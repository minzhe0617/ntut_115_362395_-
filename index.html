onale": "`JMP` 指令在 0000H 就能正常運作（事實上 0000H 放的第一行就是 `JMP START`）。"}, {"text": "因為 8051 規定程式只能從 0030H 開始執行，0000H ~ 002FH 都是壞軌", "isCorrect": false, "rationale": "0000H~002FH 不是壞軌，而是留給 Reset 與中斷向量使用。"}], "hint": "0000H 是 Reset，0003H~0023H 是五個中斷向量，為了不跟它們搶位置，主程式就從 `0030H` 開工！"}, {"questionNumber": 201, "category": "06. 中斷系統與解彈跳", "isPastExam": false, "examNo": null, "question": "若在程式中同時使用了外部中斷 `INT1` 與計時器中斷 `Timer 0`，下列哪一段中斷向量區段的組合語言結構寫法最標準且不會互相覆蓋？", "answerOptions": [{"text": "`ORG 0000H` / `START: ...`（直接寫 50 行主程式） / `ORG 0013H` / `JMP INT1_ISR`", "isCorrect": false, "rationale": "在 `0000H` 直接寫 50 行主程式會覆蓋掉 `000BH` 與 `0013H` 的中斷向量！"}, {"text": "`ORG 0003H` / `JMP START` / `ORG 0000H` / `JMP INT1_ISR`", "isCorrect": false, "rationale": "Reset（`0000H`）與 INT0（`0003H`）的位址寫反了。"}, {"text": "`ORG 0000H` / `JMP START` / `ORG 000BH` / `JMP T0_ISR` / `ORG 0013H` / `JMP INT1_ISR` / `ORG 0030H` / `START: ...`", "isCorrect": true, "rationale": "正確！Reset 放 `0000H`、Timer 0 放 `000BH`、INT1 放 `0013H`，各放一道 3 Bytes 的 `JMP` 跳轉到 `0030H` 之後的各自副程式，完全不重疊！"}, {"text": "`ORG 0013H` / `JMP T0_ISR` / `ORG 000BH` / `JMP INT1_ISR`", "isCorrect": false, "rationale": "Timer 0（`000BH`）與 INT1（`0013H`）的向量位址對調寫反了。"}], "hint": "對照各自門牌號碼：Reset = 0000H，Timer 0 = 000BH，INT1 = 0013H，主程式 = 0030H。"}, {"questionNumber": 202, "category": "07. 串列通訊 UART 與 RS-232", "isPastExam": false, "examNo": null, "question": "根據課堂筆記對 RS-232 有效傳輸距離的說明，在標準線材與一般鮑率下，RS-232 的最大有效傳輸距離大約為多少？（超出此距離需改用 RS-422/RS-485 或加裝中繼器）", "answerOptions": [{"text": "無距離限制，可繞地球一圈", "isCorrect": false, "rationale": "有明確的電氣衰減距離限制。"}, {"text": "約 15 ~ 150 公尺（課堂筆記註明約 150 公尺以內）", "isCorrect": true, "rationale": "正確！同學筆記第 5 頁右下角特別寫出：「RS-232 有效傳輸距離為 150 m（依傳輸率與電纜電容而定，高速下約 15m，低速可達 150m）」。"}, {"text": "約 100 公里", "isCorrect": false, "rationale": "RS-232 為單端非平衡傳輸，易受雜訊與線間電容衰減影響，無法傳達 100 公里。"}, {"text": "僅限 5 公分以內", "isCorrect": false, "rationale": "5 公分過於短小。"}], "hint": "請回想同學筆記第 5 頁最下方寫的數字：`有效傳輸距離為 150 m`。"}, {"questionNumber": 203, "category": "07. 串列通訊 UART 與 RS-232", "isPastExam": false, "examNo": null, "question": "在 RS-232 介面晶片（如 MAX232）內部，如何利用單一 +5V 電源產生符合 RS-232 規範的 `+10V` 與 `-10V` 雙極性電壓？", "answerOptions": [{"text": "MAX232 只能輸出 0V 與 +5V，無法產生負電壓", "isCorrect": false, "rationale": "MAX232 正是為了產生正負雙極性 RS-232 電壓而設計的。"}, {"text": "直接把 110V 家用交流電降壓送入 8051", "isCorrect": false, "rationale": "絕對不可直接接入 110V 交流市電。"}, {"text": "透過內部的「倍壓與反相電路（電荷幫浦 Charge Pump）」搭配外部小電容將 +5V 升壓並反相成 ±10V", "isCorrect": true, "rationale": "正確！你的筆記第 27 頁特別畫出「倍壓電路」示意圖，MAX232 透過內部電容切換電荷幫浦，只需 +5V 供電就能產生約 +10V 與 -10V。"}, {"text": "必須在電路板上額外安裝兩顆 9V 乾電池", "isCorrect": false, "rationale": "不需額外接乾電池。"}], "hint": "筆記第 27 頁在 `+10V`、`-10V` 旁邊特別寫了四個字：「倍壓電路」。"}, {"questionNumber": 204, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "在 8051 組合語言中，若要交換累加器 `A` 與工作暫存器 `R3` 的內容（兩者數值互換），應使用哪一道指令？若只想交換 `A` 與 `@R0` 內部 RAM 的「低 4 位元（Low Nibble）」又應使用哪一道指令？", "answerOptions": [{"text": "整組 Byte 互換用 `CPL A`；低 4 位元互換用 `RL A`", "isCorrect": false, "rationale": "`CPL` 是取反相，`RL` 是左旋。"}, {"text": "整組 Byte 互換用 `XCH A, R3`；僅低 4 位元互換用 `XCHD A, @R0`", "isCorrect": true, "rationale": "正確！根據 Ch2 投影片第 29 頁資料轉移指令表：`XCH`（Exchange）交換整個 8-bit 位元組，`XCHD`（Exchange Digit）則僅交換累加器 A 與 `@Ri` 之間的低 4 位元（常用於 BCD 碼處理）。"}, {"text": "整組 Byte 互換用 `MOV A, R3`；低 4 位元互換用 `SWAP A`", "isCorrect": false, "rationale": "`MOV A, R3` 是單向複製覆蓋（原本 A 的值會消失），不是互換；`SWAP A` 是累加器 A 自己內部的高低 4 位元互換。"}, {"text": "兩者都使用 `PUSH` 與 `POP` 即可直接一行完成", "isCorrect": false, "rationale": "PUSH/POP 需多行指令且透過堆疊，不像 `XCH` 單行即可完成互換。"}], "hint": "`XCH` = Exchange（交換），字尾加上 `D`（Digit，一個十進位 BCD 數字佔 4 bits）就是只交換低 4 位元！"}, {"questionNumber": 205, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "在 8051 邏輯運算指令中，若想將累加器 `A` 的高 4 位元全部清除為 `0`，同時保留低 4 位元原本的數值不變（位元遮罩 Masking），應執行哪一道指令？", "answerOptions": [{"text": "ANL A, #0FH（與 `0000 1111B` 做及閘 AND 運算）", "isCorrect": true, "rationale": "正確！在邏輯運算中，「與 0 做 AND 會變 0，與 1 做 AND 保持原值」，因此 `ANL A, #0FH`（`0000 1111B`）會把高 4 位元清 0、低 4 位元原封不動保留。"}, {"text": "ORL A, #0FH（與 `0000 1111B` 做或閘 OR 運算）", "isCorrect": false, "rationale": "`ORL A, #0FH` 會把低 4 位元全部強制設為 1，高 4 位元保持不變。"}, {"text": "XRL A, #0FH（與 `0000 1111B` 做互斥或 XOR 運算）", "isCorrect": false, "rationale": "`XRL A, #0FH` 會把低 4 位元全部反相（0變1、1變0）。"}, {"text": "CPL A（全部位元反相）", "isCorrect": false, "rationale": "`CPL A` 會把全部 8 個位元都反相。"}], "hint": "口訣：清零遮罩用 `AND（ANL）`，強制設 1 用 `OR（ORL）`，特定位元反轉用 `XOR（XRL）`！"}, {"questionNumber": 206, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "承上題，若想將累加器 `A` 的最高位元（Bit 7）強制設為 `1`，同時保持其餘 7 個位元（Bit 6 ~ Bit 0）原本狀態不變，應執行哪一道指令？", "answerOptions": [{"text": "ANL A, #80H（與 `1000 0000B` 做及閘 AND 運算）", "isCorrect": false, "rationale": "`ANL A, #80H` 會把低 7 個位元全部清為 0。"}, {"text": "MOV A, #80H（直接把 80H 蓋過去）", "isCorrect": false, "rationale": "`MOV A, #80H` 會把低 7 個位元全部蓋寫成 0。"}, {"text": "ORL A, #80H（與 `1000 0000B` 做或閘 OR 運算）", "isCorrect": true, "rationale": "正確！「與 1 做 OR 必定變成 1，與 0 做 OR 保持原值」，因此 `ORL A, #80H`（`1000 0000B`）只會把 Bit 7 強制設為 1，其餘 7 個位元不受影響。"}, {"text": "XRL A, #80H（與 `1000 0000B` 做互斥或 XOR 運算）", "isCorrect": false, "rationale": "`XRL A, #80H` 會把 Bit 7 反相（若原本是 1 反而會變成 0）。"}], "hint": "要強制把某個位元設成 1，就拿 `1` 去跟它做 `ORL`（或運算）！"}, {"questionNumber": 207, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "在 8051 程式跳躍指令中，`SJMP`（短跳躍）、`AJMP`（絕對跳躍）與 `LJMP`（長跳躍）的跳躍範圍有何差別？", "answerOptions": [{"text": "`SJMP` 可跳躍 64K Bytes；`LJMP` 只能跳躍前後 128 Bytes", "isCorrect": false, "rationale": "長跳躍與短跳躍的範圍寫反了。"}, {"text": "三者跳躍範圍完全相同，皆為 4K Bytes", "isCorrect": false, "rationale": "三者機械碼長度與定址位元數不同，跳躍範圍也不同。"}, {"text": "`SJMP` 只能往前跳，不能往後跳", "isCorrect": false, "rationale": "因為偏移量為 2 的補數有號數（-128 ~ +127），`SJMP` 既可往回跳（負偏移）也可往前跳（正偏移）。"}, {"text": "`SJMP` 跳躍範圍為目前位址前後 `-128 ~ +127 Bytes`；`AJMP` 範圍為 `2K Bytes` 同一頁面內；`LJMP` 可跳躍至 `64K Bytes`（`0000H ~ FFFFH`）任意位址", "isCorrect": true, "rationale": "正確！`SJMP`（2 Bytes 指令）使用 8-bit 有號相對偏移量（`-128 ~ +127`）；`AJMP`（2 Bytes）使用 11-bit 位址（`2K` 範圍）；`LJMP`（3 Bytes）使用完整 16-bit 目標位址（`64K` 全域範圍）。"}], "hint": "S = Short（短，±128B），A = Absolute（2K 頁內），L = Long（長，64K 全範圍）。"}, {"questionNumber": 208, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "在 8051 條件跳躍指令中，「JZ rel」與「JNZ rel」是根據哪一個暫存器的內容是否為零來決定是否跳躍？（注意：不會改變該暫存器的值）", "answerOptions": [{"text": "累加器 A（Jump if Accumulator is Zero / Not Zero）", "isCorrect": true, "rationale": "正確！`JZ`（Jump if Zero）與 `JNZ`（Jump if Not Zero）專門測試累加器 `A` 是否等於 `00H`（注意：PSW 裡並沒有獨立的 Zero Flag Z 位元，硬體直接檢測 A 的 8 個位元是否全為 0）。"}, {"text": "工作暫存器 R7", "isCorrect": false, "rationale": "若要測試 R7 減 1 是否為零並跳躍，應使用 `DJNZ R7, rel`。"}, {"text": "堆疊指標 SP", "isCorrect": false, "rationale": "不會測試 SP 是否為零。"}, {"text": "程式計數器 PC", "isCorrect": false, "rationale": "不會測試 PC 是否為零。"}], "hint": "在 8051 裡，沒有 Z 旗標，所有「判斷是否為零（JZ / JNZ）」的對象都是主角「累加器 A」！"}, {"questionNumber": 209, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "在你的筆記第 23 頁「Ch2 問題與解答」中，若執行以下兩行指令：\n`MOV 40H, #55H`\n`MOV R0, 40H`\n請問執行完畢後，工作暫存器 `R0` 的內容為何？（注意第二行 `40H` 前面沒有 `#` 符號）", "answerOptions": [{"text": "40H（把常數 40H 搬給 R0）", "isCorrect": false, "rationale": "若第二行寫 `MOV R0, #40H`（有井字號），R0 才會是 `40H`。"}, {"text": "00H", "isCorrect": false, "rationale": "不是 00H。"}, {"text": "55H（因為第二行是直接定址，把內部 RAM 位址 40H 裡面存放的內容 `55H` 搬給 R0）", "isCorrect": true, "rationale": "正確！第一行立即定址將常數 `55H` 存入內部 RAM 位址 `40H`；第二行 `MOV R0, 40H` 沒有 `#`，代表直接定址（讀取位址 40H 的內容），因此 `R0` 獲得 `55H`。"}, {"text": "產生語法錯誤", "isCorrect": false, "rationale": "這是完全合法的標準 8051 指令。"}], "hint": "第一行把 `55H` 放進 40 號信箱；第二行去打開 40 號信箱把裡面的東西拿給 R0！"}, {"questionNumber": 210, "category": "01. 微算機架構與指令週期", "isPastExam": false, "examNo": null, "question": "微電腦（Microcomputer）系統中的三大匯流排（System Bus）分別是哪三種匯流排？", "answerOptions": [{"text": "USB 匯流排、HDMI 匯流排、SATA 匯流排", "isCorrect": false, "rationale": "這些是現代個人電腦外部周邊介面標準。"}, {"text": "電源匯流排、接地匯流排、時脈匯流排", "isCorrect": false, "rationale": "電源、接地與時脈不屬於三大邏輯資料傳輸匯流排。"}, {"text": "串列匯流排、平行匯流排、紅外線匯流排", "isCorrect": false, "rationale": "這是傳輸方式分類，非三大系統匯流排。"}, {"text": "位址匯流排（Address Bus）、資料匯流排（Data Bus）、控制匯流排（Control Bus）", "isCorrect": true, "rationale": "正確！微算機三大系統匯流排為：位址匯流排（單向，決定存取位置）、資料匯流排（雙向，傳送資料）、控制匯流排（傳送讀寫與時序控制訊號）。"}], "hint": "CPU 要找記憶體拿資料，需要知道「去哪找（位址）」、「拿什麼（資料）」、「要讀還是要寫（控制）」。"}, {"questionNumber": 211, "category": "01. 微算機架構與指令週期", "isPastExam": false, "examNo": null, "question": "在微算機三大匯流排中，哪一條匯流排的訊號傳輸方向是「雙向（Bidirectional）」的，既能將資料從 CPU 寫入記憶體，也能從記憶體讀取資料送回 CPU？", "answerOptions": [{"text": "僅有石英晶體振盪線", "isCorrect": false, "rationale": "晶振線不是系統匯流排。"}, {"text": "所有匯流排都是單向的", "isCorrect": false, "rationale": "資料匯流排是雙向的。"}, {"text": "位址匯流排（Address Bus）", "isCorrect": false, "rationale": "位址匯流排是由 CPU 單向輸出給記憶體或周邊 IC 的。"}, {"text": "資料匯流排（Data Bus）", "isCorrect": true, "rationale": "正確！資料匯流排（8051 中為 D0~D7）必須支援讀取（記憶體→CPU）與寫入（CPU→記憶體），因此為雙向匯流排；而位址匯流排（A0~A15）由 CPU 送出指定位址，為單向。"}], "hint": "讀資料時資料往 CPU 跑，寫資料時資料往記憶體跑，所以這條路是雙向道。"}, {"questionNumber": 212, "category": "01. 微算機架構與指令週期", "isPastExam": false, "examNo": null, "question": "哈佛架構（Harvard Architecture，如 8051）與馮紐曼架構（Von Neumann Architecture，如一般 PC）在記憶體組織上的主要區別為何？", "answerOptions": [{"text": "馮紐曼架構完全沒有中央處理器 CPU", "isCorrect": false, "rationale": "兩種架構皆以 CPU 為核心。"}, {"text": "哈佛架構將「程式記憶體（ROM）」與「資料記憶體（RAM）」分開獨立定址與存取；馮紐曼架構則將程式與資料共用同一個線性記憶體空間", "isCorrect": true, "rationale": "正確！8051 採用哈佛架構，程式記憶體（0000H~FFFFH，由 PSEN 控制）與資料記憶體（內部 RAM 00H~FFH 及外部 RAM 0000H~FFFFH，由 RD/WR 控制）各自擁有獨立定址空間。"}, {"text": "哈佛架構完全沒有資料記憶體 RAM", "isCorrect": false, "rationale": "8051 內建 128B/256B 內部 RAM 並可擴充 64K 外部 RAM。"}, {"text": "哈佛架構只能執行浮點數運算", "isCorrect": false, "rationale": "8051 為 8 位元整數微控制器，無硬體浮點運算單元。"}], "hint": "這也是為什麼 8051 同時擁有「64K 程式記憶體空間」與「64K 外部資料記憶體空間」且位址編號都從 0000H 開始的原因！"}, {"questionNumber": 213, "category": "01. 微算機架構與指令週期", "isPastExam": false, "examNo": null, "question": "在指令週期的五個步驟中，「Write Back（寫回）」階段主要負責執行什麼工作？", "answerOptions": [{"text": "將算術邏輯單元（ALU）在 Execute 階段運算完成的結果寫回指定的目的暫存器或記憶體位址", "isCorrect": true, "rationale": "正確！Execute 負責在 ALU 中算出結果，最後一步 Write Back 則將運算結果存回目的運算元（例如累加器 A 或內部 RAM）。"}, {"text": "清除程式計數器 PC 為 0000H", "isCorrect": false, "rationale": "那是硬體 Reset 的動作。"}, {"text": "從程式記憶體讀取下一道指令的操作碼", "isCorrect": false, "rationale": "那是第一步 Fetch（提取指令）的工作。"}, {"text": "將組合語言原始檔寫回電腦硬碟", "isCorrect": false, "rationale": "指令週期是硬體 CPU 執行機械碼的微操作，與硬碟存檔無關。"}], "hint": "英文直譯就是「把算好的答案寫回去」。"}, {"questionNumber": 214, "category": "01. 微算機架構與指令週期", "isPastExam": false, "examNo": null, "question": "在 8051 的指令週期中，當 CPU 提取（Fetch）一道長度為 3 Bytes 的指令（如 `LJMP 0123H`）時，為什麼同學筆記第 3 頁會畫出一個從 `Decode` 指回 `Fetch` 的回授箭頭？", "answerOptions": [{"text": "因為 8051 每次抓指令都會抓錯，必須重新抓三次", "isCorrect": false, "rationale": "並非抓錯，而是 8 位元匯流排每次只能搬運 1 Byte。"}, {"text": "因為 Decode 單元壞掉了無法解碼", "isCorrect": false, "rationale": "解碼器正常運作並判斷出該指令總長度。"}, {"text": "因為 8051 一次可以同時提取 16 個 Bytes", "isCorrect": false, "rationale": "8 位元資料匯流排每次僅能提取 1 Byte。"}, {"text": "因為 8051 每個提取週期固定只從程式記憶體抓 1 個 Byte（操作碼 Opcode），解碼器（Decode）看懂這是 3-Byte 指令後，會回頭通知 Fetch 再多抓後面 2 個 Bytes 的運算元位址", "isCorrect": true, "rationale": "正確！同學筆記第 3 頁上方寫道：「每個 cycle 固定提取 1 個 byte；若有回授（Decode → Fetch），則繼續提取（8051 指令共分 1B、2B、3B）」。"}], "hint": "8 位元資料匯流排一次只能搬 1 Byte，看到 3 Bytes 的長指令就得多跑兩趟去把後面的位址搬完。"}, {"questionNumber": 215, "category": "01. 微算機架構與指令週期", "isPastExam": false, "examNo": null, "question": "關於補數運算：若在 8 位元有號數系統（2 的補數表示法）中，十進位數字 `-1` 轉換成十六進位與二進位表示為何？", "answerOptions": [{"text": "01H（0000 0001B）", "isCorrect": false, "rationale": "`01H` 是正 1（+1）。"}, {"text": "FFH（1111 1111B）", "isCorrect": true, "rationale": "正確！+1 的二進位為 `0000 0001B`，取 1 的補數反相為 `1111 1110B`，再加 1 得到 2 的補數 `1111 1111B`（`FFH`）。"}, {"text": "81H（1000 0001B）", "isCorrect": false, "rationale": "`1000 0001B` 是「符號大小表示法（Sign-Magnitude）」的 -1，在 2 的補數中 `81H` 代表 `-127`。"}, {"text": "7FH（0111 1111B）", "isCorrect": false, "rationale": "`7FH` 是 8 位元有號數的最大正整數 `+127`。"}], "hint": "驗證方式：`FFH + 01H = (1)00H`，捨棄進位後剛好等於 `00H`，所以 `FFH` 就是 `-1`！"}, {"questionNumber": 216, "category": "01. 微算機架構與指令週期", "isPastExam": false, "examNo": null, "question": "8 位元有號數（2 的補數）所能表示的十進位數值範圍為何？", "answerOptions": [{"text": "-256 ~ +255", "isCorrect": false, "rationale": "-256 ~ +255 需要 9 個位元才能表示。"}, {"text": "0 ~ +255", "isCorrect": false, "rationale": "0 ~ +255 是「無號數（Unsigned Number）」的表示範圍。"}, {"text": "-127 ~ +127", "isCorrect": false, "rationale": "-127 ~ +127 是 1 的補數或符號大小表示法的範圍（有兩個 0）。"}, {"text": "-128 ~ +127", "isCorrect": true, "rationale": "正確！8 位元 2 的補數最高位為符號位（0為正、1為負），負數最小可達 `1000 0000B`（`-128`），正數最大為 `0111 1111B`（`+127`）。"}], "hint": "負數比正數多一個（因為 0 佔用了正數那邊的 `0000 0000`）。"}, {"questionNumber": 217, "category": "01. 微算機架構與指令週期", "isPastExam": false, "examNo": null, "question": "MCS-51 系列中，型號「AT89C51」與「AT89S51」的第一個字母 `AT` 代表哪一家半導體製造商？", "answerOptions": [{"text": "Atmel（愛特梅爾，現已併入 Microchip）", "isCorrect": true, "rationale": "正確！Intel 授權 MCS-51 架構後，Atmel 公司推出了可重複電氣燒錄的 AT89C51 與支援 ISP 在線燒錄的 AT89S51/52，成為教學與工業界最普及的型號。"}, {"text": "Apple（蘋果電腦）", "isCorrect": false, "rationale": "非蘋果公司。"}, {"text": "AMD（超微半導體）", "isCorrect": false, "rationale": "非 AMD 公司。"}, {"text": "ASUS（華碩電腦）", "isCorrect": false, "rationale": "非華碩公司。"}], "hint": "AT 就是該晶片製造商名稱的前兩個英文字母。"}, {"questionNumber": 218, "category": "01. 微算機架構與指令週期", "isPastExam": false, "examNo": null, "question": "比較 AT89C51 與較新款的 AT89S51，下列哪一項功能是 `AT89S51` 新增的便利設計？", "answerOptions": [{"text": "支援 ISP（In-System Programming，系統內在線串列燒錄），可透過 P1.5~P1.7 直接在電路板上燒錄程式，不需拔下晶片插上專用高壓燒錄器", "isCorrect": true, "rationale": "正確！S 系列（Serial ISP）在 P1.5(MOSI)、P1.6(MISO)、P1.7(SCK) 加入了 SPI 串列燒錄介面，免去反覆拔插晶片把針腳折斷的風險。"}, {"text": "資料匯流排升級為 64 位元", "isCorrect": false, "rationale": "仍為 8 位元微控制器。"}, {"text": "不需要任何電源即可永久運作", "isCorrect": false, "rationale": "仍需 +5V 直流供電。"}, {"text": "內建 100GB 固態硬碟", "isCorrect": false, "rationale": "無此規格。"}], "hint": "型號中的 `S` 代表 Serial（串列在線燒錄 ISP）。"}, {"questionNumber": 219, "category": "01. 微算機架構與指令週期", "isPastExam": false, "examNo": null, "question": "在 8051 晶片封裝中，若使用「PLCC-44」或「QFP-44」封裝（44 支接腳），相比於「PDIP-40」（40 支接腳）多出來的 4 支接腳在晶片內部連接至何處？", "answerOptions": [{"text": "NC（No Connection，空腳，內部未連接任何電路）", "isCorrect": true, "rationale": "正確！正方形四邊封裝（44 腳）為了對稱美觀，在四個邊的中間各多留了 1 支空腳（Pin 1、12、23、34 標示為 NC），內部並未接線。"}, {"text": "額外連接四顆石英振盪晶體", "isCorrect": false, "rationale": "只需一顆石英晶體。"}, {"text": "額外多出一組 4 位元 I/O 埠（Port 4）", "isCorrect": false, "rationale": "標準 8051 只有 P0~P3 四組埠。"}, {"text": "全部連接到 +12V 高壓電源", "isCorrect": false, "rationale": "無 +12V 接腳。"}], "hint": "NC = No Connection（空接腳）。"}, {"questionNumber": 220, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "在 PDIP-40 封裝的 8051 中，如果實驗時不小心將 Pin 40（VCC）與 Pin 20（GND）電源正負極接反，會發生什麼後果？", "answerOptions": [{"text": "8051 會自動變成負邏輯運算模式繼續正常執行", "isCorrect": false, "rationale": "數位積體電路無自動反極性功能，接反必毀。"}, {"text": "程式會改為從 FFFFH 倒著執行回 0000H", "isCorrect": false, "rationale": "不會倒著執行。"}, {"text": "晶片內部 CMOS 保護二極體順向導通產生極大短路電流，晶片會瞬間發燙並永久燒毀", "isCorrect": true, "rationale": "正確！在搭建基本電路第一步驟「先接電源」時，務必再三確認 Pin 40 接 +5V、Pin 20 接 GND，電源接反會導致晶片立即燒毀。"}, {"text": "只有 LED 會變暗，晶片完全不受影響", "isCorrect": false, "rationale": "晶片內部電路會直接受損。"}], "hint": "接電源前一定要再三核對 Pin 40（+5V）與 Pin 20（GND）！"}, {"questionNumber": 221, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "在開發板電路圖（U1: AT89C51）中，第 29 腳 `PSEN`（低態有效）連接到 6116 SRAM 記憶體（U8）的哪一支控制腳，以便在 RUN 模式下將 6116 當作外部程式記憶體讀取？", "answerOptions": [{"text": "WE（Write Enable，寫入致能腳，Pin 21）", "isCorrect": false, "rationale": "`/WE`（寫入致能）只有在「Download（下載）」模式下才會由 8051 的 `/WR` 控制寫入程式碼。"}, {"text": "VCC（電源腳，Pin 24）", "isCorrect": false, "rationale": "不會接到 VCC。"}, {"text": "OE（Output Enable，輸出致能腳，Pin 20）", "isCorrect": true, "rationale": "正確！在 RUN（執行）模式下，8051 要從 6116 讀取程式碼，因此由 `PSEN` 透過切換電路連至 6116 的 `/OE`（輸出致能）與 `/CE`（晶片選擇），讓 6116 把指令碼放到資料匯流排上。"}, {"text": "A0（位址線 0，Pin 8）", "isCorrect": false, "rationale": "不會接到位址線 A0。"}], "hint": "讀取（Read）記憶體內容時，需要開啟記憶體的「輸出致能（Output Enable, `/OE`）」。"}, {"questionNumber": 222, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "在開發板電路圖（U12: 74LS121 DIP14 單穩態多諧振盪器）中，決定其輸出單擊正脈波寬度（Reset 持續時間）的外部被動元件為電路圖上的哪兩個零件？", "answerOptions": [{"text": "石英晶體 Y1（12MHz）與陶瓷電容 C1、C2", "isCorrect": false, "rationale": "Y1 與 C1、C2 是給 8051 產生主時脈的。"}, {"text": "可變電阻 VR1 與喇叭 SP1", "isCorrect": false, "rationale": "VR1 是給 ADC0804 輸入類比電壓的。"}, {"text": "排阻 RN1（9P-1K）與發光二極體 D0", "isCorrect": false, "rationale": "RN1 與 D0 是 Port 1 的 LED 顯示電路。"}, {"text": "電阻 R8（10KΩ）與電容 C12（10μF），透過公式 $t_w \\approx 0.7 R C$ 決定單擊脈波寬度", "isCorrect": true, "rationale": "正確！74LS121 是 RC 定時型單穩態多諧振盪器，外接定時電阻 R8（接 Pin 11 Rint/Rext）與定時電容 C12（接 Pin 10 Cext），產生約 70ms 的單擊高電位脈波送入 8051 的 RST 腳。"}], "hint": "單穩態振盪器的輸出脈波寬度是由外接的一顆電阻（R8）與一顆電容（C12）決定的。"}, {"questionNumber": 223, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "在 8051 硬體電路中，為什麼當我們使用 Port 0 作為一般數位輸出（例如直接驅動共陰極 LED 或輸出高電位邏輯 1）時，必須在 Port 0 外部加接「提升電阻（Pull-up Resistor，如 10KΩ 排阻）」？", "answerOptions": [{"text": "因為 Port 0 只能輸入不能輸出", "isCorrect": false, "rationale": "加接提升電阻後 Port 0 即可正常輸出高低電位。"}, {"text": "因為不接提升電阻會導致石英晶體停止振盪", "isCorrect": false, "rationale": "與石英晶體無關。"}, {"text": "因為 Port 0 內部電壓高達 50V，需要電阻降壓", "isCorrect": false, "rationale": "Port 0 工作電壓為 5V。"}, {"text": "因為 Port 0 內部沒有提升電阻（屬於開汲極 Open Drain 輸出），若不外接提升電阻，輸出邏輯 1 時接腳會處於高阻抗浮接狀態，無法輸出 +5V 高電位", "isCorrect": true, "rationale": "正確！Port 0 內部上方 FET 電晶體只有在存取外部記憶體位址/資料時才會主動推挽動作；當作為一般 I/O 輸出 1 時上方電晶體截止，必須靠外部提升電阻把電位拉到 +5V。"}], "hint": "開汲極（Open Drain）輸出就像一個只能把水放掉（接地變 0）的水龍頭，想要水箱滿水（變 1）就得靠外部水塔（提升電阻接 +5V）。"}, {"questionNumber": 224, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "若一顆 8051 微控制器外接 `11.0592 MHz` 的石英振盪器（此特殊頻率常為了讓 UART 產生 9600 bps 零誤差鮑率），請問此時 1 個機械週期的精確時間為何？", "answerOptions": [{"text": "0.5 μs", "isCorrect": false, "rationale": "0.5 μs 是外接 24 MHz 晶振時的機械週期。"}, {"text": "12 / 11.0592 μs（約 1.085 μs）", "isCorrect": true, "rationale": "正確！根據通用公式：1 機械週期 = $12 / f_{osc} = 12 / (11.0592 \\times 10^6\\text{ Hz}) \\approx 1.085\\text{ }\\mu\\text{s}$。"}, {"text": "11.0592 μs", "isCorrect": false, "rationale": "計算公式顛倒了。"}, {"text": "1 μs", "isCorrect": false, "rationale": "1 μs 是外接 12 MHz 晶振時的機械週期。"}], "hint": "套用通用公式：$T_{\\text{machine}} = \\frac{12}{f_{\\text{osc}}}$。"}, {"questionNumber": 225, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "在 Ch1 投影片「8051 之基本電路」中，手動重置電路使用的「TACK SW. a 接點按鈕開關」，其中的「a 接點」在電機電子工程中代表什麼意思？", "answerOptions": [{"text": "常閉接點（Normally Closed, NC）：平時未按下時接通，按下時斷開", "isCorrect": false, "rationale": "常閉接點稱為 b 接點（Normally Closed）。"}, {"text": "水銀傾斜感測開關", "isCorrect": false, "rationale": "TACK SW. 是輕觸式按鍵開關（Tactile Switch）。"}, {"text": "常開接點（Normally Open, NO）：平時未按下時兩端斷開（開路），按下按鈕時兩端接通（短路）", "isCorrect": true, "rationale": "正確！a 接點（Normally Open）平時斷路，因此不會影響電容充電與正常運作；一旦按下按鈕即導通，將 +5V 直接送到 RST 腳觸發重置。"}, {"text": "單刀雙擲切換開關（SPDT）", "isCorrect": false, "rationale": "切換開關稱為 c 接點（SPDT）。"}], "hint": "a 接點 = 原本斷開，按下去才通（Normally Open）。"}, {"questionNumber": 226, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "在 POSR（電源啟動自我重置）電路公式推導中，平板電容器的電容值公式為 $C = \\varepsilon \\frac{A}{d}$。若兩極板面積 $A$ 越大、或極板間距 $d$ 越小，電容值 $C$ 會如何變化？", "answerOptions": [{"text": "電容會變成電感器", "isCorrect": false, "rationale": "電容不會變成電感。"}, {"text": "電容值 $C$ 越大，儲存電荷的能力越強", "isCorrect": true, "rationale": "正確！根據你的筆記第 18 頁板書公式 $C = \\varepsilon (A/d)$，電容值與極板面積 $A$ 及介電常數 $\\varepsilon$ 成正比，與極板距離 $d$ 成反比。"}, {"text": "電容值 $C$ 永遠固定不變", "isCorrect": false, "rationale": "幾何尺寸改變會直接改變電容值。"}, {"text": "電容值 $C$ 越小", "isCorrect": false, "rationale": "與公式成正反比關係相反。"}], "hint": "面積 $A$ 在分子（正比），距離 $d$ 在分母（反比）。"}, {"questionNumber": 227, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "在 POSR 開機重置電路的瞬間（t = 0+，電容跨壓 $V_C = 0\\text{V}$），若電源電壓為 $+5\\text{V}$、接地電阻 $R = 10\\text{k}\\Omega$，請問流過電阻 R 的最大初始充電電流 $I$ 為多少？", "answerOptions": [{"text": "50 mA", "isCorrect": false, "rationale": "若電阻為 100Ω 才是 50 mA。"}, {"text": "0.5 mA（計算：$I = 5\\text{V} / 10\\text{k}\\Omega = 0.5\\text{ mA}$）", "isCorrect": true, "rationale": "正確！開機瞬間電容形同短路，全部 5V 跨在 $10\\text{k}\\Omega$ 電阻兩端，根據歐姆定律 $I = V / R = 5 / 10,000 = 0.0005\\text{ A} = 0.5\\text{ mA}$。"}, {"text": "0 mA", "isCorrect": false, "rationale": "0 mA 是電容充飽電（t → ∞）後的穩態電流。"}, {"text": "5 A", "isCorrect": false, "rationale": "5 A 會直接燒毀電路。"}], "hint": "回想板書公式：$I = 5 / R$，代入 $R = 10\\text{k}\\Omega$。"}, {"questionNumber": 228, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "在開發板電路圖（U1: AT89C51）中，Port 3 的每一支接腳都有第二功能（Alternate Function）。請問「Pin 10（P3.0）」與「Pin 11（P3.1）」的第二功能分別是什麼？", "answerOptions": [{"text": "P3.0 為 TXD，P3.1 為 RXD", "isCorrect": false, "rationale": "RXD（0）與 TXD（1）的編號寫反了。"}, {"text": "P3.0 為 INT0，P3.1 為 INT1", "isCorrect": false, "rationale": "INT0 與 INT1 位於 P3.2（Pin 12）與 P3.3（Pin 13）。"}, {"text": "P3.0 為 RXD（串列資料接收輸入），P3.1 為 TXD（串列資料傳送輸出）", "isCorrect": true, "rationale": "正確！Port 3 編號順序口訣：0 是 RXD、1 是 TXD、2 是 INT0、3 是 INT1、4 是 T0、5 是 T1、6 是 WR、7 是 RD。"}, {"text": "P3.0 為 RD，P3.1 為 WR", "isCorrect": false, "rationale": "WR 與 RD 位於 P3.6（Pin 16）與 P3.7（Pin 17）。"}], "hint": "口訣「收（RXD）發（TXD）外0 外1 計0 計1 寫（WR）讀（RD）」依序對應 P3.0 到 P3.7！"}, {"questionNumber": 229, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "承上題，Port 3 的「Pin 16（P3.6）」與「Pin 17（P3.7）」在擴充外部資料記憶體（如寫入或讀取外部 6116 RAM）時，各自輸出什麼控制訊號？", "answerOptions": [{"text": "P3.6 為 PSEN，P3.7 為 ALE", "isCorrect": false, "rationale": "PSEN（Pin 29）與 ALE（Pin 30）是獨立專用接腳，不在 Port 3 中。"}, {"text": "P3.6 為 WR（外部資料記憶體寫入致能，低態有效），P3.7 為 RD（外部資料記憶體讀取致能，低態有效）", "isCorrect": true, "rationale": "正確！依照 P3.0~P3.7 順序口訣，最後兩支腳 P3.6 是 `/WR`（Write），P3.7 是 `/RD`（Read）。"}, {"text": "P3.6 為 RD（讀取），P3.7 為 WR（寫入）", "isCorrect": false, "rationale": "寫入（P3.6）與讀取（P3.7）的順序寫反了。"}, {"text": "P3.6 為 T0，P3.7 為 T1", "isCorrect": false, "rationale": "T0 與 T1 位於 P3.4 與 P3.5。"}], "hint": "口訣最後兩個字：「寫（6）讀（7）」→ P3.6 是 WR，P3.7 是 RD。"}, {"questionNumber": 230, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": false, "examNo": null, "question": "在 8051 中，如果想要在組合語言程式裡存取累加器（Accumulator），什麼時候必須寫成 `A`，什麼時候必須寫成 `ACC`？", "answerOptions": [{"text": "`ACC` 只能在 8052 中使用，8051 只能用 `A`", "isCorrect": false, "rationale": "所有 MCS-51 系列皆通用此規則。"}, {"text": "兩者在任何指令中都可以完全無條件互換", "isCorrect": false, "rationale": "若寫 `PUSH A` 或 `SETB A.0`，組譯器會報錯，必須寫 `PUSH ACC` 與 `SETB ACC.0`。"}, {"text": "`A` 用於加法，`ACC` 用於減法", "isCorrect": false, "rationale": "與加減法分類無關。"}, {"text": "在一般算術邏輯指令中寫 `A`（如 `ADD A, R0`、`RL A`）；在需要「直接定址位址（E0H）」或「位元定址」的指令中必須寫 `ACC`（如 `PUSH ACC`、`SETB ACC.0`）", "isCorrect": true, "rationale": "正確！在 8051 組譯器語法中，`A` 代表累加器隱含暫存器運算元，而 `ACC` 則代表特殊功能暫存器位址 `E0H`（例如 `PUSH ACC` 翻譯為 `C0 E0`）。"}], "hint": "需要把累加器當成一個「記憶體位址（E0H）」來 PUSH 或操作單一位元時，就要叫它的全名 `ACC`！"}, {"questionNumber": 231, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": false, "examNo": null, "question": "特殊功能暫存器 `B`（直接位址 `F0H`）除了與累加器 `A` 搭配執行乘法（`MUL AB`）與除法（`DIV AB`）之外，在平時未執行乘除法時可以如何運用？", "answerOptions": [{"text": "平時絕對禁止存取暫存器 B，否則會觸發硬體重置", "isCorrect": false, "rationale": "不會觸發硬體重置。"}, {"text": "暫存器 B 只能存放負數", "isCorrect": false, "rationale": "可存放任何 8 位元資料（00H ~ FFH）。"}, {"text": "可以當作一個額外的 8 位元一般用途暫存器（Scratchpad Register）或可位元定址暫存器（B.0 ~ B.7）使用", "isCorrect": true, "rationale": "正確！不執行 `MUL AB` 或 `DIV AB` 時，B 暫存器（位址 F0H，尾數為 0H 故支援位元定址）可自由當作一般暫存器暫存資料。"}, {"text": "暫存器 B 連接到外部液晶螢幕", "isCorrect": false, "rationale": "B 為內部運算暫存器，無外部接腳。"}], "hint": "B 暫存器平時就像累加器 A 的小助手，沒做乘除法時可以自由拿來放暫存資料。"}, {"questionNumber": 232, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": false, "examNo": null, "question": "在 8051 內部資料記憶體中，位址範圍 `80H ~ FFH` 共有 128 個位址空間，但實際定義的特殊功能暫存器（SFR）只有 21 個（8052 為 26 個），請問其餘未被定義使用的位址（如 `84H ~ 86H`、`FFH`）若程式去讀取會發生什麼事？", "answerOptions": [{"text": "會讀取到內部 RAM `00H ~ 7FH` 的資料", "isCorrect": false, "rationale": "內部 RAM 00H~7FH 必須使用 `00H ~ 7FH` 的直接或間接位址存取（註：在 8052 中，高 128 Bytes 的「間接定址 `@R0/@R1`」才會存取到擴充的額外 128B RAM）。"}, {"text": "會讀出不確定的隨機數值（Undefined），且不應對這些保留位址進行寫入操作", "isCorrect": true, "rationale": "正確！高 128 Bytes（80H~FFH）在標準 8051 中僅有 21 個位址配置了實體 SFR 硬體暫存器，其餘空白格子並無實體電路，讀取會得到無意義的雜訊值。"}, {"text": "會讓 8051 晶振頻率加倍", "isCorrect": false, "rationale": "與晶振頻率無關。"}, {"text": "會自動讀取到外部程式記憶體的內容", "isCorrect": false, "rationale": "外部程式記憶體需用 `MOVC` 讀取。"}], "hint": "觀察 Ch2 投影片第 9 頁 SFR 總表，很多格子是空白留白的，只有填寫英文名稱的 21 格才有對應硬體。"}, {"questionNumber": 233, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": false, "examNo": null, "question": "在 8051 中斷或副程式呼叫時，將 16 位元的程式計數器 PC（假設返回位址為 `0123H`）推入堆疊（假設原本 `SP = 30H`），請問位址 `31H` 與 `32H` 分別存入哪一個 Byte？", "answerOptions": [{"text": "先將低位元組 `PCL`（`23H`）存入 `31H`，再將高位元組 `PCH`（`01H`）存入 `32H`（小端序入棧）", "isCorrect": true, "rationale": "正確！在 8051 中，執行 `CALL` 或中斷入棧時，硬體依序先推入低位元組 `PCL`（SP+1 = 31H 存 23H），再推入高位元組 `PCH`（SP+2 = 32H 存 01H）；返回時則先彈出 `PCH` 再彈出 `PCL`。"}, {"text": "只會把 `23H` 存入 `31H`，`01H` 直接丟棄", "isCorrect": false, "rationale": "16 位元 PC 兩個位元組都會完整保存。"}, {"text": "先將高位元組 `PCH`（`01H`）存入 `31H`，再將低位元組 `PCL`（`23H`）存入 `32H`", "isCorrect": false, "rationale": "入棧順序是先低位元組（PCL）後高位元組（PCH）。"}, {"text": "`31H` 存入 `00H`，`32H` 存入 `00H`", "isCorrect": false, "rationale": "會存入實際的返回位址，不會存 00H。"}], "hint": "口訣：低位（PCL）先下去墊底，高位（PCH）後上去壓在最上面（這樣返回時才能先拿到 PCH）。"}, {"questionNumber": 234, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": false, "examNo": null, "question": "假設某 8051 程式中，主程式設定 `MOV SP, #30H`，接著主程式呼叫副程式 `SUB1`，而 `SUB1` 內部又再呼叫副程式 `SUB2`（兩層巢狀呼叫），且 `SUB2` 內部又執行了一次 `PUSH ACC`。請問在執行到 `SUB2` 內部的這一刻，堆疊指標 `SP` 的數值變成多少？", "answerOptions": [{"text": "35H（30H + 2 + 2 + 1 = 35H）", "isCorrect": true, "rationale": "正確！初始 `30H` → 呼叫 `SUB1` 推入 2 Bytes PC 變 `32H` → 呼叫 `SUB2` 再推入 2 Bytes PC 變 `34H` → `PUSH ACC` 推入 1 Byte 變 `35H`。"}, {"text": "33H", "isCorrect": false, "rationale": "33H 計算錯誤。"}, {"text": "36H", "isCorrect": false, "rationale": "36H 多算了 1 Byte。"}, {"text": "32H", "isCorrect": false, "rationale": "32H 僅計算了一層 CALL。"}], "hint": "每次 `CALL` 或中斷加 2，每次 `PUSH` 加 1，從 `30H` 開始累加即可！"}, {"questionNumber": 235, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": false, "examNo": null, "question": "在內部 RAM 的可位元定址區（20H ~ 2FH）中，若已知某個位元的線性位元位址為 `00H`，它對應到哪一個 Byte 的哪一個 Bit？若位元位址為 `7FH`，又對應到哪一個 Byte 的哪一個 Bit？", "answerOptions": [{"text": "`00H` 對應 `2FH.7`；`7FH` 對應 `20H.0`", "isCorrect": false, "rationale": "頭尾編號顛倒了。"}, {"text": "`00H` 對應 `00H.0`；`7FH` 對應 `7FH.7`", "isCorrect": false, "rationale": "00H~1FH 與 30H~7FH 都不支援位元定址。"}, {"text": "`00H` 對應 `80H.0`；`7FH` 對應 `FFH.7`", "isCorrect": false, "rationale": "80H~FFH 是 SFR 的位元位址範圍。"}, {"text": "`00H` 對應 `20H.0`（20H 的 Bit 0）；`7FH` 對應 `2FH.7`（2FH 的 Bit 7）", "isCorrect": true, "rationale": "正確！可位元定址區從 `20H` 的最低位（`20H.0`）開始編號為 `00H`，一路依序數到最後一個 Byte `2FH` 的最高位（`2FH.7`）編號為 `7FH`（十進位 127，共 128 個位元）。"}], "hint": "可位元定址區的起點是 `20H.0`（編號 00H），終點是 `2FH.7`（編號 7FH）。"}, {"questionNumber": 236, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": false, "examNo": null, "question": "若執行指令「MOV 20H, #0FFH」（將內部 RAM 位址 20H 整個 Byte 設為 `1111 1111B`），緊接著執行指令「CLR 02H」（清除線性位元位址 `02H`），請問此時內部 RAM 位址 `20H` 的整個 Byte 內容變成多少？", "answerOptions": [{"text": "00H（0000 0000B）", "isCorrect": false, "rationale": "`CLR 02H` 只會清除 1 個位元，不會把整個 Byte 清為 00H。"}, {"text": "FDH（1111 1101B）", "isCorrect": false, "rationale": "`FDH`（`1111 1101B`）是清除 `01H`（`20H.1`）的結果。"}, {"text": "FBH（1111 1011B，因為位元位址 `02H` 就是 `20H.2`，將 Bit 2 清為 0）", "isCorrect": true, "rationale": "正確！位元位址 `00H` 是 `20H.0`、`01H` 是 `20H.1`、`02H` 就是 `20H.2`（Bit 2）。把 `1111 1111B` 的 Bit 2 清為 0，得到 `1111 1011B` = `FBH`。"}, {"text": "FEH（1111 1110B）", "isCorrect": false, "rationale": "`FEH`（`1111 1110B`）是清除 `00H`（`20H.0`）的結果。"}], "hint": "從 Bit 0 開始數：00H 是 Bit 0，01H 是 Bit 1，02H 是 Bit 2（權重為 4），$255 - 4 = 251 = \\text{FBH}$。"}, {"questionNumber": 237, "category": "04. I/O埠與硬體介面電路", "isPastExam": false, "examNo": null, "question": "在同學筆記第 13 頁的 `ADC0804` 類比數位轉換器（8 位元解析度）中，若類比輸入電壓範圍設定為 `0V ~ 5V`（即 `VREF/2 = 2.5V`），請問 ADC0804 能分辨的最小電壓變化量（步階解析度 Step Size / 1 LSB）大約為多少？", "answerOptions": [{"text": "約 0.5 V（計算：5V / 10）", "isCorrect": false, "rationale": "並非分成 10 階。"}, {"text": "約 1 μV", "isCorrect": false, "rationale": "1 μV 需要超過 22 位元的高精度 ADC 才能分辨。"}, {"text": "約 19.53 mV（計算：5V / 256 = 0.01953 V）", "isCorrect": true, "rationale": "正確！8 位元 ADC 共有 $2^8 = 256$ 個數位階數（0 ~ 255），將 5V 滿刻度電壓分成 256 階，每 1 LSB 代表 $5\\text{V} / 256 \\approx 19.53\\text{ mV}$。"}, {"text": "約 1 V（計算：5V / 5）", "isCorrect": false, "rationale": "並非分成 5 階。"}], "hint": "8 位元共有 $2^8 = 256$ 種數位組合，用滿刻度電壓 `5V` 除以 `256` 即可。"}, {"questionNumber": 238, "category": "04. I/O埠與硬體介面電路", "isPastExam": false, "examNo": null, "question": "承上題，在 `ADC0804` 電路中，第 6 腳 `+IN`（Vin+）與第 7 腳 `-IN`（Vin-）構成一組「差動類比電壓輸入端（Differential Analog Input）」。若將 `-IN` 接地（0V），而 `+IN` 接至可變電阻調整為 `+2.5V`，則 ADC0804 轉換完成後輸出的 8 位元數位數值大約為多少？", "answerOptions": [{"text": "00H（十進位 0）", "isCorrect": false, "rationale": "`00H`（0）是輸入電壓為 `0V` 時的輸出。"}, {"text": "FFH（十進位 255，滿刻度）", "isCorrect": false, "rationale": "`FFH`（255）是輸入電壓接近滿刻度 `+5V` 時的輸出。"}, {"text": "80H（十進位 128，即滿刻度 256 的一半）", "isCorrect": true, "rationale": "正確！輸入電壓 $2.5\\text{V}$ 剛好是滿刻度 $5\\text{V}$ 的一半（$1/2$），對應數位輸出為 $256 \\times 0.5 = 128$，十六進位即為 `80H`（`1000 0000B`）。"}, {"text": "10H（十進位 16）", "isCorrect": false, "rationale": "`10H`（16）對應約 0.31V。"}], "hint": "2.5V 是 5V 的一半，所以數位輸出也是 256 的一半（128 = `80H`）！"}, {"questionNumber": 239, "category": "04. I/O埠與硬體介面電路", "isPastExam": false, "examNo": null, "question": "在同學筆記第 13 頁下方的 `DAC0800` 數位類比轉換器電路中，若參考電壓 $V_{\\text{REF}+} = 5\\text{V}$ 串接 $R_{\\text{REF}} = 5\\text{k}\\Omega$（基準電流 $I_{\\text{REF}} = 1\\text{mA}$），當 8051 送入數位輸入 `FFH`（十進位 255）時，DAC0800 輸出的類比電流 $I_{\\text{OUT}}$ 為多少？", "answerOptions": [{"text": "$1\\text{mA} \\times \\frac{255}{256} \\approx 0.996\\text{ mA}$", "isCorrect": true, "rationale": "正確！根據 DAC0800 電流輸出公式 $I_{\\text{OUT}} = I_{\\text{REF}} \\times \\frac{D}{256}$，當數位輸入 $D = 255$（`FFH`）時，輸出電流為最大滿刻度 $\\frac{255}{256}\\text{ mA} \\approx 0.996\\text{ mA}$。"}, {"text": "$100\\text{ mA}$", "isCorrect": false, "rationale": "最大為 1 mA，不會達到 100 mA。"}, {"text": "$0\\text{ mA}$", "isCorrect": false, "rationale": "輸入 `00H` 時輸出才為 `0 mA`。"}, {"text": "$5\\text{ A}$", "isCorrect": false, "rationale": "輸出電流上限受 $I_{\\text{REF}} = 1\\text{mA}$ 限制，不可能達到 5 A。"}], "hint": "套用公式：$I_{\\text{OUT}} = I_{\\text{max}} \\times \\frac{\\text{數位輸入值}}{256}$。"}, {"questionNumber": 240, "category": "04. I/O埠與硬體介面電路", "isPastExam": false, "examNo": null, "question": "在同學筆記第 14~15 頁「LAB 6 軟體解彈跳」中，若原本只有 4 顆獨立按鍵，使用 4 支 I/O 腳可以直接一對一讀取；如果擴充成 $4 \\times 4$（16 顆）矩陣鍵盤，使用行列掃描法（Matrix Scanning）最少只需要佔用幾支 I/O 接腳？", "answerOptions": [{"text": "2 支 I/O 接腳", "isCorrect": false, "rationale": "2 支腳（1×1）只能掃描 1 顆按鍵。"}, {"text": "16 支 I/O 接腳", "isCorrect": false, "rationale": "16 支腳是一對一獨立接法，未使用矩陣掃描。"}, {"text": "32 支 I/O 接腳", "isCorrect": false, "rationale": "32 支腳是 8051 全部 I/O 腳數量。"}, {"text": "8 支 I/O 接腳（4 條行線 + 4 條列線，可控制 $4 \\times 4 = 16$ 顆按鍵）", "isCorrect": true, "rationale": "正確！矩陣鍵盤最大的優點就是節省 I/O 接腳：$N$ 條行線加上 $M$ 條列線只需 $N+M$ 支接腳，就能掃描 $N \\times M$ 顆按鍵（4+4=8 支腳可掃描 16 顆鍵）。"}], "hint": "把 4 條橫線與 4 條直線交叉排成井字棋盤，交點就有 $4 \\times 4 = 16$ 個，線數只要 $4 + 4 = 8$ 條！"}, {"questionNumber": 241, "category": "04. I/O埠與硬體介面電路", "isPastExam": false, "examNo": null, "question": "在 Lab 6 的 $2 \\times 2$ 矩陣鍵盤掃描程式中，當偵測到有按鍵被按下後，軟體解彈跳的標準處理流程為何？", "answerOptions": [{"text": "要求使用者每次按按鍵必須按住超過 10 秒鐘", "isCorrect": false, "rationale": "只需約 20ms 延遲，不需按住 10 秒。"}, {"text": "一偵測到低電位立刻連續執行 50 次數字加 1", "isCorrect": false, "rationale": "若不延遲也不等放開，按一次按鍵數字可能會亂跳好幾下。"}, {"text": "每次按完按鍵都要把 8051 重新斷電", "isCorrect": false, "rationale": "不需斷電。"}, {"text": "先延遲約 10~20 ms 避開按下瞬間的機械彈跳 → 再次讀取確認按鍵確實仍被按下 → 執行對應動作 → 等待按鍵完全放開（並延遲避開放開彈跳）後才繼續下一次掃描", "isCorrect": true, "rationale": "正確！軟體解彈跳的核心就是「延遲 20ms 濾除按下抖動 → 確認有效 → 執行動作 → 等待放開濾除釋放抖動」，確保按一次按鍵只計數一次。"}], "hint": "人的手指按一次按鈕至少需要 100ms 以上，而金屬接點彈跳只有 10~20ms，所以「等 20ms 再確認」就能濾掉抖動！"}, {"questionNumber": 242, "category": "04. I/O埠與硬體介面電路", "isPastExam": false, "examNo": null, "question": "在 Ch2 投影片「輸出電路設計」中，為什麼不能將一個工作電流需要 `100 mA`（線圈電阻 50Ω，工作電壓 5V）的繼電器（Relay）線圈直接接在 8051 的 P1.0 接腳上？", "answerOptions": [{"text": "因為繼電器需要高頻 12 MHz 交流電才能動作", "isCorrect": false, "rationale": "一般直流繼電器使用直流電（如 5V 或 12V DC）驅動線圈。"}, {"text": "因為繼電器內部沒有線圈", "isCorrect": false, "rationale": "電磁繼電器內部正是靠線圈產生磁力吸合接點。"}, {"text": "因為 8051 單一 I/O 接腳的最大灌電流承受能力僅約 `1.6 mA ~ 10 mA`（拉電流更只有數十 μA），無法提供 100 mA 驅動電流，硬接會無法吸合甚至燒毀接腳輸出級", "isCorrect": true, "rationale": "正確！微控制器 I/O 接腳是邏輯控制訊號腳，而非功率驅動腳，必須透過 NPN 電晶體（如 2N2222 / C1815）或 7406 緩衝器進行電流放大才能驅動繼電器。"}, {"text": "因為 8051 的 P1.0 只能輸出負電壓", "isCorrect": false, "rationale": "P1.0 輸出 0V 與 +5V。"}], "hint": "CPU 就像大腦指揮官，只能出小力氣按開關，搬重物（大電流繼電器）要交給電晶體肌肉男來做！"}, {"questionNumber": 243, "category": "04. I/O埠與硬體介面電路", "isPastExam": false, "examNo": null, "question": "當 8051 驅動「共陰極 LED」（陰極接 GND，陽極透過電阻接 P1.0）時，為什麼有時候會發現 LED 亮度明顯比「共陽極接法」暗很多？", "answerOptions": [{"text": "因為共陰極接法會讓 LED 變成紅外線不可見光", "isCorrect": false, "rationale": "LED 發光波長不會因共陽或共陰改變。"}, {"text": "因為 8051 輸出邏輯 1 時電壓只有 0.1V", "isCorrect": false, "rationale": "空載輸出 1 時為 +5V，只是帶重負載時電流受限電壓會被拉低。"}, {"text": "因為 8051（P1~P3）內部提升電阻較大（約數十 kΩ），輸出邏輯 1 時流出的「拉電流（Source Current）」極小，不足以讓 LED 達到額定工作電流", "isCorrect": true, "rationale": "正確！8051 準雙向埠輸出 1 時靠內部弱提升電阻供電，拉電流能力很弱；反之輸出 0 時內部下拉場效電晶體（FET）導通電阻極小，可吸入較大灌電流（Sink Current），因此共陽極接法 LED 亮得多。"}, {"text": "因為 GND 接地線會把光線吸走", "isCorrect": false, "rationale": "非物理原因。"}], "hint": "8051 接腳「往內吸電流（Sink，輸出 0）」很強，「往外推電流（Source，輸出 1）」很弱。"}, {"questionNumber": 244, "category": "05. 計時與計數器 Timer", "isPastExam": false, "examNo": null, "question": "若要使用 Timer 1（Mode 1，16-bit 計時器）在 `12 MHz` 晶振下產生 `10 ms`（10,000 μs）的精確定時，請問應載入 `TH1` 與 `TL1` 的 16 位元計數初值為十進位多少？（轉換為十六進位為何？）", "answerOptions": [{"text": "十進位 15536（十六進位 `3CB0H`）", "isCorrect": false, "rationale": "15536（`3CB0H`）是定時 `50 ms`（50,000 μs）的初值。"}, {"text": "十進位 65536（十六進位 `0000H`）", "isCorrect": false, "rationale": "0000H 是定時 `65.536 ms` 的初值。"}, {"text": "十進位 55536（十六進位 `D8F0H`，即 `TH1 = 0D8H`、`TL1 = 0F0H`）", "isCorrect": true, "rationale": "正確！初值 = $65536 - 10000 = 55536$；換算十六進位：$55536 \\div 256 = 216$ 餘 $240$，而 $216 = \\text{D8H}$、$240 = \\text{F0H}$，故 `TH1 = 0D8H, TL1 = 0F0H`。"}, {"text": "十進位 10000（十六進位 `2710H`）", "isCorrect": false, "rationale": "若填 10000 則會數 $65536 - 10000 = 55536\\text{ }\\mu\\text{s} = 55.536\\text{ ms}$。"}], "hint": "公式永遠是：`65536 - 目標微秒數`，算出來再除以 256 求商數（TH）與餘數（TL）。"}, {"questionNumber": 245, "category": "05. 計時與計數器 Timer", "isPastExam": false, "examNo": null, "question": "在 Timer 的「Mode 2（8-bit 自動重載模式）」下，計時器每次溢位能產生的最大單次計數時間（12 MHz 晶振下）為多少？", "answerOptions": [{"text": "65,536 μs（65.536 ms）", "isCorrect": false, "rationale": "65,536 μs 是 Mode 1（16-bit）的最大單次計時長度。"}, {"text": "1 秒", "isCorrect": false, "rationale": "1 秒需配合軟體計數器累加多次溢位才能達成。"}, {"text": "8,192 μs（8.192 ms）", "isCorrect": false, "rationale": "8,192 μs 是 Mode 0（13-bit）的最大單次計時長度。"}, {"text": "256 μs（當 THx = TLx = 00H 時，從 0 往上數 256 個機械週期溢位一次）", "isCorrect": true, "rationale": "正確！因為 Mode 2 只有低位元組 `TLx`（8 位元）參與計數，8 位元最大計數範圍為 $2^8 = 256$ 個機械週期，在 12 MHz 下即為 `256 μs`。"}], "hint": "Mode 2 是 8-bit 計時器，$2^8 = 256$ 個機械週期。"}, {"questionNumber": 246, "category": "05. 計時與計數器 Timer", "isPastExam": false, "examNo": null, "question": "在 `TCON`（Timer Control，位址 88H）暫存器中，當 Timer 0 計數發生溢位（從 FFFFH 變成 0000H）時，硬體會自動將哪一個旗標位元設為 `1`？", "answerOptions": [{"text": "IT0（Interrupt 0 Type Control，TCON.0）", "isCorrect": false, "rationale": "`IT0` 是設定外部中斷 0 觸發方式（負緣或低準位）的控制位元。"}, {"text": "TR0（Timer 0 Run Control，TCON.4）", "isCorrect": false, "rationale": "`TR0` 是啟動/停止計時器的控制位元，不會因溢位而設為 1。"}, {"text": "IE0（External Interrupt 0 Edge Flag，TCON.1）", "isCorrect": false, "rationale": "`IE0` 是外部中斷 0 的請求旗標。"}, {"text": "TF0（Timer 0 Overflow Flag，TCON.5）", "isCorrect": true, "rationale": "正確！`TF0`（Timer 0 Overflow Flag）在計時器溢位瞬間由硬體自動設為 1，可提供輪詢指令（如 `JNB TF0, $`）檢查，或觸發 Timer 0 中斷（000BH）。"}], "hint": "TF0 = Timer 0 Flag（計時器 0 溢位旗標）。"}, {"questionNumber": 247, "category": "05. 計時與計數器 Timer", "isPastExam": false, "examNo": null, "question": "承上題，若採用「輪詢（Polling）」方式使用 Timer 0 計時（未開啟 Timer 0 中斷），當程式透過 `JNB TF0, $` 等到 `TF0` 變成 `1` 之後，緊接着必須執行什麼指令才能進行下一輪計時？", "answerOptions": [{"text": "必須執行 `CLR TF0`（由軟體手動將溢位旗標清為 0），並重新載入 `TH0` 與 `TL0` 初值（若為 Mode 1）", "isCorrect": true, "rationale": "正確！只有在「開啟中斷並進入 `000BH` 中斷服務程式」時，硬體才會自動清除 `TF0`；若是用輪詢（Polling）方式，必須自己寫 `CLR TF0` 清除旗標！"}, {"text": "必須把石英晶體拔掉再重插", "isCorrect": false, "rationale": "無稽之談。"}, {"text": "硬體會自動在 1 微秒後把 TF0 清為 0，程式不需處理", "isCorrect": false, "rationale": "未進入中斷服務程式時，硬體不會自動清除 TF0。"}, {"text": "必須執行 `SETB TF0`", "isCorrect": false, "rationale": "TF0 已經是 1 了，再執行 SETB TF0 沒有意義。"}], "hint": "進中斷硬體幫你清 `TF0`；用輪詢（`JNB TF0, $`）就得自己動手 `CLR TF0`！"}, {"questionNumber": 248, "category": "06. 中斷系統與解彈跳", "isPastExam": false, "examNo": null, "question": "在 `TCON` 暫存器中，位元 `IT0`（TCON.0）與 `IT1`（TCON.2）的功能為何？", "answerOptions": [{"text": "設定內部 RAM 的暫存器庫編號", "isCorrect": false, "rationale": "暫存器庫由 `PSW` 的 RS1、RS0 選擇。"}, {"text": "選擇外部中斷 INT0 與 INT1 的觸發方式：`0` 為低準位觸發（Low-Level Trigger），`1` 為負緣觸發（Falling Edge Trigger）", "isCorrect": true, "rationale": "正確！同學筆記第 12 頁程式碼中使用 `CLR IT1` 將外部中斷 1 設為「低準位觸發」；若寫 `SETB IT1` 則設為「負緣觸發」。"}, {"text": "選擇串列通訊 UART 的鮑率倍頻模式", "isCorrect": false, "rationale": "鮑率倍頻（SMOD）位於 `PCON` 暫存器。"}, {"text": "開啟或關閉全部中斷功能", "isCorrect": false, "rationale": "開啟或關閉中斷是 `IE` 暫存器的工作。"}], "hint": "IT = Interrupt Type（中斷觸發類型）：0 是準位（Level），1 是邊緣（Edge）。"}, {"questionNumber": 249, "category": "06. 中斷系統與解彈跳", "isPastExam": false, "examNo": null, "question": "在同學筆記第 12 頁的外部中斷 1（`INT1`）實驗程式中，主程式最後一行寫著 `JMP $`，請問當使用者按下連接在 `P3.3`（INT1）的按鈕時，CPU 是如何離開 `JMP $` 去執行中斷服務程式（ISR）的？", "answerOptions": [{"text": "CPU 會先關機重開再執行 ISR", "isCorrect": false, "rationale": "不會關機重開。"}, {"text": "硬體偵測到 INT1 有效觸發訊號後，會在目前指令執行完畢瞬間自動將 PC 推入堆疊，並強制將 PC 載入中斷向量 `0013H` 跳轉執行 ISR；執行完 `RETI` 後再返回 `JMP $`", "isCorrect": true, "rationale": "正確！這正是硬體中斷（Hardware Interrupt）的精髓：主程式不需主動檢查按鈕，硬體會在每個指令週期結束時檢查中斷請求，自動暫停主程式跳至 `0013H`。"}, {"text": "因為 `JMP $` 裡面隱藏了呼叫中斷的指令", "isCorrect": false, "rationale": "`JMP $` 只是原地跳躍指令，並沒有寫呼叫 ISR 的程式碼。"}, {"text": "CPU 永遠無法離開 `JMP $`，按鈕按下去完全沒反應", "isCorrect": false, "rationale": "只要 `EA = 1` 且 `EX1 = 1`，外部中斷隨時可打斷 `JMP $`。"}], "hint": "中斷是由「硬體電路」在背景自動監聽並強行插隊跳轉的，不需要主程式寫 `CALL`。"}, {"questionNumber": 250, "category": "06. 中斷系統與解彈跳", "isPastExam": false, "examNo": null, "question": "若在撰寫中斷服務程式（ISR）時，ISR 內部會修改到累加器 `A` 或 `PSW` 旗標，而主程式同時也正在使用累加器 `A` 做重要運算，為了避免中斷返回後破壞主程式的計算結果，標準做法為何？", "answerOptions": [{"text": "在 ISR 結尾執行 `MOV SP, #07H`", "isCorrect": false, "rationale": "若在 ISR 中把 SP 改為 07H，接下來的 `RETI` 會彈出錯誤的返回位址導致程式當機飛走！"}, {"text": "在進入 ISR 的開頭先執行 `PUSH PSW` 與 `PUSH ACC` 保存現場，在 ISR 結尾 `RETI` 之前再以相反順序執行 `POP ACC` 與 `POP PSW` 還原現場", "isCorrect": true, "rationale": "正確！保護現場（Context Saving）是中斷程式設計的黃金準則：進去先 `PUSH`（後進先出），出來前反向 `POP` 還原，主程式就會完全感覺不到曾被打斷過。"}, {"text": "把主程式的變數全部寫入程式記憶體 ROM", "isCorrect": false, "rationale": "ROM 無法在執行時寫入。"}, {"text": "在中斷期間禁止使用累加器 A 與所有暫存器", "isCorrect": false, "rationale": "幾乎所有運算都需要用到累加器 A，不可能禁止使用。"}], "hint": "進去借用場地前先拍照存證（`PUSH`），離開前照原樣擺回去（`POP`）！"}, {"questionNumber": 251, "category": "07. 串列通訊 UART 與 RS-232", "isPastExam": false, "examNo": null, "question": "在 UART 非同步串列通訊的完整封包（Frame）傳送時序中，若設定為「8 個資料位元、偶同位（Even Parity）、1 個結束位元」，請問傳送這 1 個 Byte 的資料總共需要傳送幾個位元（Bits）？依序為何？", "answerOptions": [{"text": "共 8 bits：僅傳送 D0~D7", "isCorrect": false, "rationale": "缺少起始位元、同位位元與結束位元。"}, {"text": "共 12 bits：2 個起始位元 + 8 個資料位元 + 2 個結束位元", "isCorrect": false, "rationale": "起始位元永遠只有 1 個，不會有 2 個。"}, {"text": "共 11 bits：1 個起始位元（0）+ 8 個資料位元（D0~D7）+ 1 個同位位元（P）+ 1 個結束位元（1）", "isCorrect": true, "rationale": "正確！$1\\text{ (Start)} + 8\\text{ (Data)} + 1\\text{ (Parity)} + 1\\text{ (Stop)} = 11\\text{ bits}$，且順序固定為起始位元最前、D0 到 D7、同位位元在資料之後、結束位元最後。"}, {"text": "共 10 bits：1 個起始位元 + 8 個資料位元 + 1 個結束位元", "isCorrect": false, "rationale": "10 bits 是「無同位位元（None）」時的封包長度。"}], "hint": "把封包裡的每個零件加起來：$1 + 8 + 1 + 1 = 11$。"}, {"questionNumber": 252, "category": "07. 串列通訊 UART 與 RS-232", "isPastExam": false, "examNo": null, "question": "在 UART 串列通訊過程中，如果接收端在預期應該收到「結束位元（Stop Bit，必須為邏輯 1）」的時間點，取樣讀到的卻是「邏輯 0」，這代表發生了什麼通訊錯誤？", "answerOptions": [{"text": "訊框錯誤（Framing Error，FE），通常代表雙方鮑率（傳輸速率）設定不一致或線路受到嚴重干擾", "isCorrect": true, "rationale": "正確！結束位元是整個封包（Frame）的結尾邊界，必須為邏輯 1；若在該時間點讀到 0，代表接收端對錶或取樣步調已偏離訊框邊界，即發生 Framing Error。"}, {"text": "同位檢查錯誤（Parity Error）", "isCorrect": false, "rationale": "同位錯誤是在檢查同位位元與資料位元 1 的奇偶總數不符時發生。"}, {"text": "算術除以零錯誤", "isCorrect": false, "rationale": "與算術運算無關。"}, {"text": "堆疊溢位錯誤（Stack Overflow）", "isCorrect": false, "rationale": "與堆疊無關。"}], "hint": "結束位元用來框住整個訊框（Frame），結束位元不見了就叫做「訊框錯誤（Framing Error）」。"}, {"questionNumber": 253, "category": "07. 串列通訊 UART 與 RS-232", "isPastExam": false, "examNo": null, "question": "在 8051 中，串列通訊資料緩衝器 `SBUF`（位址 99H）在硬體結構上具備哪一項特殊設計，使得 8051 能夠同時進行全雙工傳送與接收？", "answerOptions": [{"text": "`SBUF` 是一個 64KB 的大型硬碟緩衝區", "isCorrect": false, "rationale": "`SBUF` 大小為 1 Byte（8 bits），不是 64KB。"}, {"text": "`SBUF` 只能寫入不能讀取", "isCorrect": false, "rationale": "可寫入（傳送）也可讀取（接收）。"}, {"text": "`SBUF` 同時只能儲存 1 個 bit", "isCorrect": false, "rationale": "一次緩衝 1 個 Byte（8 bits）。"}, {"text": "`SBUF` 在邏輯上共用同一個位址 `99H`，但內部實體上是兩個完全獨立的暫存器：寫入 `SBUF`（如 `MOV SBUF, A`）會存入傳送緩衝器並啟動發送；讀取 `SBUF`（如 `MOV A, SBUF`）則是從接收緩衝器讀出收到的資料", "isCorrect": true, "rationale": "正確！8051 將傳送 SBUF（唯寫）與接收 SBUF（唯讀）重疊映射在同一個位址 `99H`，指令在 `SBUF` 左邊（目的）代表傳送，在 `SBUF` 右邊（來源）代表接收，兩者互不衝突！"}], "hint": "同一個門牌號碼 `99H` 裡面其實住著「發信箱（寫入時用）」和「收信箱（讀取時用）」兩個獨立信箱！"}, {"questionNumber": 254, "category": "07. 串列通訊 UART 與 RS-232", "isPastExam": false, "examNo": null, "question": "在 8051 串列埠控制暫存器 `SCON`（位址 98H）中，若要允許 UART 接收外部傳來的串列資料（即開啟接收致能功能），必須將哪一個控制位元設為 `1`？", "answerOptions": [{"text": "RI（Receive Interrupt Flag，SCON.0）", "isCorrect": false, "rationale": "RI 是接收完成中斷旗標。"}, {"text": "REN（Receive Enable，SCON.4，例如執行 `SETB REN`）", "isCorrect": true, "rationale": "正確！`REN`（Receive Enable）是串列接收器的總開關，只有當 `REN = 1` 時，UART 才會開始偵測 P3.0（RXD）上的起始位元下降緣接收資料。"}, {"text": "TB8（Transmit Bit 8，SCON.3）", "isCorrect": false, "rationale": "TB8 是 Mode 2/3 時傳送的第 9 個資料位元。"}, {"text": "TI（Transmit Interrupt Flag，SCON.1）", "isCorrect": false, "rationale": "TI 是傳送完成中斷旗標。"}], "hint": "REN = Receive Enable（接收致能）。"}, {"questionNumber": 255, "category": "07. 串列通訊 UART 與 RS-232", "isPastExam": false, "examNo": null, "question": "在電信網路傳輸速率單位換算中，若單一數位語音通道（DS-0）為 `64 kbps`，而歐洲系統的 `E1` 線路包含 32 個時槽（30 路語音 + 2 路信令同步），請問一條 E1 線路的總傳輸速率為多少？", "answerOptions": [{"text": "64 kbps", "isCorrect": false, "rationale": "64 kbps 是單一通道速率。"}, {"text": "2.048 Mbps（計算：32 × 64 kbps = 2,048 kbps = 2.048 Mbps）", "isCorrect": true, "rationale": "正確！32 個通道 × 每通道 64 kbps = 2,048 kbps = 2.048 Mbps（與美日台標準的 24 路 T1 = 1.544 Mbps 並列為全球兩大數位中繼標準）。"}, {"text": "44.736 Mbps（這是 T3 速率）", "isCorrect": false, "rationale": "44.736 Mbps 是 T3（28 個 T1）的速率。"}, {"text": "1.544 Mbps（這是美規/台規 24 路的 T1 速率）", "isCorrect": false, "rationale": "1.544 Mbps 是 T1（24 路 + 1 frame bit）的速率。"}], "hint": "每個時槽都是 `64 kbps`，32 個時槽乘起來就是 `2048 kbps`！"}, {"questionNumber": 256, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "在 8051 組合語言指令中，若累加器 `A = 35H`，執行指令「SWAP A」之後，累加器 `A` 的內容會變成多少？", "answerOptions": [{"text": "53H（將累加器 A 的高 4 位元與低 4 位元互換）", "isCorrect": true, "rationale": "正確！`SWAP A`（1 Byte，1 Cycle）將累加器 A 的高半位元組（High Nibble `3`）與低半位元組（Low Nibble `5`）互相對調，變成 `53H`。"}, {"text": "6AH（向左旋轉一位）", "isCorrect": false, "rationale": "左旋是 `RL A`。"}, {"text": "CAH（取 1 的補數）", "isCorrect": false, "rationale": "取 1 的補數是 `CPL A`。"}, {"text": "00H", "isCorrect": false, "rationale": "清零是 `CLR A`。"}], "hint": "SWAP 就是把高 4 位元（左邊那位十六進位數）跟低 4 位元（右邊那位十六進位數）交換位置！"}, {"questionNumber": 257, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "在 8051 組合語言中，指令「INC DPTR」會將 16 位元資料指標 DPTR 的內容加 1。請問有沒有對應的「DEC DPTR」（將 16 位元 DPTR 減 1）指令？", "answerOptions": [{"text": "連 `INC DPTR` 也沒有", "isCorrect": false, "rationale": "標準 8051 具備 `INC DPTR` 指令，常用於查表指標遞增。"}, {"text": "有，而且可以一次減 10", "isCorrect": false, "rationale": "無此指令。"}, {"text": "沒有！標準 8051 指令集中只有 `INC DPTR`（16 位元加 1），並沒有 `DEC DPTR` 指令", "isCorrect": true, "rationale": "正確！這是標準 8051 指令集著名的不對稱設計之一：有 `INC DPTR`（Opcode A3H），但沒有 `DEC DPTR`（若要將 DPTR 減 1，必須分別對 `DPL` 與 `DPH` 進行減法借位處理）。"}, {"text": "有，而且執行時間只要 1 個機械週期", "isCorrect": false, "rationale": "標準 8051 並無 `DEC DPTR` 指令。"}], "hint": "這是 8051 指令集裡一個著名的冷知識：DPTR 只能整組 `+1`，不能整組 `-1`！"}, {"questionNumber": 258, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "執行指令「MOVC A, @A+PC」與執行指令「MOVC A, @A+DPTR」這兩道查表指令的最大差異為何？", "answerOptions": [{"text": "`@A+DPTR` 使用 16 位元資料指標 DPTR 當基底，可讀取 64K 程式記憶體任意處的表格；`@A+PC` 使用目前程式計數器 PC 當基底，只能讀取緊跟在該指令後方 255 Bytes 內的表格", "isCorrect": true, "rationale": "正確！兩者皆是從「程式記憶體（ROM）」讀取資料存入 A（不會改變 PC 或 DPTR 的值），差別在於基底暫存器不同：`DPTR` 可指向任意 16 位元位址，而 `PC` 僅能偏移 `+0 ~ +255` Bytes。"}, {"text": "`@A+PC` 可以修改程式計數器 PC 的值並跳躍過去", "isCorrect": false, "rationale": "PC 只是暫時拿來相加計算位址，執行後 PC 仍正常指向下一道指令，不會跳躍。"}, {"text": "兩者指令名稱不同，但機械碼完全一樣", "isCorrect": false, "rationale": "機械碼不同（`@A+DPTR` 為 `93H`，`@A+PC` 為 `83H`）。"}, {"text": "`@A+DPTR` 讀取的是內部 RAM；`@A+PC` 讀取的是外部 RAM", "isCorrect": false, "rationale": "兩者皆是 `MOVC`，存取的都是程式記憶體（Code Memory）。"}], "hint": "一個拿 `DPTR` 當起點（全 ROM 隨便指），一個拿 `PC` 當起點（只能抓緊跟在指令後面不遠處的表格）。"}, {"questionNumber": 259, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "在條件跳躍指令中，除了 `JZ`、`JNZ`、`CJNE`、`DJNZ` 之外，針對單一位元（Bit）狀態判斷的跳躍指令「JB P1.0, LABEL」與「JNB P1.0, LABEL」分別代表什麼意思？", "answerOptions": [{"text": "`JB` 當 P1.0 為 0 時跳躍；`JNB` 當 P1.0 為 1 時跳躍", "isCorrect": false, "rationale": "條件剛好寫反了（B = Bit is 1，NB = Not Bit / Bit is 0）。"}, {"text": "`JB`（Jump if Bit is set）：當 P1.0 為 `1` 時跳躍至 LABEL；`JNB`（Jump if Not Bit）：當 P1.0 為 `0` 時跳躍至 LABEL", "isCorrect": true, "rationale": "正確！如同學筆記第 12 頁程式碼中的 `JNB P3.3, Wait`：只要 P3.3 還是 `0`（按鈕還沒放開），就一直跳回 `Wait` 原地等待；一旦放開變成 `1`，就不跳躍而往下離開！"}, {"text": "兩者都是無條件跳躍指令", "isCorrect": false, "rationale": "無條件跳躍是 `JMP` / `SJMP` / `LJMP`。"}, {"text": "`JB` 將 P1.0 設為 1；`JNB` 將 P1.0 清為 0", "isCorrect": false, "rationale": "這是條件跳躍指令，不會改變 P1.0 的電位。"}], "hint": "JB = Jump if Bit（位元為 1 就跳），JNB = Jump if Not Bit（位元不為 1，也就是為 0 就跳）。"}, {"questionNumber": 260, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "在同學筆記第 12 頁的外部中斷服務程式中，指令「JBC」與「JNB」有何差別？（註：`JBC bit, rel` 在中斷旗標處理上非常實用）", "answerOptions": [{"text": "`JBC`（Jump if Bit is set and Clear）在偵測到該位元為 `1` 並跳躍的同時，會順便自動將該位元清除為 `0`；而 `JB` 只跳躍不清除", "isCorrect": true, "rationale": "正確！`JBC`（Jump if Bit set then Clear）把「檢查旗標為 1 → 跳躍 → 清除旗標為 0」三個動作合而為一，常用於單一中斷向量需同時判斷 `RI` 與 `TI` 的 UART 中斷服務程式中！"}, {"text": "`JBC` 只在位元為 0 時跳躍", "isCorrect": false, "rationale": "條件是位元為 `1` 時跳躍。"}, {"text": "`JBC` 會把累加器 A 清為 0", "isCorrect": false, "rationale": "清除的是指定的單一 `bit`，不是整個累加器 A。"}, {"text": "`JBC` 是無條件呼叫副程式指令", "isCorrect": false, "rationale": "呼叫副程式是 `CALL` / `ACALL` / `LCALL`。"}], "hint": "字尾多了一個 `C`（Clear），代表「如果為 1 就跳躍，並且順手幫你清成 0」！"}, {"questionNumber": 261, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "在查表法霹靂燈實驗（`TABLE: DB 07EH, 0BDH, 0DBH, 0E7H, 0DBH, 0BDH`）中，這 6 個十六進位數值依序輸出到共陽極 LED（P1.0 ~ P1.7）時，8 顆 LED（D7 ~ D0）會呈現什麼視覺燈效？", "answerOptions": [{"text": "從左到右單顆依序亮起，亮到底就熄滅不再亮", "isCorrect": false, "rationale": "這是對稱雙燈往返跑馬燈。"}, {"text": "8 顆 LED 同時全亮再同時全滅", "isCorrect": false, "rationale": "全亮是 `00H`，全滅是 `FFH`。"}, {"text": "只有 D0 一顆燈原地閃爍", "isCorrect": false, "rationale": "每筆資料都有兩個 `0`，代表同時亮兩顆燈。"}, {"text": "兩顆亮燈從最外側（D7、D0）同時往中間移動（D6、D1 → D5、D2 → D4、D3），再從中間反彈退回最外側，形成雙燈對稱往返閃爍", "isCorrect": true, "rationale": "正確！觀察二進位：`07EH`=`0111 1110`（亮D7,D0）、`0BDH`=`1011 1101`（亮D6,D1）、`0DBH`=`1101 1011`（亮D5,D2）、`0E7H`=`1110 0111`（亮D4,D3），接著再倒退回 `0DBH`、`0BDH` 循環！"}], "hint": "把 `07EH`、`0BDH`、`0DBH`、`0E7H` 轉成 8 位元二進位，觀察兩個 `0`（亮燈）的位置移動軌跡！"}, {"questionNumber": 262, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "在你的筆記第 20 頁「DLL（動態連結函式庫）」概念與 8051 連結器 `LINK4.EXE` 的比較中，下列敘述何者正確？", "answerOptions": [{"text": "8051 晶片內部直接執行 Windows 的 `.dll` 檔案", "isCorrect": false, "rationale": "8051 沒有 Windows 作業系統，不能執行 `.dll`。"}, {"text": "連結器 `LINK4.EXE` 負責把 C++ 語言翻譯成 Python 語言", "isCorrect": false, "rationale": "連結器不負責高階語言翻譯。"}, {"text": "動態連結函式庫會讓每個執行檔體積膨脹 100 倍", "isCorrect": false, "rationale": "動態連結的優點正是多個程式共用同一份 DLL，減小執行檔體積。"}, {"text": "`LINK4.EXE` 是在編譯時期（靜態連結）將各 `.obj` 目的檔與函式庫打包整併並重定位記憶體位址，產生獨立可燒錄的 `.tsk` 檔；而 Windows 的 `.dll` 則是在程式執行期間動態載入共享的函式庫", "isCorrect": true, "rationale": "正確！同學筆記第 9 頁與你的筆記第 20 頁解釋了連結（Link）的原理：靜態連結在燒錄前就把所有需要的程式碼打包進 `.tsk` 並算好位址；動態連結（DLL）則是作業系統在執行時才動態掛載。"}], "hint": "單晶片沒有作業系統，所以所有需要的副程式必須在燒錄前就先「靜態打包（LINK4）」進同一個 `.tsk` 檔案裡！"}, {"questionNumber": 263, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "在 8051 組合語言中，執行無進位加法「ADD A, #30H」與執行帶進位加法「ADDC A, #30H」有何不同？", "answerOptions": [{"text": "兩者功能完全相同", "isCorrect": false, "rationale": "`ADDC` 多加了 `CY` 的值（0 或 1）。"}, {"text": "`ADD` 只計算 `A + 30H`；`ADDC`（Add with Carry）則計算 `A + 30H + CY`（把進位旗標 CY 也一起加進去），主要用於超過 8 位元的多位元組（如 16-bit 或 32-bit）加法運算", "isCorrect": true, "rationale": "正確！當我們要用 8 位元的 8051 計算兩個 16 位元數字相加時，低位元組先用 `ADD` 相加，高位元組再用 `ADDC` 相加，就能把低位元組產生的進位 `CY` 帶入高位元組！"}, {"text": "`ADDC` 會把結果存進資料指標 DPTR", "isCorrect": false, "rationale": "結果皆存回累加器 `A`。"}, {"text": "`ADD` 用於正數加法，`ADDC` 用於負數減法", "isCorrect": false, "rationale": "減法指令是 `SUBB`（Subtract with Borrow）。"}], "hint": "字尾的 `C` 就是 Carry（進位旗標 CY）！"}, {"questionNumber": 264, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "執行算術減法指令「SUBB A, R2」（Subtract with Borrow）時，其完整的數學運算公式為何？因此在使用 `SUBB` 進行單純 8 位元減法（不需借位）之前，通常要先執行哪一道指令？", "answerOptions": [{"text": "計算 `A - R2 - CY`；進行純 8 位元減法前通常要先執行 `CLR C`（將進位/借位旗標 CY 清為 0）", "isCorrect": true, "rationale": "正確！8051 沒有單獨的 `SUB` 指令，只有帶借位減法 `SUBB`（計算 `A - src - CY`），因此在做第一個 Byte 減法前，必須先 `CLR C` 確保沒有殘留的借位被多扣掉 1！"}, {"text": "計算 `A × R2`", "isCorrect": false, "rationale": "乘法是 `MUL AB`。"}, {"text": "計算 `R2 - A`；不需理會 CY", "isCorrect": false, "rationale": "是被減數 `A` 減去減數 `R2`，且必須注意 `CY`。"}, {"text": "計算 `A + R2 + CY`；執行前要先執行 `SETB C`", "isCorrect": false, "rationale": "若先 `SETB C`，減法結果會多扣掉 1。"}], "hint": "8051 只有「帶借位減法（SUBB）」，所以減之前記得先 `CLR C` 把借位清零，才不會平白無故多減 1！"}, {"questionNumber": 265, "category": "01. 微算機架構與指令週期", "isPastExam": false, "examNo": null, "question": "電腦五大單元中，負責暫時或永久儲存程式與資料的單元是哪一個？", "answerOptions": [{"text": "算術邏輯單元（ALU）", "isCorrect": false, "rationale": "ALU 負責算術與邏輯運算。"}, {"text": "輸出單元（OU）", "isCorrect": false, "rationale": "OU 負責將處理結果輸出至外部裝置。"}, {"text": "記憶單元（Memory Unit, MU）", "isCorrect": true, "rationale": "正確！記憶單元（MU）包含 ROM（程式記憶體）與 RAM（資料記憶體）。"}, {"text": "控制單元（CU）", "isCorrect": false, "rationale": "CU 負責指令解碼與控制時序。"}], "hint": "Memory 的中文就是記憶。"}, {"questionNumber": 266, "category": "01. 微算機架構與指令週期", "isPastExam": false, "examNo": null, "question": "電腦五大單元中，負責從外部感測器、按鈕或鍵盤接收資訊進入微控制器的單元是哪一個？", "answerOptions": [{"text": "輸出單元（Output Unit, OU）", "isCorrect": false, "rationale": "OU 負責驅動 LED、繼電器、喇叭或顯示器。"}, {"text": "記憶單元（MU）", "isCorrect": false, "rationale": "MU 負責儲存。"}, {"text": "輸入單元（Input Unit, IU）", "isCorrect": true, "rationale": "正確！輸入單元（IU）負責接收外部數位或類比轉換後的訊號。"}, {"text": "算術邏輯單元（ALU）", "isCorrect": false, "rationale": "ALU 負責運算。"}], "hint": "Input 的中文就是輸入。"}, {"questionNumber": 267, "category": "01. 微算機架構與指令週期", "isPastExam": false, "examNo": null, "question": "下列哪一顆晶片在出廠製造時就已將程式永久寫死在光罩中，無法事後抹除修改，僅適合超大量生產定型產品？", "answerOptions": [{"text": "89C51 / 89C52（EEPROM/Flash）", "isCorrect": false, "rationale": "89C51 可用電氣抹除重燒。"}, {"text": "8031 / 8032（無 ROM 型）", "isCorrect": false, "rationale": "8031 內部無 ROM。"}, {"text": "8751 / 8752（EPROM）", "isCorrect": false, "rationale": "8751 可用紫外線抹除重燒。"}, {"text": "8051 / 8052（Mask ROM 光罩式唯讀記憶體）", "isCorrect": true, "rationale": "正確！型號第二碼為 `0` 的 8051/8052 內建 Mask ROM，由半導體廠光罩一次成型，無法更改。"}], "hint": "光罩（Mask）一旦開模製作完成，內容就固定無法修改。"}, {"questionNumber": 268, "category": "01. 微算機架構與指令週期", "isPastExam": false, "examNo": null, "question": "下列哪一顆 MCS-51 晶片同時具備「內建 8K Bytes EEPROM（Flash）」、「256 Bytes RAM」、「3 個 16 位元計時器」以及「6 個中斷源」？", "answerOptions": [{"text": "8032", "isCorrect": false, "rationale": "8032 內部無 ROM（0K），需外接程式記憶體。"}, {"text": "89C51（或 89S51）", "isCorrect": false, "rationale": "89C51 只有 4K ROM、128B RAM、2 個 Timer 與 5 個中斷源。"}, {"text": "89C52（或 89S52）", "isCorrect": true, "rationale": "正確！`89` 代表內建 EEPROM/Flash，`52` 代表 8K ROM、256B RAM、3 個 Timer 與 6 個中斷源。"}, {"text": "8031", "isCorrect": false, "rationale": "8031 內部無 ROM（0K）。"}], "hint": "把 `89`（Flash ROM）跟 `52`（加倍規格）組合起來！"}, {"questionNumber": 269, "category": "01. 微算機架構與指令週期", "isPastExam": false, "examNo": null, "question": "8051 晶片共有 111 個指令碼，在 8 位元（256 種組合）的操作碼（Opcode）編碼表中，唯獨哪一個十六進位機械碼在標準 8051 中被保留未定義使用？", "answerOptions": [{"text": "22H（RET）", "isCorrect": false, "rationale": "`22H` 是副程式返回指令 `RET`。"}, {"text": "FFH（MOV R7, A）", "isCorrect": false, "rationale": "`FFH` 是 `MOV R7, A`。"}, {"text": "A5H", "isCorrect": true, "rationale": "正確！在標準 8051 機械碼表（如你的筆記第 24~25 頁）中，`00H~FFH` 共 256 個編碼中唯獨 `A5H` 保留未定義。"}, {"text": "00H（NOP）", "isCorrect": false, "rationale": "`00H` 是空操作指令 `NOP`。"}], "hint": "這個保留未定義的機械碼位於 `A0H` 那一列的第 5 格。"}, {"questionNumber": 270, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "在 PDIP-40 封裝的 8051 中，若要將外部程式記憶體的 16 位元位址線 `A0 ~ A15` 完整輸出給外部 EPROM，請問 `A0 ~ A7` 與 `A8 ~ A15` 分別來自哪兩組接腳？", "answerOptions": [{"text": "`A0 ~ A7` 來自 Port 2；`A8 ~ A15` 來自 Port 0", "isCorrect": false, "rationale": "高低位元組的 Port 順序顛倒了。"}, {"text": "`A0 ~ A7` 來自 Port 1；`A8 ~ A15` 來自 Port 3", "isCorrect": false, "rationale": "P1 與 P3 不輸出記憶體位址。"}, {"text": "`A0 ~ A7` 來自 Port 0（經 74LS373 栓鎖後輸出）；`A8 ~ A15` 來自 Port 2（Pin 21 ~ Pin 28）", "isCorrect": true, "rationale": "正確！低位址 A0~A7 由 Port 0 分時多工送出並由 74LS373 鎖住；高位址 A8~A15 直接由 Port 2 穩定輸出。"}, {"text": "全部 16 條位址線都從 Port 1 分兩次送出", "isCorrect": false, "rationale": "Port 1 不負責外部記憶體位址。"}], "hint": "口訣：低位 P0（配 373 鎖住），高位 P2（直接輸出）。"}, {"questionNumber": 271, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "在開發板電路圖（U8: 6116 SRAM DIP24）中，當開發板撥動開關 SW1 切換到「Download（下載模式）」時，AT89C51 的 Bootloader 是使用哪一道指令將從電腦收到的程式碼一筆一筆寫入 6116 SRAM？", "answerOptions": [{"text": "`SWAP A`（半位元組交換指令）", "isCorrect": false, "rationale": "`SWAP A` 只操作累加器 A。"}, {"text": "`MOVX @DPTR, A`（外部資料記憶體寫入指令，觸發 P3.6 `/WR` 腳將資料寫入 6116）", "isCorrect": true, "rationale": "正確！下載時 6116 接成外部資料記憶體（RAM），Bootloader 把收到的機械碼放入 `A`、目標位址放入 `DPTR`，執行 `MOVX @DPTR, A` 即可寫入 6116。"}, {"text": "`MOVC A, @A+DPTR`（程式記憶體讀取指令）", "isCorrect": false, "rationale": "`MOVC` 只能「讀取」程式記憶體，不能寫入。"}, {"text": "`PUSH ACC`（內部堆疊推入指令）", "isCorrect": false, "rationale": "`PUSH` 只能寫入 8051 內部 RAM 堆疊，不能寫入外部 6116。"}], "hint": "要寫入「外部（eXternal）」資料記憶體，必須使用帶有 `X` 的搬移指令！"}, {"questionNumber": 272, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "在開發板電路圖中，6116 SRAM（2K Bytes，位址範圍 `0000H ~ 07FFH`）共有 11 條位址線 `A0 ~ A10`，分別連接至低位址匯流排 `B0 ~ B10`。請問剩下的高位址線 `B13、B14、B15` 連接至哪一顆 IC 進行位址解碼？", "answerOptions": [{"text": "U15（74LS138，3 對 8 線解碼器）", "isCorrect": true, "rationale": "正確！高位址線 A13、A14、A15 送入 74LS138 解碼器的 A、B、C 輸入端，將 64K 位址空間劃分為 8 個 8K 區塊以產生晶片選擇訊號。"}, {"text": "U14（DAC0800，數位類比轉換器）", "isCorrect": false, "rationale": "DAC0800 連接的是經 74LS373 栓鎖的資料匯流排。"}, {"text": "U10（MAX232，RS-232 轉換器）", "isCorrect": false, "rationale": "MAX232 連接的是 P3.0/P3.1。"}, {"text": "U9（74LS373，八位元栓鎖器）", "isCorrect": false, "rationale": "74LS373 連接的是低 8 位元 AD0~AD7。"}], "hint": "3 條高位址線（A13, A14, A15）剛好送進「3 對 8 解碼器（74LS138）」。"}, {"questionNumber": 273, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "若 8051 外接 `6 MHz` 的石英振盪晶體，請問此時 1 個振盪週期 $T_{osc}$ 與 1 個機械週期分別為多少時間？", "answerOptions": [{"text": "$T_{osc} = 6\\text{ }\\mu\\text{s}$，1 機械週期 = $72\\text{ }\\mu\\text{s}$", "isCorrect": false, "rationale": "頻率與週期應為倒數關係。"}, {"text": "$T_{osc} = 0.5\\text{ }\\mu\\text{s}$，1 機械週期 = $6\\text{ }\\mu\\text{s}$", "isCorrect": false, "rationale": "計算錯誤。"}, {"text": "$T_{osc} = 1/12\\text{ }\\mu\\text{s}$，1 機械週期 = $1\\text{ }\\mu\\text{s}$", "isCorrect": false, "rationale": "這是 12 MHz 晶振的數值。"}, {"text": "$T_{osc} = 1/6\\text{ }\\mu\\text{s}$（約 166.7 ns），1 機械週期 = $2\\text{ }\\mu\\text{s}$", "isCorrect": true, "rationale": "正確！頻率為 12 MHz 的一半（6 MHz），因此週期變為 2 倍：1 機械週期 = $12 / 6\\text{MHz} = 2\\text{ }\\mu\\text{s}$。"}], "hint": "晶振頻率減半（12MHz → 6MHz），執行時間就會加倍（1μs → 2μs）。"}, {"questionNumber": 274, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "在 8051 系統電路中，若將第 9 腳 `RST` 持續接在 `+5V`（高電位）不放開，CPU 會處於什麼狀態？", "answerOptions": [{"text": "CPU 會一直處於重置狀態，程式計數器 PC 被鎖死在 `0000H`，四個 I/O 埠維持 `FFH`，完全不會往下執行任何指令", "isCorrect": true, "rationale": "正確！因為 8051 是高電位重置，只要 RST 維持高電位，內部暫存器與 PC 就會被持續強制歸零，直到 RST 降回低電位才開始從 0000H 抓指令執行。"}, {"text": "CPU 會自動進入省電休眠模式", "isCorrect": false, "rationale": "8051 省電模式是透過 PCON 暫存器的 IDL 或 PD 位元進入。"}, {"text": "CPU 會以兩倍速度瘋狂執行程式", "isCorrect": false, "rationale": "不會加快執行。"}, {"text": "CPU 會正常執行完所有程式", "isCorrect": false, "rationale": "必須等 RST 回到低電位（0V）才會開始執行程式。"}], "hint": "這也是為什麼 POSR 開機重置電路的電容充飽後，必須讓 RST 降回 0V 的原因！"}, {"questionNumber": 275, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": false, "examNo": null, "question": "在 8051 內部資料記憶體中，當程式同時需要「四組工作暫存器庫（RB0 ~ RB3）」全部用於不同中斷等級的快速現場切換時，主程式一開始應將堆疊指標 `SP` 至少設定在多少以上才安全？", "answerOptions": [{"text": "`07H`（維持 Reset 預設值即可）", "isCorrect": false, "rationale": "若維持 `07H`，第一次 PUSH 就會寫入 `08H` 破壞 RB1。"}, {"text": "`2FH` 或 `30H` 以上（避開 `00H ~ 1FH` 的四組暫存器庫與 `20H ~ 2FH` 的可位元定址區）", "isCorrect": true, "rationale": "正確！`00H ~ 1FH` 是四組暫存器庫，`20H ~ 2FH` 是可位元定址區，因此將 `SP` 設為 `2FH`（第一次 PUSH 存 30H）或 `30H`（第一次 PUSH 存 31H）最為安全。"}, {"text": "`0FH`", "isCorrect": false, "rationale": "若設為 `0FH`，第一次 PUSH 會寫入 `10H` 破壞 RB2。"}, {"text": "`17H`", "isCorrect": false, "rationale": "若設為 `17H`，第一次 PUSH 會寫入 `18H` 破壞 RB3。"}], "hint": "只有 `30H ~ 7FH` 是完全不會跟暫存器庫或位元定址區打架的自由空間。"}, {"questionNumber": 276, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": false, "examNo": null, "question": "在 8051 中，如果主程式執行 `MOV SP, #7FH`（將堆疊指標直接設在內部 RAM 的最高上限 7FH），緊接着執行 `CALL DELAY`，會發生什麼嚴重問題？", "answerOptions": [{"text": "推入返回位址時 SP 會溢位超過 `7FH` 進入 `80H` 與 `81H`（即直接寫入特殊功能暫存器 P0 與 SP 本身！），造成 Stack Overflow 系統崩潰", "isCorrect": true, "rationale": "正確！因為 8051 堆疊是「往上（高位址）生長」的，設在 `7FH` 再 `CALL` 會讓 SP 加 2 變成 `81H`，直接覆蓋掉 SFR 區的 `P0 (80H)` 與 `SP (81H)` 自己，造成災難性錯誤！"}, {"text": "程式會執行得更穩定", "isCorrect": false, "rationale": "會導致系統失控當機。"}, {"text": "SP 會自動變成 30H", "isCorrect": false, "rationale": "不會自動跳回 30H。"}, {"text": "堆疊會自動擴充到外部硬碟", "isCorrect": false, "rationale": "不會自動擴充到外部。"}], "hint": "7FH 已經是頂樓天花板了，再往上蓋兩層就會撞進 SFR 控制室！"}, {"questionNumber": 277, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": false, "examNo": null, "question": "關於特殊功能暫存器 `PCON`（Power Control，位址 87H），下列敘述何者正確？", "answerOptions": [{"text": "它是用來控制 Port 0 電壓大小的暫存器", "isCorrect": false, "rationale": "不是控制 Port 0 電壓。"}, {"text": "它是程式計數器 PC 的高 8 位元", "isCorrect": false, "rationale": "與 PC 無關。"}, {"text": "其最高位元 `SMOD`（Bit 7）可用於將串列通訊 UART 的鮑率加倍（Double Baud Rate），且因位址尾數為 `7H` 故不支援位元定址", "isCorrect": true, "rationale": "正確！`PCON` 位址為 `87H`（不能被 8 整除），因此不能用 `SETB`，必須用整組 Byte 指令（如 `MOV PCON, #80H`）將最高位 `SMOD` 設為 1 來使鮑率加倍。"}, {"text": "它支援位元定址，可以用 `SETB SMOD` 直接設定", "isCorrect": false, "rationale": "位址 `87H` 不支援位元定址，寫 `SETB SMOD` 會報錯。"}], "hint": "位址尾數不是 `0H` 或 `8H` 的 SFR，全部都不能用 `SETB` / `CLR` 單獨改其中一個位元！"}, {"questionNumber": 278, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": false, "examNo": null, "question": "在 8051 內部 RAM 的可位元定址區（20H ~ 2FH）中，若執行指令「MOV 25H, #00H」，緊接著執行「SETB 25H.3」，請問內部 RAM 位址 `25H` 的內容變成多少？", "answerOptions": [{"text": "80H（1000 0000B）", "isCorrect": false, "rationale": "80H 是 Bit 7（$2^7 = 128$）為 1。"}, {"text": "08H（0000 1000B，將 Bit 3 設為 1）", "isCorrect": true, "rationale": "正確！Bit 3 的二進位權重為 $2^3 = 8$，因此將 `25H` 的 Bit 3 設為 1 后，數值變成 `0000 1000B` = `08H`。"}, {"text": "03H（0000 0011B）", "isCorrect": false, "rationale": "03H 是 Bit 0 與 Bit 1 為 1。"}, {"text": "04H（0000 0100B）", "isCorrect": false, "rationale": "04H 是 Bit 2（$2^2 = 4$）為 1。"}], "hint": "二進位權重：$2^0=1, 2^1=2, 2^2=4, 2^3=8$。"}, {"questionNumber": 279, "category": "04. I/O埠與硬體介面電路", "isPastExam": false, "examNo": null, "question": "在同學筆記第 13 頁 `ADC0804` 的接腳功能中，第 9 腳 `VREF/2` 的作用為何？若 `VREF/2` 接腳保持空接（Open），則 ADC0804 預設的類比輸入滿刻度電壓範圍（Span）為多少？", "answerOptions": [{"text": "用來連接石英振盪晶體", "isCorrect": false, "rationale": "晶振接在 Pin 4 與 Pin 19。"}, {"text": "用來輸出數位資料的最低位元；空接時範圍為 `0V ~ 100V`", "isCorrect": false, "rationale": "Pin 9 是參考電壓調整腳，不是數位輸出。"}, {"text": "必須接地否則晶片會燒毀", "isCorrect": false, "rationale": "空接為標準 0~5V 操作模式，不會燒毀。"}, {"text": "用來設定參考電壓的一半；若空接則內部預設 $V_{\\text{REF}}/2 = 2.5\\text{V}$，對應滿刻度類比輸入電壓範圍為 `0V ~ 5V`（即 $2 \\times V_{\\text{REF}}/2$）", "isCorrect": true, "rationale": "正確！ADC0804 的滿刻度類比跨距（Full-Scale Span）等於 $2 \\times (V_{\\text{REF}}/2)$；若外接 `1.28V` 則輸入範圍為 `0V ~ 2.56V`（每階剛好 10mV），若空接則內部自動分壓為 `2.5V`（範圍 `0V ~ 5V`）。"}], "hint": "接腳名稱叫做「參考電壓的一半（VREF/2）」，所以滿刻度電壓就是它的 2 倍！"}, {"questionNumber": 280, "category": "04. I/O埠與硬體介面電路", "isPastExam": false, "examNo": null, "question": "在開發板電路圖（U14: DAC0800）中，Pin 14 標示為 `VREF+`，Pin 15 標示為 `VREF-`（接電阻至 GND），Pin 4 為 `IOUT`（電流輸出），Pin 2 為 `/IOUT`（互補電流輸出）。請問互補電流輸出 `/IOUT` 與 `IOUT` 的總和永遠等於多少？", "answerOptions": [{"text": "永遠等於滿刻度參考電流 $I_{\\text{FS}}$（即 $I_{\\text{OUT}} + \\overline{I_{\\text{OUT}}} = I_{\\text{FS}}$，一增一減互補）", "isCorrect": true, "rationale": "正確！DAC0800 內部採用 R-2R 電流導引開關陣列，數位位元為 1 時電流導向 `IOUT`，為 0 時電流導向 `/IOUT`，因此兩者之和恆等於總基準電流。"}, {"text": "兩者毫無關係", "isCorrect": false, "rationale": "兩者呈現互補關係（Complementary）。"}, {"text": "永遠等於 0", "isCorrect": false, "rationale": "總和為恆定基準電流，非零。"}, {"text": "永遠等於 100 A", "isCorrect": false, "rationale": "數值過大。"}], "hint": "就像把一條固定水量的水管分成兩條支流，左邊多流一點、右邊就少流一點，加起來總水量不變。"}, {"questionNumber": 281, "category": "04. I/O埠與硬體介面電路", "isPastExam": false, "examNo": null, "question": "在 8051 驅動「共陰極 LED」與「共陽極 LED」的比較中，若我們使用一顆 `7404` 或 `7406` 反相器緩衝 IC 接在 8051 的 P1.0 與「共陽極 LED」之間，此時 8051 的 P1.0 要輸出邏輯 `0` 還是邏輯 `1` 才能讓 LED 點亮？", "answerOptions": [{"text": "LED 永遠不會亮", "isCorrect": false, "rationale": "只要 P1.0 輸出 1 即可點亮。"}, {"text": "P1.0 必須輸出高阻抗", "isCorrect": false, "rationale": "邏輯電位即可控制。"}, {"text": "P1.0 必須輸出邏輯 `0`", "isCorrect": false, "rationale": "若 P1.0 輸出 `0`，經過反相器會變成 `1`（+5V），LED 兩端同電位反而熄滅。"}, {"text": "P1.0 必須輸出邏輯 `1`（經過反相器變成 `0V` 低電位，才能點亮共陽極 LED）", "isCorrect": true, "rationale": "正確！因為中間多了一顆「反相器（Inverter）」，P1.0 輸出 `1` → 反相器輸出 `0` → 電流從 +5V 經共陽極 LED 灌入反相器，LED 點亮！"}], "hint": "反相器會把 0 變 1、1 變 0，所以原本給 0 才亮的共陽極 LED，加了反相器後變成給 1 才亮！"}, {"questionNumber": 282, "category": "05. 計時與計數器 Timer", "isPastExam": false, "examNo": null, "question": "在 8051 中，如果想要讓 Timer 1 工作在「Mode 2（8-bit 自動重載模式）」，並且每 `100 μs`（12 MHz 晶振下）就自動溢位一次，請問應填入 `TH1` 與 `TL1` 的十進位初值為何？", "answerOptions": [{"text": "156（計算：256 - 100 = 156，即十六進位 `9CH`）", "isCorrect": true, "rationale": "正確！Mode 2 是 8 位元計數器，在 `256` 溢位，因此初值 = $256 - 100 = 156$（`9CH`），同時放入 `TH1`（重載值）與 `TL1`（初始計數值）。"}, {"text": "100（十六進位 `64H`）", "isCorrect": false, "rationale": "若填入 100，則會數 $256 - 100 = 156\\text{ }\\mu\\text{s}$。"}, {"text": "65436（十六進位 `FF9CH`）", "isCorrect": false, "rationale": "65436 是 16 位元 Mode 1 的初值。"}, {"text": "256（十六進位 `00H`）", "isCorrect": false, "rationale": "256 超過 8 位元最大值 255（填入 00H 會數 256 μs）。"}], "hint": "8-bit 上數計時器到 256 溢位，所以用 `256 - 100`！"}, {"questionNumber": 283, "category": "05. 計時與計數器 Timer", "isPastExam": false, "examNo": null, "question": "為什麼在設定 8051 串列通訊（UART）的鮑率產生器（Baud Rate Generator）時，幾乎一律使用「Timer 1 的 Mode 2（8-bit 自動重載模式）」，而不使用 Mode 1（16-bit 模式）？", "answerOptions": [{"text": "因為 Mode 2 溢位時由硬體自動重載 TH1 初值，完全不需要進入中斷再用軟體重新寫入初值，不會產生軟體延遲累積誤差，可確保鮑率時脈高度精準", "isCorrect": true, "rationale": "正確！鮑率時脈要求極高精準度，若用軟體重載初值會因中斷響應時間而產生誤差；Mode 2 的硬體自動重載（Auto-Reload）完全消除了這個誤差。"}, {"text": "因為 Mode 2 可以直接把文字翻譯成英文", "isCorrect": false, "rationale": "與語言翻譯無關。"}, {"text": "因為 Mode 1 不能在 12 MHz 晶振下運作", "isCorrect": false, "rationale": "Mode 1 可在 12 MHz 下運作。"}, {"text": "因為 Timer 1 沒有 Mode 1", "isCorrect": false, "rationale": "Timer 1 支援 Mode 0、1、2。"}], "hint": "自動重載（Auto-Reload）完全靠硬體瞬間完成，零軟體時間誤差！"}, {"questionNumber": 284, "category": "06. 中斷系統與解彈跳", "isPastExam": false, "examNo": null, "question": "在 8051 串列通訊中，無論是「傳送完畢（`TI = 1`）」或是「接收完畢（`RI = 1`）」，兩者都共用同一個中斷向量位址 `0023H`。因此當 CPU 進入 `0023H` 的 UART 中斷服務程式時，程式設計師第一步應該做什麼？", "answerOptions": [{"text": "直接關閉電源重開", "isCorrect": false, "rationale": "無稽之談。"}, {"text": "把 P0 ~ P3 全部清為 00H", "isCorrect": false, "rationale": "與 I/O 埠清零無關。"}, {"text": "使用位元測試指令（如 `JB RI, RECEIVE_ISR` 與 `JB TI, TRANSMIT_ISR`）判斷究竟是接收完成還是傳送完成所引發的中斷，並用軟體清除對應旗標", "isCorrect": true, "rationale": "正確！因為 `RI` 與 `TI` 透過邏輯 OR 閘共用同一個 `0023H` 中斷向量，進入 ISR 後必須檢查這兩個旗標位元才能分流處理並各自清除（`CLR RI` / `CLR TI`）。"}, {"text": "不需要判斷，因為 UART 只能接收不能傳送", "isCorrect": false, "rationale": "UART 是全雙工，傳送與接收都會觸發 0023H 中斷。"}], "hint": "兩條路（RI 與 TI）匯入同一個大門（0023H），進門後當然要先問清楚是誰敲的門！"}, {"questionNumber": 285, "category": "06. 中斷系統與解彈跳", "isPastExam": false, "examNo": null, "question": "在 8051 中斷系統中，關於「同級中斷」與「高優先權中斷」的巢狀（Nesting）打斷規則，下列敘述何者正確？", "answerOptions": [{"text": "任何中斷都可以隨意互相打斷，包括自己打斷自己", "isCorrect": false, "rationale": "同級或低級不能打斷正在執行的中斷。"}, {"text": "正在執行「低優先權」中斷時，可以被「高優先權」中斷打斷；但正在執行某個中斷時，不能被「同級」或「低優先權」的中斷打斷", "isCorrect": true, "rationale": "正確！8051 具有兩層優先權（高優先權 IP=1 與低優先權 IP=0）：高優先權可搶佔低優先權形成兩層中斷巢狀，同級中斷則必須等目前 ISR 執行完 `RETI` 才會依查詢順序服務。"}, {"text": "低優先權中斷可以打斷高優先權中斷", "isCorrect": false, "rationale": "優先權方向說反了。"}, {"text": "8051 完全不支援高優先權打斷低優先權（沒有中斷巢狀功能）", "isCorrect": false, "rationale": "8051 支援兩層中斷巢狀。"}], "hint": "就像急診室檢傷分類：第一級重症（高優先權）可以插隊第二級輕症（低優先權），但同等級的要排隊！"}, {"questionNumber": 286, "category": "07. 串列通訊 UART 與 RS-232", "isPastExam": false, "examNo": null, "question": "在 RS-232 串列通訊規範中，除了定義邏輯 1（-3V ~ -15V，典型 -10V）與邏輯 0（+3V ~ +15V，典型 +10V）之外，介於 `-3V ~ +3V` 之間的電壓區間被定義為什麼？", "answerOptions": [{"text": "未定義區（轉態過渡區 / 雜訊容限帶），為避免誤判，有效訊號不應停留在 -3V ~ +3V 之間", "isCorrect": true, "rationale": "正確！在 RS-232 電氣標準中，-3V 到 +3V 是不確定的過渡區（Undefined Transition Region），只有低於 -3V 才保證判定為邏輯 1，高於 +3V 才保證判定為邏輯 0，提供極佳的抗雜訊能力。"}, {"text": "代表傳送結束字元", "isCorrect": false, "rationale": "非結束字元。"}, {"text": "代表邏輯 2", "isCorrect": false, "rationale": "數位邏輯只有 0 與 1，沒有邏輯 2。"}, {"text": "代表電源正常指示燈", "isCorrect": false, "rationale": "非指示燈定義。"}], "hint": "從 `-3V` 到 `+3V` 中間留了 6V 寬的緩衝無人區，這樣即使線上有 ±2V 的雜訊干擾也不會把 0 誤認成 1！"}, {"questionNumber": 287, "category": "07. 串列通訊 UART 與 RS-232", "isPastExam": false, "examNo": null, "question": "在同學筆記第 8 頁的紅外線遙控器通訊架構中，為什麼遙控器發出的串列訊號除了按鍵功能碼之外，前面還必須包含一組「識別碼（Custom Code / Address Code）」？", "answerOptions": [{"text": "因為 8051 只能接收英文字母", "isCorrect": false, "rationale": "8051 接收的是二進位位元組資料。"}, {"text": "為了區分不同廠牌與不同家電設備（例如避免按電視遙控器時，旁邊的冷氣或電風扇也跟著誤動作）", "isCorrect": true, "rationale": "正確！同學筆記第 8 頁寫出紅外線通訊包含「識別碼 + 資料碼 + 重複碼」，識別碼用來確保只有指定廠牌型號的電器才會接收並執行指令。"}, {"text": "為了讓遙控器電池壽命縮短", "isCorrect": false, "rationale": "與電池壽命無關。"}, {"text": "為了讓紅外線變成可見的藍色雷射光", "isCorrect": false, "rationale": "紅外線為 980nm 不可見光。"}], "hint": "就像每家門牌號碼不同，信件上寫明收件人地址（識別碼），才不會送到鄰居家！"}, {"questionNumber": 288, "category": "07. 串列通訊 UART 與 RS-232", "isPastExam": false, "examNo": null, "question": "在你的筆記第 27 頁比較「平行傳輸（Parallel Transmission）」與「串列傳輸（Serial Transmission）」的優缺點時，下列敘述何者正確？", "answerOptions": [{"text": "平行傳輸適合跨越太平洋的海底電纜；串列傳輸只能用在 1 公分以內", "isCorrect": false, "rationale": "長距離通訊（如海底電纜）必須使用串列光纖傳輸，平行線長距離會嚴重不同步。"}, {"text": "平行傳輸一次傳送多個位元（如 8 bits），短距離速度極快但需要多條資料線（成本高、長距離易產生訊號偏移 Skew 與串音干擾）；串列傳輸一次傳送 1 個位元，只需極少連接線，適合長距離傳輸", "isCorrect": true, "rationale": "正確！這正是微控制器對外長距離通訊（如 RS-232、USB、乙太網路）普遍採用串列傳輸的核心原因：線材少、成本低、長距離抗干擾能力佳。"}, {"text": "兩者使用的連接線數量完全一樣", "isCorrect": false, "rationale": "平行傳輸線數遠多於串列傳輸。"}, {"text": "平行傳輸只需要 1 條線；串列傳輸需要 64 條線", "isCorrect": false, "rationale": "線數描述完全相反。"}], "hint": "多線道並排（平行）在短距離塞車時很快，但跑長途容易各車道速度不一（Skew），所以長途高速公路都用單線道高速串列傳輸！"}, {"questionNumber": 289, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "在 8051 組合語言指令中，若累加器 `A = 85H`（二進位 `1000 0101B`）且進位旗標 `CY = 0`，執行「帶進位左旋指令 `RLC A`」一次之後，累加器 `A` 與進位旗標 `CY` 的新內容分別為何？", "answerOptions": [{"text": "`A = 85H`，`CY = 0`", "isCorrect": false, "rationale": "數值會左移改變。"}, {"text": "`A = 0BH`（`0000 1011B`），`CY = 0`", "isCorrect": false, "rationale": "`0BH`（`0000 1011B`）是無進位左旋 `RL A` 的結果（Bit 7 直接繞回 Bit 0）。"}, {"text": "`A = 0BH`（`0000 1011B`？不，Bit 7 的 1 進入 CY，原本 CY 的 0 補入 Bit 0，故 `A = 0AH` (`0000 1010B`)，`CY = 1`）", "isCorrect": true, "rationale": "正確！`RLC A` 是「9 位元大循環（CY + 8-bit A）」向左旋轉：原本 Bit 7 的 `1` 移出進入 `CY`（故 `CY = 1`），原本 `CY` 的 `0` 繞回補進 Bit 0，其餘左移一格，變成 `0000 1010B`（`0AH`）。"}, {"text": "`A = 42H`（`0100 0010B`），`CY = 1`", "isCorrect": false, "rationale": "`42H` 是向右旋轉的結果。"}], "hint": "`RLC` 多了一個 `C`，代表把進位旗標 `CY` 也拉進來一起排隊轉圈圈（變成 9 個人手拉手轉圈）！"}, {"questionNumber": 290, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "在 8051 組合語言中，指令「NOP」（No Operation，機械碼 `00H`）執行時會產生什麼效果？在實務程式設計中有什麼用途？", "answerOptions": [{"text": "CPU 不做任何算術、邏輯或資料搬移動作，僅消耗 `1 個機械週期`（12MHz 下為 1 μs）並讓 PC 加 1；常用於產生極短微秒級精確延遲或預留程式修改空間", "isCorrect": true, "rationale": "正確！`NOP` 是 1 Byte、1 機械週期的空操作指令，除了推進 PC 與消耗 1 個機械週期時間外不影響任何暫存器與旗標。"}, {"text": "跳躍到程式記憶體的最後一行", "isCorrect": false, "rationale": "PC 僅正常加 1 指向下一道指令。"}, {"text": "立即停止 8051 運作並關閉電源", "isCorrect": false, "rationale": "不會停止運作或關閉電源。"}, {"text": "將所有暫存器清除為 0", "isCorrect": false, "rationale": "不會清除任何暫存器。"}], "hint": "No Operation = 原地發呆 1 個機械週期（1 μs）再繼續走！"}, {"questionNumber": 291, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "在 8051 組合語言指令中，下列哪一道無條件呼叫副程式指令的機械碼長度為 `3 Bytes`，可以呼叫位於 64K 程式記憶體（`0000H ~ FFFFH`）任意位址的副程式？", "answerOptions": [{"text": "`ACALL addr11`（Absolute Call，絕對短呼叫，2 Bytes，僅限 2K 頁面內）", "isCorrect": false, "rationale": "`ACALL` 為 2 Bytes 指令，僅能呼叫與下一道指令位於同一個 2K 頁面內的副程式。"}, {"text": "`SJMP rel`（短跳躍，2 Bytes）", "isCorrect": false, "rationale": "`SJMP` 是跳躍指令，不會將返回位址推入堆疊。"}, {"text": "`RET`（副程式返回，1 Byte）", "isCorrect": false, "rationale": "`RET` 是從副程式返回。"}, {"text": "`LCALL addr16`（Long Call，長呼叫）", "isCorrect": true, "rationale": "正確！`LCALL`（機械碼 `12H` 加上 2 Bytes 16 位元目標位址，共 3 Bytes）可呼叫 64K 全範圍內任何位址的副程式。"}], "hint": "L = Long（長距離），可呼叫 64K 全空間任意遠的副程式。"}, {"questionNumber": 292, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "在你的筆記第 39 頁與同學筆記第 9 頁的單向霹靂燈程式中，寫道：\n`START: MOV SP, #30H`\n`MOV A, #0FEH`\n`NEXT: MOV P1, A`\n`RL A`\n`CALL DELAY`\n`JMP NEXT`\n請問若想讓霹靂燈的方向改為「由左往右移動（D7 → D6 → ... → D0）」，只需要修改哪兩行指令？", "answerOptions": [{"text": "將 `MOV SP, #30H` 改為 `MOV SP, #00H`", "isCorrect": false, "rationale": "修改 SP 不會改變 LED 移動方向。"}, {"text": "將 `JMP NEXT` 改為 `JMP START`", "isCorrect": false, "rationale": "若改為 `JMP START`，每次都會重新載入 `0FEH`，燈號會永遠卡在 D0 不動！"}, {"text": "將 `MOV P1, A` 改為 `MOV P0, A`", "isCorrect": false, "rationale": "只會把輸出改到 Port 0，移動方向不變。"}, {"text": "將初始值改為 `MOV A, #7FH`（`0111 1111B`，先點亮最左邊 D7），並將 `RL A` 改為 `RR A`（向右旋轉）", "isCorrect": true, "rationale": "正確！`7FH`（`0111 1111B`）先讓 Bit 7（D7）為 0 點亮，接著每次執行 `RR A`（Rotate Right）向右旋轉，亮燈就會依序從 D7 → D6 → D5 → ... → D0 移動！"}], "hint": "要從左邊開始往右跑：起點改最左邊（`0111 1111B = 7FH`），方向改向右旋（`RR A`）！"}, {"questionNumber": 293, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "承上題，如果在該霹靂燈程式中，不小心把最後一行的 `JMP NEXT` 寫成了 `JMP START`，實際執行時會看到什麼現象？", "answerOptions": [{"text": "8 顆 LED 全部熄滅", "isCorrect": false, "rationale": "D0 會持續亮著。"}, {"text": "8 顆 LED 會以雙倍速度移動", "isCorrect": false, "rationale": "不會移動。"}, {"text": "每次執行完一遍 `RL A` 後又跳回 `START` 重新執行 `MOV A, #0FEH`，導致只有 `D0` 永遠亮著，完全不會移動", "isCorrect": true, "rationale": "正確！`START` 裡面包含了初始化指令 `MOV A, #0FEH`，若跳回 `START`，累加器 A 的旋轉結果每次都被 `0FEH` 蓋掉，燈號永遠停在 D0！"}, {"text": "組譯器會當機報錯", "isCorrect": false, "rationale": "語法完全合法，組譯器不會報錯，但邏輯結果錯誤。"}], "hint": "初始化指令（`MOV SP`、`MOV A, #0FEH`）只能跑一次，主迴圈只能跳回 `NEXT`！"}, {"questionNumber": 294, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "在 8051 組合語言中，若我們寫了一段雙層迴圈延遲副程式：\n`DELAY: MOV R6, #100`\n`D1: MOV R7, #250`\n`DJNZ R7, $`\n`DJNZ R6, D1`\n`RET`\n請問當主程式呼叫 `CALL DELAY` 時，如果主程式本身也正在使用 `R6` 與 `R7` 存放重要計數值，會發生什麼問題？要如何解決？", "answerOptions": [{"text": "延遲副程式會直接覆蓋破壞主程式的 `R6` 與 `R7` 數值；解決方法是在 `DELAY` 開頭先 `PUSH 06H`、`PUSH 07H`，結束 `RET` 前再 `POP 07H`、`POP 06H`（或切換不同的暫存器庫 RB1）", "isCorrect": true, "rationale": "正確！8051 同一時間共用同一組工作暫存器庫（RB0），副程式修改 `R6`、`R7` 會直接蓋掉主程式的資料，因此進入副程式前應使用 `PUSH` 保存、離開前用 `POP` 還原。"}, {"text": "不會有任何影響，因為副程式的 R6 與主程式的 R6 是不同硬體", "isCorrect": false, "rationale": "若未切換 PSW 的 RS1/RS0，兩者操作的是同一個實體 RAM 位址 `06H` 與 `07H`。"}, {"text": "8051 規定主程式不可以使用 R6 與 R7", "isCorrect": false, "rationale": "主程式可使用所有暫存器，只需做好現場保存即可。"}, {"text": "只需要在 `RET` 後面寫 `CLR A` 即可還原 R6 與 R7", "isCorrect": false, "rationale": "`CLR A` 無法還原 R6 與 R7。"}], "hint": "共用同一間辦公室的抽屜（R6, R7），借用前先把原本主人的東西收進堆疊（PUSH），用完再放回抽屜（POP）！"}, {"questionNumber": 295, "category": "01. 微算機架構與指令週期", "isPastExam": false, "examNo": null, "question": "在 8051 系統中，下列哪一項不屬於中央處理單元（CPU）內部的暫存器，而是屬於外部擴充元件？", "answerOptions": [{"text": "74LS373 位址栓鎖器", "isCorrect": true, "rationale": "正確！74LS373 是外接在 8051 晶片外部的 TTL 栓鎖器 IC。"}, {"text": "累加器 A（ACC）", "isCorrect": false, "rationale": "ACC 是 CPU 內部核心運算暫存器。"}, {"text": "程式狀態字組（PSW）", "isCorrect": false, "rationale": "PSW 是 CPU 內部狀態暫存器。"}, {"text": "資料指標（DPTR）", "isCorrect": false, "rationale": "DPTR 是 CPU 內部 16 位元指標暫存器。"}], "hint": "型號以 `74LS` 開頭的是外部標準 TTL 邏輯 IC。"}, {"questionNumber": 296, "category": "01. 微算機架構與指令週期", "isPastExam": false, "examNo": null, "question": "標準 8051 晶片採用哪一種半導體製程技術（例如 AT89C51 的 `C` 所代表）以降低靜態功耗？", "answerOptions": [{"text": "真空管製程（Vacuum Tube）", "isCorrect": false, "rationale": "真空管是第一代大型電腦元件。"}, {"text": "CMOS / CHMOS（互補式金氧半場效電晶體製程）", "isCorrect": true, "rationale": "正確！型號中的 `C` 代表 CMOS（如 80C51、AT89C51），具有極低靜態耗電與高抗雜訊特性。"}, {"text": "繼電器機械觸點製程", "isCorrect": false, "rationale": "非機械繼電器。"}, {"text": "磁芯記憶體製程", "isCorrect": false, "rationale": "非磁芯記憶體。"}], "hint": "80C51 與 89C51 中間的英文字母 `C` 就是該製程的縮寫。"}, {"questionNumber": 297, "category": "01. 微算機架構與指令週期", "isPastExam": false, "examNo": null, "question": "在指令週期的五個步驟中，哪一個步驟負責將機械碼（如 `74H`）解譯成內部控制訊號，指揮 ALU 與匯流排進行對應動作？", "answerOptions": [{"text": "Fetch（提取指令）", "isCorrect": false, "rationale": "Fetch 只負責把機械碼從記憶體抓進指令暫存器（IR）。"}, {"text": "Decode（解碼）", "isCorrect": true, "rationale": "正確！Decode（指令解碼器）負責看懂操作碼 Opcode 的意義並發出控制訊號。"}, {"text": "Fetch Operand（提取運算元）", "isCorrect": false, "rationale": "Fetch Operand 負責抓取資料。"}, {"text": "Write Back（寫回）", "isCorrect": false, "rationale": "Write Back 負責存回運算結果。"}], "hint": "解開密碼（Opcode）的步驟就叫做 Decode。"}, {"questionNumber": 298, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "在 PDIP-40 封裝的 8051 接腳圖中，位於左側最下方緊鄰 Pin 20（GND）上面的那一支接腳（Pin 19）與再往上一支接腳（Pin 18）分別是什麼功能？", "answerOptions": [{"text": "Pin 19 為 XTAL1（振盪器輸入），Pin 18 為 XTAL2（振盪器輸出）", "isCorrect": true, "rationale": "正確！左側由上往下：Pin 1~8 (P1)、Pin 9 (RST)、Pin 10~17 (P3)、Pin 18 (XTAL2)、Pin 19 (XTAL1)、Pin 20 (GND)。"}, {"text": "Pin 19 為 PSEN，Pin 18 為 ALE", "isCorrect": false, "rationale": "PSEN 是 Pin 29，ALE 是 Pin 30。"}, {"text": "Pin 19 為 VCC，Pin 18 為 RST", "isCorrect": false, "rationale": "VCC 是 Pin 40，RST 是 Pin 9。"}, {"text": "Pin 19 為 P0.0，Pin 18 為 P0.1", "isCorrect": false, "rationale": "P0 是右側 Pin 32~39。"}], "hint": "接腳圖左下角 18、19、20 號腳依序是：XTAL2、XTAL1、GND。"}, {"questionNumber": 299, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "在開發板電路圖（U8: 6116 SRAM）中，6116 晶片總共有幾支接腳（封裝規格）？", "answerOptions": [{"text": "40 支接腳（DIP-40）", "isCorrect": false, "rationale": "DIP-40 是 8051 的封裝。"}, {"text": "16 支接腳（DIP-16）", "isCorrect": false, "rationale": "DIP-16 是 74LS138 與 DAC0800 的封裝。"}, {"text": "8 支接腳（DIP-8）", "isCorrect": false, "rationale": "DIP-8 是 555 計時器或單顆運算放大器的封裝。"}, {"text": "24 支接腳（DIP-24）", "isCorrect": true, "rationale": "正確！6116 SRAM 為窄體或標準 DIP-24 封裝（11 條位址線 + 8 條資料線 + 3 條控制線 CE/OE/WE + VCC + GND = 24 支腳）。"}], "hint": "11 位址 + 8 資料 + 3 控制 + 2 電源 = 24 支腳！"}, {"questionNumber": 300, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "在 8051 系統中，當 `EA` 接腳接地（0V，強制執行外部程式記憶體）時，CPU 讀取外部程式記憶體的 16 位元位址最高可到 `FFFFH`，此時外部程式記憶體（ROM）的 16 條位址線接法為何？", "answerOptions": [{"text": "全部 16 條位址線都直接接在 `P1.0 ~ P1.7` 上", "isCorrect": false, "rationale": "Port 1 只有 8 支腳且不輸出位址。"}, {"text": "全部 16 條位址線都接在 `+5V` 上", "isCorrect": false, "rationale": "接 +5V 會使位址永遠固定在 FFFFH。"}, {"text": "外部 ROM 不需要連接任何位址線", "isCorrect": false, "rationale": "沒有位址線無法指定要讀取哪一行程式碼。"}, {"text": "低 8 位元 `A0 ~ A7` 接 74LS373 輸出端 `Q0 ~ Q7`；高 8 位元 `A8 ~ A15` 直接接 8051 的 `P2.0 ~ P2.7`", "isCorrect": true, "rationale": "正確！Port 0 經 74LS373 栓鎖產生低位址 A0~A7，Port 2 直接提供高位址 A8~A15，共同定址 64K 外部 ROM。"}], "hint": "低 8 位址靠 P0 + 373 鎖住，高 8 位址直接由 P2 輸出。"}, {"questionNumber": 301, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "若一顆 8051 外接 `12 MHz` 石英振盪晶體，執行一道「1 機械週期」指令（如 `INC A`）需要 `1 μs`；執行一道「2 機械週期」指令（如 `SJMP`）需要 `2 μs`；那麼執行一道「4 機械週期」指令（如 `DIV AB`）需要多少時間？", "answerOptions": [{"text": "48 μs", "isCorrect": false, "rationale": "48 是振盪週期的個數（4 × 12 = 48 T_osc），時間為 4 μs。"}, {"text": "2 μs", "isCorrect": false, "rationale": "2 μs 為 2 機械週期。"}, {"text": "4 μs", "isCorrect": true, "rationale": "正確！12 MHz 下 1 個機械週期 = 1 μs，因此 4 個機械週期 = $4 \\times 1\\text{ }\\mu\\text{s} = 4\\text{ }\\mu\\text{s}$。"}, {"text": "1 μs", "isCorrect": false, "rationale": "1 μs 為 1 機械週期。"}], "hint": "在 12 MHz 晶振下，「幾個機械週期」就剛好等於「幾微秒（μs）」！"}, {"questionNumber": 302, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "在 8051 硬體設計中，若未使用外部資料記憶體也未使用外部程式記憶體（只用內部 4K ROM 與 128B RAM，且 EA 接 +5V），此時 `Port 0` 與 `Port 2` 的接腳可以拿來做什麼用途？", "answerOptions": [{"text": "可以完全當作一般的數位輸入/輸出（I/O）接腳使用（其中 Port 0 需外接提升電阻）", "isCorrect": true, "rationale": "正確！只有當系統擴充外部記憶體（執行 `MOVX` 或讀取外部程式碼）時，P0 與 P2 才會自動切換成位址/資料匯流排；單晶片獨立運作時，P0~P3 四組埠共 32 支腳全部可當一般 I/O 使用。"}, {"text": "必須全部剪斷不能使用", "isCorrect": false, "rationale": "不需剪斷，可當一般 I/O 使用。"}, {"text": "只能用來連接石英晶體", "isCorrect": false, "rationale": "晶振只接 XTAL1 與 XTAL2。"}, {"text": "只能當作電源 VCC 接腳使用", "isCorrect": false, "rationale": "不可當電源腳。"}], "hint": "沒外接記憶體時，P0 和 P2 就不需要當公車（匯流排）載客，可以自由當作一般 I/O 腳使用！"}, {"questionNumber": 303, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": false, "examNo": null, "question": "在 8051 內部資料記憶體中，哪一個特殊功能暫存器（SFR）用來存放目前串列通訊埠（UART）要傳送出去或剛剛接收進來的 8 位元資料？", "answerOptions": [{"text": "PCON（Power Control，位址 87H）", "isCorrect": false, "rationale": "`PCON` 是電源與鮑率倍頻控制暫存器。"}, {"text": "SBUF（Serial Buffer，位址 99H）", "isCorrect": true, "rationale": "正確！`SBUF`（Serial Data Buffer）是串列資料緩衝器，例如 `MOV SBUF, #'A'` 即可把字元 `'A'` 從 TXD 傳送出去。"}, {"text": "TMOD（Timer Mode，位址 89H）", "isCorrect": false, "rationale": "`TMOD` 是計時器模式暫存器。"}, {"text": "SCON（Serial Control，位址 98H）", "isCorrect": false, "rationale": "`SCON` 是設定串列埠工作模式與狀態旗標（RI/TI）的控制暫存器。"}], "hint": "BUF = Buffer（緩衝器），存放實際要收發的資料本體。"}, {"questionNumber": 304, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": false, "examNo": null, "question": "在 8051 內部資料記憶體中，若目前 PSW 的 `RS1 = 1` 且 `RS0 = 1`（選用暫存器庫 RB3），此時執行指令「MOV 1FH, #99H」，緊接着執行「MOV A, R7」，請問累加器 `A` 的內容會變成多少？", "answerOptions": [{"text": "99H（因為 RB3 的 R7 在內部 RAM 中的實際位址就是 `1FH`）", "isCorrect": true, "rationale": "正確！RB3 的位址範圍為 `18H ~ 1FH`，其中 R0=18H ... R7=1FH，因此直接寫入位址 `1FH` 就等同於寫入 RB3 的 `R7`！"}, {"text": "00H", "isCorrect": false, "rationale": "不是 00H。"}, {"text": "07H", "isCorrect": false, "rationale": "`07H` 是 RB0 的 R7 位址。"}, {"text": "1FH", "isCorrect": false, "rationale": "`1FH` 是位址，內容是 `99H`。"}], "hint": "RB3 佔用 `18H ~ 1FH` 的最後 8 格，最後一格 `1FH` 正好是 `R7`！"}, {"questionNumber": 305, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": false, "examNo": null, "question": "在 8051 組合語言中，若寫出指令「PUSH 00H」，這道指令實際上是把哪一個暫存器的內容推入堆疊（Stack）中？", "answerOptions": [{"text": "程式計數器 `PC`", "isCorrect": false, "rationale": "PC 無法直接用 PUSH 指令推入。"}, {"text": "進位旗標 `CY`", "isCorrect": false, "rationale": "CY 是單一位元，PUSH 以 Byte 為單位（需用 `PUSH PSW`）。"}, {"text": "累加器 `A`", "isCorrect": false, "rationale": "累加器 A 的直接位址是 `0E0H`（`PUSH ACC`）。"}, {"text": "工作暫存器庫 RB0 的 `R0`（因為內部 RAM 位址 `00H` 正好對應 RB0 的 R0）", "isCorrect": true, "rationale": "正確！因為 `PUSH` 只接受直接定址（Direct Address），而內部 RAM 位址 `00H ~ 07H` 就是預設暫存器庫 RB0 的 `R0 ~ R7`，所以保存 `R0` 的標準寫法就是 `PUSH 00H`。"}], "hint": "不能寫 `PUSH R0`，但 `R0` 住在內部 RAM 的 `00H` 號房，所以直接叫門牌號碼 `PUSH 00H` 就可以了！"}, {"questionNumber": 306, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": false, "examNo": null, "question": "承上題，若在副程式開頭依序執行了「PUSH ACC」、「PUSH PSW」、「PUSH 00H」，則在副程式結尾執行 `RET` 返回之前，必須依照哪一種正確順序執行 `POP` 指令才能完整還原現場？", "answerOptions": [{"text": "`POP PSW` → `POP ACC` → `POP 00H`", "isCorrect": false, "rationale": "順序錯誤。"}, {"text": "`PO
