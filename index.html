存器庫之後的 20H ~ 2FH 共 16 Bytes（16 × 8 = 128 bits），每個位元都有獨立的位元位址（00H ~ 7FH），常當作軟體旗標使用。"}, {"text": "00H ~ 1FH（32 Bytes），共 256 個可單獨定址的位元", "isCorrect": false, "rationale": "00H ~ 1FH 是工作暫存器庫（RB0 ~ RB3），不屬於位元定址區。"}, {"text": "80H ~ FFH（128 Bytes），全部 1024 個位元皆可位元定址", "isCorrect": false, "rationale": "SFR 空間中只有 Byte 位址尾數為 0H 或 8H 的暫存器才能位元定址，並非全部。"}, {"text": "30H ~ 7FH（80 Bytes），共 640 個可單獨定址的位元", "isCorrect": false, "rationale": "30H ~ 7FH 是一般用途 RAM 與堆疊區，僅能以 Byte 為單位存取。"}], "hint": "在內部 RAM 地圖中，畫滿小方格（一格 1 bit）的那一塊區域就是 20H ~ 2FH。"}, {"questionNumber": 97, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": false, "examNo": null, "question": "板書範例中寫出「SETB 20H.0」與「CLR 2FH.6」，這兩道指令分別對內部記憶體執行什麼動作？", "answerOptions": [{"text": "將位址 20H 的第 0 個位元設為 1；將位址 2FH 的第 6 個位元清除為 0", "isCorrect": true, "rationale": "正確！`SETB`（Set Bit）將指定單一位元設為 1，`CLR`（Clear Bit）將指定單一位元清為 0，不會影響同一個 Byte 內的其他 7 個位元。"}, {"text": "將 Port 2 的第 0 腳設為 1；將 Port 2 的第 6 腳設為 0", "isCorrect": false, "rationale": "Port 2 的位元寫法是 `P2.0`、`P2.6`，不是 `20H.0`。"}, {"text": "將程式計數器跳躍到 20H；將堆疊指標清除為 2FH", "isCorrect": false, "rationale": "這是記憶體位元操作指令，非跳躍或堆疊指令。"}, {"text": "將位址 20H 整個 Byte 設為 00H；將位址 2FH 整個 Byte 設為 06H", "isCorrect": false, "rationale": "位元操作指令只改變 1 個 bit，不會改寫整個 Byte。"}], "hint": "`SETB` = 設為 1，`CLR` = 清為 0；小數點後面的數字代表 Bit 0 ~ Bit 7。"}, {"questionNumber": 98, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": false, "examNo": null, "question": "在內部資料記憶體的可位元定址區（20H ~ 2FH）中，板書舉例的「21H.7」（即位址 21H 的 Bit 7）對應到的線性位元位址（Bit Address）編號為何？", "answerOptions": [{"text": "07H", "isCorrect": false, "rationale": "07H 是 20H.7 的位元位址。"}, {"text": "21H", "isCorrect": false, "rationale": "21H 是 Byte 位址，不是位元位址。"}, {"text": "0FH", "isCorrect": true, "rationale": "正確！20H.0 ~ 20H.7 對應位元位址 00H ~ 07H，緊接著的 21H.0 ~ 21H.7 對應 08H ~ 0FH，因此 21H.7 就是 0FH（第 15 個位元）。"}, {"text": "17H", "isCorrect": false, "rationale": "17H 是 22H.7 的位元位址。"}], "hint": "20H 佔用了前 8 個位元（00H~07H），21H 再往後數 8 個位元（08H~0FH）。"}, {"questionNumber": 99, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": false, "examNo": null, "question": "關於高 128 Bytes 特殊功能暫存器（SFR，位址 80H ~ FFH）的位元定址規則，下列敘述何者正確？", "answerOptions": [{"text": "所有 SFR 暫存器都支援位元定址", "isCorrect": false, "rationale": "例如 SP（81H）、DPL（82H）、DPH（83H）、TMOD（89H）、SBUF（99H）都不支援位元定址。"}, {"text": "只有 Byte 位址能被 8 整除（即十六進位尾數為 0H 或 8H）的 SFR 才支援位元定址（如 P0=80H、TCON=88H、P1=90H、IE=A8H、PSW=D0H、ACC=E0H）", "isCorrect": true, "rationale": "正確！在 8051 硬體解碼設計中，位元位址 80H ~ FFH 剛好對應到 Byte 位址尾數為 0H 與 8H 的 SFR（例如 `SETB EA` 就是操作 IE.7 = AFH）。"}, {"text": "所有 SFR 暫存器都不支援位元定址，全部只能一次寫入整個 Byte", "isCorrect": false, "rationale": "例如 P0~P3、IE、TCON、SCON、PSW、ACC 都支援位元定址。"}, {"text": "只有尾數為 FH 的 SFR 才支援位元定址", "isCorrect": false, "rationale": "不存在尾數為 FH 的獨立 SFR。"}], "hint": "觀察 Ch2 投影片第 9 頁「特殊功能暫存器」表格，最左側標示藍色位元編號的列，其位址全部都是 `x0H` 或 `x8H`！"}, {"questionNumber": 100, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": false, "examNo": null, "question": "在 8051 微控制器內部架構中，程式計數器（Program Counter，PC）是否佔用特殊功能暫存器（SFR，80H ~ FFH）的位址空間？", "answerOptions": [{"text": "是，PC 位於 SFR 的 F0H 與 FFH 位址", "isCorrect": false, "rationale": "F0H 是 B 暫存器，FFH 保留未使用。"}, {"text": "是，PC 位於 SFR 的 80H 與 81H 位址", "isCorrect": false, "rationale": "80H 是 P0，81H 是 SP。"}, {"text": "是，PC 位於內部 RAM 的 00H 與 01H 位址", "isCorrect": false, "rationale": "00H 與 01H 是 RB0 的 R0 與 R1。"}, {"text": "否，PC 是一個獨立的 16 位元硬體暫存器，不在資料記憶體或 SFR 定址空間中", "isCorrect": true, "rationale": "正確！同學筆記第 5 頁特別用英文註明：「Program Counter is not in Data Register / SFR」，無法用 `MOV` 指令直接讀取 PC。"}], "hint": "你不能寫 `MOV A, PC`，因為 PC 根本沒有在資料記憶體空間分配位址。"}, {"questionNumber": 101, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": false, "examNo": null, "question": "下列常用特殊功能暫存器（SFR）與其直接定址位址（Direct Address）的配對，哪一組「完全正確」？", "answerOptions": [{"text": "ACC = 00H、B = 01H、PSW = 02H、SP = 07H", "isCorrect": false, "rationale": "00H~07H 是內部 RAM 的 RB0。"}, {"text": "ACC = E0H、B = F0H、PSW = D0H、SP = 81H", "isCorrect": true, "rationale": "正確！這四個是最核心的 SFR 位址：SP=81H、PSW=D0H、ACC=E0H、B=F0H（例如 Lab 1 機械碼 `75 81 30` 就是 `MOV SP, #30H`）。"}, {"text": "ACC = 80H、B = 90H、PSW = A0H、SP = B0H", "isCorrect": false, "rationale": "80H、90H、A0H、B0H 分別是 P0、P1、P2、P3 的位址。"}, {"text": "ACC = FFH、B = FEH、PSW = FDH、SP = FCH", "isCorrect": false, "rationale": "FFH~FCH 不是這些暫存器的位址。"}], "hint": "對照 Lab 1 機械碼列表第 3 行：`75 81 30` 對應 `MOV SP, #30H`，可見 SP 的位址就是 `81H`！"}, {"questionNumber": 102, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": false, "examNo": null, "question": "程式狀態字組暫存器（PSW，位址 D0H）共 8 個位元，其中最高位元（Bit 7，位址 D7H）與最低位元（Bit 0，位址 D0H）分別是什麼旗標？", "answerOptions": [{"text": "Bit 7 為 CY（進位旗標 Carry），Bit 0 為 P（同位旗標 Parity）", "isCorrect": true, "rationale": "正確！PSW 由高到低（Bit 7 → Bit 0）依序為：`CY, AC, F0, RS1, RS0, OV, -, P`。"}, {"text": "Bit 7 為 EA（中斷總開關），Bit 0 為 EX0（外部中斷 0）", "isCorrect": false, "rationale": "EA 與 EX0 位於中斷致能暫存器 IE（A8H）中。"}, {"text": "Bit 7 為 RS1，Bit 0 為 RS0", "isCorrect": false, "rationale": "RS1 與 RS0 位於 Bit 4 與 Bit 3。"}, {"text": "Bit 7 為 OV（溢位旗標），Bit 0 為 AC（輔助進位旗標）", "isCorrect": false, "rationale": "OV 位於 Bit 2，AC 位於 Bit 6。"}], "hint": "口訣記住 PSW 順序：CY, AC, F0, RS1, RS0, OV, 保留, P。"}, {"questionNumber": 103, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": false, "examNo": null, "question": "在 8051 中，堆疊指標（SP，Stack Pointer）在晶片 Reset 之後的預設初始值為何？", "answerOptions": [{"text": "00H", "isCorrect": false, "rationale": "SP 初值不是 00H。"}, {"text": "07H", "isCorrect": true, "rationale": "正確！Reset 後 SP 預設為 07H，這樣第一次執行 PUSH 時，SP 會先加 1 變成 08H（剛好避開 RB0 的 00H~07H）。"}, {"text": "30H", "isCorrect": false, "rationale": "30H 是程式設計師為了保護 RB1~RB3 與位元定址區，在主程式開頭手動設定的值。"}, {"text": "7FH", "isCorrect": false, "rationale": "7FH 是內部一般用途 RAM 的最高位址上限。"}], "hint": "因為 RB0 佔用了 00H ~ 07H，所以硬體預設 SP 停在 RB0 的最後一格（07H）。"}, {"questionNumber": 104, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": false, "examNo": null, "question": "為什麼幾乎所有 8051 組合語言程式，在 `START:` 的第一行都要立刻執行「MOV SP, #30H」（或 `#2FH`）？", "answerOptions": [{"text": "因為 SP 重置後初值為 07H，若不移走，呼叫副程式或發生中斷時資料會從 08H 往上寫入，覆蓋破壞暫存器庫 RB1~RB3（08H~1FH）與可位元定址區（20H~2FH）", "isCorrect": true, "rationale": "正確！將 SP 移至 30H（或 2FH，這樣第一次 PUSH 會存入 30H），就能使用 30H ~ 7FH 這 80 Bytes 安全無衝突的空間作為堆疊。"}, {"text": "因為如果 SP 不等於 30H，8051 的石英晶體就不會振盪", "isCorrect": false, "rationale": "SP 與晶振是否起振無關。"}, {"text": "因為 30H 是程式記憶體的起始位址", "isCorrect": false, "rationale": "程式記憶體起始位址是 0000H，SP 指向的是內部資料記憶體 RAM。"}, {"text": "因為 SP 必須設定為 30H 才能開啟 Port 1 的 LED 輸出", "isCorrect": false, "rationale": "SP 與 Port 1 輸出無直接關聯。"}], "hint": "把堆疊搬家到 30H 以上，才不會跟暫存器庫或位元旗標區搶房間住！"}, {"questionNumber": 105, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": false, "examNo": null, "question": "8051 堆疊（Stack）的生長方向以及「PUSH」指令的內部執行順序為何？", "answerOptions": [{"text": "由低位址往高位址生長；PUSH 時先將資料存入目前 SP 位址，再將 SP 加 1", "isCorrect": false, "rationale": "若先存再加 1，Reset 初值 07H 時就會直接把 RB0 的 R7（07H）蓋掉了！"}, {"text": "由高位址往低位址（由上往下）生長；PUSH 時先將 SP 減 1，再存入資料", "isCorrect": false, "rationale": "x86 架構才是向下生長（SP 減），8051 是向上生長（SP 加）。"}, {"text": "SP 永遠固定在 30H 不動，資料直接覆蓋寫入 30H", "isCorrect": false, "rationale": "若不移動指標就無法實現後進先出（LIFO）的多層儲存。"}, {"text": "由低位址往高位址（由下往上）生長；PUSH 時先將 SP 加 1，再將資料存入 SP 所指的新位址", "isCorrect": true, "rationale": "正確！8051 堆疊是向上生長（Ascending Stack），且 SP 指向最後一筆有效資料，因此 PUSH 必為「先 SP + 1，再寫入資料」。"}], "hint": "想想看為什麼 SP 初值是 `07H` 而第一個存入的是 `08H`：就是因為「先加 1，再存入」。"}, {"questionNumber": 106, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": false, "examNo": null, "question": "執行「POP」指令從 8051 堆疊取出資料時，其內部運作步驟順序為何？", "answerOptions": [{"text": "先從目前 SP 所指的位址取出資料，再將 SP 減 1", "isCorrect": true, "rationale": "正確！因為 SP 正指著堆疊最頂端的資料，所以 POP 是「先取出資料，再將 SP - 1」，與 PUSH（先 +1 再存入）完全對稱互逆。"}, {"text": "先將 SP 減 1，再從新位址取出資料", "isCorrect": false, "rationale": "若先減 1 再取，會漏掉最頂端那筆最新資料。"}, {"text": "先從目前 SP 所指的位址取出資料，再將 SP 加 1", "isCorrect": false, "rationale": "取出資料後堆疊高度減少，SP 應該減 1 而非加 1。"}, {"text": "先將 SP 加 1，再取出資料", "isCorrect": false, "rationale": "步驟順序與增減方向皆錯。"}], "hint": "POP 與 PUSH 是完全相反的鏡像動作：PUSH 是「+1 → 存」，POP 就是「取 → -1」。"}, {"questionNumber": 107, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": false, "examNo": null, "question": "假設主程式已將 SP 設定為 `30H`，當主程式執行「CALL DELAY」呼叫副程式時，SP 變成 `32H`；請問當副程式執行最後一行的「RET」返回主程式後，SP 會變回多少？", "answerOptions": [{"text": "07H（恢復為 Reset 預設值）", "isCorrect": false, "rationale": "不會恢復成 07H，而是回到呼叫前的 30H。"}, {"text": "32H（SP 維持不變）", "isCorrect": false, "rationale": "若 SP 不減少，連續呼叫副程式很快就會造成堆疊溢位。"}, {"text": "34H（SP 再加 2）", "isCorrect": false, "rationale": "RET 是彈出資料，SP 會減少而不是增加。"}, {"text": "30H（因為從堆疊彈出 2 Bytes 返回位址寫回 PC，SP 減 2）", "isCorrect": true, "rationale": "正確！CALL 推入 2 Bytes（PCL、PCH）使 SP 從 30H 變成 32H；RET 則從堆疊彈出這 2 Bytes 寫回 PC，使 SP 減 2 恢復為 30H。"}], "hint": "有借有還：呼叫（CALL）時借了 2 格空間（+2），返回（RET）時就歸還 2 格空間（-2）。"}, {"questionNumber": 108, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": false, "examNo": null, "question": "在資料轉移指令中，使用堆疊存取指令「PUSH」與「POP」時，其運算元必須採用哪一種定址模式？（例如要將累加器 A 推入堆疊，正確寫法為何？）", "answerOptions": [{"text": "直接定址（Direct Addressing），例如 `PUSH ACC`（或 `PUSH 0E0H`）與 `PUSH 00H`", "isCorrect": true, "rationale": "正確！根據 Ch2 投影片第 28 頁，PUSH 與 POP 僅支援「直接定址（direct）」，因此不能寫 `PUSH A` 或 `PUSH R0`，必須寫 `PUSH ACC`（位址 E0H）或 `PUSH 00H`。"}, {"text": "間接定址，例如 `PUSH @R0`", "isCorrect": false, "rationale": "不支援間接定址 `@R0`。"}, {"text": "暫存器定址，例如 `PUSH A` 與 `PUSH R0`", "isCorrect": false, "rationale": "`PUSH A` 與 `PUSH R0` 在標準 8051 組譯器中會產生語法錯誤！"}, {"text": "立即定址，例如 `PUSH #30H`", "isCorrect": false, "rationale": "不能直接把常數（`#30H`）PUSH 進堆疊。"}], "hint": "注意看 Ch2 投影片第 28 頁寫的語法格式：`PUSH direct`、`POP direct`。"}, {"questionNumber": 109, "category": "04. I/O埠與硬體介面電路", "isPastExam": false, "examNo": null, "question": "在電路設計中，若將 LED 的陽極（正極）透過限流電阻接至 +5V，陰極（負極）接至 8051 的 P1.0 接腳（共陽極接法），執行哪一道指令會讓該 LED「點亮」？", "answerOptions": [{"text": "CLR P1.0（輸出 0V 低電位，形成電流通路）", "isCorrect": true, "rationale": "正確！LED 陽極已接 +5V，因此當 8051 的 P1.0 輸出低電位 0V（`CLR P1.0`）時，兩端產生電位差使電流從 +5V 經電阻與 LED 流入 8051（灌電流），LED 點亮。"}, {"text": "CPL P1.0（無論原本狀態一律熄滅）", "isCorrect": false, "rationale": "CPL 是反相指令，若原本是 0 反而會變成 1 而熄滅。"}, {"text": "SETB P1.0（輸出 +5V 高電位）", "isCorrect": false, "rationale": "P1.0 輸出 +5V 時，LED 兩端皆為 +5V（無電位差），LED 熄滅。"}, {"text": "NOP（不執行任何動作）", "isCorrect": false, "rationale": "NOP 不會改變接腳電位。"}], "hint": "共陽極 = 陽極已經接正電（+5V），所以控制腳要給「負電/低電位（0V）」才會順向導通！"}, {"questionNumber": 110, "category": "04. I/O埠與硬體介面電路", "isPastExam": false, "examNo": null, "question": "實務上 8051 驅動 LED 多採用「共陽極（低電位點亮）」接法，而非「共陰極（高電位點亮）」接法，下列關於共陽極優點的敘述何者正確？", "answerOptions": [{"text": "共陰極接法會導致 8051 程式計數器歸零", "isCorrect": false, "rationale": "與程式計數器無關。"}, {"text": "8051 I/O 埠的灌電流（Sink Current，輸出 0 時吸入電流）能力遠大於拉電流（Source Current，輸出 1 時流出電流）能力，LED 較亮且不會拉垮接腳高電位", "isCorrect": true, "rationale": "正確！8051（P1~P3）輸出 1 時僅靠內部弱提升電阻供電（拉電流僅約數十微安培），LED 會非常暗；輸出 0 時內部下拉電晶體導通，可承受較大灌電流（約 1.6mA~10mA）。"}, {"text": "共陽極接法可以讓 LED 不消耗任何電力", "isCorrect": false, "rationale": "LED 發光一定會消耗電功率。"}, {"text": "共陽極接法不需要串聯任何限流電阻", "isCorrect": false, "rationale": "無論共陽或共陰，LED 都必須串聯限流電阻（如 330Ω~1KΩ）以免燒毀。"}], "hint": "觀察同學筆記第 12 頁板書：共陰極旁邊寫著 `Source`（拉電流），共陽極則是讓電流灌入晶片內部電晶體。"}, {"questionNumber": 111, "category": "04. I/O埠與硬體介面電路", "isPastExam": false, "examNo": null, "question": "在讀取 8051 準雙向輸出入埠（如 Port 1、Port 2、Port 3）的外部接腳輸入狀態之前，程式設計者必須先對該接腳執行什麼動作？（如 Lab 中讀取按鍵 `SETB P3.3`）", "answerOptions": [{"text": "先寫入邏輯 1（如 SETB P3.3），以關閉內部的 Pull-down Transistor（下拉電晶體）", "isCorrect": true, "rationale": "正確！同學筆記第 12 頁註解寫得非常清楚：「`SETB P3.3 ; 讀取接腳電壓前需先寫入高電壓以關閉 Pull down Transistor`」，否則內部下拉電晶體導通會把接腳死死拉在 0V，永遠讀到 0！"}, {"text": "先寫入邏輯 0（如 CLR P3.3），以開啟內部的下拉電晶體", "isCorrect": false, "rationale": "若先寫入 0，內部電晶體會把腳位拉低到 GND，外部按鈕無論按不按都會讀成 0。"}, {"text": "先將接腳接地 10 秒鐘", "isCorrect": false, "rationale": "不需接地 10 秒。"}, {"text": "先將 EA 接腳切換為低電位", "isCorrect": false, "rationale": "EA 腳與 I/O 埠輸入無關。"}], "hint": "這就是 8051 稱為「準雙向埠（Quasi-bidirectional）」的原因：當輸入用之前，必須先輸出 1 放開內部開關！"}, {"questionNumber": 112, "category": "04. I/O埠與硬體介面電路", "isPastExam": false, "examNo": null, "question": "在 8051 輸出電路設計中，若要控制繼電器（Relay）線圈，通常會在繼電器線圈兩端反向並聯一顆二極體（飛輪二極體），其主要保護作用為何？", "answerOptions": [{"text": "當驅動電晶體由導通變為截止瞬間，提供繼電器電感線圈產生之高壓反向電動勢洩放路徑，保護電晶體不被擊穿", "isCorrect": true, "rationale": "正確！繼電器線圈是電感性負載，電流突然切斷時會產生極高的反向感應電動勢（$V = L \\frac{di}{dt}$），反向並聯二極體可形成續流迴路消耗能量，保護驅動電晶體或 7406 IC。"}, {"text": "用來發光顯示繼電器目前的動作狀態", "isCorrect": false, "rationale": "發光指示應使用 LED 並串聯電阻，而非直接並聯在線圈兩端。"}, {"text": "用來將交流市電整流成直流電供 8051 使用", "isCorrect": false, "rationale": "這不是電源整流電路。"}, {"text": "用來降低繼電器的工作電壓至 1.5V", "isCorrect": false, "rationale": "二極體在正常導通時為逆偏不導通，不會降低工作電壓。"}], "hint": "電感性負載斷電瞬間會產生高壓突波，這顆二極體就是突波的逃生門。"}, {"questionNumber": 113, "category": "04. I/O埠與硬體介面電路", "isPastExam": false, "examNo": null, "question": "根據 Ch2 投影片「輸出電路設計」，除了使用 NPN 電晶體外，還可以使用哪兩顆常見的高耐壓開集極（Open Collector）反相器緩衝 IC 來驅動繼電器？", "answerOptions": [{"text": "74LS373 或 74LS138", "isCorrect": false, "rationale": "74LS373 是栓鎖器，74LS138 是解碼器。"}, {"text": "ADC0804 或 DAC0800", "isCorrect": false, "rationale": "兩者分別是類比數位與數位類比轉換器。"}, {"text": "AT89C51 或 6116", "isCorrect": false, "rationale": "89C51 是微控制器，6116 是 SRAM。"}, {"text": "7405 或 7406", "isCorrect": true, "rationale": "正確！Ch2 投影片第 20 頁標題即為「使用 7405/7406 驅動繼電器」，兩者皆為六反相器開集極輸出緩衝器（其中 7406 輸出耐壓可達 30V）。"}], "hint": "Ch2 投影片第 20 頁標題直接點名了這兩顆 IC 型號。"}, {"questionNumber": 114, "category": "04. I/O埠與硬體介面電路", "isPastExam": false, "examNo": null, "question": "當使用 8051 驅動喇叭（Speaker）發出不同音高的音樂或警報聲時，程式是透過控制 I/O 接腳輸出方波訊號的哪一項物理參數來改變音調？", "answerOptions": [{"text": "串列埠 UART 的同位位元設定", "isCorrect": false, "rationale": "與 UART 同位位元無關。"}, {"text": "方波訊號的頻率（週期長短，即高低電位切換的延遲時間）", "isCorrect": true, "rationale": "正確！聲音的音調高低取決於振動頻率（Hz），例如中音 Do 為 262Hz、La 為 440Hz，程式透過控制 `CPL P1.0` 與延遲時間即可產生不同頻率的方波。"}, {"text": "程式記憶體 ROM 的容量大小", "isCorrect": false, "rationale": "音調與 ROM 容量無關。"}, {"text": "電源 VCC 的電壓大小（如改接 100V）", "isCorrect": false, "rationale": "8051 I/O 輸出只有邏輯 0（0V）與邏輯 1（5V），不能直接調整類比電壓振幅。"}], "hint": "音調高低 = 頻率快慢。"}, {"questionNumber": 115, "category": "04. I/O埠與硬體介面電路", "isPastExam": false, "examNo": null, "question": "在實驗電路圖中，接在 P1.0 ~ P1.7 與 +5V 之間的「9P-1K」零件是什麼電子元件？", "answerOptions": [{"text": "9 位元的指撥開關", "isCorrect": false, "rationale": "它不是開關元件。"}, {"text": "9 支腳的排阻（Resistor Network），內部包含 8 個共一端（第 1 腳接 VCC）的 1KΩ 限流電阻", "isCorrect": true, "rationale": "正確！9P-1K 代表 9 Pins、阻值 1KΩ 的單列直插式排阻（SIP-9），第 1 腳（有圓點標記）為共同端接 +5V，其餘 8 支腳分別連接 8 顆 LED 作為限流電阻。"}, {"text": "9 顆串聯在一起的藍色發光二極體", "isCorrect": false, "rationale": "LED 是電路圖上的 D0 ~ D7。"}, {"text": "9 支腳的電容器陣列，總電容為 1K pF", "isCorrect": false, "rationale": "它是電阻器，不是電容器。"}], "hint": "P 代表 Pin（接腳），1K 代表電阻值 1000 歐姆。"}, {"questionNumber": 116, "category": "04. I/O埠與硬體介面電路", "isPastExam": false, "examNo": null, "question": "在共陽極 LED 電路（D0 接 P1.0、D7 接 P1.7）中，若執行指令「MOV A, #0FEH」再執行「MOV P1, A」，此時哪一顆 LED 會點亮？", "answerOptions": [{"text": "只有最左邊的 D7 點亮，D0 ~ D6 皆熄滅", "isCorrect": false, "rationale": "只有 D7 點亮應該是 `0111 1111B`（`7FH`）。"}, {"text": "D1 ~ D7 全部點亮，只有 D0 熄滅", "isCorrect": false, "rationale": "那是共陰極接法（高電位點亮）才會發生的結果。"}, {"text": "只有最右邊的 D0 點亮，D1 ~ D7 皆熄滅", "isCorrect": true, "rationale": "正確！`0FEH` 的二進位為 `1111 1110B`，只有最低位元 Bit 0（P1.0）為 0，因此在共陽極接法下只有 D0 點亮。"}, {"text": "8 顆 LED 全部點亮", "isCorrect": false, "rationale": "全部點亮應該是 `00H`（`0000 0000B`）。"}], "hint": "把 `0FEH` 拆成二進位：`1111 1110`，看看哪一個位元是 `0`。"}, {"questionNumber": 117, "category": "04. I/O埠與硬體介面電路", "isPastExam": false, "examNo": null, "question": "承上題，若在共陽極 LED 電路（D0 接 P1.0 ~ D7 接 P1.7）中，要讓「最外側的 D7 與 D0」同時點亮，其餘中間 6 顆熄滅，應輸出哪一個十六進位數值給 Port 1？", "answerOptions": [{"text": "81H（1000 0001B）", "isCorrect": false, "rationale": "`81H`（`1000 0001B`）會讓中間 6 顆點亮、D7 與 D0 熄滅。"}, {"text": "7EH（0111 1110B）", "isCorrect": true, "rationale": "正確！D7 與 D0 亮代表 Bit 7 與 Bit 0 為 0，其餘為 1，二進位即 `0111 1110B`，高四位 `0111` = 7，低四位 `1110` = E，即 `7EH`。"}, {"text": "E7H（1110 0111B）", "isCorrect": false, "rationale": "`E7H`（`1110 0111B`）會讓最中間兩顆 D4 與 D3 點亮。"}, {"text": "DBH（1101 1011B）", "isCorrect": false, "rationale": "`DBH`（`1101 1011B`）會讓 D5 與 D2 點亮。"}], "hint": "共陽極是「0 亮 1 滅」，把頭尾兩個位元設 0、中間六個設 1，再四個一組轉成十六進位。"}, {"questionNumber": 118, "category": "04. I/O埠與硬體介面電路", "isPastExam": false, "examNo": null, "question": "在同學筆記第 13 頁的 ADC0804 類比數位轉換器（DIP20）電路中，評估一顆 ADC 晶片效能的三項核心規格為何？", "answerOptions": [{"text": "1. 石英晶體大小、2. LED 顏色、3. 排阻腳數", "isCorrect": false, "rationale": "與 ADC 規格無關。"}, {"text": "1. 堆疊指標初值、2. 暫存器庫數量、3. 假指令個數", "isCorrect": false, "rationale": "這是 8051 記憶體與組語規格。"}, {"text": "1. 接受類比電壓範圍、2. 數位訊號位元精度（解析度）、3. 轉換時間（Best / Average / Worst case）", "isCorrect": true, "rationale": "正確！同學筆記第 13 頁左上角清楚條列 ADC 的三項重要指標：類比輸入電壓範圍、數位位元精度（ADC0804 為 8 bits）、以及轉換時間。"}, {"text": "1. 串列埠鮑率、2. 同位位元種類、3. 結束位元長度", "isCorrect": false, "rationale": "這是 UART 串列通訊的規格。"}], "hint": "參考同學筆記第 13 頁最上方 `ADC: ①... ②... ③...`。"}, {"questionNumber": 119, "category": "04. I/O埠與硬體介面電路", "isPastExam": false, "examNo": null, "question": "在 ADC0804 介面電路中，接腳 `/WR`、`/INTR` 與 `/RD` 在一次完整類比轉數位過程中的分工順序為何？", "answerOptions": [{"text": "8051 先發送 `/WR` 負脈波通知「開始轉換」→ 轉換完成後 ADC0804 拉低 `/INTR` 通知 8051（常接 INT0 中斷）→ 8051 發送 `/RD` 低態訊號「讀取 8 位元數位資料」", "isCorrect": true, "rationale": "正確！同學筆記第 13 頁在 ADC0804 旁標註了動作流程：`/WR`（開始轉換）→ `/INTR`（通知轉換完成、觸發中斷）→ `/RD`（開始傳送/讀取完成之資料）。"}, {"text": "8051 先發送 `/RD` 開始轉換 → ADC0804 拉高 `/WR` 通知完成 → 8051 讀取 `/INTR`", "isCorrect": false, "rationale": "控制腳訊號方向與順序完全顛倒。"}, {"text": "只需要接 `/CS` 接地，其他三支腳完全不需要連接", "isCorrect": false, "rationale": "沒有 `/WR` 與 `/RD` 無法控制轉換時機與資料匯流排輸出。"}, {"text": "`/INTR` 是用來輸入類比電壓的接腳", "isCorrect": false, "rationale": "類比電壓是從 `+IN`（Pin 6）與 `-IN`（Pin 7）輸入。"}], "hint": "Write（寫入指令啟動轉換）→ Interrupt（轉換好了通知 CPU）→ Read（把結果讀進來）。"}, {"questionNumber": 120, "category": "04. I/O埠與硬體介面電路", "isPastExam": false, "examNo": null, "question": "根據同學筆記第 13 頁下方關於 DAC0800（8 位元數位類比轉換器）的重點整理，下列敘述何者「錯誤」？", "answerOptions": [{"text": "當參考電壓 5V 搭配 5kΩ 電阻時，最大輸出電流 $I_{max} = 5\\text{V} / 5\\text{k}\\Omega = 1\\text{mA}$", "isCorrect": false, "rationale": "正確敘述：根據歐姆定律 $I = 5\\text{V} / 5\\text{k}\\Omega = 1\\text{mA}$。"}, {"text": "DAC0800 內部自帶資料栓鎖器（Latch），因此可以直接接在 Port 0 資料匯流排上不需外加 74LS373", "isCorrect": true, "rationale": "本選項錯誤！同學筆記特別用紅字註明：「DAC0800 Input 不帶栓鎖器」，所以電路圖中必須在前面串接一顆 U13（74LS373）把 8051 送出的 8 位元數位資料鎖住！"}, {"text": "DAC0800 屬於「電流輸出型」晶片（IOUT），需搭配運算放大器轉為電壓輸出", "isCorrect": false, "rationale": "正確敘述：DAC0800 輸出的是類比電流 `IOUT`。"}, {"text": "DAC 電流方向分為 Sink（電流往內流）與 Source（電流往外流）兩種概念", "isCorrect": false, "rationale": "正確敘述：筆記中明確對比了 Sink（往內流）與 Source（往外流）。"}], "hint": "看看開發板電路圖 U13（74LS373）就夾在 8051 與 U14（DAC0800）之間！"}, {"questionNumber": 121, "category": "04. I/O埠與硬體介面電路", "isPastExam": false, "examNo": null, "question": "在同學筆記第 14~15 頁「LAB 6 軟體解彈跳」的 $2 \\times 2$ 矩陣鍵盤掃描實驗中，為什麼老師設計僅採用 Port 1 的 4 支接腳來掃描鍵盤，而不使用 P0、P2 或 P3？", "answerOptions": [{"text": "因為只有 Port 1 可以輸出高電位，其他 Port 都只能輸出 0V", "isCorrect": false, "rationale": "P1、P2、P3 結構相同，皆可輸出高低電位。"}, {"text": "因為 P0 與 P2 在開發板上要當作外部記憶體的位址/資料匯流排，而 P3 保留作中斷、計時器與串列通訊等特殊功能，不能隨意佔用", "isCorrect": true, "rationale": "正確！同學筆記第 14 頁明確寫出原因：「1. P0、P2 為 Address/Data 不能用，P3 為特殊功能不能用 => 故採用 Port 1 的 4 支腳掃描 2×2 鍵盤」。"}, {"text": "因為 P0、P2 與 P3 在 8051 晶片內部全部都是空腳（NC）", "isCorrect": false, "rationale": "P0、P2、P3 皆為功能完整的 I/O 埠，只是在擴充系統中另有要職。"}, {"text": "因為組合語言的 `MOV` 指令只能存取 Port 1", "isCorrect": false, "rationale": "`MOV` 指令可以存取所有 Port（P0~P3）。"}], "hint": "開發板已經插了 6116 外部程式記憶體，所以 P0、P2（匯流排）跟 P3（RD/WR/UART）都正在忙碌中！"}, {"questionNumber": 122, "category": "04. I/O埠與硬體介面電路", "isPastExam": false, "examNo": null, "question": "承上題，在 Lab 6 的 $2 \\times 2$ 矩陣鍵盤（行線 X3, X4；列線 Y1, Y2）以行優先（Column Major）方式掃描讀取按鍵狀態時，下列操作要點何者正確？", "answerOptions": [{"text": "掃描時必須同時把 X3 與 X4 都設為 0，才能分辨是哪一行被按下", "isCorrect": false, "rationale": "若兩行同時為 0，按下按鍵時無法區分是 X3 還是 X4 導通。"}, {"text": "掃描鍵盤時必須先把 8051 的石英晶體拔除", "isCorrect": false, "rationale": "拔除晶振會導致 CPU 停止運作。"}, {"text": "因為 Port 1 內部有提升電阻，每次掃描拉低某一行（如 X3=0, X4=1）後，讀取列線（Y1, Y2）前必須確保列線位元先設為 1（灌 1）", "isCorrect": true, "rationale": "正確！同學筆記第 15 頁寫出：「2. Port 接腳內部有提升電阻，讀取前記得灌 1！ 3. Column Major：X3: Y1, Y2；X4: Y1, Y2」。"}, {"text": "矩陣鍵盤不需要任何軟體或硬體解彈跳處理", "isCorrect": false, "rationale": "機械按鍵在按下與放開瞬間都會產生約 10~20ms 的接點彈跳，必須進行解彈跳。"}], "hint": "每次只讓一行（Column）輸出 0，另一行輸出 1，再去檢查哪一列（Row）被拉成 0。"}, {"questionNumber": 123, "category": "05. 計時與計數器 Timer", "isPastExam": false, "examNo": null, "question": "8051 內建的 Timer 0 與 Timer 1 各由兩個 8 位元特殊功能暫存器組成（TH0/TL0 與 TH1/TL1），透過設定 TMOD 暫存器可選擇幾種工作模式？", "answerOptions": [{"text": "2 種模式（僅 Mode 0 與 Mode 1）", "isCorrect": false, "rationale": "共有 4 種模式（0~3）。"}, {"text": "4 種模式（Mode 0、Mode 1、Mode 2、Mode 3）", "isCorrect": true, "rationale": "正確！TMOD 中的 M1、M0 兩個位元可設定 4 種工作模式：Mode 0（13-bit）、Mode 1（16-bit）、Mode 2（8-bit 自動重載）、Mode 3（雙 8-bit）。"}, {"text": "1 種固定模式", "isCorrect": false, "rationale": "有多種計時模式可選。"}, {"text": "8 種模式（Mode 0 ~ Mode 7）", "isCorrect": false, "rationale": "只有 2 個模式選擇位元（M1, M0），最多 4 種組合。"}], "hint": "TMOD 每個計時器有 `M1` 與 `M0` 兩個位元，2^2 = 4 種模式。"}, {"questionNumber": 124, "category": "05. 計時與計數器 Timer", "isPastExam": false, "examNo": null, "question": "關於 8051 計時器的「Mode 0（13-bit 計時器）」運作方式，下列敘述何者正確？", "answerOptions": [{"text": "最大計數次數為 65536 次", "isCorrect": false, "rationale": "13-bit 最大計數次數為 $2^{13} = 8192$ 次，65536 是 Mode 1。"}, {"text": "使用 THx 的全部 8 bits 與 TLx 的低 5 bits（共 13 bits），TLx 數到 31（2^5 - 1）後再加 1 就會進位到 THx", "isCorrect": true, "rationale": "正確！你的筆記第 22 頁板書圖示清楚畫出：Mode 0 使用 TH0（8 bits）+ TL0（5 bits，高 3 bits 打叉不用），因為 $2^5 = 32$，所以 TL0 數到 31 再加 1 就進位到 TH0（為了向下相容早期 MCS-48）。"}, {"text": "使用 THx 的低 5 bits 與 TLx 的全部 8 bits，TLx 數到 255 才進位", "isCorrect": false, "rationale": "5 bits 是在低位元組 TLx，8 bits 是在高位元組 THx。"}, {"text": "Mode 0 是現今最常用來產生精確 1 秒定時的模式", "isCorrect": false, "rationale": "最常用的是 Mode 1（16-bit）與 Mode 2（8-bit 自動重載），Mode 0 僅為向下相容保留。"}], "hint": "回想板書上在 `TL0` 旁邊畫了三個叉叉（`XXX`），只留 5 個位元，$2^5 = 32$。"}, {"questionNumber": 125, "category": "05. 計時與計數器 Timer", "isPastExam": false, "examNo": null, "question": "關於 8051 計時器的「Mode 2（8-bit Auto-Reload 自動重載模式）」，下列運作原理何者正確？", "answerOptions": [{"text": "TLx 數到 255 後會自動停止計數，必須由軟體重新設定初值", "isCorrect": false, "rationale": "無自動重載、需軟體重設初值的是 Mode 1。"}, {"text": "THx 與 TLx 串接成 16 位元計數器，溢位後自動重載 15536", "isCorrect": false, "rationale": "串接成 16 位元且無自動重載的是 Mode 1。"}, {"text": "Mode 2 是一個 8 位元下數計時器，數到 0 會自動重載", "isCorrect": false, "rationale": "8051 計時器全部都是「上數」計時器。"}, {"text": "TLx 負責往上計數，THx 負責儲存預設初值；當 TLx 數到 255 再加 1 溢位時，硬體自動將 THx 的預設值重新載入 TLx 繼續上數", "isCorrect": true, "rationale": "正確！如板書舉例：設定初值 `251` 存入 TH0 與 TL0，TL0 從 251→252→253→254→255→溢位（共計數 256 - 251 = 5 個機械週期），溢位瞬間硬體自動把 TH0 的 251 複製回 TL0，完全沒有軟體重載的時間誤差（最適合當 UART 鮑率產生器）。"}], "hint": "8-bit 只能計數 0~255，所以拆成兩半：TL 負責跑圈數數，TH 站在起跑線負責每次重新發號施令！"}, {"questionNumber": 126, "category": "05. 計時與計數器 Timer", "isPastExam": false, "examNo": null, "question": "使用 Timer 0 工作在「Mode 1（16-bit 計時器）」，外接 12 MHz 石英振盪器，若想讓計時器每循環一次剛好產生 `50 ms`（50,000 μs）的定時，請問應填入 `TH0` 與 `TL0` 的十進位或十六進位初值為何？", "answerOptions": [{"text": "計數初值為 65536，因此 TH0 = 00H、TL0 = 00H", "isCorrect": false, "rationale": "填入 0000H 會數滿 65536 μs = 65.536 ms。"}, {"text": "計數初值為 251，因此 TH0 = 251、TL0 = 251", "isCorrect": false, "rationale": "251 是 8-bit Mode 2 的舉例數值。"}, {"text": "計數初值為 15536（3CB0H），因此 TH0 = 60（3CH）、TL0 = 176（B0H）", "isCorrect": true, "rationale": "正確！16-bit 計時器在 65536 溢位，因此初值 = $65536 - 50000 = 15536$；將 15536 除以 256，商數 Q = 60（`3CH`）放入高位元 `TH0`，餘數 R = 176（`B0H`）放入低位元 `TL0`。"}, {"text": "計數初值為 50000（C350H），因此 TH0 = 195（C3H）、TL0 = 80（50H）", "isCorrect": false, "rationale": "若填入 50000，則只會數 $65536 - 50000 = 15536\\text{ }\\mu\\text{s}$（約 15.5ms），因為 8051 是「上數」不是下數！"}], "hint": "板書長除法演示：`15536 ÷ 256`，商數 Q 放 TH0，餘數 R 放 TL0！"}, {"questionNumber": 127, "category": "05. 計時與計數器 Timer", "isPastExam": false, "examNo": null, "question": "承上題，當 Timer 0 在 Mode 1 每次溢位定時為 `50 ms`（0.05 秒）時，程式中只需要利用一個軟體計數器重複循環幾次，就能精確計時「1 秒鐘」？", "answerOptions": [{"text": "100 次（50 ms × 100 = 5 秒）", "isCorrect": false, "rationale": "100 次為 5 秒。"}, {"text": "50 次（50 ms × 50 = 2.5 秒）", "isCorrect": false, "rationale": "50 次為 2.5 秒。"}, {"text": "20 次（50 ms × 20 = 1,000 ms = 1 秒）", "isCorrect": true, "rationale": "正確！板書計算式明確寫出：$50,000\\text{ }\\mu\\text{s} \\times 20 = 1,000,000\\text{ }\\mu\\text{s} = 1\\text{ 秒}$。"}, {"text": "10 次（50 ms × 10 = 0.5 秒）", "isCorrect": false, "rationale": "10 次只有 0.5 秒。"}], "hint": "1 秒等於 1000 毫秒（ms），$1000 \\div 50 = 20$。"}, {"questionNumber": 128, "category": "05. 計時與計數器 Timer", "isPastExam": false, "examNo": null, "question": "8051 的 Timer 0 與 Timer 1 既可當作「計時器（Timer）」也可當作「計數器（Counter）」，兩者在計數時脈來源上有何差別？", "answerOptions": [{"text": "計時器計算外部接腳電壓高低；計數器計算内部指令執行個數", "isCorrect": false, "rationale": "時脈來源說反了。"}, {"text": "計時器計算內部機械週期脈波（12 除頻振盪時脈）；計數器計算外部接腳 P3.4（T0）或 P3.5（T1）輸入的 1→0 負緣變化次數", "isCorrect": true, "rationale": "正確！透過 TMOD 暫存器的 `C/T` 位元選擇：C/T = 0 為計時模式（時脈來自內部晶振 ÷ 12）；C/T = 1 為計數模式（偵測 T0/P3.4 或 T1/P3.5 接腳的負緣脈波）。"}, {"text": "兩者完全沒有差別，只是名稱不同", "isCorrect": false, "rationale": "時脈來源不同，用途（精確計時 vs 外部事件計數）也不同。"}, {"text": "計時器只能在 Mode 0 使用；計數器只能在 Mode 2 使用", "isCorrect": false, "rationale": "兩種模式在 Mode 0、1、2 下皆可使用。"}], "hint": "英文 Timer（計時）靠內部固定節拍器；Counter（計數）靠外部接腳數物體通過的次數。"}, {"questionNumber": 129, "category": "06. 中斷系統與解彈跳", "isPastExam": false, "examNo": null, "question": "標準 8051 五個中斷源對應的「中斷向量位址（Interrupt Vector Address）」排列，下列哪一組「完全正確」？", "answerOptions": [{"text": "INT0：0000H、Timer 0：0008H、INT1：0010H、Timer 1：0018H、UART：0020H", "isCorrect": false, "rationale": "0000H 是 Reset 向量位址，中斷向量是從 0003H 開始，不是從 0000H 開始。"}, {"text": "INT0：0003H、INT1：000BH、Timer 0：0013H、Timer 1：001BH、UART：0023H", "isCorrect": false, "rationale": "Timer 0（000BH）排在 INT1（0013H）前面，順序交替排列（外部、計時、外部、計時、串列）。"}, {"text": "INT0：0030H、Timer 0：0038H、INT1：0040H、Timer 1：0048H、UART：0050H", "isCorrect": false, "rationale": "0030H 是一般程式主體（`START:`）與堆疊常放的位址。"}, {"text": "INT0：0003H、Timer 0：000BH、INT1：0013H、Timer 1：001BH、UART：0023H", "isCorrect": true, "rationale": "正確！從 `0003H` 開始，每隔 8 個 Bytes（08H）配置一個中斷向量：`03H → 0BH → 13H → 1BH → 23H`。"}], "hint": "記住起始位址 `0003H`，每次加 `8`：`3 → B（11）→ 13（19）→ 1B（27）→ 23（35）`。"}, {"questionNumber": 130, "category": "06. 中斷系統與解彈跳", "isPastExam": false, "examNo": null, "question": "在 8051 程式記憶體中，相鄰兩個中斷向量位址之間（例如 `0003H` 到 `000BH`）只相隔 8 Bytes 空間，因此實務上在中斷向量位址處通常會放什麼指令？", "answerOptions": [{"text": "放一道跳躍指令（例如 `JMP INT1INT`），跳轉到其他較寬敞的程式記憶體空間執行完整的中斷服務程式（ISR）", "isCorrect": true, "rationale": "正確！同學筆記第 4 頁在 0003H 旁畫出 8 Bytes 格子並寫道：「中斷向量：跳至程式所在處（是個跳躍指令）」，避免程式碼過長覆蓋到下一個中斷向量（000BH）。"}, {"text": "直接把 100 行的中斷服務程式全部塞在 0003H ~ 000AH 裡面", "isCorrect": false, "rationale": "若超過 8 Bytes 會直接覆蓋掉下一個中斷的向量位址，造成組譯器報錯或程式當機。"}, {"text": "放 `END` 假指令結束中斷", "isCorrect": false, "rationale": "ISR 結尾應放 `RETI`，不是 `END`。"}, {"text": "放 `MOV SP, #30H` 重設堆疊", "isCorrect": false, "rationale": "SP 是在主程式 `START:` 初始化的。"}], "hint": "8 Bytes 只能塞兩三道小指令，所以中斷向量處就像一個「轉運站路標（JMP）」，指引 CPU 跳去真正的 ISR 基地。"}, {"questionNumber": 131, "category": "06. 中斷系統與解彈跳", "isPastExam": false, "examNo": null, "question": "在 8051 中，中斷服務程式（ISR）的最後一行返回指令「RETI」與一般副程式返回指令「RET」，兩者最大的差異為何？", "answerOptions": [{"text": "`RET` 會從堆疊彈出 2 Bytes，`RETI` 則會把整個堆疊清空歸零", "isCorrect": false, "rationale": "RETI 同樣只彈出 2 Bytes 返回位址。"}, {"text": "兩者機械碼與功能完全一模一樣，可以隨意互換", "isCorrect": false, "rationale": "若在 ISR 結尾誤用 `RET` 代替 `RETI`，中斷控制器會以為該中斷永遠還沒結束，導致之後同等級中斷再也無法觸發！"}, {"text": "兩者都會從堆疊彈出 2 Bytes 寫回 PC，但 `RETI` 還會額外通知中斷系統清除中斷優先權鎖存狀態（重新開啟同級中斷遮罩）", "isCorrect": true, "rationale": "正確！同學筆記第 9 頁清楚對比：「共通點：RET、RETI 執行時，將 SP 上端的 2 Byte 寫回 PC；差異：RETI 除返回上層外，另重新開啟中斷遮罩（清除正在執行中斷之優先權狀態）」。"}, {"text": "`RETI` 只能在主程式使用，`RET` 只能在中斷中使用", "isCorrect": false, "rationale": "使用對象完全寫反了。"}], "hint": "RETI = Return from Interrupt，最後那個 `I` 負責把中斷控制器的「忙碌中」旗標解除。"}, {"questionNumber": 132, "category": "06. 中斷系統與解彈跳", "isPastExam": false, "examNo": null, "question": "關於 8051 外部中斷（INT0、INT1）選擇「負緣觸發（Falling Edge Trigger）」與「低準位觸發（Low-Level Trigger）」的「記憶性」差異，下列敘述何者正確？", "answerOptions": [{"text": "低準位觸發具有「無限次記憶性」，負緣觸發完全沒有記憶性", "isCorrect": false, "rationale": "記憶特性說反了。"}, {"text": "負緣觸發只有在電源關閉時才會記憶", "isCorrect": false, "rationale": "斷電後所有暫存器皆清空。"}, {"text": "負緣觸發具有「一次記憶性」（若 ISR 執行中再次發生負緣會被鎖存記住，結束後再執行一次，但第二次以上忽略）；低準位觸發「無記憶性」", "isCorrect": true, "rationale": "正確！你的筆記第 15 頁與同學筆記第 8 頁皆詳細記錄：「邊緣觸發有一次記憶，若當前正在執行中斷，這時再來一個負緣，結束後會再回頭執行一次中斷（第二次以上忽略）；準位觸發沒有記憶」。"}, {"text": "兩者都具有 10 次按鍵記憶緩衝區", "isCorrect": false, "rationale": "8051 硬體沒有 10 次按鍵緩衝區。"}], "hint": "邊緣觸發會把「1→0 的瞬間」存進硬體正反器 IE0/IE1（所以有一次記憶）；準位觸發只看「當下是不是 0V」，放開恢復高電位就沒事了。"}, {"questionNumber": 133, "category": "06. 中斷系統與解彈跳", "isPastExam": false, "examNo": null, "question": "在同學筆記第 12 頁的外部中斷 `INT1` 實驗程式碼中，為什麼老師特別選用「低準位觸發（`CLR IT1`）」，並在 ISR 內寫了延遲 20ms 後加上 `SETB P3.3` 與 `JNB P3.3, Wait`？", "answerOptions": [{"text": "為了讓按鈕按一次就連續觸發 100 次中斷", "isCorrect": false, "rationale": "目的是防止重複誤觸發，而不是連續觸發 100 次。"}, {"text": "因為 8051 的 `INT1` 硬體上不支援負緣觸發", "isCorrect": false, "rationale": "8051 支援負緣觸發（`SETB IT1`），但容易受機械彈跳影響。"}, {"text": "為了實現「軟體解彈跳（Software Debounce）」：延遲 20ms 避開按鈕按下時的機械彈跳，再用 `JNB P3.3, Wait` 等待使用者放開按鈕才執行 `RETI`，確保按一次只動作一次", "isCorrect": true, "rationale": "正確！機械按鈕按下與放開都有約 20ms 彈跳；若用負緣觸發，彈跳產生的多個下降緣會導致「一次記憶」在 RETI 後立刻又誤觸發第二次！改用低準位觸發並等到放開（P3.3 變回 1）才 RETI，就能完全避開按下與放開的彈跳。"}, {"text": "為了讓 LED 永遠停留在暗掉的狀態", "isCorrect": false, "rationale": "每按一次按鈕，程式會執行 `RL A` 讓亮燈移動一格。"}], "hint": "回想你的筆記第 15 頁：「通常按鈕彈跳 20ms，確保中斷服務程式有等待夠 20ms，使用準位觸發。」"}, {"questionNumber": 134, "category": "06. 中斷系統與解彈跳", "isPastExam": false, "examNo": null, "question": "在同學筆記第 12 頁的程式碼中，指令「MOV IE, #10000100B」的用途為何？", "answerOptions": [{"text": "開啟串列通訊中斷（ES = 1）與計時器 0 中斷（ET0 = 1）", "isCorrect": false, "rationale": "ES 在 Bit 4，ET0 在 Bit 1，此處皆為 0。"}, {"text": "將累加器 A 的內容設為 84H", "isCorrect": false, "rationale": "目的暫存器是 IE（Interrupt Enable），不是 A。"}, {"text": "關閉所有中斷功能（EA = 0）", "isCorrect": false, "rationale": "若 EA = 0 才會關閉所有中斷。"}, {"text": "開啟中斷總開關（EA = 1，Bit 7）以及致能外部中斷 1（EX1 = 1，Bit 2），其餘中斷關閉", "isCorrect": true, "rationale": "正確！IE 暫存器 8 個位元由高到低為 `EA, -, ET2, ES, ET1, EX1, ET0, EX0`。`10000100B` 的 Bit 7（EA）= 1 且 Bit 2（EX1）= 1，代表允許 INT1 產生中斷。"}], "hint": "數一下 `10000100B` 中兩個 `1` 所在的位置：最高位（Bit 7 = EA）與右邊數來第 3 位（Bit 2 = EX1）。"}, {"questionNumber": 135, "category": "06. 中斷系統與解彈跳", "isPastExam": false, "examNo": null, "question": "關於 8051 串列通訊（UART）的中斷旗標 `TI`（傳送中斷旗標）與 `RI`（接收中斷旗標），兩者的「設定為 1」與「清除為 0」分別是由誰負責？", "answerOptions": [{"text": "全部由硬體自動設為 1，進入中斷後硬體也會自動清除為 0", "isCorrect": false, "rationale": "只有外部負緣中斷（IE0/IE1）與計時器溢位中斷（TF0/TF1）在進入 ISR 時會由硬體自動清除，UART 的 TI 與 RI「不會」自動清除！"}, {"text": "由硬體（Hardware）在傳送完成或收到資料時自動設為 1；必須由軟體（Software，程式設計者寫 `CLR TI` / `CLR RI`）手動清除為 0", "isCorrect": true, "rationale": "正確！同學筆記第 8 頁表格與你的筆記第 14 頁明確記載：硬體負責設為 1（通知送完資料或收到資料），而軟體（程式設計師）在讀取或下次使用前必須手動清除為 0（否則會無限重複進入 UART 中斷）。"}, {"text": "TI 與 RI 永遠保持為 1，不需要清除", "isCorrect": false, "rationale": "不清除為 0 會導致中斷無窮迴圈。"}, {"text": "由軟體手動設為 1，再由硬體自動清除為 0", "isCorrect": false, "rationale": "硬體才會知道何時真正收完 8 bits 資料。"}], "hint": "這是 8051 最經典的考試陷阱：INT0/INT1/TF0/TF1 進 ISR 硬體自動清 0，唯獨 UART 的 TI/RI 必須「人工（軟體）清除為 0」！"}, {"questionNumber": 136, "category": "06. 中斷系統與解彈跳", "isPastExam": false, "examNo": null, "question": "在處理周邊狀態或串列通訊時，課堂比較了「輪詢（Polling）」與「中斷（Interrupt）」兩種處理方法，下列關於「輪詢（Polling）」的敘述何者正確？", "answerOptions": [{"text": "輪詢的即時響應速度永遠比硬體中斷快 1000 倍", "isCorrect": false, "rationale": "中斷是事件一發生立刻響應，輪詢必須等程式迴圈跑回來檢查，響應較慢。"}, {"text": "8051 無法使用輪詢方式檢查 RI 或 TI 旗標", "isCorrect": false, "rationale": "使用 `JNB RI, $` 就是典型的輪詢寫法。"}, {"text": "完全不需要 CPU 參與檢查，硬體會自動強制跳轉到 0023H", "isCorrect": false, "rationale": "那是中斷（Interrupt）的運作方式。"}, {"text": "不會進入中斷向量，而是由主程式定期主動檢查旗標是否為 1，較佔用 CPU 資源，適用於通訊頻率低或不要求即時響應的場合", "isCorrect": true, "rationale": "正確！同學筆記第 8 頁明確比較：「① 輪詢（Polling）：不會進入中斷，由程式定期 check 旗標是否為 1，佔用較多 CPU 資源，用於通訊頻率較低/不要求響應時間時」。"}], "hint": "輪詢就像每隔五分鐘自己走去門口看信箱有沒有信；中斷就像郵差按門鈴通知你出來拿信。"}, {"questionNumber": 137, "category": "07. 串列通訊 UART 與 RS-232", "isPastExam": false, "examNo": null, "question": "串列通訊英文縮寫「UART」的全名與中文意義為何？", "answerOptions": [{"text": "United Analog Register Transfer（聯合類比暫存器傳輸）", "isCorrect": false, "rationale": "全名完全錯誤。"}, {"text": "Universal Address Reset Timer（通用位址重置計時器）", "isCorrect": false, "rationale": "全名完全錯誤。"}, {"text": "User Application Read Table（使用者應用讀取表）", "isCorrect": false, "rationale": "全名完全錯誤。"}, {"text": "Universal Asynchronous Receiver and Transmitter（通用／萬用非同步接收與傳送器）", "isCorrect": true, "rationale": "正確！U = Universal，A = Asynchronous（非同步），R = Receiver，T = Transmitter。"}], "hint": "請留意筆記上「老高英語小教室」特別補充的字根：`Asynchronous`（非同步）。"}, {"questionNumber": 138, "category": "07. 串列通訊 UART 與 RS-232", "isPastExam": false, "examNo": null, "question": "筆記第 6 頁「老高英語小教室」中，老師特別比較了三個以字首 `A-`（否定/非）開頭的英文單字，下列配對何者完全正確？", "answerOptions": [{"text": "Asynchronous（非同步）、Asymmetric（非對稱）、Aperiodic（非週期性）", "isCorrect": true, "rationale": "正確！同學筆記第 6 頁右上角框框記錄：「老高英語小教室：Asynchronous 非同步、Asymmetric 非對稱、Aperiodic 非週期性」。"}, {"text": "Automatic（自動化）、Analog（類比式）、Address（位址）", "isCorrect": false, "rationale": "這些不是該小教室整理的字首 `A-` 對比字彙。"}, {"text": "Assemble（組譯）、Accumulator（累加器）、Active（致能）", "isCorrect": false, "rationale": "這些不是該小教室整理的字彙。"}, {"text": "Arithmetic（算術）、Algorithm（演算法）、Array（陣列）", "isCorrect": false, "rationale": "這些不是該小教室整理的字彙。"}], "hint": "字首 `A-` 在英文科技字彙中常代表「無、非、不」（如 synchronous 同步 → asynchronous 非同步）。"}, {"questionNumber": 139, "category": "07. 串列通訊 UART 與 RS-232", "isPastExam": false, "examNo": null, "question": "關於通訊傳輸方向的「單工（Simplex）」、「半雙工（Half Duplex）」與「全雙工（Full Duplex）」生活實例配對，下列何者正確？", "answerOptions": [{"text": "單工：電話通話；半雙工：無線電廣播；全雙工：無線電對講機", "isCorrect": false, "rationale": "配對全部錯置。"}, {"text": "半雙工可以同時傳送與接收，全雙工只能單向傳送", "isCorrect": false, "rationale": "半雙工與全雙工的定義說反了。"}, {"text": "單工：無線電廣播/電視（只能單向）；半雙工：無線電對講機（同一時間只能一方講話）；全雙工：電話通話（雙方可同時講與聽）", "isCorrect": true, "rationale": "正確！你的筆記第 26 頁寫道「半雙工就是對講機」，而電話雙方可同時說話與聆聽則為全雙工。"}, {"text": "單工需要 10 條訊號線，全雙工只需要 1 條訊號線", "isCorrect": false, "rationale": "線數說明錯誤。"}], "hint": "按住通話鍵講話、放開才能聽對方講的「對講機」就是最經典的半雙工。"}, {"questionNumber": 140, "category": "07. 串列通訊 UART 與 RS-232", "isPastExam": false, "examNo": null, "question": "當串列通訊設定鮑率（Baud Rate）為 `9600 bps` 時，每一個位元所佔用的時間寬度，即「位元區間（Bit Interval, T）」為多少秒？", "answerOptions": [{"text": "T = 1 / 12000000 秒", "isCorrect": false, "rationale": "那是 12 MHz 的振盪週期。"}, {"text": "T = 8 / 9600 秒", "isCorrect": false, "rationale": "那是傳送 8 個資料位元所需的時間，不是單一個位元區間。"}, {"text": "T = 9600 秒", "isCorrect": false, "rationale": "那是 9600 秒，不是每秒傳 9600 個位元。"}, {"text": "T = 1 / 9600 秒（約 104.17 μs）", "isCorrect": true, "rationale": "正確！根據定義，位元區間 $T = \\frac{1}{\\text{Baud Rate}} = \\frac{1}{9600}\\text{ 秒}$。"}], "hint": "每秒鐘傳 9600 個位元，那平均每 1 個位元就分到 9600 分之 1 秒。"}, {"questionNumber": 141, "category": "07. 串列通訊 UART 與 RS-232", "isPastExam": false, "examNo": null, "question": "在 RS-232 串列通訊協定中，傳輸線處於「閒置（Mark / Idle）狀態」時為邏輯 1，此時電氣電壓準位為何？而「起始位元（Start Bit）」必為邏輯 0，其電壓準位為何？", "answerOptions": [{"text": "兩者皆維持在 0V 接地電位", "isCorrect": false, "rationale": "RS-232 不以 0V 作為有效邏輯準位。"}, {"text": "閒置邏輯 1 為負電壓（約 -10V）；起始位元邏輯 0 為正電壓（約 +10V）", "isCorrect": true, "rationale": "正確！RS-232 是負邏輯（邏輯 1 = -10V，邏輯 0 = +10V），因此線路閒置時維持在 -10V（邏輯 1），當起始位元（邏輯 0）開始時，電壓會由 -10V 跳變為 +10V。"}, {"text": "閒置邏輯 1 為正電壓（約 +10V）；起始位元邏輯 0 為負電壓（約 -10V）", "isCorrect": false, "rationale": "把負邏輯跟正邏輯搞混了。"}, {"text": "閒置邏輯 1 為 +5V；起始位元邏輯 0 為 0V", "isCorrect": false, "rationale": "+5V 與 0V 是 TTL 準位，不是 RS-232 準位。"}], "hint": "先確認邏輯值（閒置=1、起始=0），再套用 RS-232「負邏輯（1負0正）」轉換成電壓！"}, {"questionNumber": 142, "category": "07. 串列通訊 UART 與 RS-232", "isPastExam": false, "examNo": null, "question": "假設要透過 UART 傳送 8 位元資料 `0110 0101B`（從 LSB 到 MSB 依序為 `1, 0, 1, 0, 0, 1, 1, 0`），若雙方約定採用「偶同位（Even Parity）」檢查，請問同位位元 `P` 應填入 0 還是 1？", "answerOptions": [{"text": "P = 0 或 1 皆可，接收端不會檢查", "isCorrect": false, "rationale": "接收端會計算 1 的總個數是否為偶數來偵測傳輸錯誤。"}, {"text": "P = 0（因為資料本身已有 4 個 1，已經是偶數個 1）", "isCorrect": true, "rationale": "正確！如同學筆記第 6 頁左下角板書範例：`Data 0110 0101`，裡面共有 4 個 `1`（已是偶數），因此偶同位位元 `P = 0`，讓「資料 + P」的 1 總數維持偶數（4 個）。"}, {"text": "P = 1（為了讓 1 的總數變成 5 個奇數）", "isCorrect": false, "rationale": "讓 1 的總數變成奇數那是「奇同位（Odd Parity）」。"}, {"text": "偶同位不傳送同位位元", "isCorrect": false, "rationale": "No Parity 才不傳送同位位元。"}], "hint": "偶同位（Even Parity）的目標是讓「所有資料位元 + 同位位元」裡面的 `1` 總共有偶數個。"}, {"questionNumber": 143, "category": "07. 串列通訊 UART 與 RS-232", "isPastExam": false, "examNo": null, "question": "串列通訊參數常簡寫為「9600, N, 8, 1」，請問這四個代號由左至右分別代表什麼意義？", "answerOptions": [{"text": "每分鐘 9600 字、奇同位、8 個結束位元、1 個資料位元", "isCorrect": false, "rationale": "定義完全錯置。"}, {"text": "頻率 9600 Hz、負邏輯、8 個起始位元、1 個同位位元", "isCorrect": false, "rationale": "起始位元永遠只有 1 個，不會有 8 個。"}, {"text": "鮑率 9600 bps、無同位位元（No Parity）、每個封包 8 個資料位元、1 個結束位元", "isCorrect": true, "rationale": "正確！如你的筆記第 29 頁右下角標註的 `9600, N, 8, 1`，依序對應串列通訊四大要項：鮑率、同位檢查（N=None）、資料位元數（8 bits）、結束位元數（1 bit）。"}, {"text": "鮑率 9600 bps、偶同位、8 個封包、1 秒延遲", "isCorrect": false, "rationale": "N 代表 No Parity，不是偶同位（偶同位為 E）。"}], "hint": "N = None（無同位），8 = 8 data bits，1 = 1 stop bit。"}, {"questionNumber": 144, "category": "07. 串列通訊 UART 與 RS-232", "isPastExam": false, "examNo": null, "question": "在 `9600, N, 8, 1` 的串列通訊設定下，為什麼實際上每秒鐘能傳送的「有效資料（Payload Data）」位元數一定少於 9600 bits？", "answerOptions": [{"text": "因為每傳送 8 bits 有效資料，封包中還必須額外包含 1 個起始位元與 1 個結束位元（共傳 10 bits 才含 8 bits 有效資料，有效資料率僅 9600 × 8/10 = 7680 bps）", "isCorrect": true, "rationale": "正確！你的筆記第 29 頁最下方寫道：「假設設定 9600 bps，但是實際上能傳送的資料少於 9600 bit」，正是因為每個 10-bit 訊框中只有 8 bits 是真正的資料（Payload），其餘 2 bits 是起訖控制位元。"}, {"text": "因為同位位元佔用了 8 個位元", "isCorrect": false, "rationale": "N 設定下沒有同位位元，且同位位元最多也只有 1 bit。"}, {"text": "因為 RS-232 負邏輯會吃掉一半的傳輸時間", "isCorrect": false, "rationale": "負邏輯只是電壓極性定義，不影響位元比例。"}, {"text": "因為 8051 每傳 1 個位元就要重置一次", "isCorrect": false, "rationale": "傳輸過程不會重置。"}], "hint": "寄一封信有 8 張信紙（Payload），但外面還得包 1 張信封頭（起始位元）和 1 張信封尾（結束位元）。"}, {"questionNumber": 145, "category": "07. 串列通訊 UART 與 RS-232", "isPastExam": false, "examNo": null, "question": "在筆記中提到 UART 串列通訊為了確認傳送出去的資料是否正確無誤，常採用「Echo（迴音）」機制，請問 Echo 機制是如何運作的？", "answerOptions": [{"text": "接收端不回傳任何訊號，直接將電源關閉", "isCorrect": false, "rationale": "接收端必須回傳原資料供傳送端比對。"}, {"text": "傳送端把每個位元連續重複發送 100 次", "isCorrect": false, "rationale": "重複發送 100 次不是 Echo 機制。"}, {"text": "接收端收到資料後，立即將完全相同的資料再回傳（複誦）給原傳送端進行比對驗證", "isCorrect": true, "rationale": "正確！同學筆記第 6 頁寫出「可採用 echo，請接收端複誦回傳收到內容以防出錯」，你的筆記第 29 頁也寫出「接收完畢後，再回傳一樣的資料回去，代表收到了」。"}, {"text": "在傳輸線上加裝彈簧產生聲音回音", "isCorrect": false, "rationale": "Echo 是指資料在全雙工迴路中的回傳複誦，不是物理聲音回音。"}], "hint": "就像對山谷大喊一聲「哈囉」，聽到山谷原封不動回傳「哈囉」，就知道對方聽清楚了。"}, {"questionNumber": 146, "category": "07. 串列通訊 UART 與 RS-232", "isPastExam": false, "examNo": null, "question": "兩台電腦（皆為 DTE 裝置）要直接以 RS-232 互連進行全雙工通訊時，連接線必須採用「Null Modem（無數據機 / 跳線 Cross Over）」接法，請問其 Pin 2 與 Pin 3 應如何連接？", "answerOptions": [{"text": "只需要連接雙方的 Pin 5，Pin 2 與 Pin 3 全部空接", "isCorrect": false, "rationale": "只接 Pin 5 沒有資料通道。"}, {"text": "甲方的 Pin 2（RXD）接乙方的 Pin 3（TXD），甲方的 Pin 3（TXD）接乙方的 Pin 2（RXD），Pin 5 接 Pin 5", "isCorrect": true, "rationale": "正確！如同學筆記第 6 頁與你的筆記第 28 頁所示，A 端送出的 TXD（Pin 3）必須交叉接到 B 端的接收腳 RXD（Pin 2），反之亦然（商場買的直通線通常沒有跳接，需自己跳接）。"}, {"text": "甲方的 Pin 2 接乙方的 Pin 2，甲方的 Pin 3 接乙方的 Pin 3（直通線）", "isCorrect": false, "rationale": "若 2 接 2、3 接 3，會變成雙方同時對著對方的嘴巴講話（TXD 撞 TXD），誰也收不到！"}, {"text": "甲方的 Pin 2 與 Pin 3 全部一起接到乙方的 Pin 5 地線", "isCorrect": false, "rationale": "把資料線接地會造成短路。"}], "hint": "A 的「傳送（3）」必須對準 B 的「接收（2）」，所以 2 和 3 要交叉（Cross Over）！"}, {"questionNumber": 147, "category": "07. 串列通訊 UART 與 RS-232", "isPastExam": false, "examNo": null, "question": "同學筆記第 8 頁介紹了「紅外線遙控器的串列通訊」，請問紅外線遙控器為何要將數位訊號調變在「38 kHz 副載波（Sub-Carrier）」上發射（波長約 980nm）？", "answerOptions": [{"text": "為了讓紅外線可以穿透厚達 10 公尺的鋼筋水泥牆", "isCorrect": false, "rationale": "紅外線為直線光波，無法穿透不透明水泥牆。"}, {"text": "因為 8051 的石英晶體最高只能跑到 38 kHz", "isCorrect": false, "rationale": "8051 晶振頻率為 MHz 等級（如 12 MHz）。"}, {"text": "因為 38 kHz 是人耳最容易聽見的音樂頻率", "isCorrect": false, "rationale": "38 kHz 是超音波頻率且透過紅外線發光二極體發射，非聲音。"}, {"text": "用來隔離環境光源與人類／生物體溫所發出的自然紅外光干擾", "isCorrect": true, "rationale": "正確！同學筆記第 8 頁明確寫道：「Sub-Carrier 副載波 38kHz => 可隔離生物發出的紅外光」，接收端只解調 38kHz 閃爍的 980nm 紅外光，避免環境干擾。"}], "hint": "生物體溫與日光也會發出直流/低頻紅外線，所以遙控器讓紅外線以每秒 38,000 次的頻率閃爍當作暗號。"}, {"questionNumber": 148, "category": "07. 串列通訊 UART 與 RS-232", "isPastExam": false, "examNo": null, "question": "在筆記第 31~32 頁介紹的公眾交換電話網路（PSTN）數位多工傳輸架構中，單一標準語音通道（DS-0）的頻寬（傳輸速率）是如何計算出來的？", "answerOptions": [{"text": "每秒取樣 1,000 次 × 每次取樣 16 bits = 16 kbps", "isCorrect": false, "rationale": "計算參數不符。"}, {"text": "每秒取樣 8,000 次 × 每次取樣 8 bits = 64,000 bits/sec = 64 kbps", "isCorrect": true, "rationale": "正確！語音最高頻率約 4 kHz，根據取樣定理取樣率為 $8,000\\text{ samples/sec}$，每次量化為 $8\\text{ bits}$，故 $8000 \\times 8 = 64\\text{ kbps}$。"}, {"text": "每秒取樣 9,600 次 × 每次取樣 1 bit = 9.6 kbps", "isCorrect": false, "rationale": "9600 bps 是常見的 UART 鮑率，不是電話語音通道。"}, {"text": "每秒取樣 44,100 次 × 每次取樣 16 bits = 705.6 kbps", "isCorrect": false, "rationale": "44.1 kHz / 16-bit 是 CD 音質規格，不是 PSTN 電話語音通道。"}], "hint": "筆記第 27 頁與第 32 頁：`8,000 次/秒 × 8 bits/次 = 64 kbps`。"}, {"questionNumber": 149, "category": "07. 串列通訊 UART 與 RS-232", "isPastExam": false, "examNo": null, "question": "承上題，在北美與台灣電信網路（如中華電信）的 T1（DS-1）多工傳輸線路中，一條 T1 包含 24 個語音通道（DS-0）以及每訊框 1 個碼框位元（Frame Bit），其總傳輸速率為多少？", "answerOptions": [{"text": "64 kbps（這是單一語音通道速率）", "isCorrect": false, "rationale": "64 kbps 是單一 DS-0 通道速率。"}, {"text": "44.736 Mbps（這是 28 條 T1 組成的 T3 速率）", "isCorrect": false, "rationale": "44.736 Mbps 是高一階的 T3（DS-3，由 28 個 T1 組成）速率。"}, {"text": "1.544 Mbps（計算：(24 × 8 + 1) × 8,000 = 193 × 8,000 = 1,544,000 bps）", "isCorrect": true, "rationale": "正確！你的筆記第 31~32 頁詳細推導了這條算式：24 路 × 8 bits + 1 Frame bit = 193 bits/frame，每秒 8000 frames，總計 $193 \\times 8000 = 1.544\\text{ Mbps}$。"}, {"text": "1.536 Mbps（沒有加上碼框位元）", "isCorrect": false, "rationale": "忘記加上同步用的 1 個 Frame Bit。"}], "hint": "24 路語音共 192 bits，再加上 1 個用來對齊的碼框位元（Frame bit）變成 193 bits，乘以 8000 次/秒。"}, {"questionNumber": 150, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "在 Ch2 投影片介紹的 8051 五大定址模式（Addressing Modes）中，下列哪一組「指令與定址模式」的配對完全正確？", "answerOptions": [{"text": "所有五道指令全部都屬於立即定址模式", "isCorrect": false, "rationale": "五道指令分別示範五種不同的定址模式。"}, {"text": "ANL A, R5（間接定址）；INC @R0（暫存器定址）；MOVC A, @A+PC（立即定址）", "isCorrect": false, "rationale": "暫存器與間接定址搞反了。"}, {"text": "ADD A, 40H（立即定址）；ORL A, #0FH（直接定址）；INC @R0（索引定址）", "isCorrect": false, "rationale": "直接與立即定址搞反了。"}, {"text": "ADD A, 40H（直接定址）；INC @R0（間接定址）；ANL A, R5（暫存器定址）；ORL A, #0FH（立即定址）；MOVC A, @A+PC（索引定址）", "isCorrect": true, "rationale": "正確！這五道範例完全出自 Ch2 投影片第 24 頁「定址模式」一覽表：有 `#` 是立即、沒 `#` 的位址是直接、`Rn` 是暫存器、`@Ri` 是間接、`@A+PC`/`@A+DPTR` 是索引。"}], "hint": "有井字號 `#` 代表「立即」把常數塞進去；有 `@` 搭配 `R0/R1` 代表「間接」找指標；有 `@A+DPTR` 代表「索引」查表。"}, {"questionNumber": 151, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "在 8051 組合語言中，若要使用間接定址（搭配 `@` 符號）存取內部資料記憶體（RAM），只允許使用哪兩個工作暫存器作為位址指標？", "answerOptions": [{"text": "R0 ~ R7 八個暫存器全部都可以（如 `@R5`、`@R7`）", "isCorrect": false, "rationale": "R2 ~ R7 不支援 `@` 間接定址。"}, {"text": "僅限 R0 與 R1（即 `@R0` 與 `@R1`）", "isCorrect": true, "rationale": "正確！在 8051 指令集中，內部 RAM 的 8 位元間接定址在機械碼編碼上僅分配了 1 個位元來區分，因此只能使用 `@R0` 或 `@R1`（寫 `@R2` 會語法錯誤）。"}, {"text": "僅限 DPTR（`@DPTR` 存取內部 RAM）", "isCorrect": false, "rationale": "`@DPTR` 是搭配 `MOVX` 用來存取 16 位元「外部」資料記憶體的。"}, {"text": "僅限累加器 A（`@A`）", "isCorrect": false, "rationale": "不支援 `@A` 單獨作為內部 RAM 間接定址。"}], "hint": "只能用編號最前面的兩個暫存器（0 號與 1 號）。"}, {"questionNumber": 152, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "為什麼在 8051 組合語言程式中，當我們要載入一個以英文字母 A ~ F 開頭的十六進位常數（例如 `FEH`）時，必須在前面補一個 `0` 寫成「MOV A, #0FEH」？", "answerOptions": [{"text": "因為補了 0 之後常數會變成 16 位元", "isCorrect": false, "rationale": "仍然維持 8 位元（1 Byte）常數。"}, {"text": "因為 0FEH 代表負數，FEH 代表正數", "isCorrect": false, "rationale": "補 0 不影響數值大小與正負號（`0FEH` 與 `FEH` 都是 `1111 1110B`）。"}, {"text": "因為部分組譯器（Assembler）若看到 `#` 後面第一個字元不是阿拉伯數字（0~9），會將 `FEH` 誤判為未定義的英文字母標籤（Label）而當機報錯", "isCorrect": true, "rationale": "正確！同學筆記第 9 頁與你的筆記第 35 頁皆明確提醒：「符號 `#` 後面儘量用 0 開頭，有的組譯器看到首位非數字會當機」。"}, {"text": "因為 8051 只能接受十進位數字，不能使用十六進位", "isCorrect": false, "rationale": "在數字後方加上 `H` 即表示十六進位（Hexadecimal）。"}], "hint": "組譯器辨識名稱的規則是「英文字母開頭視為符號名稱，阿拉伯數字開頭視為常數」。"}, {"questionNumber": 153, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "關於 8051 資料搬移指令「MOV」、「MOVC」、「MOVX」的存取目標記憶體區分，下列敘述何者正確？", "answerOptions": [{"text": "MOV 存取內部 RAM 與 SFR；MOVC 讀取程式記憶體（ROM 查表）；MOVX 存取外部資料記憶體（External RAM）", "isCorrect": true, "rationale": "正確！記憶口訣：`MOV`（內部資料）、`MOVC`（Code 程式記憶體）、`MOVX`（eXternal 外部資料記憶體）。"}, {"text": "MOV 存取外部 ROM；MOVC 存取內部 RAM；MOVX 存取 SFR", "isCorrect": false, "rationale": "三者對應的記憶體完全錯置。"}, {"text": "三道指令的功能完全相同，只是寫法不同", "isCorrect": false, "rationale": "三者觸發的控制訊號（內部匯流排 vs PSEN vs RD/WR）完全不同。"}, {"text": "MOVX 只能用來搬移複數（Complex Number）資料", "isCorrect": false, "rationale": "`X` 代表 eXternal（外部），不是複數。"}], "hint": "見你的筆記第 45 頁白板右上角：`MOV -> Internal move`、`MOVX -> external move`、`MOVC -> Read Data from program memory`。"}, {"questionNumber": 154, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "假指令「DB」與「DW」在 8051 組合語言中的全名及功能為何？", "answerOptions": [{"text": "DB（Delete Byte）刪除 1 個位元組；DW（Delete Word）刪除 2 個位元組", "isCorrect": false, "rationale": "D 是 Define（定義），不是 Delete（刪除）。"}, {"text": "DB（Define Byte）在程式記憶體中定義 1 個 Byte 的常數資料；DW（Define Word）一次定義 2 個 Bytes（1 個 Word）的常數資料", "isCorrect": true, "rationale": "正確！如同學筆記第 11 頁與你的筆記第 45 頁所示：DB 定義 1 Byte 靜態資料放入程式記憶體，DW 定義 2 Bytes 資料；組譯器不會翻譯成指令，而是直接將數值寫入 ROM。"}, {"text": "DB 與 DW 會被翻譯成 ALU 的加減法機械碼", "isCorrect": false, "rationale": "它們不會被翻譯成 ALU 運算機械碼。"}, {"text": "DB（Data Bus）設定資料匯流排方向；DW（Data Write）寫入外部硬碟", "isCorrect": false, "rationale": "與匯流排或硬碟無關。"}], "hint": "查表法霹靂燈的亮滅數據表就是用 `TABLE: DB 07EH, 0BDH...` 放進程式記憶體的。"}, {"questionNumber": 155, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "在 Ch1 投影片第 26 頁的範例程式 `ch1.asm` 中，初始載入 `MOV A, #0FH`（0000 1111B），迴圈中執行 `MOV P2, A` 後執行「CPL A」，請問執行一次 `CPL A` 後累加器 A 的內容變成多少？", "answerOptions": [{"text": "F0H（1111 0000B，對 A 的 8 個位元逐位取 1 的補數反相）", "isCorrect": true, "rationale": "正確！`CPL`（Complement）是逐位元反相指令，把原本的 `0000 1111B` 變成 `1111 0000B`（`F0H`），配合延遲就能讓 8 顆 LED 分成左右兩組 4 顆交替閃爍。"}, {"text": "00H（全部清除為 0）", "isCorrect": false, "rationale": "全部清零是 `CLR A`。"}, {"text": "1EH（向左移一位）", "isCorrect": false, "rationale": "向左移一位是 `RL A`。"}, {"text": "0FH（保持不變）", "isCorrect": false, "rationale": "CPL 會將 0 變 1、1 變 0，不會保持不變。"}], "hint": "CPL = Complement（取補數/反相），原本亮的滅掉、原本滅的點亮！"}, {"questionNumber": 156, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "若累加器 A 的內容為 `0111 1110B`（7EH），執行一次無進位左旋指令「RL A」（Rotate Left）後，A 的新內容為何？", "answerOptions": [{"text": "1111 1101B（FDH）", "isCorrect": false, "rationale": "最高位 Bit 7 原本是 0，繞回 Bit 0 應該是 0 而不是 1。"}, {"text": "0111 1110B（7EH）", "isCorrect": false, "rationale": "A 的內容會向左移動一格。"}, {"text": "0011 1111B（3FH，向右旋轉一位）", "isCorrect": false, "rationale": "向右旋轉一位是 `RR A`（Rotate Right）。"}, {"text": "1111 1100B（FCH，最高位 Bit 7 的 0 繞回最低位 Bit 0）", "isCorrect": true, "rationale": "正確！`RL A` 將 8 個位元全部向左移動 1 格，原本最左邊 Bit 7 的 `0` 會循環繞回到最右邊 Bit 0，變成 `1111 1100B`（`FCH`）。"}], "hint": "RL 是循環左旋（頭尾相接的跑馬燈），最左邊擠出去的位元會補回最右邊。"}, {"questionNumber": 157, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "在單向霹靂燈程式中，若只寫 `NEXT: MOV P1, A` → `RL A` → `JMP NEXT` 而「沒有」呼叫任何 `DELAY` 延遲副程式，實際燒錄到實驗板通電後人眼會看到什麼現象？", "answerOptions": [{"text": "因為每個 LED 切換速度太快（僅數個微秒），人眼視覺暫留會看到 8 顆 LED 同時微亮，完全看不出單燈移動閃爍的效果", "isCorrect": true, "rationale": "正確！同學筆記第 9 頁明確寫出：「組合語言每個 LED 只能亮 5 個機械週期（5μs）... But 此程式無 Delay，看不見閃爍」。"}, {"text": "8051 晶片會因為沒有延遲指令而當機停止", "isCorrect": false, "rationale": "CPU 不會當機，只是執行速度遠超人眼反應速度（約 1/24 秒）。"}, {"text": "8 顆 LED 會每隔 1 秒鐘慢速移動一次", "isCorrect": false, "rationale": "要加上約 0.1~0.2 秒的延遲副程式才能讓肉眼看清楚移動。"}, {"text": "只有 D0 會亮，其他 7 顆完全不會通電", "isCorrect": false, "rationale": "CPU 依然高速執行 `RL A`，每個接腳都會輪流輸出低電位。"}], "hint": "12MHz 下執行一圈迴圈只要 5 微秒（每秒跑 20 萬圈），人眼根本跟不上！"}, {"questionNumber": 158, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "在 Lab 1 機械碼對照表中，指令「JMP START」（跳轉至位址 `0009H`）翻譯成的 3 Bytes 機械碼為 `02 00 09`，而指令「MOV SP, #30H」翻譯成的 3 Bytes 機械碼為 `75 81 30`，請問其中的 `75` 與 `81` 分別代表什麼？", "answerOptions": [{"text": "`75` 是程式結束碼；`81` 是中斷向量位址", "isCorrect": false, "rationale": "不是結束碼或中斷向量。"}, {"text": "`75` 是 `MOV direct, #immed` 的運算碼（Opcode）；`81` 是堆疊指標 `SP` 在 SFR 中的直接位址（81H）", "isCorrect": true, "rationale": "正確！同學筆記第 10 頁清楚標註：「75：搬移指令（MOV direct, #immed），把常數 30H 搬到資料記憶體 81H（SP Address）」。"}, {"text": "`75` 是十進位數字 75；`81` 是十進位數字 81", "isCorrect": false, "rationale": "75H 與 81H 是十六進位機械碼，不是十進位數字。"}, {"text": "`75` 是暫存器 R5；`81` 是累加器 A", "isCorrect": false, "rationale": "R5 不是 75H，累加器 A 的位址是 E0H。"}], "hint": "對照同學筆記第 10 頁頂端機械碼表第 3 列與第 24 頁指令集表：`MOV direct, #immed` 的 Opcode 正是 `75`。"}, {"questionNumber": 159, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "在雙向霹靂燈（單燈左移到底再右移回來）的程式設計中，除了使用查表法外，另一種寫法是利用「CJNE A, #01111111B, Left_Rotate」與「CJNE A, #11111110B, Right_Rotate」來判斷燈號是否已經跑到最左端（D7 亮）或最右端（D0 亮），請問這兩行指令的作用為何？", "answerOptions": [{"text": "用來關閉 Port 1 的輸出功能", "isCorrect": false, "rationale": "不會關閉 Port 1。"}, {"text": "用來產生 20ms 的硬體計時器中斷", "isCorrect": false, "rationale": "與計時器中斷無關。"}, {"text": "當亮燈還沒移到邊界時，條件不相等便繼續往同方向旋轉；一旦相等（到達邊界），就不跳躍而往下切換成反方向旋轉", "isCorrect": true, "rationale": "正確！同學筆記第 10 頁右上角與你的筆記第 42 頁皆記錄了這個雙向巡迴判斷邏輯：`0111 1111B` 代表 D7 亮（最左端），`1111 1110B` 代表 D0 亮（最右端）。"}, {"text": "強制把累加器 A 的值清除為 00H", "isCorrect": false, "rationale": "CJNE 只做比較與跳躍，不會改寫累加器 A 的數值。"}], "hint": "`CJNE` = 比較「若不相等就跳躍」，所以只要還沒撞到牆壁（邊界），就繼續往前走！"}, {"questionNumber": 160, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "分析實驗課程的三層巢狀延遲副程式（12 MHz 晶振，1 機械週期 = 1 μs）：\n`DELAY: MOV R6, #40`\n`DEL: MOV R7, #248`\n`DJNZ R7, $`\n`DJNZ R6, DEL`\n`DJNZ R5, DELAY`\n`RET`\n請問最內層指令「DJNZ R7, $」（執行時間 2 機械週期）在 R5 = 1 時總共會執行幾次？消耗多少微秒？", "answerOptions": [{"text": "執行 40 次，消耗 80 μs", "isCorrect": false, "rationale": "40 次是 `DJNZ R6, DEL` 本身的執行次數。"}, {"text": "執行 248 × 40 = 9,920 次，消耗 9,920 × 2 μs = 19,840 μs", "isCorrect": true, "rationale": "正確！外圈 `R6` 跑 40 次，每次進入內圈 `R7` 都會從 248 減到 0（執行 248 次），每次 `DJNZ` 需 2 μs，因此 $248 \\times 40 \\times 2\\text{ }\\mu\\text{s} = 19,840\\text{ }\\mu\\text{s}$。"}, {"text": "執行 248 × 40 × 248 次，消耗 2,460,160 μs", "isCorrect": false, "rationale": "沒有第三個 248 迴圈。"}, {"text": "執行 248 次，消耗 248 μs", "isCorrect": false, "rationale": "忽略了外層 `R6 = 40` 的重複次數與 `DJNZ` 為 2 個機械週期。"}], "hint": "對照你的筆記第 40 頁白板算式：`1 + 40 + 248×40×2 + 40×2 + 2 = 19,963 μs ≈ 20 ms`。"}, {"questionNumber": 161, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "承上題，當主程式設定「MOV R5, #10」並呼叫 `CALL DELAY` 時，整段延遲副程式所產生的總延遲時間大約為多少？", "answerOptions": [{"text": "約 10 μs", "isCorrect": false, "rationale": "10 μs 遠小於實際延遲。"}, {"text": "約 200 ms（0.2 秒，計算：10 × 19,963 μs + 2 μs ≈ 200 ms）", "isCorrect": true, "rationale": "正確！R5 = 1 時約為 19.963 ms ≈ 20 ms；當 `R5 = 10` 時，總延遲時間即為 $10 \\times 20\\text{ ms} = 200\\text{ ms} = 0.2\\text{ 秒}$。"}, {"text": "約 20 ms（0.02 秒）", "isCorrect": false, "rationale": "20 ms 是 `R5 = 1` 時的延遲時間。"}, {"text": "約 2 秒（2,000 ms）", "isCorrect": false, "rationale": "要讓延遲變成 2 秒，`R5` 必須設為 `#100`。"}], "hint": "筆記上寫明公式：`Delay Time = R5 × 20 ms`。"}, {"questionNumber": 162, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "在 Ch1 與 Ch2 投影片範例（`ch1.asm`、`Ch2-1.asm`）中，延遲副程式寫成：\n`DELAY: MOV R7, #200`\n`D1: MOV R6, #250`\n`DJNZ R6, $`\n`DJNZ R7, D1`\n`RET`\n若晶振為 12 MHz，這段兩層迴圈延遲副程式的總時間約為多少？", "answerOptions": [{"text": "約 1 秒（1000 ms）", "isCorrect": false, "rationale": "1 秒需要 1,000,000 μs。"}, {"text": "約 0.1 秒（100 ms，計算：200 × 250 × 2 μs = 100,000 μs = 0.1 s）", "isCorrect": true, "rationale": "正確！Ch2 投影片第 36 頁註解直接寫明：`DELAY: ; 延遲副程式 (0.1 秒)`，因為 $200 \\times 250 \\times 2\\text{ }\\mu\\text{s} = 100,000\\text{ }\\mu\\text{s} = 0.1\\text{ 秒}$。"}, {"text": "約 50 秒", "isCorrect": false, "rationale": "計算數量級錯誤。"}, {"text": "約 0.01 秒（10 ms）", "isCorrect": false, "rationale": "10 ms 為 10,000 μs。"}], "hint": "計算 $200 \\times 250 \\times 2\\text{ }\\mu\\text{s} = 100,000\\text{ }\\mu\\text{s}$。"}, {"questionNumber": 163, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "在查表法霹靂燈實驗（2026/11/11 講義）中，表格定義為 `TABLE: DB 07EH, 0BDH, 0DBH, 0E7H, 0DBH, 0BDH`（共 6 筆資料），主程式用 `INC R0` 與 `CJNE R0, #6, NEXT` 控制索引，當 `R0` 遞增變成 `6` 時會執行什麼動作？", "answerOptions": [{"text": "將 8051 晶片重新 Reset", "isCorrect": false, "rationale": "不會觸發系統 Reset。"}, {"text": "條件相等不跳躍，往下執行 `MOV R0, #00H` 將索引歸零，再跳回 `NEXT` 從表格第 0 筆重新循環閃爍", "isCorrect": true, "rationale": "正確！表格只有 0 ~ 5 共 6 筆資料，當 `R0` 加到 6 時，`CJNE R0, #6, NEXT` 判定相等而不跳躍，緊接著執行 `MOV R0, #00H` 歸零並 `JMP NEXT`，防止越界讀取到表格後面的 `X` 未知記憶體！"}, {"text": "讀取表格第 6 筆（表格外的未知記憶體資料）並輸出到 P1", "isCorrect": false, "rationale": "正是為了避免讀取表格外的未知資料（你的筆記第 45 頁白板在第 5 筆下方特別畫了一個 `X` 問號！），才要在 R0=6 時歸零。"}, {"text": "直接停止執行並關閉所有 LED", "isCorrect": false, "rationale": "不會停止執行。"}], "hint": "觀察你的筆記第 45 頁白板程式記憶體圖：0~5 格放著 6 筆資料，第 6 格畫了一個大大的 `X`！"}, {"questionNumber": 164, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "在你的筆記第 24~25 頁「8051 指令集」抄錄中，關於乘法指令「MUL AB」與除法指令「DIV AB」的執行時間與結果存放位置，下列敘述何者正確？", "answerOptions": [{"text": "MUL AB 結果全部存放在 DPTR 中；DIV AB 商數存放在 R0 中", "isCorrect": false, "rationale": "結果是放在 A 與 B 暫存器，不是 DPTR 或 R0。"}, {"text": "兩者執行時間皆為 1 個機械週期；除法餘數會被直接丟棄不保留", "isCorrect": false, "rationale": "乘除法是 8051 中執行週期最長的指令，需要 4 個機械週期（12MHz 下為 4 μs），且除法會保留餘數在 B。"}, {"text": "兩者長度皆為 1 Byte、執行時間皆為 4 個機械週期；MUL AB 結果高位在 B、低位在 A；DIV AB 商數在 A、餘數在 B（若除數 B=0 則 OV=1）", "isCorrect": true, "rationale": "正確！8051 具備單指令硬體乘除法（1 Byte，4 Cycles）：`MUL AB` 計算 $BA = A \\times B$；`DIV AB` 計算商數存入 `A`、餘數存入 `B`，除以零時溢位旗標 `OV = 1`。"}, {"text": "8051 沒有硬體乘除法指令，必須全部用加法迴圈自己寫", "isCorrect": false, "rationale": "8051 內建 `MUL AB`（Opcode A4H）與 `DIV AB`（Opcode 84H）。"}], "hint": "參考你的筆記第 25 頁指令表：`MUL AB`（1 Byte, 4 Cycle）、`DIV AB`（1 Byte, 4 Cycle）。"}, {"questionNumber": 165, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "在你的筆記第 25 頁指令表中，指令「DA A」（Decimal Adjust Accumulator）的用途為何？", "answerOptions": [{"text": "將類比電壓直接轉換成數位資料存入累加器 A", "isCorrect": false, "rationale": "DA 是十進位調整指令，與類比數位轉換無關。"}, {"text": "當累加器進行 BCD（二進位編碼十進位）加法運算（使用 ADD 或 ADDC）後，自動將二進位結果調整修正回合法的 BCD 格式", "isCorrect": true, "rationale": "正確！你的筆記第 25 頁寫道：「DA：累加器進行 BCD 加法運算時，使用二進位加法器（ADD, ADDC）後，將結果調整回 BCD（變換成 BCD 格式，1 Byte，1 Cycle）」。"}, {"text": "將累加器 A 的所有位元全部清除為 0", "isCorrect": false, "rationale": "清除累加器是 `CLR A`。"}, {"text": "將累加器 A 的資料直接輸出到 DAC0800 晶片", "isCorrect": false, "rationale": "與 DAC0800 無關。"}], "hint": "例如十進位 `9 + 1 = 10`，二進位加法會算出 `0AH`，執行 `DA A` 後就會自動進位調整成 BCD 的 `10H`！"}, {"questionNumber": 166, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "在傳統 8051 軟體開發流程中，組譯器 `X8051.EXE` 與連結器 `LINK4.EXE` 各自扮演什麼角色？", "answerOptions": [{"text": "兩者功能完全重複，只需執行其中一個即可直接燒錄", "isCorrect": false, "rationale": "必須先組譯成 `.obj`，再連結配置絕對記憶體位址成 `.tsk` 才能燒錄。"}, {"text": "`X8051.EXE` 是硬體示波器軟體；`LINK4.EXE` 是電路板佈線軟體", "isCorrect": false, "rationale": "兩者皆為軟體編譯連結工具。"}, {"text": "`X8051.EXE` 負責將組合語言原始碼（.asm）翻譯成二進制機械碼目的檔（.obj）；`LINK4.EXE` 負責打包並位移各程式碼模組與函式庫（無轉譯行為），產生可燒錄檔（.tsk）", "isCorrect": true, "rationale": "正確！同學筆記第 9 頁右下角流程圖明確區分：「X8051.EXE Assemble 組譯：即翻譯為機械碼（.OBJ）；LINK4.EXE LINK 連結：打包並位移各程式碼及函式庫，無轉譯行為，產生燒錄檔（.tsk）」。"}, {"text": "`X8051.EXE` 負責把 8051 晶片燒毀；`LINK4.EXE` 負責將 `.tsk` 檔反編譯回 C 語言", "isCorrect": false, "rationale": "敘述錯誤。"}], "hint": "組譯器負責「翻譯語言」，連結器負責「整併打包與位址重定位」。"}, {"questionNumber": 167, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "在 Ch1 投影片第 28 頁「實例演練（步驟 2）」中，在 DOS 命令提示字元下輸入 `avsim51 -c1` 的用途為何？", "answerOptions": [{"text": "從網際網路下載新的作業系統", "isCorrect": false, "rationale": "不是網路下載指令。"}, {"text": "格式化電腦的 C 槽硬碟", "isCorrect": false, "rationale": "不是格式化指令。"}, {"text": "將 8051 的石英晶體頻率設定為 1 MHz", "isCorrect": false, "rationale": "與晶振頻率無關。"}, {"text": "啟動 8051 軟體模擬器（Simulator），在電腦螢幕上模擬暫存器變化與 I/O 接腳電位，不需實體硬體即可測試程式邏輯", "isCorrect": true, "rationale": "正確！Ch1 投影片提到「開發工具部分：包括原始程式的撰寫、組譯、連結，以及軟硬體模擬等」，`avsim51` 即為經典的 8051 指令級軟體模擬器。"}], "hint": "`sim` 就是 Simulator（模擬器）的縮寫。"}, {"questionNumber": 168, "category": "01. 微算機架構與指令週期", "isPastExam": false, "examNo": null, "question": "標準 8051 內建的計時/計數器（Timer 0 與 Timer 1）各自為多少位元的計數器？", "answerOptions": [{"text": "32 位元", "isCorrect": false, "rationale": "不是 32 位元。"}, {"text": "16 位元", "isCorrect": true, "rationale": "正確！8051 內建「兩個 16 位元計時/計數器」（各由高 8 位元 THx 與低 8 位元 TLx 組成）。"}, {"text": "4 位元", "isCorrect": false, "rationale": "不是 4 位元。"}, {"text": "8 位元", "isCorrect": false, "rationale": "單一暫存器 THx 或 TLx 是 8 位元，但合起來是一個 16 位元計時器。"}], "hint": "最大計數值可達 65,536，所以是 $2^{16}$ 位元。"}, {"questionNumber": 169, "category": "01. 微算機架構與指令週期", "isPastExam": false, "examNo": null, "question": "關於 8051 的輸出入埠規格，下列哪一項描述最精確？", "answerOptions": [{"text": "四組僅能輸出不能輸入的 8 位元埠", "isCorrect": false, "rationale": "四組埠皆具備輸入與輸出雙向功能。"}, {"text": "四組可位元定址的 8 位元雙向輸出入埠（P0、P1、P2、P3），共 32 支 I/O 接腳", "isCorrect": true, "rationale": "正確！Ch1 規格表明確指出：「四組可位元定址的 8 位元輸出入埠，即 P0、P1、P2 及 P3」。"}, {"text": "兩組不可位元定址的 16 位元輸出入埠", "isCorrect": false, "rationale": "P0~P3 全部都支援位元定址（如 `SETB P1.0`、`CLR P2.7`）。"}, {"text": "八組 4 位元類比輸入埠", "isCorrect": false, "rationale": "標準 8051 沒有內建類比輸入埠。"}], "hint": "4 組 × 每組 8 bits = 32 支 I/O 腳，且每一支腳都能用 `SETB Px.y` 單獨控制。"}, {"questionNumber": 170, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "在 PDIP-40 封裝的 8051 接腳圖中，Port 1（P1.0 ~ P1.7）位於晶片的哪一側、第幾支接腳？", "answerOptions": [{"text": "右側下方，Pin 21 ~ Pin 28", "isCorrect": false, "rationale": "Pin 21 ~ Pin 28 是 Port 2（P2.0 ~ P2.7）。"}, {"text": "左側上方，Pin 1 ~ Pin 8", "isCorrect": true, "rationale": "正確！Pin 1 為 P1.0，依序往下至 Pin 8 為 P1.7，緊接著 Pin 9 為 RST。"}, {"text": "右側上方，Pin 32 ~ Pin 39", "isCorrect": false, "rationale": "Pin 32 ~ Pin 39 是 Port 0（P0.7 ~ P0.0，注意是由上往下編號遞減）。"}, {"text": "左側下方，Pin 10 ~ Pin 17", "isCorrect": false, "rationale": "Pin 10 ~ Pin 17 是 Port 3（P3.0 ~ P3.7）。"}], "hint": "晶片左上角第 1 支腳開始就是 P1.0 ~ P1.7。"}, {"questionNumber": 171, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "在 PDIP-40 封裝的 8051 接腳圖中，Port 0（P0.0 ~ P0.7）的接腳編號順序為何？", "answerOptions": [{"text": "Pin 39 為 P0.0，往下遞減至 Pin 32 為 P0.7", "isCorrect": true, "rationale": "正確！右上角 Pin 40 是 VCC，緊接著往下 Pin 39 是 P0.0(AD0)、Pin 38 是 P0.1(AD1)... 直到 Pin 32 是 P0.7(AD7)。"}, {"text": "Pin 21 為 P0.0，往下遞增至 Pin 28 為 P0.7", "isCorrect": false, "rationale": "Pin 21 ~ Pin 28 是 Port 2。"}, {"text": "Pin 1 為 P0.0，往下遞增至 Pin 8 為 P0.7", "isCorrect": false, "rationale": "Pin 1 ~ Pin 8 是 Port 1。"}, {"text": "Pin 32 為 P0.0，往下遞增至 Pin 39 為 P0.7", "isCorrect": false, "rationale": "Port 0 的編號在右側是由上往下從 0 排到 7（即 Pin 39 到 Pin 32）。"}], "hint": "觀察接腳圖右上角：Pin 40 是 VCC，下面一格 Pin 39 就是 `P0.0(AD0)`。"}, {"questionNumber": 172, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "在 8051 外部記憶體控制接腳中，哪三支接腳專門負責外部記憶體的存取與位址栓鎖控制？", "answerOptions": [{"text": "RXD（Pin 10）、TXD（Pin 11）、INT0（Pin 12）", "isCorrect": false, "rationale": "這三支是串列通訊與外部中斷接腳。"}, {"text": "XTAL1（Pin 19）、XTAL2（Pin 18）、RST（Pin 9）", "isCorrect": false, "rationale": "這三支是時脈與重置接腳。"}, {"text": "T0（Pin 14）、T1（Pin 15）、GND（Pin 20）", "isCorrect": false, "rationale": "這三支是計時器外部輸入與接地接腳。"}, {"text": "PSEN（Pin 29）、ALE/PROG（Pin 30）、EA/VPP（Pin 31）", "isCorrect": true, "rationale": "正確！這三支位於右側中間（Pin 29、30、31）的接腳專司外部程式記憶體致能、位址栓鎖與內外部程式切換。"}], "hint": "三支腳在接腳圖右側剛好排在一起：29（PSEN）、30（ALE）、31（EA）。"}, {"questionNumber": 173, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": false, "examNo": null, "question": "在 8051 中，16 位元資料指標暫存器「DPTR」（Data Pointer）是由哪兩個 8 位元特殊功能暫存器組合而成的？", "answerOptions": [{"text": "TH0（位址 8CH）與 TL0（位址 8AH）", "isCorrect": false, "rationale": "TH0 與 TL0 是 Timer 0 的高低位元組。"}, {"text": "PCH 與 PCL", "isCorrect": false, "rationale": "PCH 與 PCL 是程式計數器 PC 的高低位元組。"}, {"text": "ACC（位址 E0H）與 B（位址 F0H）", "isCorrect": false, "rationale": "ACC 與 B 是算術運算暫存器。"}, {"text": "DPH（高位元組，位址 83H）與 DPL（低位元組，位址 82H）", "isCorrect": true, "rationale": "正確！同學筆記第 11 頁與你的筆記第 6 頁皆畫出 DPTR 由高 8 位元 `DPH` 與低 8 位元 `DPL` 組成，可當成一個 16 位元指標（`MOV DPTR, #TABLE`）或分開存取。"}], "hint": "DPTR = Data Pointer，H = High（高位元組），L = Low（低位元組）。"}, {"questionNumber": 174, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": false, "examNo": null, "question": "在查表法霹靂燈程式中，若符號 `TABLE` 位於程式記憶體的 `0138H` 位址，執行 `MOV DPTR, #TABLE` 後，請問 `DPH` 與 `DPL` 的內容分別為何？", "answerOptions": [{"text": "DPH = 01H，DPL = 38H", "isCorrect": true, "rationale": "正確！同學筆記第 11 頁直接畫出此例：`DPTR = 0138H`，其中高位元組 `DPH = 01H`，低位元組 `DPL = 38H`。"}, {"text": "DPH = 38H，DPL = 01H", "isCorrect": false, "rationale": "高低位元組寫反了（8051 暫存器為大端序邏輯：DPH 存高 Byte、DPL 存低 Byte）。"}, {"text": "DPH = 00H，DPL = 00H", "isCorrect": false, "rationale": "不是 00H。"}, {"text": "DPH = 01H，DPL = 00H", "isCorrect": false, "rationale": "低位元組應為 38H。"}], "hint": "高 8 位元（01H）放 `DPH`，低 8 位元（38H）放 `DPL`。"}, {"questionNumber": 175, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": false, "examNo": null, "question": "在 8051 內部資料記憶體中，當不切換 PSW 的 RS1、RS0 位元（維持 Reset 預設 `RS1=0, RS0=0`）時，組合語言中的 `R0` ~ `R7` 預設對應到哪一段 RAM 位址？", "answerOptions": [{"text": "RB1（08H ~ 0FH）", "isCorrect": false, "rationale": "RB1 需設定 `RS1=0, RS0=1`。"}, {"text": "RB0（00H ~ 07H）", "isCorrect": true, "rationale": "正確！Reset 後 PSW 全部清零（`RS1=0, RS0=0`），預設使用第 0 組暫存器庫 RB0，位址為 `00H ~ 07H`。"}, {"text": "RB3（18H ~ 1FH）", "isCorrect": false, "rationale": "RB3 需設定 `RS1=1, RS0=1`。"}, {"text": "RB2（10H ~ 17H）", "isCorrect": false, "rationale": "RB2 需設定 `RS1=1, RS0=0`。"}], "hint": "Reset 後所有暫存器位元預設為 0，所以選中的是第 0 號暫存器庫。"}, {"questionNumber": 176, "category": "04. I/O埠與硬體介面電路", "isPastExam": false, "examNo": null, "question": "在開發板電路圖（U11: ADC0804 DIP20）中，第 4 腳 `CLKR` 與第 19 腳 `CLKIN` 之間連接了一個 10KΩ 電阻（R12）與一顆 150pF 電容（C11）到地，其作用為何？", "answerOptions": [{"text": "用來產生 8051 的系統 Reset 訊號", "isCorrect": false, "rationale": "與 8051 Reset 無關。"}, {"text": "用來調整類比輸入電壓的放大倍率", "isCorrect": false, "rationale": "放大倍率是由 `VREF/2`（Pin 9）決定的。"}, {"text": "利用 ADC0804 內建的施密特觸發振盪器搭配外部 RC 元件產生轉換所需的內部工作時脈（約 640 kHz）", "isCorrect": true, "rationale": "正確！ADC0804 內建時脈產生器，只需外接一顆電阻（10KΩ）與一顆電容（150pF）即可自激振盪產生轉換時脈（$f_{CLK} \\approx \\frac{1}{1.1 RC} \\approx 606\\text{ kHz}$），不需外接石英晶體。"}, {"text": "作為 UART 串列通訊的鮑率產生器", "isCorrect": false, "rationale": "ADC0804 是平行資料輸出介面，非 UART。"}], "hint": "接腳名稱上的 `CLK` 就是 Clock（時脈）的縮寫。"}, {"questionNumber": 177, "category": "04. I/O埠與硬體介面電路", "isPastExam": false, "examNo": null, "question": "在開發板電路圖（U14: DAC0800 DIP16）中，電路板上設計了一個單刀雙擲開關 `SW3`（標示 `UniPolar / BiPolar`），用來切換 DAC0800 經運算放大器後的類比電壓輸出範圍，請問兩者有何不同？", "answerOptions": [{"text": "兩者輸出波形完全一模一樣，只是開關名稱不同", "isCorrect": false, "rationale": "單極性（Uni-）只有正電壓，雙極性（Bi-）有正有負。"}, {"text": "UniPolar 用於連接印表機；BiPolar 用於連接鍵盤", "isCorrect": false, "rationale": "與印表機或鍵盤無關。"}, {"text": "UniPolar（單極性）輸出僅為單一極性電壓（例如 0V ~ +5V）；BiPolar（雙極性）輸出包含正負雙極性電壓（例如 -5V ~ +5V）", "isCorrect": true, "rationale": "正確！DAC0800 搭配外部運算放大器（如 U16 LM741/LF356）與參考電壓偏置電路，透過 SW3 可切換為 0~5V 單極性輸出或 -5V~+5V 雙極性交流波形輸出。"}, {"text": "UniPolar 代表只能輸出數位 0 與 1；BiPolar 代表輸出類比電流", "isCorrect": false, "rationale": "DAC 輸出皆為連續類比訊號。"}], "hint": "字首 `Uni-` 代表單一（單極性），`Bi-` 代表雙重（雙極性，有正也有負）。"}, {"questionNumber": 178, "category": "05. 計時與計數器 Timer", "isPastExam": false, "examNo": null, "question": "若要讓 8051 的 Timer 0 開始計數，除了在 `TMOD` 設定工作模式與填入 `TH0`/`TL0` 初值外，還必須執行哪一道位元控制指令啟動計時器（假設 `GATE = 0`）？", "answerOptions": [{"text": "SETB TF0（將溢位旗標設為 1）", "isCorrect": false, "rationale": "`TF0` 是計數溢位時由硬體自動設為 1 的「溢位旗標」，設為 1 並不會啟動計時器。"}, {"text": "SETB TR0（將 TCON 暫存器中的 Timer 0 Run 控制位元設為 1）", "isCorrect": true, "rationale": "正確！`TR0`（Timer 0 Run Control Bit，位於 TCON.4）為計時器啟動開關，執行 `SETB TR0` 才會開始計數，執行 `CLR TR0` 則暫停計數。"}, {"text": "CLR TR0（將啟動位元清為 0）", "isCorrect": false, "rationale": "`CLR TR0` 是停止計時器。"}, {"text": "SETB EA（開啟中斷總開關即可自動啟動計時器）", "isCorrect": false, "rationale": "`EA` 只控制是否允許產生中斷，不會啟動計時器計數。"}], "hint": "`TR0` = Timer 0 Run（讓 Timer 0 跑起來）。"}, {"questionNumber": 179, "category": "05. 計時與計數器 Timer", "isPastExam": false, "examNo": null, "question": "8051 的計時器模式「Mode 3（雙 8-bit 計時器模式）」具備哪一項特殊硬體限制？", "answerOptions": [{"text": "只有 Timer 0 支援 Mode 3（將 TL0 與 TH0 拆成兩個獨立的 8 位元計時器，其中 TH0 借用 Timer 1 的 TR1 與 TF1 控制位元），而 Timer 1 設為 Mode 3 時會停止計數", "isCorrect": true, "rationale": "正確！這是 8051 計時器架構的經典特性：Timer 0 進入 Mode 3 時分裂為兩個獨立的 8-bit 計時器（TL0 與 TH0），而 Timer 1 設為 Mode 3 則等效於關閉計數。"}, {"text": "只有 Timer 1 支援 Mode 3，Timer 0 不支援", "isCorrect": false, "rationale": "支援分裂的是 Timer 0，不是 Timer 1。"}, {"text": "Mode 3 可以串接成 32 位元超長計時器", "isCorrect": false, "rationale": "是分裂成兩個 8-bit，不是串接成 32-bit。"}, {"text": "Mode 3 只能在外部晶振 1 MHz 下使用", "isCorrect": false, "rationale": "與晶振頻率無關。"}], "hint": "只有 0 號計時器（Timer 0）可以一分為二成兩個 8-bit 計時器。"}, {"questionNumber": 180, "category": "06. 中斷系統與解彈跳", "isPastExam": false, "examNo": null, "question": "在 8051 中，如果多個中斷源在同一時間點同時發生請求（假設皆維持預設優先權，未修改 IP 暫存器），CPU 會依照哪一個固定優先權順序（由高到低）依序服務？", "answerOptions": [{"text": "INT0 → INT1 → Timer 0 → Timer 1 → UART", "isCorrect": false, "rationale": "Timer 0（000BH）排在 INT1（0013H）前面，優先權高於 INT1。"}, {"text": "UART → Timer 1 → INT1 → Timer 0 → INT0", "isCorrect": false, "rationale": "順序完全相反。"}, {"text": "Timer 0 → Timer 1 → INT0 → INT1 → UART", "isCorrect": false, "rationale": "外部中斷 INT0 優先權最高。"}, {"text": "INT0 → Timer 0 → INT1 → Timer 1 → UART", "isCorrect": true, "rationale": "正確！預設硬體查詢優先權順序完全等同於中斷向量位址由低到高的排列順序：`0003H (INT0) > 000BH (T0) > 0013H (INT1) > 001BH (T1) > 0023H (UART)`。"}], "hint": "中斷向量位址越靠前面（數字越小）的，預設優先權就越高！"}, {"questionNumber": 181, "category": "06. 中斷系統與解彈跳", "isPastExam": false, "examNo": null, "question": "若在程式中需要讓「串列通訊中斷（UART）」擁有高優先權，甚至可以打斷正在執行的外部中斷 `INT0`，程式設計者應設定哪一個特殊功能暫存器（SFR）？", "answerOptions": [{"text": "SCON（Serial Control，位址 98H）", "isCorrect": false, "rationale": "SCON 是串列埠工作模式控制暫存器。"}, {"text": "IP（Interrupt Priority，中斷優先權暫存器，位址 B8H）", "isCorrect": true, "rationale": "正確！8051 具有兩層中斷優先權架構，透過設定 `IP` 暫存器中對應的位元（如 `SETB PS`），可將特定中斷提升為高優先權，實現中斷巢狀（Interrupt Nesting）。"}, {"text": "PSW（Program Status Word，位址 D0H）", "isCorrect": false, "rationale": "PSW 是算術旗標與暫存器庫選擇暫存器。"}, {"text": "IE（Interrupt Enable，中斷致能暫存器，位址 A8H）", "isCorrect": false, "rationale": "IE 只能控制中斷的「開啟或關閉」，不能改變優先權高低。"}], "hint": "英文全名 Interrupt Priority（中斷優先權）的縮寫。"}, {"questionNumber": 182, "category": "07. 串列通訊 UART 與 RS-232", "isPastExam": false, "examNo": null, "question": "在你的筆記第 30~32 頁介紹資料交換技術時，比較了「電路交換（Circuit Switching）」與「分封交換（Packet Switching）」的差異，下列敘述何者正確？", "answerOptions": [{"text": "電路交換（如傳統 PSTN 電話網路）在通話期間會獨佔一條專屬實體通道；分封交換（如網際網路 Internet）則將資料切成多個封包（Packet）加上標頭各自路由傳輸，頻寬共享利用率高", "isCorrect": true, "rationale": "正確！傳統撥號電話使用電路交換（保證固定延遲但沒講話時頻道也佔著浪費）；網際網路使用分封交換（將資料切塊封裝，按需求動態共享線路）。"}, {"text": "兩者是完全相同的技術名稱", "isCorrect": false, "rationale": "兩者為通訊網路兩大核心交換架構。"}, {"text": "傳統家用有線電話是採用分封交換；網際網路是採用電路交換", "isCorrect": false, "rationale": "舉例對象完全顛倒。"}, {"text": "電路交換不需要建立連線；分封交換在閒置時也會獨佔整條海底電纜", "isCorrect": false, "rationale": "兩者特性完全顛倒。"}], "hint": "打傳統市話時一條線專屬於你跟對方；上網傳 LINE 訊息則是切成一包一包在網路上共用道路。"}, {"questionNumber": 183, "category": "07. 串列通訊 UART 與 RS-232", "isPastExam": false, "examNo": null, "question": "在同學筆記第 8 頁紅外線遙控器接收電路中，紅外線接收模組（IR Receiver）輸出端常接一顆「4584」（六反相史密特觸發器 Schmitt Trigger），其主要功能為何？", "answerOptions": [{"text": "將 5V 直流電升壓成 220V 交流電", "isCorrect": false, "rationale": "4584 是低電壓 CMOS 邏輯閘，不是升壓器。"}, {"text": "用來產生 12 MHz 的石英晶體振盪", "isCorrect": false, "rationale": "不是晶振元件。"}, {"text": "將帶有雜訊或邊緣緩慢變化的類比/失真波形整形成乾淨俐落的數位方波訊號送入微控制器", "isCorrect": true, "rationale": "正確！史密特觸發器（Schmitt Trigger，如 74HC14 或 CD4584）具有遲滯（Hysteresis）特性，能有效消除訊號雜訊與振鈴，將微弱或變形的接收波整形成標準數位脈波。"}, {"text": "用來儲存 64KB 的 MP3 音樂檔案", "isCorrect": false, "rationale": "4584 沒有記憶體功能。"}], "hint": "「史密特觸發器（Schmitt Trigger）」在數位邏輯中的招牌功能就是「波形整形（Wave Shaping）與抗雜訊」。"}, {"questionNumber": 184, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "在你的筆記第 22 頁列出 `Test.bat` 批次檔的自動化編譯連結指令內容，除了組譯器 `X8051` 與連結器 `LINK` 之外，為什麼作者在批次檔第一行加上 `@echo off`？", "answerOptions": [{"text": "關閉 8051 的所有中斷", "isCorrect": false, "rationale": "與 8051 中斷無關。"}, {"text": "刪除電腦裡所有的 `.asm` 檔案", "isCorrect": false, "rationale": "不會刪除任何檔案。"}, {"text": "開啟串列埠 UART 的 Echo 迴音功能", "isCorrect": false, "rationale": "批次檔的 `@echo off` 是給 Windows/DOS 命令列看的，不是設定 UART。"}, {"text": "關閉命令提示字元（DOS）逐行顯示指令本身的文字輸出，讓編譯過程的畫面更乾淨易讀", "isCorrect": true, "rationale": "正確！在 Windows/DOS 批次檔（`.bat`）中，`@echo off` 的作用是隱藏指令本身在終端機視窗的回顯，只顯示程式執行的錯誤訊息或結果。"}], "hint": "這是 Windows `.bat` 批次檔第一行最常見的指令。"}, {"questionNumber": 185, "category": "01. 微算機架構與指令週期", "isPastExam": false, "examNo": null, "question": "在微處理機的指令週期五步驟「Fetch → Decode → Fetch Operand → Execute → Write Back」中，若執行的是單純暫存器清零指令「CLR A」（1 Byte），哪一個步驟實際上不需要額外去記憶體抓取資料？", "answerOptions": [{"text": "Execute（執行，因為 ALU 不用做任何動作）", "isCorrect": false, "rationale": "Execute 階段負責將累加器 A 清零。"}, {"text": "Decode（解碼，因為 CPU 不用分辨這是什麼指令）", "isCorrect": false, "rationale": "任何指令都必須經過 Decode 解碼。"}, {"text": "Fetch（提取指令，因為 CPU 不用讀取指令碼）", "isCorrect": false, "rationale": "任何指令都必須先經過 Fetch 從程式記憶體讀取機械碼（CLR A 為 E4H）。"}, {"text": "Fetch Operand（提取運算元，因為運算對象就是內部累加器 A）", "isCorrect": true, "rationale": "正確！因為目的運算元就在 CPU 內部的累加器 A 中，解碼後不需再去外部或內部記憶體提取運算元（Fetch Operand）。"}], "hint": "「Operand」就是運算元（資料），如果資料已經在累加器 A 裡面，就不用再跑一趟去抓資料了。"}, {"questionNumber": 186, "category": "01. 微算機架構與指令週期", "isPastExam": false, "examNo": null, "question": "關於 8051 與現代 32 位元微控制器（如筆記中提到的 STM32 ARM Cortex-M）在架構上的比較，下列敘述何者正確？", "answerOptions": [{"text": "兩者都是 64 位元超純量處理器", "isCorrect": false, "rationale": "兩者皆非 64 位元處理器。"}, {"text": "8051 為 32 位元 RISC 架構；STM32 為 8 位元 CISC 架構", "isCorrect": false, "rationale": "兩者架構剛好寫反了。"}, {"text": "8051 為 8 位元 CISC 架構（指令長度 1~3 Bytes）；STM32 為 32 位元 RISC 架構（指令長度規則固定）", "isCorrect": true, "rationale": "正確！同學筆記第 3 頁明確對比了 `8051（CISC）` 與 `ARM（RISC，如 STM32、RISC-V）` 的指令長度與解碼差異。"}, {"text": "兩者都是 8 位元 CISC 架構", "isCorrect": false, "rationale": "STM32 是 32 位元 ARM RISC 架構。"}], "hint": "8051 是經典 8 位元 CISC，ARM / RISC-V 則是現代主流 32 位元 RISC。"}, {"questionNumber": 187, "category": "01. 微算機架構與指令週期", "isPastExam": false, "examNo": null, "question": "標準 8051 晶片內部整合了哪些周邊硬體資源？（請選出規格完全正確的組合）", "answerOptions": [{"text": "4K Bytes ROM、128 Bytes RAM、2 組 8 位元 I/O 埠、1 個 8 位元計時器、1 組半雙工 UART、2 個中斷源", "isCorrect": false, "rationale": "I/O 埠、計時器與中斷數量皆低於標準 8051。"}, {"text": "4K Bytes ROM、128 Bytes RAM、4 組 8 位元 I/O 埠、2 個 16 位元計時器、1 組全雙工 UART、5 個中斷源", "isCorrect": true, "rationale": "正確！這正是 Ch1 投影片第 4 頁「8051 之規格」所列出的標準 8051 完整硬體配置。"}, {"text": "64K Bytes ROM、64K Bytes RAM、8 組 8 位元 I/O 埠、4 個 32 位元計時器、2 組 USB、16 個中斷源", "isCorrect": false, "rationale": "這是過度誇大的錯誤規格。"}, {"text": "8K Bytes ROM、256 Bytes RAM、4 組 8 位元 I/O 埠、3 個 16 位元計時器、1 組全雙工 UART、6 個中斷源", "isCorrect": false, "rationale": "這是「8052（52 類）」的規格，不是標準 8051。"}], "hint": "標準 8051 是：4K ROM、128B RAM、4 個 Port、2 個 Timer、1 個 UART、5 個中斷。"}, {"questionNumber": 188, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "在 8051 系統中，若程式設計師把第 31 腳 `EA/VPP` 接至 +5V（VCC），但撰寫的程式碼總長度達到了 `6K Bytes`（超過內部 4K ROM 容量），請問 8051 在執行完位址 `0000H ~ 0FFFH`（前 4K）的指令後會發生什麼事？", "answerOptions": [{"text": "CPU 會自動切換到外部程式記憶體，繼續從外部位址 `1000H ~ 17FFH` 讀取剩餘的 2K 程式碼執行", "isCorrect": true, "rationale": "正確！當 EA = 1（+5V）時，位址 `0000H ~ 0FFFH` 讀取內部 4K ROM；一旦程式計數器 PC 超過 `0FFFH`（到達 `1000H` 以上），硬體會自動啟動 `PSEN` 轉向外部 ROM 讀取指令。"}, {"text": "CPU 會把多出來的 2K 程式碼自動寫入內部 RAM", "isCorrect": false, "rationale": "程式碼不會寫入內部 RAM。"}, {"text": "CPU 會直接當機並燒毀內部 ROM", "isCorrect": false, "rationale": "不會當機或燒毀。"}, {"text": "CPU 會忽略超過 4K 的程式碼，直接跳回 0000H", "isCorrect": false, "rationale": "不會忽略超過 4K 的部分。"}], "hint": "EA = 1 代表「內部 4K 優先，不夠的自動去外面抓」！"}, {"questionNumber": 189, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "在開發板電路圖（U1: AT89C51）中，第 30 腳 `ALE/PROG` 在正常執行程式（未燒錄內部 Flash）時，即使沒有存取外部記憶體，仍會以石英振盪器頻率的幾分之一持續輸出正脈波？", "answerOptions": [{"text": "1 / 12（即 1 MHz）", "isCorrect": false, "rationale": "1/12 是機械週期的頻率（1 MHz），ALE 每個機械週期輸出兩次，故為 1/6。"}, {"text": "1 / 2（即 6 MHz）", "isCorrect": false, "rationale": "不是 1/2。"}, {"text": "完全不會有任何訊號，永遠維持 0V", "isCorrect": false, "rationale": "只要 8051 晶振正常起振且 Reset 結束，量測 Pin 30 就能看到 2 MHz 的 ALE 方波！"}, {"text": "1 / 6（即每 1 個機械週期輸出 2 次 ALE 脈波，12MHz 晶振時為 2 MHz）", "isCorrect": true, "rationale": "正確！在標準 8051 中，1 個機械週期包含 6 個狀態（S1~S6，共 12 個振盪週期），ALE 會在每個機械週期固定輸出兩次正脈波（頻率為 $f_{osc}/6$），常作為系統是否正常起振的量測指標。"}], "hint": "實務修板子口訣：懷疑 8051 沒起振時，拿示波器量第 30 腳 `ALE`，有看到 1/6 晶振頻率的方波就代表 CPU 活著！"}, {"questionNumber": 190, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "在 8051 硬體基本電路中，為什麼兩顆連接在 XTAL1、XTAL2 與地（GND）之間的陶瓷電容（約 20pF ~ 30pF）必須盡量靠近 8051 晶片接腳焊接？", "answerOptions": [{"text": "為了增加整個電路板的重量", "isCorrect": false, "rationale": "與電路板重量無關。"}, {"text": "為了減少雜散電容與長導線電感干擾，確保石英振盪器穩定起振並維持頻率精準度", "isCorrect": true, "rationale": "正確！高頻（12MHz ~ 24MHz）振盪迴路對寄生電容與電感非常敏感，縮短走線並靠近接腳能確保振盪波形乾淨穩定。"}, {"text": "為了讓陶瓷電容可以兼作發光二極體使用", "isCorrect": false, "rationale": "陶瓷電容不會發光。"}, {"text": "為了防止電源線插反", "isCorrect": false, "rationale": "防止電源接反通常使用串聯二極體或防呆接頭。"}], "hint": "高頻時脈訊號走線越短越好，才能減少寄生雜訊影響振盪頻率。"}, {"questionNumber": 191, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "在 POSR（電源啟動自我重置）電路公式中，若原本使用 $R = 10\\text{k}\\Omega$、$C = 10\\mu\\text{F}$（時間常數 $\\tau = RC = 100\\text{ms}$），今將電容更換為 $C = 22\\mu\\text{F}$，對開機重置動作會產生什麼影響？", "answerOptions": [{"text": "時間常數 $\\tau$ 變大（變成 220ms），開機時 RST 接腳維持高電位重置的時間變長", "isCorrect": true, "rationale": "正確！根據板書公式 $\\tau = RC$，增大電容 C 或電阻 R 都會使充電時間變長，因此 RST 維持在高電位的重置脈波寬度也會變長。"}, {"text": "時間常數變小，開機時無法觸發重置", "isCorrect": false, "rationale": "增大電容會使時間常數變大而非變小。"}, {"text": "RST 接腳會變成低電位重置", "isCorrect": false, "rationale": "極性不會改變。"}, {"text": "8051 的指令執行速度會加快 2.2 倍", "isCorrect": false, "rationale": "重置電容只影響開機重置時間，不影響石英晶振決定的指令執行速度。"}], "hint": "水桶（電容 C）變大，裝滿水（充飽電）所需的時間自然變長！"}, {"questionNumber": 192, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "在實驗室開發板（CH505 教學實驗板）電路圖中，用來下載程式並與電腦溝通的串列通訊介面晶片 `U10` 型號為何？", "answerOptions": [{"text": "6116（2K×8 SRAM）", "isCorrect": false, "rationale": "6116 是靜態記憶體。"}, {"text": "LM7805（5V 穩壓 IC）", "isCorrect": false, "rationale": "LM7805 是三端穩壓器。"}, {"text": "74LS373（八位元栓鎖器）", "isCorrect": false, "rationale": "74LS373 是位址栓鎖器。"}, {"text": "MAX232（TTL 與 RS-232 準位轉換 IC）", "isCorrect": true, "rationale": "正確！8051 的 UART（P3.0/P3.1）輸出的是 0V/+5V TTL 準位，必須透過 `MAX232` 晶片內部的電荷幫浦倍壓轉換成 ±10V 負邏輯的 RS-232 準位，才能與 PC 的 COM Port 連接。"}], "hint": "這顆晶片名字裡直接帶有 `232`！"}, {"questionNumber": 193, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": false, "examNo": null, "question": "在 8051 內部資料記憶體（Internal RAM，00H ~ 7FH）中，若扣掉工作暫存器庫（00H ~ 1FH，共 32 Bytes）與可位元定址區（20H ~ 2FH，共 16 Bytes），剩下的一般用途 RAM 與堆疊區（30H ~ 7FH）總共有多少 Bytes？", "answerOptions": [{"text": "80 Bytes（計算：128 - 32 - 16 = 80 Bytes）", "isCorrect": true, "rationale": "正確！低 128 Bytes（00H ~ 7FH）分為三區：00H~1FH（32B）暫存器庫 + 20H~2FH（16B）位元定址區 + 30H~7FH（80B）一般用途 RAM 與堆疊區，合計 128 Bytes。"}, {"text": "128 Bytes", "isCorrect": false, "rationale": "128 Bytes 是整個低半部內部 RAM 的總和。"}, {"text": "256 Bytes", "isCorrect": false, "rationale": "256 Bytes 是包含 SFR 的總內部定址空間。"}, {"text": "48 Bytes", "isCorrect": false, "rationale": "48 Bytes 是前兩區（32 + 16）加起來的大小。"}], "hint": "計算 $128 - 32 - 16$，或是十六進位 $80\\text{H} - 30\\text{H} = 50\\text{H} = 5 \\times 16 = 80$ Bytes。"}, {"questionNumber": 194, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": false, "examNo": null, "question": "在程式狀態字組暫存器 `PSW` 中，當執行無號數加法「ADD A, B」且結果大於 255（FFH，產生最高位 Bit 7 向外進位）時，哪一個旗標位元會被硬體自動設為 1？", "answerOptions": [{"text": "P（同位旗標 Parity Flag，PSW.0）", "isCorrect": false, "rationale": "P 旗標反映的是累加器 A 裡面 1 的個數是否為奇數（奇同位）。"}, {"text": "RS0（暫存器庫選擇位元 0，PSW.3）", "isCorrect": false, "rationale": "RS0 不會因算術運算結果而改變。"}, {"text": "OV（溢位旗標 Overflow Flag，PSW.2）", "isCorrect": false, "rationale": "OV 用於判斷「有號數」加減法是否溢位。"}, {"text": "CY（進位旗標 Carry Flag，PSW.7）", "isCorrect": true, "rationale": "正確！無號數加法超過 8 位元最大值 255 時，會產生第 8 位元進位，使進位旗標 `CY = 1`；而 `OV` 則是針對「有號數（2 的補數）」運算超出 `-128 ~ +127` 範圍時才會設為 1。"}], "hint": "無號數加法超出 255 產生進位，看的是 Carry Flag（`CY`）。"}, {"questionNumber": 195, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": false, "examNo": null, "question": "若程式執行完指令「MOV A, #07H」（二進位 `0000 0111B`，裡面共有 3 個 1），請問此時程式狀態字組暫存器 `PSW` 的最低位元同位旗標 `P`（PSW.0）會自動變成 0 還是 1？", "answerOptions": [{"text": "P 永遠維持為 0，必須由軟體手動設定", "isCorrect": false, "rationale": "P 是唯讀的硬體狀態旗標，會隨 A 的內容即時自動更新。"}, {"text": "P 會變成 07H", "isCorrect": false, "rationale": "P 只有 1 個位元，只能是 0 或 1。"}, {"text": "P = 1（因為 8051 的 P 旗標採用奇同位規則：當 A 中 1 的個數為奇數時 P = 1，使「A 的 1 個數 + P」總和為偶數）", "isCorrect": true, "rationale": "正確！在 8051 硬體設計中，同位旗標 `P`（PSW.0）隨時自動反映累加器 `A` 中位元為 `1` 的總個數：若 A 中有奇數個 1，則 `P = 1`；若有偶數個 1，則 `P = 0`。"}, {"text": "P = 0（因為 07H 小於 10H）", "isCorrect": false, "rationale": "P 的值只看 A 中位元 1 的奇偶個數，與數值大小無關。"}], "hint": "07H 有三個 1（奇數個 1），8051 規定奇數個 1 時 `P = 1`（這樣加上 P 之後總共有四個 1，變成偶數！）。"}, {"questionNumber": 196, "category": "04. I/O埠與硬體介面電路", "isPastExam": false, "examNo": null, "question": "在同學筆記第 12 頁的按鈕輸入電路中，按鍵開關接在 8051 的 `P3.3`（INT1）與地（GND）之間，且 `P3.3` 透過一顆 10KΩ 提升電阻接至 +5V。請問在按鈕「未被按下」時，讀取 `P3.3` 的邏輯狀態為何？「按下按鈕」瞬間又為何？", "answerOptions": [{"text": "未按下時為邏輯 0；按下時變成邏輯 1", "isCorrect": false, "rationale": "邏輯準位說反了（這是低態有效 Active-Low 按鍵設計）。"}, {"text": "未按下時為邏輯 1（高電位 +5V）；按下時接通接地變成邏輯 0（低電位 0V）", "isCorrect": true, "rationale": "正確！平時按鍵斷開，P3.3 經由提升電阻維持高電位（邏輯 1）；當按下按鈕時，P3.3 直接導通至 GND，電壓被拉低為 0V（邏輯 0），同時產生 1→0 負緣並維持低準位。"}, {"text": "無論按不按都永遠維持邏輯 0", "isCorrect": false, "rationale": "未按下時有提升電阻拉至 +5V。"}, {"text": "無論按不按都永遠維持邏輯 1", "isCorrect": false, "rationale": "按下時會被導通接地變成 0。"}], "hint": "這是微控制器最標準的「低態有效（Active-Low）按鍵」接法：放開是 1，按下接地變 0。"}, {"questionNumber": 197, "category": "04. I/O埠與硬體介面電路", "isPastExam": false, "examNo": null, "question": "在同學筆記第 14~15 頁「LAB 6 軟體解彈跳」中，透過 $2 \\times 2$ 矩陣鍵盤按鍵控制七段顯示器（7-Segment Display）顯示數字 `0, 1, 2, 3`。請問共陽極七段顯示器的共同端（COM）應接至何處，且輸出邏輯 `0` 代表該段發亮還是熄滅？", "answerOptions": [{"text": "七段顯示器不需要接共同端即可發光", "isCorrect": false, "rationale": "沒有共同端無法形成完整電流迴路。"}, {"text": "共同端（COM）接至 GND，8051 輸出邏輯 `0` 時該段 LED 發亮", "isCorrect": false, "rationale": "共同端接 GND 的是「共陰極」七段顯示器。"}, {"text": "共同端（COM）接至 +5V（VCC），8051 輸出邏輯 `0`（低電位）時該段 LED 發亮", "isCorrect": true, "rationale": "正確！七段顯示器內部由 7 顆（加小數點共 8 顆）LED 組成；共陽極即所有 LED 陽極共接 +5V，因此對應接腳給低電位 `0` 時該筆畫點亮。"}, {"text": "共同端（COM）接至 +5V，8051 輸出邏輯 `1` 時該段 LED 發亮", "isCorrect": false, "rationale": "共陽極給邏輯 1 時兩端皆為 +5V，會熄滅而非發亮。"}], "hint": "七段顯示器的本質就是把 8 顆 LED 排成「8」字形，共陽極規則跟單顆共陽極 LED 完全相同（0 亮 1 滅）！"}, {"questionNumber": 198, "category": "05. 計時與計數器 Timer", "isPastExam": false, "examNo": null, "question": "在 `TMOD`（Timer Mode Control，位址 89H）暫存器中，高 4 位元用來控制 Timer 1，低 4 位元用來控制 Timer 0，每組 4 位元由高到低依序為 `GATE, C/T, M1, M0`。若設定 `MOV TMOD, #01H`（二進位 `0000 0001B`），其代表意義為何？", "answerOptions": [{"text": "設定 Timer 0 為計時模式（C/T=0）、工作於 Mode 1（16-bit 計時器，M1=0, M0=1）、且僅由軟體 TR0 啟動（GATE=0）", "isCorrect": true, "rationale": "正確！`01H` = `0000 0001B`，低 4 位元為 `0001`：GATE=0（單純由 TR0 啟動）、C/T=0（內部計時器）、M1=0, M0=1（Mode 1，16 位元計時器）。"}, {"text": "設定 Timer 1 工作於 Mode 1，Timer 0 關閉", "isCorrect": false, "rationale": "高 4 位元為 `0000`，代表設定的是低 4 位元的 Timer 0。"}, {"text": "設定 Timer 0 工作於 Mode 2（8-bit 自動重載模式）", "isCorrect": false, "rationale": "Mode 2 應設定為 `02H`（`M1=1, M0=0`）。"}, {"text": "設定 Timer 0 為外部事件計數器模式（C/T=1）", "isCorrect": false, "rationale": "外部事件計數器需設定 `C/T = 1`（即 `05H`）。"}], "hint": "低 4 位元控制 Timer 0，二進位 `0001` 的模式位元 `M1M0 = 01` 就是 Mode 1。"}, {"questionNumber": 199, "category": "05. 計時與計數器 Timer", "isPastExam": false, "examNo": null, "question": "在 `TMOD` 暫存器中，每組計時器的最高位元 `GATE`（門控位元）若設為 `1`（例如 `GATE = 1`），則計時器要開始計數必須同時滿足哪兩個條件？", "answerOptions": [{"text": "必須 `TRx = 1`（軟體啟動位元為 1）且外部中斷接腳 `INTx`（P3.2 或 P3.3）也同時輸入高電位（1），常用於量測外部高電位脈波寬度", "isCorrect": true, "rationale": "正確！當 `GATE = 1` 時，計時器啟動閘門受 `TRx AND INTx` 雙重控制，只有當 `TRx = 1` 且外部 `INTx` 腳為高電位時才計數，非常適合用來精確量測外部正脈波的時間寬度。"}, {"text": "只要 `TRx = 1` 即可，與外部接腳無關", "isCorrect": false, "rationale": "那是 `GATE = 0` 時的條件。"}, {"text": "GATE = 1 代表完全鎖死計時器永遠不能啟動", "isCorrect": false, "rationale": "並非永遠鎖死，而是需要外部接腳高電位配合放行。"}, {"text": "必須 `TRx = 0` 且外部接腳接地", "isCorrect": false, "rationale": "條件寫反了。"}], "hint": "GATE 就是「大門」的意思：GATE = 0 時大門敞開只需看 TRx；GATE = 1 時還得看外部接腳 `INTx` 是否為高電位放行！"}, {"questionNumber": 200, "category": "06. 中斷系統與解彈跳", "isPastExam": false, "examNo": null, "question": "在你的筆記第 16 頁與同學筆記第 4 頁中，為什麼主程式通常會把程式碼起始位址放在 `ORG 0030H`（例如 `0000H` 放 `JMP START`，然後跳到 `ORG 0030H` 的 `START:`）？", "answerOptions": [{"text": "為了完整避開 `0000H`（Reset 向量）以及 `0003H ~ 0023H`（五個中斷向量位址區），防止主程式覆蓋中斷向量入口", "isCorrect": true, "rationale": "正確！從 `0000H` 到 `002AH` 是系統保留給 Reset 與各個中斷向量跳躍指令的黃金地段，因此將主程式本體放在 `ORG 0030H` 之後是最標準安全的程式記憶體配置。"}, {"text": "因為 0030H 是堆疊指標 SP 的硬體位址", "isCorrect": false, "rationale": "堆疊位於內部 RAM（資料記憶體），而 `ORG 0030H` 指定的是程式記憶體（ROM）位址，兩者屬於不同記憶體空間。"}, {"text": "因為 `JMP` 指令在 0030H 之前無法運作", "isCorrect": false, "rati
