P 00H` → `POP PSW` → `POP ACC`（後進先出 LIFO，順序與 PUSH 完全相反）", "isCorrect": true, "rationale": "正確！堆疊遵循「後進先出（LIFO）」原則，最後推進去的 `00H` 壓在最上面，必須第一個彈出，依序反向還原。"}, {"text": "不需要執行任何 POP，直接執行 `RET` 即可", "isCorrect": false, "rationale": "若不把推入的 3 Bytes 彈出，堆疊頂端會停留在資料上而非返回位址，執行 `RET` 會導致程式飛走當機！"}, {"text": "`POP ACC` → `POP PSW` → `POP 00H`（順序與 PUSH 相同）", "isCorrect": false, "rationale": "若按相同順序 POP，會把 `00H` 的值放進 `ACC`，把 `ACC` 的值放進 `00H`，造成暫存器錯亂！"}], "hint": "穿衣服順序是「內衣 → 襯衫 → 外套」，脫衣服（POP）一定要倒過來「外套 → 襯衫 → 內衣」！"}, {"questionNumber": 307, "category": "04. I/O埠與硬體介面電路", "isPastExam": false, "examNo": null, "question": "在同學筆記第 13 頁 `ADC0804` 的接腳圖中，晶片上共有 8 支數位資料輸出接腳 `DB0 ~ DB7`（Pin 18 ~ Pin 11），這些接腳內部具備「三態輸出緩衝器（Tri-State Output Buffer）」，請問只有當哪兩支控制接腳同時為低電位（`0`）時，`DB0 ~ DB7` 才會輸出轉換好的數位資料到匯流排上？", "answerOptions": [{"text": "`/CS = 0`（晶片選擇致能）且 `/RD = 0`（讀取致能）", "isCorrect": true, "rationale": "正確！因為 `DB0 ~ DB7` 掛載在共用的 8 位元資料匯流排上，只有當晶片被選中（`/CS = 0`）且 CPU 發出讀取訊號（`/RD = 0`）時，三態緩衝器才會開啟輸出資料；平時維持高阻抗（High-Z）以免干擾匯流排。"}, {"text": "只要接上電源就會永遠輸出，不需要控制", "isCorrect": false, "rationale": "若不透過三態控制，會與匯流排上的其他晶片（如 6116）發生電位衝突。"}, {"text": "`/CS = 1` 且 `/RD = 1`", "isCorrect": false, "rationale": "高電位時為關閉（高阻抗）狀態。"}, {"text": "`/WR = 0` 且 `/INTR = 1`", "isCorrect": false, "rationale": "`/WR = 0` 是啟動類比轉換，不是讀取資料。"}], "hint": "要從匯流排「讀取（Read）」這顆「被選中晶片（Chip Select）」的資料，兩個低態致能腳都必須為 0！"}, {"questionNumber": 308, "category": "04. I/O埠與硬體介面電路", "isPastExam": false, "examNo": null, "question": "在開發板電路圖（U13: 74LS373 連接於資料匯流排與 U14: DAC0800 之間）中，為什麼 8051 每次將新的數位波形數值寫入 DAC0800 時，都必須透過 `74LS373` 栓鎖起來？", "answerOptions": [{"text": "因為 DAC0800 內部沒有資料栓鎖器，而 8051 的資料匯流排很快會切換去傳輸其他指令或資料，若不靠 74LS373 鎖住數值，DAC0800 輸出的類比電壓就會瞬間跑掉", "isCorrect": true, "rationale": "正確！資料匯流排是分時共用的，CPU 寫入 DAC 的瞬間只有短短幾百奈秒，必須由 74LS373 接手鎖住該數位值，DAC0800 才能持續穩定輸出對應的類比電流。"}, {"text": "因為 74LS373 是用來給 DAC0800 降溫的散熱片", "isCorrect": false, "rationale": "它是邏輯 IC，非散熱片。"}, {"text": "因為 74LS373 可以把數位訊號直接變成音樂", "isCorrect": false, "rationale": "74LS373 是數位栓鎖器，不直接產生音樂。"}, {"text": "因為 DAC0800 只能接受 16 位元資料", "isCorrect": false, "rationale": "DAC0800 是 8 位元轉換器。"}], "hint": "DAC 沒有記憶力（不帶栓鎖器），所以旁邊要站一個小秘書（74LS373）幫它死死記住 CPU 剛剛交代的數字！"}, {"questionNumber": 309, "category": "04. I/O埠與硬體介面電路", "isPastExam": false, "examNo": null, "question": "在 Lab 6 的 $2 \\times 2$ 矩陣鍵盤與七段顯示器實驗中，若要讓共陽極七段顯示器（筆畫 a~g 依序接至 P0.0~P0.6，小數點 dp 接 P0.7）顯示數字「0」（即 `a, b, c, d, e, f` 六段亮，中間橫槓 `g` 與小數點 `dp` 滅），請問應輸出哪一個十六進位字型碼？", "answerOptions": [{"text": "`0F9H`（`1111 1001B`，顯示數字 `1`）", "isCorrect": false, "rationale": "`0F9H` 只點亮 `b`（Bit 1）與 `c`（Bit 2），顯示數字 `1`。"}, {"text": "`0FFH`（`1111 1111B`，全部熄滅）", "isCorrect": false, "rationale": "`0FFH` 全部筆畫都熄滅。"}, {"text": "`00H`（`0000 0000B`，會顯示數字 `8.` 全亮）", "isCorrect": false, "rationale": "`00H` 連中間橫槓 `g` 與小數點 `dp` 都會點亮，變成 `8.`。"}, {"text": "`0C0H`（二進位 `1100 0000B`，即 Bit 7(dp)=1、Bit 6(g)=1 熄滅，低 6 位 a~f 全為 0 點亮）", "isCorrect": true, "rationale": "正確！共陽極七段顯示器為 `0 亮 1 滅`，數字 `0` 只需熄滅中間的 `g`（Bit 6）與小數點 `dp`（Bit 7），二進位為 `1100 0000B` = `0C0H`。"}], "hint": "數字 `0` 就是把數字 `8` 中間那一橫（`g` 段）跟小數點（`dp`）關掉（設為 1），其餘全亮（設為 0）！"}, {"questionNumber": 310, "category": "05. 計時與計數器 Timer", "isPastExam": false, "examNo": null, "question": "在 8051 計時器程式設計中，若使用「Mode 1（16-bit 計時器）」且外接 `12 MHz` 石英晶振，不搭配任何軟體計數器迴圈的情況下，單次計時所能產生的「最長定時時間」為多少？", "answerOptions": [{"text": "1 秒（1,000,000 μs）", "isCorrect": false, "rationale": "1 秒超過 65.536 ms，必須配合軟體迴圈多次累加。"}, {"text": "256 μs", "isCorrect": false, "rationale": "256 μs 是 8 位元 Mode 2 的最長定時。"}, {"text": "10 秒", "isCorrect": false, "rationale": "10 秒遠超單次計時上限。"}, {"text": "65,536 μs（約 65.536 ms，當初值設為 `THx = 00H, TLx = 00H` 時）", "isCorrect": true, "rationale": "正確！16 位元計數器最大計數步數為 $2^{16} = 65,536$ 步，在 12 MHz 下每步 1 μs，因此單次最長定時為 $65,536\\text{ }\\mu\\text{s} \\approx 65.5\\text{ ms}$（這也是為什麼課堂計算 1 秒延遲時，常先設定單次 50 ms 再循環 20 次的原因）。"}], "hint": "16 位元最大只能數 $2^{16} = 65,536$ 下，每下 1 微秒，最多就只能撐 `65.536 毫秒`！"}, {"questionNumber": 311, "category": "05. 計時與計數器 Timer", "isPastExam": false, "examNo": null, "question": "當 8051 的計時器設定為「計數器（Counter）模式」（`C/T = 1`）用來計算外部接腳 `T0`（P3.4）輸入的脈波個數時，硬體是在外部訊號發生哪一種電位變化時將計數器加 1？", "answerOptions": [{"text": "負緣變化（從邏輯 1 變為邏輯 0 的 1→0 下降緣瞬間）", "isCorrect": true, "rationale": "正確！8051 計數器在每個機械週期取樣 `T0` / `T1` 接腳電位，當偵測到前一個機械週期為 `1`、目前機械週期為 `0`（即 1→0 負緣）時，計數暫存器加 1。"}, {"text": "只要維持高電位就每個機械週期自動加 1", "isCorrect": false, "rationale": "那是內部計時器模式（C/T=0）加上 GATE=1 的行為。"}, {"text": "正緣變化（從邏輯 0 變為邏輯 1 的 0→1 上升緣瞬間）", "isCorrect": false, "rationale": "8051 外部事件計數器偵測的是負緣（1→0），非正緣。"}, {"text": "只要維持低電位就每個機械週期自動加 1", "isCorrect": false, "rationale": "偵測的是狀態跳變（1→0），不是靜態低電位。"}], "hint": "跟外部中斷一樣，8051 偵測外部脈波觸發的傳統都是「1 掉到 0（負緣）」！"}, {"questionNumber": 312, "category": "06. 中斷系統與解彈跳", "isPastExam": false, "examNo": null, "question": "在 8051 中斷致能暫存器 `IE`（Interrupt Enable，位址 `A8H`）中，若執行指令「CLR EA」（將最高位 Bit 7 清為 0），會產生什麼影響？", "answerOptions": [{"text": "立即觸發系統硬體重置", "isCorrect": false, "rationale": "不會觸發 Reset。"}, {"text": "立即關閉所有 5 個中斷源（全部中斷被禁止，無論個別中斷致能位元 EX0、ET0、EX1、ET1、ES 是否為 1）", "isCorrect": true, "rationale": "正確！`EA`（Enable All）是整個中斷系統的「總電源開關」，只要 `EA = 0`，所有中斷請求一律被遮罩禁止；常用於執行不能被打斷的關鍵時序程式碼（Critical Section）期間。"}, {"text": "開啟所有中斷功能", "isCorrect": false, "rationale": "`SETB EA` 才是開啟中斷總開關。"}, {"text": "只關閉外部中斷 INT0，其他中斷依然有效", "isCorrect": false, "rationale": "EX0 才是只控制外部中斷 0。"}], "hint": "EA = Enable All（總開關），總開關一拉下來，家裡所有房間的電燈（個別中斷）全部都不會亮！"}, {"questionNumber": 313, "category": "06. 中斷系統與解彈跳", "isPastExam": false, "examNo": null, "question": "在開發板電路圖（U11: ADC0804）中，ADC0804 的轉換完成通知腳 `/INTR`（Pin 5，低態有效）連接到 8051 的哪一支中斷接腳？", "answerOptions": [{"text": "P3.2（`INT0`，外部中斷 0，中斷向量位址 `0003H`）", "isCorrect": true, "rationale": "正確！觀察同學筆記第 13 頁電路圖，ADC0804 的第 5 腳 `/INTR` 直接標示連接至 `INT0`（P3.2），當轉換完成 `/INTR` 變低電位時，立刻透過 `0003H` 通知 8051 讀取資料。"}, {"text": "Pin 9（`RST`，重置腳）", "isCorrect": false, "rationale": "不接 RST。"}, {"text": "P3.3（`INT1`，外部中斷 1，中斷向量位址 `0013H`）", "isCorrect": false, "rationale": "P3.3（INT1）在實驗板上常接獨立按鍵 SW2。"}, {"text": "P3.0（`RXD`，串列接收腳）", "isCorrect": false, "rationale": "不接 RXD。"}], "hint": "參考同學筆記第 13 頁左上角 ADC0804 第 5 腳 `/INTR` 旁邊寫的符號：`INT0`！"}, {"questionNumber": 314, "category": "07. 串列通訊 UART 與 RS-232", "isPastExam": false, "examNo": null, "question": "在 UART 串列通訊中，若傳送端與接收端雙方約定的「鮑率（Baud Rate）」誤差過大（例如傳送端設 9600 bps，接收端誤設為 4800 bps），會造成什麼結果？", "answerOptions": [{"text": "傳送速度會自動變成 14400 bps", "isCorrect": false, "rationale": "不會變成 14400 bps。"}, {"text": "接收端取樣的時間間隔拉長一倍，導致同一個封包內的位元取樣位置嚴重錯位，收到的資料全部變成亂碼並引發訊框錯誤（Framing Error）", "isCorrect": true, "rationale": "正確！因為非同步通訊沒有時脈線，雙方全靠各自內部計時器按照約定好的鮑率計算取樣時間點（T/2 與 T），鮑率不同步會導致取樣點完全歪掉。"}, {"text": "兩台電腦的電源供應器會燒毀", "isCorrect": false, "rationale": "只是邏輯通訊亂碼，不會燒毀硬體。"}, {"text": "接收端會自動偵測並無條件正常收到正確文字", "isCorrect": false, "rationale": "標準 UART 不會自動修正 2 倍鮑率差（除非專門設計自動鮑率偵測演算法）。"}], "hint": "非同步通訊就像兩個人約好「每 1 秒鐘對一次暗號」，結果一個人按 1 秒算、另一個人按 2 秒算，暗號一定全部對歪！"}, {"questionNumber": 315, "category": "07. 串列通訊 UART 與 RS-232", "isPastExam": false, "examNo": null, "question": "假設某 UART 系統設定為「9600 bps、8 個資料位元、無同位位元（N）、1 個結束位元（1）」，現在要透過該串列埠連續傳送 `960 Bytes`（960 個英文字元）的資料，理論上最少需要花費多少時間？", "answerOptions": [{"text": "9.6 秒", "isCorrect": false, "rationale": "計算數量級錯誤。"}, {"text": "1 秒（計算：每個 Byte 封包共 1+8+1 = 10 bits，960 Bytes × 10 bits/Byte = 9,600 bits，除以 9,600 bps = 1 秒）", "isCorrect": true, "rationale": "正確！傳送 1 個 Byte 需要 10 bits（含起始與結束位元），傳送 960 Bytes 共需傳送 $960 \\times 10 = 9,600\\text{ bits}$，在 9600 bps 速率下剛好耗時 `1 秒`！"}, {"text": "10 秒", "isCorrect": false, "rationale": "計算錯誤。"}, {"text": "0.8 秒（計算：960 × 8 ÷ 9600）", "isCorrect": false, "rationale": "0.8 秒忘記把每個封包的 1 個起始位元與 1 個結束位元算進去。"}], "hint": "在 `9600, N, 8, 1` 下，傳 1 個 Byte 要送 10 個 bits，所以除以 10 就是每秒能傳的 Byte 數（960 Bytes/秒）！"}, {"questionNumber": 316, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "在 8051 組合語言指令中，若累加器 `A = 25H`，執行指令「ADD A, #17H」之後，累加器 `A` 的十六進位內容為何？（注意這是標準二進位加法，尚未執行 `DA A`）", "answerOptions": [{"text": "32H", "isCorrect": false, "rationale": "計算錯誤。"}, {"text": "42H（十進位 25 + 17 = 42）", "isCorrect": false, "rationale": "`42H` 是執行 `DA A` 調整後的 BCD 碼結果。"}, {"text": "0EH", "isCorrect": false, "rationale": "計算錯誤。"}, {"text": "3CH（計算：低四位 5 + 7 = 12 = CH；高四位 2 + 1 = 3，故為 `3CH`）", "isCorrect": true, "rationale": "正確！CPU 加法器一律執行十六進位（二進位）加法：`25H + 17H` 中，$5 + 7 = 12 = \\text{CH}$，$2 + 1 = 3$，結果為 `3CH`（若要變成 BCD 十進位結果 `42H`，需緊接著執行 `DA A` 調整）。"}], "hint": "在十六進位裡，`5 + 7 = 12`，而 12 在十六進位是用英文字母 `C` 表示！"}, {"questionNumber": 317, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "在 8051 組合語言中，若執行邏輯互斥或指令「XRL A, #0FFH」（將累加器 A 與 `1111 1111B` 做 XOR 運算），其運算結果等同於下列哪一道單一指令？", "answerOptions": [{"text": "`CPL A`（將累加器 A 的所有 8 個位元逐位元反相）", "isCorrect": true, "rationale": "正確！互斥或（XOR）的特性是「與 1 做 XOR 會反相，與 0 做 XOR 保持不變」，因此與 `FFH`（全部為 1）做 XOR 會讓 A 的 8 個位元全部反轉，效果完全等同於 `CPL A`！"}, {"text": "`CLR A`（將累加器 A 清為 00H）", "isCorrect": false, "rationale": "與自己做 XOR（`XRL A, A`）才會清為 `00H`。"}, {"text": "`SWAP A`（高低 4 位元互換）", "isCorrect": false, "rationale": "與高低 4 位元互換不同。"}, {"text": "`NOP`（不改變累加器 A）", "isCorrect": false, "rationale": "與 `00H` 做 XOR（`XRL A, #00H`）才會保持不變。"}], "hint": "任何位元跟 `1` 做 XOR 都會變成相反的數值（0⊕1=1，1⊕1=0），所以跟 8 個 1 做 XOR 就是全部反相！"}, {"questionNumber": 318, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "在 8051 程式設計中，若想要用最快、機械碼最短（僅 1 Byte、1 機械週期）的方式將累加器 `A` 的內容歸零，應該使用哪一道指令？", "answerOptions": [{"text": "`MOV A, #00H`（機械碼 `74 00`，2 Bytes，1 機械週期）", "isCorrect": false, "rationale": "`MOV A, #00H` 雖然也能歸零，但佔用 2 Bytes 空間。"}, {"text": "`MOV A, 00H`（這是把內部 RAM 位址 00H 的內容搬給 A，不一定為 0）", "isCorrect": false, "rationale": "`MOV A, 00H` 沒有 `#`，是讀取 R0 的值。"}, {"text": "`SUBB A, #00H`（這不會讓 A 歸零）", "isCorrect": false, "rationale": "減去 0 不會歸零。"}, {"text": "`CLR A`（機械碼 `E4H`，1 Byte，1 機械週期）", "isCorrect": true, "rationale": "正確！`CLR A` 是專用的單字節累加器清零指令（Opcode `E4H`），比 `MOV A, #00H`（2 Bytes）節省 1 Byte 程式空間。"}], "hint": "專為累加器設計的單字節歸零指令：`CLR A`。"}, {"questionNumber": 319, "category": "08. 組合語言指令與開發實作", "isPastExam": false, "examNo": null, "question": "在 8051 組合語言指令中，比較跳躍指令「CJNE A, #50H, NEXT」除了在兩者不相等時跳躍至 `NEXT` 之外，還會順便影響程式狀態字組 `PSW` 中的哪一個旗標位元（可用來判斷大小關係）？", "answerOptions": [{"text": "同位旗標 `P`", "isCorrect": false, "rationale": "不影響 P 的特殊判斷意義。"}, {"text": "暫存器庫選擇位元 `RS1`", "isCorrect": false, "rationale": "不會改變 RS1。"}, {"text": "溢位旗標 `OV`", "isCorrect": false, "rationale": "不會設定 OV。"}, {"text": "進位旗標 `CY`（若目的運算元 `A` 小於來源運算元 `#50H`，則 `CY = 1`；若 `A >= #50H`，則 `CY = 0`）", "isCorrect": true, "rationale": "正確！`CJNE` 內部是透過減法比較兩數大小：當第一個運算元（無號數）小於第二個運算元時會產生借位，使 `CY = 1`；大於或等於時 `CY = 0`，因此常在 `CJNE` 後面緊接 `JC`（小於就跳）或 `JNC`（大於等於就跳）來判斷大小！"}], "hint": "比大小用減法，不夠減（第一個數 < 第二個數）就會產生借位 `CY = 1`！"}];

      } catch (e) {
        console.warn("Unable to load localStorage:", e);
      }
    }

    function saveState() {
      try {
        localStorage.setItem(STORAGE_KEY, JSON.stringify({
          answers: state.answers,
          bookmarks: state.bookmarks,
          darkMode: state.darkMode
        }));
      } catch (e) {}
    }

    function formatText(str) {
      if (!str) return "";
      const escaped = str
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
      return escaped.replace(/`([^`]+)`/g, "<code>$1</code>");
    }

    function initCategories() {
      const select = document.getElementById("categoryFilter");
      const cats = [...new Set(ALL_QUESTIONS.map(q => q.category))].sort();
      cats.forEach(c => {
        const count = ALL_QUESTIONS.filter(q => q.category === c).length;
        const opt = document.createElement("option");
        opt.value = c;
        opt.textContent = `${c} (${count}題)`;
        select.appendChild(opt);
      });
    }

    function getFilteredQuestions() {
      let base = state.customOrder ? state.customOrder : ALL_QUESTIONS;
      return base.filter(q => {
        if (state.scope === "exam" && !q.isPastExam) return false;
        if (state.scope === "course" && q.isPastExam) return false;
        if (state.scope === "wrong") {
          const ans = state.answers[q.questionNumber];
          if (ans === undefined || q.answerOptions[ans]?.isCorrect) return false;
        }
        if (state.scope === "bookmark" && !state.bookmarks[q.questionNumber]) return false;
        if (state.category !== "ALL" && q.category !== state.category) return false;
        return true;
      });
    }

    function updateStats() {
      const total = ALL_QUESTIONS.length;
      let answered = 0;
      let correct = 0;
      let wrong = 0;

      ALL_QUESTIONS.forEach(q => {
        const ans = state.answers[q.questionNumber];
        if (ans !== undefined) {
          answered++;
          if (q.answerOptions[ans]?.isCorrect) correct++;
          else wrong++;
        }
      });

      const acc = answered > 0 ? Math.round((correct / answered) * 100) : 0;
      document.getElementById("statProgress").textContent = `進度：${answered} / ${total} 題`;
      document.getElementById("statCorrect").textContent = `答對：${correct} 題`;
      document.getElementById("statWrong").textContent = `答錯：${wrong} 題`;
      document.getElementById("statAccuracy").textContent = `正確率：${acc}%`;
      document.getElementById("wrongCountBadge").textContent = wrong;
      document.getElementById("bookmarkCountBadge").textContent = Object.keys(state.bookmarks).length;
      document.getElementById("progressBar").style.width = `${(answered / total) * 100}%`;
    }

    function renderGrid(filteredList) {
      const grid = document.getElementById("qGrid");
      grid.innerHTML = "";
      filteredList.forEach((q, idx) => {
        const cell = document.createElement("button");
        cell.className = "q-cell";
        if (state.viewMode === "card" && idx === state.currentIndex) cell.classList.add("current");
        const ans = state.answers[q.questionNumber];
        if (ans !== undefined) {
          cell.classList.add(q.answerOptions[ans]?.isCorrect ? "c-correct" : "c-wrong");
        }
        if (state.bookmarks[q.questionNumber]) cell.classList.add("bookmarked");
        cell.textContent = q.questionNumber;
        cell.title = `第 ${q.questionNumber} 題 - ${q.category}`;
        cell.onclick = () => {
          state.currentIndex = idx;
          state.showHint = false;
          if (state.viewMode === "list") {
            const el = document.getElementById(`card-q-${q.questionNumber}`);
            if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
          } else {
            render();
          }
        };
        grid.appendChild(cell);
      });
    }

    function buildQuestionCardHTML(q, displayIdx, totalInFilter, isListMode) {
      const userAns = state.answers[q.questionNumber];
      const isAnswered = userAns !== undefined;
      const isBookmarked = !!state.bookmarks[q.questionNumber];
      const letters = ["A", "B", "C", "D"];

      const optionsHTML = q.answerOptions.map((opt, optIdx) => {
        let cls = "option-item";
        if (isAnswered) {
          cls += " locked";
          if (opt.isCorrect) cls += " correct";
          else if (optIdx === userAns) cls += " wrong";
        }

        const rationaleHTML = isAnswered
          ? `<div class="option-rationale"><strong>${opt.isCorrect ? "✓ 正確解析：" : "✕ 選項解析："}</strong>${formatText(opt.rationale)}</div>`
          : "";

        return `
          <div class="${cls}" onclick="selectOption(${q.questionNumber}, ${optIdx})">
            <div class="option-header">
              <span class="option-letter">${letters[optIdx]}</span>
              <div class="option-label">${formatText(opt.text)}</div>
            </div>
            ${rationaleHTML}
          </div>
        `;
      }).join("");

      const examBadge = q.isPastExam
        ? `<span class="badge-exam">⭐ 歷屆考古題 #${q.examNo}</span>`
        : "";

      const footerHTML = !isListMode ? `
        <div class="card-footer">
          <div style="display:flex;gap:8px;flex-wrap:wrap;">
            <button class="btn btn-sm" onclick="toggleHint()">💡 ${state.showHint ? "隱藏提示" : "顯示提示"}</button>
            ${isAnswered ? `<button class="btn btn-sm" onclick="clearSingleAnswer(${q.questionNumber})">🔄 重做此題</button>` : ""}
          </div>
          <div class="nav-btns">
            <button class="btn" onclick="prevQuestion()" ${displayIdx === 0 ? "disabled" : ""}>← 上一題</button>
            <button class="btn btn-primary" onclick="nextQuestion()" ${displayIdx >= totalInFilter - 1 ? "disabled" : ""}>下一題 →</button>
          </div>
        </div>
      ` : `
        <div class="card-footer">
          <button class="btn btn-sm" onclick="this.nextElementSibling.classList.toggle('show')">💡 提示</button>
          <div class="hint-box" style="width:100%;margin-top:8px;">💡 <strong>解題提示：</strong>${formatText(q.hint)}</div>
          ${isAnswered ? `<button class="btn btn-sm" onclick="clearSingleAnswer(${q.questionNumber})">🔄 重做此題</button>` : ""}
        </div>
      `;

      return `
        <div class="quiz-card" id="card-q-${q.questionNumber}">
          <div class="card-meta">
            <div class="meta-left">
              <span class="q-index">第 ${displayIdx + 1} / ${totalInFilter} 題（總題庫 #${q.questionNumber}）</span>
              <span class="badge-cat">${q.category}</span>
              ${examBadge}
            </div>
            <button class="btn btn-sm" onclick="toggleBookmark(${q.questionNumber})">
              ${isBookmarked ? "🔖 已標記" : "🏷️ 標記複習"}
            </button>
          </div>

          <div class="question-text">${formatText(q.question)}</div>
          <div class="options-list">${optionsHTML}</div>

          ${!isListMode ? `<div class="hint-box ${state.showHint ? "show" : ""}">💡 <strong>解題提示：</strong>${formatText(q.hint)}</div>` : ""}
          ${footerHTML}
        </div>
      `;
    }

    function render() {
      updateStats();
      const filtered = getFilteredQuestions();
      const container = document.getElementById("quizContainer");

      if (filtered.length === 0) {
        container.innerHTML = `
          <div class="quiz-card" style="text-align:center;padding:40px 20px;">
            <h3 style="margin-bottom:8px;">目前篩選條件下沒有題目</h3>
            <p style="color:var(--text-muted);margin-bottom:16px;">你可以切換回「全部題庫」，或清除章節篩選條件。</p>
            <button class="btn btn-primary" onclick="resetFilters()">顯示全部 319 題</button>
          </div>
        `;
        renderGrid([]);
        return;
      }

      if (state.currentIndex >= filtered.length) state.currentIndex = 0;
      if (state.currentIndex < 0) state.currentIndex = 0;

      renderGrid(filtered);

      if (state.viewMode === "card") {
        const q = filtered[state.currentIndex];
        container.innerHTML = buildQuestionCardHTML(q, state.currentIndex, filtered.length, false);
      } else {
        container.innerHTML = filtered
          .map((q, idx) => buildQuestionCardHTML(q, idx, filtered.length, true))
          .join("");
      }
    }

    function selectOption(qNum, optIdx) {
      if (state.answers[qNum] !== undefined) return;
      state.answers[qNum] = optIdx;
      saveState();
      render();
    }

    function clearSingleAnswer(qNum) {
      delete state.answers[qNum];
      saveState();
      render();
    }

    function toggleBookmark(qNum) {
      if (state.bookmarks[qNum]) delete state.bookmarks[qNum];
      else state.bookmarks[qNum] = true;
      saveState();
      render();
    }

    function toggleHint() {
      state.showHint = !state.showHint;
      render();
    }

    function prevQuestion() {
      if (state.currentIndex > 0) {
        state.currentIndex--;
        state.showHint = false;
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    }

    function nextQuestion() {
      const filtered = getFilteredQuestions();
      if (state.currentIndex < filtered.length - 1) {
        state.currentIndex++;
        state.showHint = false;
        render();
        window.scrollTo({ top: 0, behavior: "smooth" });
      }
    }

    function setScope(scope) {
      state.scope = scope;
      state.currentIndex = 0;
      state.showHint = false;
      document.querySelectorAll("#scopeTabs .tab-btn").forEach(btn => {
        btn.classList.toggle("active", btn.dataset.scope === scope);
      });
      render();
    }

    function setCategory(cat) {
      state.category = cat;
      state.currentIndex = 0;
      state.showHint = false;
      render();
    }

    function resetFilters() {
      state.scope = "all";
      state.category = "ALL";
      state.currentIndex = 0;
      document.getElementById("categoryFilter").value = "ALL";
      setScope("all");
    }

    function toggleViewMode() {
      state.viewMode = state.viewMode === "card" ? "list" : "card";
      document.getElementById("btnViewMode").textContent =
        state.viewMode === "card" ? "📋 切換全卷總覽" : "🃏 切換單題測驗";
      render();
    }

    function toggleGrid() {
      document.getElementById("gridPanel").classList.toggle("show");
    }

    function toggleTheme() {
      state.darkMode = !state.darkMode;
      document.body.classList.toggle("dark", state.darkMode);
      document.getElementById("btnTheme").textContent = state.darkMode ? "☀️ 淺色模式" : "🌙 深色模式";
      saveState();
    }

    function shuffleCurrentList() {
      const copy = [...ALL_QUESTIONS];
      for (let i = copy.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [copy[i], copy[j]] = [copy[j], copy[i]];
      }
      state.customOrder = copy;
      state.currentIndex = 0;
      state.showHint = false;
      render();
    }

    function resetAllProgress() {
      if (!confirm("確定要清除所有已作答與收藏紀錄嗎？")) return;
      state.answers = {};
      state.bookmarks = {};
      state.customOrder = null;
      state.currentIndex = 0;
      saveState();
      render();
    }

    function exportWrongNotes() {
      const wrongs = ALL_QUESTIONS.filter(q => {
        const ans = state.answers[q.questionNumber];
        return ans !== undefined && !q.answerOptions[ans]?.isCorrect;
      });
      if (wrongs.length === 0) {
        alert("目前還沒有答錯的題目！繼續保持！");
        return;
      }
      let txt = "=== 微算機原理及應用（8051）錯題複習筆記 ===\n\n";
      wrongs.forEach((q, idx) => {
        const correctOpt = q.answerOptions.find(o => o.isCorrect);
        const userOpt = q.answerOptions[state.answers[q.questionNumber]];
        txt += `${idx + 1}. [總題號 #${q.questionNumber} | ${q.category}]\n`;
        txt += `題目：${q.question}\n`;
        txt += `你的選擇：${userOpt.text}\n`;
        txt += `正確答案：${correctOpt.text}\n`;
        txt += `詳解：${correctOpt.rationale}\n`;
        txt += "--------------------------------------------------\n\n";
      });
      const blob = new Blob([txt], { type: "text/plain;charset=utf-8" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = "8051_錯題複習筆記.txt";
      a.click();
      URL.revokeObjectURL(url);
    }

    document.addEventListener("keydown", (e) => {
      if (state.viewMode !== "card") return;
      if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
      const filtered = getFilteredQuestions();
      if (!filtered.length) return;
      const q = filtered[state.currentIndex];
      const key = e.key.toUpperCase();
      if (["1", "A"].includes(key)) selectOption(q.questionNumber, 0);
      else if (["2", "B"].includes(key)) selectOption(q.questionNumber, 1);
      else if (["3", "C"].includes(key)) selectOption(q.questionNumber, 2);
      else if (["4", "D"].includes(key)) selectOption(q.questionNumber, 3);
      else if (e.key === "ArrowLeft") prevQuestion();
      else if (e.key === "ArrowRight") nextQuestion();
      else if (key === "H") toggleHint();
    });

    loadState();
    if (state.darkMode) document.getElementById("btnTheme").textContent = "☀️ 淺色模式";
    initCategories();
    render();
  </script>
</body>
</html>
