<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>微算機原理及應用（8051）全方位互動題庫（319 題完整版）</title>
  <style>
    :root {
      --bg: #f8fafc;
      --surface: #ffffff;
      --surface-alt: #f1f5f9;
      --border: #e2e8f0;
      --text: #0f172a;
      --text-muted: #475569;
      --primary: #2563eb;
      --primary-hover: #1d4ed8;
      --primary-soft: #eff6ff;
      --success: #16a34a;
      --success-bg: #f0fdf4;
      --success-border: #86efac;
      --danger: #dc2626;
      --danger-bg: #fef2f2;
      --danger-border: #fca5a5;
      --amber: #d97706;
      --amber-bg: #fffbeb;
      --amber-border: #fcd34d;
      --code-bg: #f1f5f9;
      --code-text: #be123c;
      --shadow: 0 4px 20px -2px rgba(15, 23, 42, 0.06);
      --radius: 14px;
    }

    body.dark {
      --bg: #0b1120;
      --surface: #1e293b;
      --surface-alt: #0f172a;
      --border: #334155;
      --text: #f1f5f9;
      --text-muted: #94a3b8;
      --primary: #3b82f6;
      --primary-hover: #60a5fa;
      --primary-soft: rgba(59, 130, 246, 0.15);
      --success: #22c55e;
      --success-bg: rgba(34, 197, 94, 0.14);
      --success-border: rgba(34, 197, 94, 0.45);
      --danger: #ef4444;
      --danger-bg: rgba(239, 68, 68, 0.14);
      --danger-border: rgba(239, 68, 68, 0.45);
      --amber: #f59e0b;
      --amber-bg: rgba(245, 158, 11, 0.15);
      --amber-border: rgba(245, 158, 11, 0.45);
      --code-bg: #0f172a;
      --code-text: #fda4af;
      --shadow: 0 8px 28px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      transition: background 0.2s, color 0.2s;
      padding-bottom: 60px;
    }

    code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", monospace;
      background: var(--code-bg);
      color: var(--code-text);
      padding: 2px 6px;
      border-radius: 5px;
      font-size: 0.9em;
      font-weight: 600;
    }

    .container {
      max-width: 900px;
      margin: 0 auto;
      padding: 20px 16px;
    }

    /* Header */
    .header-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 20px 24px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
      flex-wrap: wrap;
    }

    .title-area h1 {
      font-size: 1.35rem;
      font-weight: 800;
      letter-spacing: -0.01em;
    }

    .title-area p {
      font-size: 0.88rem;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .header-actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 8px 14px;
      border-radius: 9px;
      font-size: 0.86rem;
      font-weight: 600;
      cursor: pointer;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      transition: all 0.15s ease;
      user-select: none;
    }

    .btn:hover:not(:disabled) {
      border-color: var(--primary);
      background: var(--primary-soft);
      color: var(--primary);
    }

    .btn:disabled {
      opacity: 0.45;
      cursor: not-allowed;
    }

    .btn-primary {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    .btn-primary:hover:not(:disabled) {
      background: var(--primary-hover);
      color: #ffffff;
    }

    .btn-sm {
      padding: 5px 10px;
      font-size: 0.8rem;
    }

    /* Stats & Progress */
    .stats-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
      font-size: 0.88rem;
    }

    .stat-pills {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
    }

    .pill {
      padding: 4px 10px;
      border-radius: 999px;
      font-weight: 600;
      font-size: 0.82rem;
      background: var(--surface-alt);
      border: 1px solid var(--border);
    }

    .pill.green {
      background: var(--success-bg);
      color: var(--success);
      border-color: var(--success-border);
    }

    .pill.red {
      background: var(--danger-bg);
      color: var(--danger);
      border-color: var(--danger-border);
    }

    .progress-bar-wrap {
      width: 100%;
      height: 7px;
      background: var(--surface-alt);
      border-radius: 999px;
      overflow: hidden;
      margin-top: 12px;
    }

    .progress-bar-fill {
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #10b981);
      width: 0%;
      transition: width 0.25s ease;
    }

    /* Filter Toolbar */
    .toolbar {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 14px 18px;
      margin-bottom: 16px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow);
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
    }

    .tab-btn {
      padding: 6px 12px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--text-muted);
      font-size: 0.83rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }

    .tab-btn.active {
      background: var(--primary);
      color: #ffffff;
      border-color: var(--primary);
    }

    select.cat-select {
      padding: 6px 10px;
      border-radius: 8px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text);
      font-size: 0.83rem;
      font-weight: 600;
      max-width: 240px;
    }

    /* Quiz Card */
    .quiz-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 24px 26px;
      box-shadow: var(--shadow);
      margin-bottom: 16px;
    }

    .card-meta {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 14px;
      flex-wrap: wrap;
    }

    .meta-left {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .q-index {
      font-weight: 800;
      font-size: 0.95rem;
      color: var(--primary);
    }

    .badge-cat {
      font-size: 0.78rem;
      font-weight: 600;
      padding: 3px 9px;
      border-radius: 6px;
      background: var(--surface-alt);
      color: var(--text-muted);
      border: 1px solid var(--border);
    }

    .badge-exam {
      font-size: 0.78rem;
      font-weight: 700;
      padding: 3px 9px;
      border-radius: 6px;
      background: var(--amber-bg);
      color: var(--amber);
      border: 1px solid var(--amber-border);
    }

    .question-text {
      font-size: 1.08rem;
      font-weight: 700;
      margin-bottom: 18px;
      white-space: pre-line;
      line-height: 1.7;
    }

    /* Options */
    .options-list {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .option-item {
      border: 1.5px solid var(--border);
      border-radius: 11px;
      padding: 13px 16px;
      cursor: pointer;
      transition: all 0.15s ease;
      background: var(--surface);
      position: relative;
    }

    .option-item:hover:not(.locked) {
      border-color: var(--primary);
      background: var(--primary-soft);
    }

    .option-item.locked {
      cursor: default;
    }

    .option-item.correct {
      border-color: var(--success);
      background: var(--success-bg);
    }

    .option-item.wrong {
      border-color: var(--danger);
      background: var(--danger-bg);
    }

    .option-header {
      display: flex;
      align-items: flex-start;
      gap: 11px;
    }

    .option-letter {
      width: 26px;
      height: 26px;
      border-radius: 50%;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      font-size: 0.82rem;
      font-weight: 800;
      flex-shrink: 0;
      background: var(--surface-alt);
      border: 1px solid var(--border);
      margin-top: 1px;
    }

    .option-item.correct .option-letter {
      background: var(--success);
      color: #fff;
      border-color: var(--success);
    }

    .option-item.wrong .option-letter {
      background: var(--danger);
      color: #fff;
      border-color: var(--danger);
    }

    .option-label {
      font-size: 0.96rem;
      font-weight: 500;
      flex: 1;
    }

    .option-rationale {
      margin-top: 9px;
      margin-left: 37px;
      padding-top: 8px;
      border-top: 1px dashed var(--border);
      font-size: 0.88rem;
      color: var(--text-muted);
      line-height: 1.55;
    }

    .option-item.correct .option-rationale {
      color: var(--text);
    }

    /* Hint & Card Footer */
    .hint-box {
      margin-top: 16px;
      padding: 12px 15px;
      border-radius: 10px;
      background: var(--amber-bg);
      border: 1px solid var(--amber-border);
      font-size: 0.9rem;
      display: none;
    }

    .hint-box.show {
      display: block;
    }

    .card-footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      gap: 10px;
      flex-wrap: wrap;
    }

    .nav-btns {
      display: flex;
      gap: 10px;
    }

    /* Question Grid Drawer */
    .grid-panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 18px 20px;
      box-shadow: var(--shadow);
      margin-top: 16px;
      display: none;
    }

    .grid-panel.show {
      display: block;
    }

    .grid-legend {
      display: flex;
      gap: 14px;
      flex-wrap: wrap;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .legend-dot {
      display: inline-block;
      width: 10px;
      height: 10px;
      border-radius: 3px;
      margin-right: 4px;
    }

    .q-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(38px, 1fr));
      gap: 6px;
      max-height: 300px;
      overflow-y: auto;
      padding-right: 4px;
    }

    .q-cell {
      height: 34px;
      border-radius: 7px;
      border: 1px solid var(--border);
      background: var(--surface-alt);
      color: var(--text);
      font-size: 0.78rem;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .q-cell.current {
      outline: 2.5px solid var(--primary);
      outline-offset: 1px;
    }

    .q-cell.c-correct {
      background: var(--success-bg);
      border-color: var(--success);
      color: var(--success);
    }

    .q-cell.c-wrong {
      background: var(--danger-bg);
      border-color: var(--danger);
      color: var(--danger);
    }

    .q-cell.bookmarked::after {
      content: "";
      position: absolute;
      top: 2px;
      right: 2px;
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: var(--amber);
    }

    .shortcut-tip {
      text-align: center;
      font-size: 0.8rem;
      color: var(--text-muted);
      margin-top: 14px;
    }

    @media (max-width: 600px) {
      .quiz-card {
        padding: 18px 16px;
      }
      .question-text {
        font-size: 1rem;
      }
      .option-rationale {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- Header -->
    <div class="header-card">
      <div class="header-top">
        <div class="title-area">
          <h1>微算機原理及應用（8051）全方位互動題庫</h1>
          <p>完整收錄：課堂投影片與筆記全覆蓋補充題庫 269 題（共 319 題）</p>
        </div>
        <div class="header-actions">
          <button class="btn btn-sm" id="btnViewMode" onclick="toggleViewMode()">📋 切換全卷總覽</button>
          <button class="btn btn-sm" id="btnGridToggle" onclick="toggleGrid()">🔢 題號總表</button>
          <button class="btn btn-sm" id="btnTheme" onclick="toggleTheme()">🌙 深色模式</button>
        </div>
      </div>

      <div class="stats-row">
        <div class="stat-pills">
          <span class="pill" id="statProgress">進度：0 / 319 題</span>
          <span class="pill green" id="statCorrect">答對：0 題</span>
          <span class="pill red" id="statWrong">答錯：0 題</span>
          <span class="pill" id="statAccuracy">正確率：0%</span>
        </div>
        <div class="header-actions">
          <button class="btn btn-sm" onclick="shuffleCurrentList()">🔀 隨機洗牌</button>
          <button class="btn btn-sm" onclick="exportWrongNotes()">📥 匯出錯題筆記</button>
          <button class="btn btn-sm" onclick="resetAllProgress()">🗑️ 重置紀錄</button>
        </div>
      </div>

      <div class="progress-bar-wrap">
        <div class="progress-bar-fill" id="progressBar"></div>
      </div>
    </div>

    <!-- Filter Toolbar -->
    <div class="toolbar">
      <div class="filter-group" id="scopeTabs">
        <button class="tab-btn active" data-scope="all" onclick="setScope('all')">全部題庫 (319)</button>
        <button class="tab-btn" data-scope="exam" onclick="setScope('exam')">⭐ 精華題目 (50)</button>
        <button class="tab-btn" data-scope="course" onclick="setScope('course')">📚 課堂 (269)</button>
        <button class="tab-btn" data-scope="wrong" onclick="setScope('wrong')">❌ 錯題本 (<span id="wrongCountBadge">0</span>)</button>
        <button class="tab-btn" data-scope="bookmark" onclick="setScope('bookmark')">🔖 標記複習 (<span id="bookmarkCountBadge">0</span>)</button>
      </div>
      <div class="filter-group">
        <select class="cat-select" id="categoryFilter" onchange="setCategory(this.value)">
          <option value="ALL">所有章節分類（全 8 單元）</option>
        </select>
      </div>
    </div>

    <!-- Question Grid Navigator -->
    <div class="grid-panel" id="gridPanel">
      <div class="grid-legend">
        <span><i class="legend-dot" style="background:var(--surface-alt);border:1px solid var(--border)"></i>未作答</span>
        <span><i class="legend-dot" style="background:var(--success)"></i>答對</span>
        <span><i class="legend-dot" style="background:var(--danger)"></i>答錯</span>
        <span><i class="legend-dot" style="background:var(--amber)"></i>右上黃點＝已標記收藏</span>
      </div>
      <div class="q-grid" id="qGrid"></div>
    </div>

    <!-- Main Quiz Container -->
    <div id="quizContainer"></div>

    <div class="shortcut-tip">
      ⌨️ 快捷鍵支援：按 <code>1</code>~<code>4</code> 或 <code>A</code>~<code>D</code> 直接作答 ｜ <code>←</code> / <code>→</code> 切換上下題 ｜ <code>H</code> 顯示提示
    </div>
  </div>

  <script>
    const ALL_QUESTIONS = [{"questionNumber": 1, "category": "01. 微算機架構與指令週期", "isPastExam": true, "examNo": 1, "question": "【考古題 1】一個完整的指令週期（Instruction Cycle）包含五個步驟，其正確的先後執行順序為何？", "answerOptions": [{"text": "Fetch → Decode → Execute → Write Back → Fetch Operand", "isCorrect": false, "rationale": "Write Back 是最後將運算結果寫回暫存器或記憶體的步驟。"}, {"text": "Fetch → Decode → Fetch Operand → Execute → Write Back", "isCorrect": true, "rationale": "正確！依序為：提取指令（Fetch）→ 解碼（Decode）→ 提取運算元（Fetch Operand）→ 執行（Execute）→ 寫回（Write Back）。"}, {"text": "Decode → Fetch → Execute → Fetch Operand → Write Back", "isCorrect": false, "rationale": "必須先提取指令（Fetch），解碼器才知道要解碼什麼。"}, {"text": "Fetch → Fetch Operand → Decode → Execute → Write Back", "isCorrect": false, "rationale": "尚未解碼（Decode）前，CPU 無法得知運算元的位置與定址模式。"}], "hint": "先從記憶體把指令抓出來（Fetch），看懂指令內容（Decode）後再去抓資料（Fetch Operand）。"}, {"questionNumber": 2, "category": "01. 微算機架構與指令週期", "isPastExam": true, "examNo": 2, "question": "【考古題 2】複雜指令集架構（CISC）微處理機在運作時，負擔最重、設計難度最高的是指令週期五個步驟中的哪一個步驟？", "answerOptions": [{"text": "提取指令（Fetch）", "isCorrect": false, "rationale": "Fetch 每次固定從程式記憶體讀取 1 Byte，動作單純。"}, {"text": "解碼（Decode）", "isCorrect": true, "rationale": "正確！CISC 指令長度不固定（1~3 Bytes）且格式多樣，解碼器（Decoder）電路最複雜、運作負擔最重。"}, {"text": "提取運算元（Fetch Operand）", "isCorrect": false, "rationale": "Fetch Operand 依據解碼後的結果讀取資料，複雜度低於多變長度的指令解碼。"}, {"text": "寫回（Write Back）", "isCorrect": false, "rationale": "Write Back 僅是將 ALU 結果寫入目的暫存器或記憶體。"}], "hint": "因為每道指令長度與格式都不一樣，CPU 要「看懂」這道指令需要最複雜的硬體邏輯。"}, {"questionNumber": 3, "category": "01. 微算機架構與指令週期", "isPastExam": true, "examNo": 3, "question": "【考古題 3】複雜指令集架構（CISC）微處理機，它的指令長度（也就是機械碼）在程式記憶體中所佔的空間是否都一樣？", "answerOptions": [{"text": "不同，依指令功能與定址模式而異（如 8051 為 1 ~ 3 Bytes）", "isCorrect": true, "rationale": "正確！CISC 指令長度可變，以 8051 為例，機械碼長度分為 1 Byte、2 Bytes 與 3 Bytes 三種。"}, {"text": "完全一樣，每道指令固定佔用 4 Bytes", "isCorrect": false, "rationale": "固定 32-bit（4 Bytes）是典型 RISC（如 ARM/MIPS/RISC-V）的特徵。"}, {"text": "完全一樣，每道指令固定佔用 2 Bytes", "isCorrect": false, "rationale": "固定長度是精簡指令集（RISC）的特徵，非 CISC。"}, {"text": "不同，但只分成 1 Byte 與 8 Bytes 兩種", "isCorrect": false, "rationale": "8051 指令長度為 1、2 或 3 Bytes，並無 8 Bytes 的指令。"}], "hint": "想想看 `RL A` 只有 1 Byte，而 `MOV SP, #30H` 卻有 `75 81 30` 共 3 Bytes。"}, {"questionNumber": 4, "category": "01. 微算機架構與指令週期", "isPastExam": true, "examNo": 4, "question": "【考古題 4】8051 的指令長度，其機械碼在程式記憶體當中所佔的空間大小都一樣長嗎？", "answerOptions": [{"text": "一樣長，全部都是 8 bits", "isCorrect": false, "rationale": "單運算元暫存器指令（如 `INC A`）佔 1 Byte，但立即定址或長跳躍指令會佔 2 或 3 Bytes。"}, {"text": "不一樣，分為 1 Byte、2 Bytes、3 Bytes 不等", "isCorrect": true, "rationale": "正確！8051 屬於 CISC 架構，指令機械碼依運算元多寡佔用 1、2 或 3 Bytes。"}, {"text": "不一樣，會隨石英震盪器頻率改變長度", "isCorrect": false, "rationale": "機械碼空間大小在組譯時就已決定，與時脈頻率無關。"}, {"text": "一樣長，全部都是 16 bits", "isCorrect": false, "rationale": "8051 並非固定 16-bit 指令長度。"}], "hint": "參考 Lab 1 機械碼列表：`02 00 09`（3 Bytes）、`74 FE`（2 Bytes）、`23`（1 Byte）。"}, {"questionNumber": 5, "category": "01. 微算機架構與指令週期", "isPastExam": true, "examNo": 5, "question": "【考古題 5】請問 8051 微控制器是屬於精簡指令集（RISC）還是複雜指令集（CISC）架構？", "answerOptions": [{"text": "複雜指令集（CISC）", "isCorrect": true, "rationale": "正確！8051 擁有 111 個指令碼、指令長度與執行週期皆不固定，屬於典型的 CISC 架構。"}, {"text": "混合指令集（MISC）", "isCorrect": false, "rationale": "課堂上明確將處理器分為 CISC（如 8051）與 RISC（如 STM32/ARM/RISC-V）。"}, {"text": "超長指令字（VLIW）", "isCorrect": false, "rationale": "VLIW 常見於高階 DSP 處理器，非 8051。"}, {"text": "精簡指令集（RISC）", "isCorrect": false, "rationale": "RISC 代表架構為 ARM（STM32）、MIPS、RISC-V，指令長度固定。"}], "hint": "8051 指令長度不一、執行時間為 1~4 個機械週期不等。"}, {"questionNumber": 6, "category": "07. 串列通訊 UART 與 RS-232", "isPastExam": true, "examNo": 6, "question": "【考古題 6】RS-232 串列通訊在傳送一個位元組（Byte）的資料時，是從哪一個位元開始傳送？", "answerOptions": [{"text": "隨機決定先傳高位元或低位元", "isCorrect": false, "rationale": "通訊協定必須固定位元順序，否則接收端無法還原正確數值。"}, {"text": "MSB（最高有效位元 D7）", "isCorrect": false, "rationale": "MSB（D7）是資料位元中最後一個傳送的位元。"}, {"text": "LSB（最低有效位元 D0）", "isCorrect": true, "rationale": "正確！串列通訊在起始位元（Start Bit）之後，固定由最低有效位元 LSB（D0）開始依序傳送到 MSB（D7）。"}, {"text": "同位位元（Parity Bit）", "isCorrect": false, "rationale": "同位位元位於所有資料位元（D0~D7）傳送完畢之後。"}], "hint": "請回想課堂板書波形圖：起始位元右邊緊接著的第一格資料標示為 D0。"}, {"questionNumber": 7, "category": "07. 串列通訊 UART 與 RS-232", "isPastExam": true, "examNo": 7, "question": "【考古題 7】關於 RS-232 串列通訊介面的電氣準位邏輯定義，下列敘述何者正確？", "answerOptions": [{"text": "差動邏輯（D+ 與 D- 電位差）", "isCorrect": false, "rationale": "差動訊號用於 RS-422/RS-485 或 USB，非 RS-232。"}, {"text": "負邏輯（+10V 為 0，-10V 為 1）", "isCorrect": true, "rationale": "正確！RS-232 採用負邏輯，正電壓（約 +10V，規範 +3V~+15V）代表邏輯 0，負電壓（約 -10V，規範 -3V~-15V）代表邏輯 1。"}, {"text": "正邏輯（+5V 為 1，0V 為 0）", "isCorrect": false, "rationale": "+5V/0V 是 TTL 準位，不是 RS-232 準位。"}, {"text": "電流迴路邏輯（20mA 為 1，0mA 為 0）", "isCorrect": false, "rationale": "20mA 電流迴路屬於工業控制舊式介面，非 RS-232。"}], "hint": "在 RS-232 中，電壓是「負的」反而代表邏輯「1」。"}, {"questionNumber": 8, "category": "07. 串列通訊 UART 與 RS-232", "isPastExam": true, "examNo": 8, "question": "【考古題 8】下列何者是串列傳輸開始前，傳送端與接收端雙方必須先約定好的「串列通訊四大要項」？", "answerOptions": [{"text": "僅需約定同位位元（Parity）與結束位元（Stop Bit）", "isCorrect": false, "rationale": "還需要傳輸率與資料位元長度。"}, {"text": "僅需約定傳輸率（Baud Rate）", "isCorrect": false, "rationale": "只有傳輸率不足以解析封包長度與檢查錯誤。"}, {"text": "僅需約定每個封包傳送的位元數", "isCorrect": false, "rationale": "還需要知道傳輸速率與起訖邊界。"}, {"text": "以上皆是（傳輸率、封包位元數、同位位元、結束位元）", "isCorrect": true, "rationale": "正確！串列通訊四大要項缺一不可：1. 鮑率/傳輸率、2. 每個封包位元數、3. 同位位元、4. 結束位元。"}], "hint": "設定終端機時常見的 `9600, N, 8, 1` 正好對應這四個項目。"}, {"questionNumber": 9, "category": "07. 串列通訊 UART 與 RS-232", "isPastExam": true, "examNo": 9, "question": "【考古題 9】下列何者「不是」標準串列通訊每次封包傳輸所允許的資料位元數（bits transmitted per packet）？", "answerOptions": [{"text": "4 位元（4 bits）", "isCorrect": true, "rationale": "正確！串列通訊合法的資料位元數僅有 5、6、7、8 bits 四種，不允許 4 bits。"}, {"text": "7 位元（7 bits）", "isCorrect": false, "rationale": "7 bits 為合法設定（標準 ASCII 碼使用）。"}, {"text": "5 位元（5 bits）", "isCorrect": false, "rationale": "5 bits 為合法設定（早期電傳打字機 Baudot 碼使用）。"}, {"text": "8 位元（8 bits）", "isCorrect": false, "rationale": "8 bits 為現今最常用的合法設定（1 Byte 資料）。"}], "hint": "合法數量為連續的四個整數：5, 6, 7, 8。"}, {"questionNumber": 10, "category": "07. 串列通訊 UART 與 RS-232", "isPastExam": true, "examNo": 10, "question": "【考古題 10】根據課堂講解，串列通訊接收端在確認起始位元後，在每個資料位元區間（Bit Interval, T）內取樣幾次？", "answerOptions": [{"text": "2 次（於上升緣與下降緣各取樣一次）", "isCorrect": false, "rationale": "非同步通訊不在資料位元邊緣取樣，因為邊緣可能有雜訊或時脈誤差。"}, {"text": "10 次（取平均值）", "isCorrect": false, "rationale": "並非取 10 次平均。"}, {"text": "1 次（於每個位元區間的中心點取樣）", "isCorrect": true, "rationale": "正確！起始位元下降緣觸發後，先延遲 T/2 確認起始位元中心，之後每隔一個完整位元區間 T 在中心點取樣 1 次。"}, {"text": "4 次（每 T/4 取樣一次）", "isCorrect": false, "rationale": "課堂筆記明確指出「串列通訊在一個位元區間內取樣 1 次」。"}], "hint": "對錶完成後，為了避開訊號轉換邊緣的不穩定期，接收端在每個位元最中間讀取一次即可。"}, {"questionNumber": 11, "category": "07. 串列通訊 UART 與 RS-232", "isPastExam": true, "examNo": 11, "question": "【考古題 11】下列何者「不是」串列非同步通訊所允許的結束位元（Stop Bit）長度？", "answerOptions": [{"text": "2 位元（2T）", "isCorrect": false, "rationale": "2 位元（2T）是合法的結束位元設定。"}, {"text": "1.5 位元（1.5T）", "isCorrect": false, "rationale": "1.5 位元（1.5T）是合法的結束位元設定。"}, {"text": "1 位元（1T）", "isCorrect": false, "rationale": "1 位元（1T）是最常見的結束位元設定。"}, {"text": "0 位元（不能沒有結束位元）", "isCorrect": true, "rationale": "正確！結束位元（邏輯 1）是下一個封包起始位元（邏輯 0）產生負緣「重新對錶」的必要前提，因此絕對不能為 0 位元。"}], "hint": "如果沒有邏輯 1 的結束位元，當最後一個資料位元也是 0 時，就無法產生 1→0 的下降緣供下次對錶。"}, {"questionNumber": 12, "category": "07. 串列通訊 UART 與 RS-232", "isPastExam": true, "examNo": 12, "question": "【考古題 12】兩台電腦（或兩個設備）要使用 RS-232 進行最基本的「全雙工（Full Duplex）」串列傳輸時，至少需要幾條連接線？", "answerOptions": [{"text": "1 條", "isCorrect": false, "rationale": "1 條線無法形成電流迴路，無法傳遞電壓訊號。"}, {"text": "3 條", "isCorrect": true, "rationale": "正確！全雙工需要傳送線（TXD）、接收線（RXD）以及共同的訊號地線（Signal Ground），共 3 條線。"}, {"text": "2 條", "isCorrect": false, "rationale": "2 條線（一條訊號線 + 一條地線）只能達成單工（Simplex）。"}, {"text": "9 條", "isCorrect": false, "rationale": "9-pin 接頭雖有 9 支腳，但最基本全雙工只需用到其中 3 條線。"}], "hint": "一條負責傳（TXD）、一條負責收（RXD）、還有一條大家共用的參考基準（SG）。"}, {"questionNumber": 13, "category": "07. 串列通訊 UART 與 RS-232", "isPastExam": true, "examNo": 13, "question": "【考古題 13】承上題，兩台電腦進行 RS-232 串列傳輸時，雙方的訊號地（Signal Ground）必須連接在一起，請問應連接 9-pin D 型接頭（DB9）的第幾支接腳？", "answerOptions": [{"text": "第 3 支腳（Pin 3）", "isCorrect": false, "rationale": "Pin 3 是傳送資料腳（TXD）。"}, {"text": "第 2 支腳（Pin 2）", "isCorrect": false, "rationale": "Pin 2 是接收資料腳（RXD）。"}, {"text": "第 5 支腳（Pin 5）", "isCorrect": true, "rationale": "正確！在 9-pin D-type 接頭中，Pin 5 固定為 Signal Ground（SG，訊號地）。"}, {"text": "第 4 支腳（Pin 4）", "isCorrect": false, "rationale": "Pin 4 是資料終端就緒腳（DTR）。"}], "hint": "DB9 接頭最核心的三支腳是 2、3、5，其中 2 和 3 是資料線，剩下那支就是地線。"}, {"questionNumber": 14, "category": "07. 串列通訊 UART 與 RS-232", "isPastExam": true, "examNo": 14, "question": "【考古題 14】在單機開發測試 RS-232 串列通訊（自傳自收 Loopback 測試）時，必須將 9-pin D 型接頭的哪兩支接腳短路？", "answerOptions": [{"text": "Pin 1 與 Pin 5 短路", "isCorrect": false, "rationale": "Pin 1 是 DCD，與 Pin 5 短路無法自傳自收。"}, {"text": "Pin 2 與 Pin 5 短路", "isCorrect": false, "rationale": "將 RXD 接地會使接收腳永遠被拉住，無法收到自己送出的訊號。"}, {"text": "Pin 2（RXD）與 Pin 3（TXD）短路", "isCorrect": true, "rationale": "正確！將 Pin 3（TXD 傳送腳）直接短路接到 Pin 2（RXD 接收腳），送出的資料就會立刻被自己接收回來。"}, {"text": "Pin 3 與 Pin 5 短路", "isCorrect": false, "rationale": "將 TXD 直接對地短路會造成輸出驅動器過載。"}], "hint": "要把「嘴巴（TXD）」直接接到自己的「耳朵（RXD）」。"}, {"questionNumber": 15, "category": "07. 串列通訊 UART 與 RS-232", "isPastExam": true, "examNo": 15, "question": "【考古題 15】UART 的傳送與接收屬於「非同步（Asynchronous）」通訊，雙方沒有共用時脈線，請問接收端如何達到「虛擬同步（對錶）」？", "answerOptions": [{"text": "依靠傳輸線上的高頻載波鎖相環", "isCorrect": false, "rationale": "UART 是基頻數位傳輸，沒有高頻載波。"}, {"text": "利用傳輸準位由高電位標記狀態（邏輯 1）轉換到低電位起始位元（邏輯 0）的瞬間進行虛擬同步", "isCorrect": true, "rationale": "正確！線路閒置時為高電位（邏輯 1，Mark），當起始位元（邏輯 0）出現時產生 1→0 的下降緣，接收端以此瞬間重新對錶計算取樣時間點。"}, {"text": "由接收端定期送出時脈脈波給傳送端", "isCorrect": false, "rationale": "UART 沒有時脈線，接收端不會送時脈給傳送端。"}, {"text": "利用封包最後一個結束位元的上升緣進行同步", "isCorrect": false, "rationale": "結束位元是維持邏輯 1 的休息狀態，是用來準備下一次 1→0 的跌落。"}], "hint": "每次有新封包要開始時，訊號會從閒置的高準位「往下掉」變成起始位元。"}, {"questionNumber": 16, "category": "01. 微算機架構與指令週期", "isPastExam": true, "examNo": 16, "question": "【考古題 16】8051 微控制器內部的資料匯流排（Internal Data Bus）寬度為多少位元？", "answerOptions": [{"text": "32 位元", "isCorrect": false, "rationale": "32 位元是 ARM Cortex-M 等高階 MCU 的規格。"}, {"text": "16 位元", "isCorrect": false, "rationale": "16 位元是 8051 的「位址匯流排（Address Bus）」寬度，而非資料匯流排。"}, {"text": "8 位元", "isCorrect": true, "rationale": "正確！8051 是標準的 8 位元微控制器，內部資料匯流排與暫存器基本寬度皆為 8 bits。"}, {"text": "4 位元", "isCorrect": false, "rationale": "4 位元是早期 Intel 4004 等微處理器的規格。"}], "hint": "8051 之所以稱為「8 位元微控制器」，就是因為它一次處理與傳輸的資料寬度為 8 bits。"}, {"questionNumber": 17, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": true, "examNo": 17, "question": "【考古題 17】標準 8051 所執行的機器程式碼，在正常硬體架構下是存放在哪一種記憶體中？（註：課堂開發板則是先透過 Bootloader 寫入外部 6116 RAM 再切換當作程式記憶體執行）", "answerOptions": [{"text": "程式記憶體（ROM）", "isCorrect": true, "rationale": "正確！8051 採用哈佛架構（Harvard Architecture），執行的程式碼存放在程式記憶體（ROM，如內部 4K Flash/ROM 或外部 EPROM）中。"}, {"text": "堆疊指標（SP）", "isCorrect": false, "rationale": "SP 只是儲存堆疊頂端位址的 8 位元暫存器。"}, {"text": "特殊功能暫存器（SFR）", "isCorrect": false, "rationale": "SFR 用來控制周邊與 CPU 狀態，不存放程式碼。"}, {"text": "資料記憶體（RAM）", "isCorrect": false, "rationale": "標準架構下資料記憶體（RAM）用來存放變數與堆疊，斷電資料會消失，不存放永久程式碼。"}], "hint": "唯讀記憶體（Read-Only Memory）在斷電後程式依然保留。"}, {"questionNumber": 18, "category": "05. 計時與計數器 Timer", "isPastExam": true, "examNo": 18, "question": "【考古題 18】8051 內建的計時/計數器（Timer 0 與 Timer 1）的計數方向為何？", "answerOptions": [{"text": "隨機跳號計數器", "isCorrect": false, "rationale": "計時器必須規律累加才能精確計時。"}, {"text": "上數計時器（Up Counter，從初值往上累加直到溢位）", "isCorrect": true, "rationale": "正確！8051 的計時器固定為上數（Up Counter），每經過一個機械週期就加 1，數到最大值再加 1 時產生溢位（Overflow）旗標。"}, {"text": "可由暫存器設定為上數或下數的雙向計時器", "isCorrect": false, "rationale": "8051 的 Timer 0/1 沒有下數控制位元。"}, {"text": "下數計時器（Down Counter，從初值往下遞減直到 0）", "isCorrect": false, "rationale": "下數計時器常見於 8254 或 ARM SysTick，8051 並非下數。"}], "hint": "請回想課堂計算 50ms 延遲時，為什麼要用 `65536 - 50000 = 15536` 當初值？因為要從 15536 往上數到 65536。"}, {"questionNumber": 19, "category": "05. 計時與計數器 Timer", "isPastExam": true, "examNo": 19, "question": "【考古題 19】當 8051 工作在「計時（Timer）」模式時，計時器暫存器每隔多少時間會自動加 1？", "answerOptions": [{"text": "每隔 12 個機械週期加 1", "isCorrect": false, "rationale": "是 12 個「振盪週期」，不是 12 個「機械週期」。"}, {"text": "每隔 2 個機械週期（24 個振盪週期）加 1", "isCorrect": false, "rationale": "不是每 2 個機械週期加 1。"}, {"text": "每隔 1 個振盪週期（T_osc）加 1", "isCorrect": false, "rationale": "標準 8051 的計時器時脈經過 12 除頻，並非每個振盪週期加 1。"}, {"text": "每隔 1 個機械週期（等於 12 個振盪週期）加 1", "isCorrect": true, "rationale": "正確！在計時模式下，時脈來源為內部振盪頻率除以 12，即每隔 1 個機械週期（12 個振盪週期）計數值加 1。"}], "hint": "在 12MHz 晶振下，計時器剛好每 1 微秒（1 機械週期）加 1。"}, {"questionNumber": 20, "category": "07. 串列通訊 UART 與 RS-232", "isPastExam": true, "examNo": 20, "question": "【考古題 20】8051 內建的串列通訊埠（UART）具備哪一種雙向傳輸能力？", "answerOptions": [{"text": "僅能接收不能傳送", "isCorrect": false, "rationale": "8051 透過 P3.1（TXD）傳送、P3.0（RXD）接收。"}, {"text": "單工（Simplex）", "isCorrect": false, "rationale": "單工只能單方向傳輸，但 8051 同時具備 TXD 與 RXD 兩條獨立腳位。"}, {"text": "全雙工（Full Duplex）", "isCorrect": true, "rationale": "正確！8051 具有獨立的傳送緩衝器與接收緩衝器（共用名稱 SBUF），支援全雙工（可同時傳送與接收）。"}, {"text": "半雙工（Half Duplex）", "isCorrect": false, "rationale": "半雙工同一時間只能收或只能發，8051 可同時進行。"}], "hint": "打電話時雙方可以同時講話與聽對方說話，這就是全雙工。"}, {"questionNumber": 21, "category": "06. 中斷系統與解彈跳", "isPastExam": true, "examNo": 21, "question": "【考古題 21】在標準 8051 微控制器中，扣掉硬體重置（Reset）之後，總共有幾個中斷源？", "answerOptions": [{"text": "4 個", "isCorrect": false, "rationale": "4 個遺漏了串列通訊中斷。"}, {"text": "2 個", "isCorrect": false, "rationale": "2 個僅是外部硬體中斷（INT0、INT1）的數量。"}, {"text": "3 個", "isCorrect": false, "rationale": "3 個數量不足。"}, {"text": "5 個（INT0、INT1、Timer 0、Timer 1、UART）", "isCorrect": true, "rationale": "正確！標準 8051 共有 5 個中斷源：外部中斷 INT0、計時器 Timer 0、外部中斷 INT1、計時器 Timer 1、串列埠 UART（RI/TI）。"}], "hint": "兩個外部中斷 + 兩個計時器中斷 + 一個串列埠中斷。"}, {"questionNumber": 22, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": true, "examNo": 22, "question": "【考古題 22】在 8051 的四組輸出入埠（Port 0 ~ Port 3）中，哪一組埠在擴充外部記憶體時，同時擔任位址匯流排（Address）與資料匯流排（Data）的分時多工接腳？", "answerOptions": [{"text": "Port 0（AD0 ~ AD7）", "isCorrect": true, "rationale": "正確！Port 0（P0.0~P0.7）兼作低 8 位元位址線（A0~A7）與 8 位元資料線（D0~D7），透過 ALE 訊號分時多工切換。"}, {"text": "Port 2（A8 ~ A15）", "isCorrect": false, "rationale": "Port 2 僅輸出高 8 位元位址（A8~A15），不傳輸資料。"}, {"text": "Port 3", "isCorrect": false, "rationale": "Port 3 負責外部讀寫控制（RD/WR）、中斷、計時輸入與 UART 等第二功能。"}, {"text": "Port 1", "isCorrect": false, "rationale": "Port 1 在標準 8051 中僅作為一般數位 I/O 埠使用。"}], "hint": "接腳圖上標示為 `P0.0(AD0)` ~ `P0.7(AD7)` 的那一組。"}, {"questionNumber": 23, "category": "06. 中斷系統與解彈跳", "isPastExam": true, "examNo": 23, "question": "【考古題 23】當 8051 發生中斷（或執行 CALL 呼叫副程式）時，原本程式計數器（PC）的返回位址會自動儲存在哪裡？", "answerOptions": [{"text": "內部資料記憶體（RAM）的堆疊（Stack）中", "isCorrect": true, "rationale": "正確！CPU 會自動將 16 位元的 PC（先存 PCL 再存 PCH）推入內部 RAM 的堆疊區中，並讓 SP 加 2。"}, {"text": "特殊功能暫存器 DPTR 中", "isCorrect": false, "rationale": "DPTR 是資料指標暫存器，不會用來保存中斷返回位址。"}, {"text": "程式記憶體（ROM）的 0000H 處", "isCorrect": false, "rationale": "程式記憶體 ROM 在執行期間不可寫入。"}, {"text": "累加器 A 與暫存器 B 中", "isCorrect": false, "rationale": "A 與 B 是運算用暫存器，不會自動保存返回位址。"}], "hint": "堆疊（Stack）就是位於內部資料記憶體 RAM 中，專門用來暫存中斷或副程式返回位址的區域。"}, {"questionNumber": 24, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": true, "examNo": 24, "question": "【考古題 24】標準 8051 微控制器的一個「機械週期（Machine Cycle）」包含幾個「振盪週期（Oscillation Period）」？", "answerOptions": [{"text": "24 個", "isCorrect": false, "rationale": "24 MHz 是最高晶振頻率，不是週期倍數。"}, {"text": "4 個", "isCorrect": false, "rationale": "4 個振盪週期是 PIC 微控制器的規格，不是標準 8051。"}, {"text": "12 個", "isCorrect": true, "rationale": "正確！標準 8051 的 1 個機械週期固定等於 12 個振盪週期（12 T_osc）。"}, {"text": "6 個", "isCorrect": false, "rationale": "6 個振盪週期是部分增強型 8051（6T 模式）的規格。"}], "hint": "記住公式：1 機械週期 = 12 T_osc。"}, {"questionNumber": 25, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": true, "examNo": 25, "question": "【考古題 25】若 8051 外接的石英振盪器頻率為 12 MHz，則執行一個機械週期需要花費多少時間？", "answerOptions": [{"text": "1 μs", "isCorrect": true, "rationale": "正確！T_osc = 1 / 12MHz，1 機械週期 = 12 × (1 / 12×10^6) = 10^-6 秒 = 1 μs。"}, {"text": "0.5 μs", "isCorrect": false, "rationale": "0.5 μs 是外接 24 MHz 石英晶振時的機械週期長度。"}, {"text": "2 μs", "isCorrect": false, "rationale": "2 μs 是 12 MHz 下「2 個機械週期」指令的執行時間。"}, {"text": "12 μs", "isCorrect": false, "rationale": "若誤把 12 乘在分子上才會算出 12 μs。"}], "hint": "12MHz 與 12 個振盪週期剛好分子分母約分消掉，變成百萬分之一秒！"}, {"questionNumber": 26, "category": "06. 中斷系統與解彈跳", "isPastExam": true, "examNo": 26, "question": "【考古題 26】下列關於 8051 外部中斷（INT0、INT1）的敘述，何者「不正確」？", "answerOptions": [{"text": "負緣觸發具有一次記憶性，低準位觸發則無記憶性", "isCorrect": false, "rationale": "正確敘述：負緣觸發會被硬體旗標 IE0/IE1 鎖存一次；低準位觸發若中斷期間訊號恢復高電位則不記憶。"}, {"text": "當設定為邊緣觸發時，需使用正緣觸發（Rising Edge Trigger）", "isCorrect": true, "rationale": "本選項不正確！8051 的邊緣觸發是「負緣觸發（Falling / Negative Edge Trigger，1→0 瞬間觸發）」，而非正緣觸發。"}, {"text": "外部中斷可選擇邊緣觸發或準位觸發", "isCorrect": false, "rationale": "正確敘述：可透過 TCON 的 IT0/IT1 位元選擇觸發方式。"}, {"text": "設定為準位觸發時，需使用低準位（Low-Level）觸發", "isCorrect": false, "rationale": "正確敘述：8051 準位觸發為低準位有效（0V 觸發）。"}], "hint": "觀察接腳名稱 `INT0` 與 `INT1` 上面都有一條橫線（低態有效），所以都是往下掉（負緣或低準位）才觸發。"}, {"questionNumber": 27, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": true, "examNo": 27, "question": "【考古題 27】8051 的重置接腳 RST（Pin 9）是哪一種電位準位有效（Active）？", "answerOptions": [{"text": "正負雙極性脈波重置", "isCorrect": false, "rationale": "8051 為單電源 +5V 數位邏輯，無負極性重置。"}, {"text": "高電位重置（Reset High）", "isCorrect": true, "rationale": "正確！8051 的 RST 接腳為高電位有效（Reset High），給予 +5V 高電位維持至少 2 個機械週期即可重置系統。"}, {"text": "類比電壓 2.5V 觸發重置", "isCorrect": false, "rationale": "RST 為數位邏輯輸入腳，非類比電壓比較。"}, {"text": "低電位重置（Reset Low）", "isCorrect": false, "rationale": "低電位重置（如 AVR、ARM 的 nRESET）與 8051 相反。"}], "hint": "回想開機重置電路：電容接 +5V、電阻接地，開機瞬間電容導通把 RST 拉到 +5V。"}, {"questionNumber": 28, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": true, "examNo": 28, "question": "【考古題 28】當 8051 完成硬體重置（Reset）動作後，程式計數器（PC）會指向哪一個十六進位位址？", "answerOptions": [{"text": "0000H", "isCorrect": true, "rationale": "正確！Reset 之後 16 位元的 PC 會全部歸零為 0000H，因此程式總是從 0000H 開始執行。"}, {"text": "0030H", "isCorrect": false, "rationale": "0030H 是程式設計師常手動設定給堆疊指標 SP 的起始位址。"}, {"text": "FFFFH", "isCorrect": false, "rationale": "FFFFH 是 64K 程式記憶體的最後一個位址。"}, {"text": "0003H", "isCorrect": false, "rationale": "0003H 是外部中斷 INT0 的中斷向量位址。"}], "hint": "Reset 代表一切重新歸零開始。"}, {"questionNumber": 29, "category": "08. 組合語言指令與開發實作", "isPastExam": true, "examNo": 29, "question": "【考古題 29】8051 的比較不相等就跳躍指令「CJNE」（Compare and Jump if Not Equal）需要寫入多少個參數（運算元）？", "answerOptions": [{"text": "3 個（例如：CJNE R0, #6, NEXT）", "isCorrect": true, "rationale": "正確！CJNE 需要 3 個參數：第 1 個被比較數、第 2 個比較數、第 3 個不相等時跳躍的目標標籤（如 `CJNE R0, #6, NEXT`）。"}, {"text": "1 個", "isCorrect": false, "rationale": "如 `INC A` 或 `JMP NEXT` 才是 1 個參數。"}, {"text": "2 個", "isCorrect": false, "rationale": "如 `MOV A, #0FEH` 或 `DJNZ R7, $` 才是 2 個參數。"}, {"text": "0 個", "isCorrect": false, "rationale": "如 `RET` 或 `NOP` 才是 0 個參數。"}], "hint": "要比較「誰」跟「誰」，不相等又要跳去「哪裡」，總共需要三個資訊！"}, {"questionNumber": 30, "category": "08. 組合語言指令與開發實作", "isPastExam": true, "examNo": 30, "question": "【考古題 30】下列哪一個關鍵字是 8051 組合語言的「假指令（Pseudo-instruction）」，僅供組譯器參考而不會產生機械碼？", "answerOptions": [{"text": "MOV", "isCorrect": false, "rationale": "MOV 是資料搬移真指令，會產生機械碼（如 74H、75H）。"}, {"text": "RL", "isCorrect": false, "rationale": "RL 是累加器左旋真指令（機械碼 23H）。"}, {"text": "DJNZ", "isCorrect": false, "rationale": "DJNZ 是遞減跳躍真指令，會產生機械碼。"}, {"text": "ORG（Originate）", "isCorrect": true, "rationale": "正確！ORG（指定程式起始位址）與 END、DB、DW 皆屬於假指令，不會被翻譯成 CPU 執行的機械碼。"}], "hint": "假指令是寫給組譯器（Assembler）看的排版或資料定義指示。"}, {"questionNumber": 31, "category": "01. 微算機架構與指令週期", "isPastExam": true, "examNo": 31, "question": "【考古題 31】典型的標準 8051 微控制器，其晶片內部建置的程式記憶體（Internal ROM）容量為多少 Byte？", "answerOptions": [{"text": "128 Bytes", "isCorrect": false, "rationale": "128 Bytes 是標準 8051 內部一般用途資料記憶體（RAM）的容量。"}, {"text": "2K Bytes", "isCorrect": false, "rationale": "2K Bytes 是外部 6116 SRAM 晶片的容量。"}, {"text": "256 Bytes", "isCorrect": false, "rationale": "256 Bytes 是 8052 內部 RAM 容量（或 8051 含 SFR 的總資料定址空間）。"}, {"text": "4K Bytes", "isCorrect": true, "rationale": "正確！標準 8051 內建 4K Bytes（4096 Bytes，位址 0000H~0FFFH）程式記憶體。"}], "hint": "8051 內建 4K ROM、128B RAM；8052 則是雙倍（8K ROM、256B RAM）。"}, {"questionNumber": 32, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": true, "examNo": 32, "question": "【考古題 32】8051 共有 16 條位址線（A0 ~ A15），請問它的外部程式記憶體最大可擴充到多大？", "answerOptions": [{"text": "1M Bytes", "isCorrect": false, "rationale": "1M Bytes 需要 20 條位址線（如 8086）。"}, {"text": "16K Bytes", "isCorrect": false, "rationale": "16K Bytes 僅需 14 條位址線（2^14）。"}, {"text": "64K Bytes（2 的 16 次方）", "isCorrect": true, "rationale": "正確！16 條位址線可定址 2^16 = 65,536 Bytes = 64K Bytes。"}, {"text": "4K Bytes", "isCorrect": false, "rationale": "4K Bytes 是內部程式記憶體容量。"}], "hint": "計算 $2^{16} = 2^6 \\times 2^{10} = 64 \\times 1024$ Bytes。"}, {"questionNumber": 33, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": true, "examNo": 33, "question": "【考古題 33】8051 內部資料記憶體（00H ~ 1FH）總共規劃了幾個工作暫存器庫（Register Bank）？", "answerOptions": [{"text": "3 個", "isCorrect": false, "rationale": "不止 3 個。"}, {"text": "4 個（RB0 ~ RB3）", "isCorrect": true, "rationale": "正確！8051 共有 4 個暫存器庫：RB0（00H~07H）、RB1（08H~0FH）、RB2（10H~17H）、RB3（18H~1FH）。"}, {"text": "2 個", "isCorrect": false, "rationale": "不止 2 個。"}, {"text": "1 個", "isCorrect": false, "rationale": "只有 1 組的話中斷發生時就無法快速切換暫存器環境。"}], "hint": "由 PSW 中的 2 個位元（RS1、RS0）組合選擇，2^2 = 4 組。"}, {"questionNumber": 34, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": true, "examNo": 34, "question": "【考古題 34】承上題，8051 的每一個工作暫存器庫（Register Bank）中，各自包含幾個 8 位元暫存器？", "answerOptions": [{"text": "8 個（R0 ~ R7）", "isCorrect": true, "rationale": "正確！每個暫存器庫都有 8 個 8 位元暫存器，分別命名為 R0、R1、R2、R3、R4、R5、R6、R7。"}, {"text": "16 個", "isCorrect": false, "rationale": "16 個是整個可位元定址區的 Byte 數。"}, {"text": "2 個", "isCorrect": false, "rationale": "2 個數量不足。"}, {"text": "4 個", "isCorrect": false, "rationale": "4 個數量不足。"}], "hint": "4 個暫存器庫 × 每個庫 8 個暫存器 = 32 Bytes（00H ~ 1FH）。"}, {"questionNumber": 35, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": true, "examNo": 35, "question": "【考古題 35】8051 內部的資料記憶體（Internal Data Memory）如果包含特殊功能暫存器（SFR）在內，總定址空間大小是多少？", "answerOptions": [{"text": "64K Bytes", "isCorrect": false, "rationale": "64K Bytes 是外部擴充記憶體上限。"}, {"text": "4K Bytes", "isCorrect": false, "rationale": "4K Bytes 是內部程式記憶體 ROM 大小。"}, {"text": "128 Bytes", "isCorrect": false, "rationale": "128 Bytes 僅計算了低半部的 RAM（00H~7FH），未包含高半部的 SFR。"}, {"text": "256 Bytes（00H ~ FFH）", "isCorrect": true, "rationale": "正確！低 128 Bytes 一般 RAM（00H~7FH）加上高 128 Bytes SFR（80H~FFH），共 256 Bytes（8 位元位址可定址空間）。"}], "hint": "內部資料位址由 00H 編號到 FFH，總共是 $2^8 = 256$ 個位址。"}, {"questionNumber": 36, "category": "01. 微算機架構與指令週期", "isPastExam": true, "examNo": 36, "question": "【考古題 36】在 8051 CPU 內部，哪一個暫存器專門用來指向「下一個要執行指令」在程式記憶體中的位置？", "answerOptions": [{"text": "DPTR（資料指標）", "isCorrect": false, "rationale": "DPTR 用來指向外部資料記憶體或程式記憶體查表的資料位址。"}, {"text": "PSW（程式狀態字組）", "isCorrect": false, "rationale": "PSW 儲存進位、溢位等算術旗標與暫存器庫選擇位元。"}, {"text": "PC（程式計數器 Program Counter）", "isCorrect": true, "rationale": "正確！PC（Program Counter，16 位元）永遠存放下一道即將被提取（Fetch）執行之指令的位址。"}, {"text": "SP（堆疊指標）", "isCorrect": false, "rationale": "SP 指向內部資料記憶體中堆疊的最頂端。"}], "hint": "它的英文名字叫做 Program Counter（或 Instruction Pointer）。"}, {"questionNumber": 37, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": true, "examNo": 37, "question": "【考古題 37】在 8051 系統裡，假若堆疊指標暫存器（SP）在中斷發生之前的內容是 30H，當中斷發生後，堆疊指標 SP 的內容會變成多少？", "answerOptions": [{"text": "2EH", "isCorrect": false, "rationale": "2EH 是 SP 減 2 的結果（中斷返回 RETI 後才會變回 30H）。"}, {"text": "32H", "isCorrect": true, "rationale": "正確！中斷發生時，16 位元的 PC（PCL 與 PCH 共 2 Bytes）會依序推入堆疊，SP 每次推入加 1，總共加 2 成為 32H。"}, {"text": "31H", "isCorrect": false, "rationale": "31H 只存入了 1 個 Byte，但程式計數器 PC 是 16 位元（2 Bytes）。"}, {"text": "30H", "isCorrect": false, "rationale": "中斷發生時必須保存返回位址，SP 不會停留在 30H。"}], "hint": "堆疊寬度只有 8 bits，但要存進去的是 16 bits 的程式計數器 PC，所以要占兩格！"}, {"questionNumber": 38, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": true, "examNo": 38, "question": "【考古題 38】8051 的堆疊（Stack）是配置在哪一種記憶體空間裡面？", "answerOptions": [{"text": "內部資料記憶體（Internal RAM）", "isCorrect": true, "rationale": "正確！8051 的堆疊指標 SP 為 8 位元，只能在內部資料記憶體 RAM（通常設定在 30H~7FH）中運作。"}, {"text": "特殊功能暫存器（SFR）", "isCorrect": false, "rationale": "SFR 空間（80H~FFH）用於控制硬體暫存器，不可當作堆疊區。"}, {"text": "外部程式記憶體（External ROM）", "isCorrect": false, "rationale": "外部程式記憶體不可作為堆疊空間。"}, {"text": "內部程式記憶體（Internal ROM）", "isCorrect": false, "rationale": "ROM 只能讀取不能在執行中動態寫入堆疊資料。"}], "hint": "中斷或副程式發生時需要隨時「讀寫」返回位址，因此必須放在內部可讀寫的 RAM 中。"}, {"questionNumber": 39, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": true, "examNo": 39, "question": "【考古題 39】關於 8051 堆疊指標（SP）的運作特性，下列敘述何者正確？", "answerOptions": [{"text": "SP 儲存最後一筆推入堆疊資料的位置（即堆疊的最頂端）", "isCorrect": true, "rationale": "正確！SP 永遠指向堆疊區最頂端（最後一筆推入資料所在）的內部 RAM 位址。"}, {"text": "PUSH 資料時 SP 會自動減 1", "isCorrect": false, "rationale": "8051 堆疊是由低位址往高位址生長，PUSH 時 SP 是「加 1」。"}, {"text": "SP 永遠固定指向 07H 不可更改", "isCorrect": false, "rationale": "Reset 後初值為 07H，但可用 `MOV SP, #30H` 修改。"}, {"text": "SP 指向下一個尚未存入資料的空白位址", "isCorrect": false, "rationale": "8051 的 SP 指向的是「目前已有最新資料」的頂端位置，所以 PUSH 時才要先 SP+1 再寫入。"}], "hint": "回想筆記原話：「堆疊指標指到堆疊的最高點，指標指向位置有資料。」"}, {"questionNumber": 40, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": true, "examNo": 40, "question": "【考古題 40】下列有關 8051 堆疊（Stack）的敘述，何者「不正確」？", "answerOptions": [{"text": "Reset 後 SP 預設值為 07H，程式開頭常將其改設為 30H", "isCorrect": false, "rationale": "正確敘述：將 SP 移至 30H 可避免覆蓋 RB1~RB3 與位元定址區。"}, {"text": "當堆疊推入過多資料超出內部 RAM 上限時會發生 Stack Overflow", "isCorrect": false, "rationale": "正確敘述：堆疊超出 7FH 就會產生堆疊溢位（Stack Overflow）。"}, {"text": "堆疊指標（SP）指向的位置是程式記憶體（ROM）", "isCorrect": true, "rationale": "本選項不正確！SP 指向的是「內部資料記憶體（RAM）」，絕非程式記憶體（ROM）。"}, {"text": "堆疊遵循後進先出（LIFO）原則", "isCorrect": false, "rationale": "正確敘述：最後 PUSH 進去的資料會最先被 POP 出來。"}], "hint": "ROM 無法在程式執行時寫入資料，因此堆疊絕對不可能放在程式記憶體中。"}, {"questionNumber": 41, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": true, "examNo": 41, "question": "【考古題 41】在 8051 電路中，若第 31 支接腳（EA/VPP）接至高電位 VCC（+5V），則 CPU 優先讀取哪裡的程式記憶體？（註：若改為接地 GND 則只讀取外部）", "answerOptions": [{"text": "內部程式記憶體（Internal ROM）", "isCorrect": true, "rationale": "正確！EA（External Access）為低態有效；接 VCC（+5V）代表正常優先使用內部程式記憶體（若程式超過 4K 才會自動轉往外部）。"}, {"text": "外部資料記憶體（External RAM）", "isCorrect": false, "rationale": "EA 腳位控制的是程式記憶體（Code Memory），而非資料記憶體。"}, {"text": "僅能執行單步除錯模式", "isCorrect": false, "rationale": "與單步除錯無關。"}, {"text": "外部程式記憶體（External ROM）", "isCorrect": false, "rationale": "EA 接地（0V）時，才會完全忽略內部 ROM 而強制從外部程式記憶體讀取指令。"}], "hint": "EA 上面有一條橫線（低態有效），所以接高電位 VCC 代表「不強制外部存取」，先用內部的！"}, {"questionNumber": 42, "category": "08. 組合語言指令與開發實作", "isPastExam": true, "examNo": 42, "question": "【考古題 42】在實驗課程的霹靂燈程式中，所使用的時間延遲副程式（DELAY，包含 R5、R6、R7 暫存器）相當於幾層巢狀迴圈？", "answerOptions": [{"text": "3 層", "isCorrect": true, "rationale": "正確！最內層 `DJNZ R7, $`、中間層 `DJNZ R6, DEL`、最外層 `DJNZ R5, DELAY`，共 3 層巢狀迴圈。"}, {"text": "1 層", "isCorrect": false, "rationale": "單層迴圈最多只能計數 256 次，無法達到 200ms 延遲。"}, {"text": "2 層", "isCorrect": false, "rationale": "2 層迴圈（R6 與 R7）約產生 20ms 基本延遲，還需要外層 R5。"}, {"text": "4 層", "isCorrect": false, "rationale": "程式中並未用到第 4 個計數暫存器。"}], "hint": "數數看延遲副程式裡總共用了幾個 `DJNZ` 指令（R7、R6、R5）。"}, {"questionNumber": 43, "category": "08. 組合語言指令與開發實作", "isPastExam": true, "examNo": 43, "question": "【考古題 43】在查表法霹靂燈實驗中，查表指令「MOVC A, @A+DPTR」所搬移的資料來源位於哪一種記憶體？", "answerOptions": [{"text": "內部資料記憶體（RAM）", "isCorrect": false, "rationale": "搬移內部 RAM 資料使用的是 `MOV` 指令。"}, {"text": "特殊功能暫存器（SFR）", "isCorrect": false, "rationale": "存取 SFR 使用的是 `MOV` 指令。"}, {"text": "程式記憶體（ROM / Code Memory）", "isCorrect": true, "rationale": "正確！MOVC 中的「C」代表 Code（程式碼），專門從程式記憶體（ROM）中讀取事先用 `DB` 定義的靜態資料表。"}, {"text": "外部資料記憶體（RAM）", "isCorrect": false, "rationale": "搬移外部資料記憶體使用的是 `MOVX`（External）指令。"}], "hint": "指令字尾 `MOVC` 的 C 就是 Code Memory（程式記憶體）的縮寫。"}, {"questionNumber": 44, "category": "08. 組合語言指令與開發實作", "isPastExam": true, "examNo": 44, "question": "【考古題 44】承上題，在查表法霹靂燈程式中（`TABLE: DB 07EH, 0BDH, 0DBH, 0E7H, 0DBH, 0BDH`），當 DPTR 指向 TABLE 起始位址且累加器 A 的內容為 0 時，執行「MOVC A, @A+DPTR」後，A 的內容為何？", "answerOptions": [{"text": "0E7H", "isCorrect": false, "rationale": "0E7H 是 A = 3 時（3 + TABLE）查到的第四筆資料。"}, {"text": "0BDH", "isCorrect": false, "rationale": "0BDH 是 A = 1 時（1 + TABLE）查到的第二筆資料。"}, {"text": "0DBH", "isCorrect": false, "rationale": "0DBH 是 A = 2 或 A = 4 時查到的資料。"}, {"text": "07EH", "isCorrect": true, "rationale": "正確！A + DPTR = 0 + TABLE，讀取表格第 0 筆（第一筆）資料，即 07EH（0111 1110B，點亮最外側兩顆燈 D7 與 D0）。"}], "hint": "索引值 `A = 0` 代表偏移量為 0，直接抓取 `TABLE` 標籤正指著的第一個數值。"}, {"questionNumber": 45, "category": "08. 組合語言指令與開發實作", "isPastExam": true, "examNo": 45, "question": "【考古題 45】在 8051 組合語言指令中，錢字號「$」（例如 `DJNZ R7, $` 或 `JMP $`）代表什麼意思？", "answerOptions": [{"text": "代表堆疊指標 SP 目前的內容", "isCorrect": false, "rationale": "與堆疊指標 SP 無關。"}, {"text": "代表十六進位數值的前置符號", "isCorrect": false, "rationale": "8051 十六進位是在數字後方加 `H`（如 `30H`），不是前面加 `$`。"}, {"text": "代表該行指令本身在程式記憶體中的位置（位址）", "isCorrect": true, "rationale": "正確！`$` 代表目前這一道指令所在的程式記憶體位址，因此 `DJNZ R7, $` 就是原地跳躍重複執行自己直到 R7 減為 0。"}, {"text": "代表程式結束的標記", "isCorrect": false, "rationale": "程式結束的假指令是 `END`。"}], "hint": "在 `JMP $` 裡，CPU 會一直跳回這一行自己，形成原地踏步的無窮迴圈。"}, {"questionNumber": 46, "category": "08. 組合語言指令與開發實作", "isPastExam": true, "examNo": 46, "question": "【考古題 46】在課本與實驗室的 8051 單晶片主程式中（如霹靂燈主迴圈最後加上 `JMP NEXT` 或中斷主程式的 `JMP $`），程式執行起來有沒有結束的時候？", "answerOptions": [{"text": "有，執行 256 次後會自動停止", "isCorrect": false, "rationale": "不會在 256 次後自動停止。"}, {"text": "有，執行完一遍 LED 閃爍後 CPU 就會自動關機", "isCorrect": false, "rationale": "單晶片嵌入式系統若跑飛或停止會造成失控，因此不會自動關機。"}, {"text": "有，遇到 `END` 指令時 CPU 就會停止運作", "isCorrect": false, "rationale": "`END` 只是給組譯器看的假指令，不會讓實際硬體 CPU 停下來。"}, {"text": "沒有，它是一個無窮迴圈（Infinite Loop），只要不斷電就會持續執行", "isCorrect": true, "rationale": "正確！微控制器主程式都會設計成無窮迴圈（Infinite Loop），持續監控或控制周邊設備直到電源關閉或 Reset。"}], "hint": "嵌入式系統沒有作業系統可以「關閉視窗返回桌面」，主程式必須永遠在迴圈裡待命。"}, {"questionNumber": 47, "category": "08. 組合語言指令與開發實作", "isPastExam": true, "examNo": 47, "question": "【考古題 47】這個學期使用課堂開發工具編譯連結完成後，最終下載（燒錄）到 8051 實驗板執行的可燒錄檔案副檔名為何？", "answerOptions": [{"text": ".exe", "isCorrect": false, "rationale": "`.exe` 是 PC 端 Windows 執行的工具程式（如 X8051.EXE），不能燒進 8051。"}, {"text": ".obj", "isCorrect": false, "rationale": "`.obj` 是經過組譯器（X8051）翻譯後產生的目的碼檔案。"}, {"text": ".tsk", "isCorrect": true, "rationale": "正確！經過 `LINK4.EXE` 連結打包後產生的 `.tsk` 檔才是下載燒錄進開發板的二進位可執行檔。"}, {"text": ".asm", "isCorrect": false, "rationale": "`.asm` 是人類撰寫的組合語言原始程式碼檔案。"}], "hint": "開發流程三階段副檔名依序是：`.asm` → `.obj` → `.tsk`。"}, {"questionNumber": 48, "category": "08. 組合語言指令與開發實作", "isPastExam": true, "examNo": 48, "question": "【考古題 48】開發 8051 程式時，我們在文字編輯器中撰寫的組合語言「原始檔（Source Code）」，其副檔名為何？", "answerOptions": [{"text": ".tsk", "isCorrect": false, "rationale": "`.tsk` 是連結後的可執行燒錄檔（Task / Executable Code）。"}, {"text": ".asm", "isCorrect": true, "rationale": "正確！Assembly Language 原始程式碼的標準副檔名為 `.asm`。"}, {"text": ".obj", "isCorrect": false, "rationale": "`.obj` 是組譯後的目的碼（Object Code）。"}, {"text": ".lst", "isCorrect": false, "rationale": "`.lst` 是組譯時產生的列表清單檔（List File）。"}], "hint": "取英文 Assembly（組語）的前三個字母。"}, {"questionNumber": 49, "category": "08. 組合語言指令與開發實作", "isPastExam": true, "examNo": 49, "question": "【考古題 49】撰寫好的 `.asm` 原始檔經過組譯器（`X8051.EXE`）組譯（Assemble）之後，會產生什麼副檔名的「目的碼（Object Code）」檔案？", "answerOptions": [{"text": ".dll", "isCorrect": false, "rationale": "`.dll` 是 Windows 系統的動態連結函式庫。"}, {"text": ".asm", "isCorrect": false, "rationale": "`.asm` 是組譯前的原始檔。"}, {"text": ".tsk", "isCorrect": false, "rationale": "`.tsk` 必須再經過 LINK4 連結器處理後才會產生。"}, {"text": ".obj", "isCorrect": true, "rationale": "正確！組譯器將組合語言翻譯成機械碼後，會輸出 `.obj`（Object File）目的碼檔案。"}], "hint": "取英文 Object（目的碼）的前三個字母。"}, {"questionNumber": 50, "category": "08. 組合語言指令與開發實作", "isPastExam": true, "examNo": 50, "question": "【考古題 50】在使用 `LINK4.EXE` 連結程式時，如果要產生可下載燒錄的二進位執行檔（`.tsk`），課堂實作中要輸入哪一個參數選項？", "answerOptions": [{"text": "A", "isCorrect": false, "rationale": "並非參數 A。"}, {"text": "D", "isCorrect": false, "rationale": "`-D` 是前面執行 `X8051` 組譯器時用來產生除錯資訊的參數（見 `Test.bat`）。"}, {"text": "X", "isCorrect": true, "rationale": "正確！課堂筆記明確記錄在使用 `LINK4.EXE` 產生二進位燒錄檔（`.tsk`）時，需選用參數 `X`（Executable）。"}, {"text": "R", "isCorrect": false, "rationale": "並非參數 R。"}], "hint": "回想同學筆記第 10 頁開發流程圖：「LINK4.EXE 選以參數 X 產生燒錄檔（.tsk）」。"}, {"questionNumber": 51, "category": "01. 微算機架構與指令週期", "isPastExam": false, "examNo": null, "question": "微處理器（Microprocessor，μP）的核心架構是由哪兩個單元共同組成中央處理單元（CPU）？", "answerOptions": [{"text": "ROM（唯讀記憶體）與 RAM（隨機存取記憶體）", "isCorrect": false, "rationale": "ROM 與 RAM 屬於記憶單元（MU）。"}, {"text": "UART（串列埠）與 Timer（計時器）", "isCorrect": false, "rationale": "UART 與 Timer 是微控制器整合的周邊介面。"}, {"text": "MU（記憶單元）與 IU（輸入單元）", "isCorrect": false, "rationale": "MU 與 IU 是電腦五大單元中的記憶體與輸入單元，不屬於 CPU 內部核心。"}, {"text": "ALU（算術邏輯單元）與 CU（控制單元）", "isCorrect": true, "rationale": "正確！ALU（Arithmetic Logic Unit）負責運算，CU（Control Unit）負責解碼與發送控制訊號，兩者合稱 CPU。"}], "hint": "CPU 負責「算數（ALU）」與「指揮控制（CU）」。"}, {"questionNumber": 52, "category": "01. 微算機架構與指令週期", "isPastExam": false, "examNo": null, "question": "微控制器（Microcontroller，μC，又稱單晶片或單片機）與一般微處理器（μP）在硬體架構上的最大差異為何？", "answerOptions": [{"text": "微控制器內部不包含任何記憶體，必須全部外接", "isCorrect": false, "rationale": "微控制器內建 ROM 與 RAM，不需要外接記憶體即可獨立運作。"}, {"text": "微控制器的運算速度一定比微處理器快 100 倍", "isCorrect": false, "rationale": "一般而言，微處理器（如電腦 CPU）運算能力較強、價格較貴，微控制器強調控制整合與低成本。"}, {"text": "微控制器只能執行邏輯運算，沒有算術運算單元 ALU", "isCorrect": false, "rationale": "微控制器內部具備完整的 ALU 與 CU。"}, {"text": "微控制器將 CPU、記憶單元（MU）與輸出入單元（IU/OU）等五大單元全部整合在同一顆晶片內", "isCorrect": true, "rationale": "正確！Single-Chip Microcomputer（單晶片）就是將電腦五大單元全部整合進單一 IC 封裝中。"}], "hint": "「單晶片」的意思就是把整台微電腦的五大單元都塞進一顆晶片裡。"}, {"questionNumber": 53, "category": "01. 微算機架構與指令週期", "isPastExam": false, "examNo": null, "question": "關於電腦五大單元英文縮寫與中文名稱的配對，下列哪一組「完全正確」？", "answerOptions": [{"text": "CPU：中央周邊單元；MU：微處理單元；ALU：位址栓鎖單元", "isCorrect": false, "rationale": "CPU 為 Central Processing Unit（中央處理單元）。"}, {"text": "ALU：自動載入單元；CU：計數單元；MU：多工單元", "isCorrect": false, "rationale": "英文縮寫全名皆誤。"}, {"text": "ALU：算術邏輯單元；CU：控制單元；MU：記憶單元", "isCorrect": true, "rationale": "正確！Arithmetic Logic Unit（ALU）、Control Unit（CU）、Memory Unit（MU）、Input Unit（IU）、Output Unit（OU）。"}, {"text": "IU：中斷單元；OU：溢位單元；CU：時脈單元", "isCorrect": false, "rationale": "IU 為 Input Unit（輸入單元），OU 為 Output Unit（輸出單元）。"}], "hint": "M = Memory，I = Input，O = Output。"}, {"questionNumber": 54, "category": "01. 微算機架構與指令週期", "isPastExam": false, "examNo": null, "question": "課堂筆記中比較微處理機（μP）與微控制器（μC）的成本與定位時，為什麼指出「微處理機比較貴」？", "answerOptions": [{"text": "因為微處理機使用的是真空管製程", "isCorrect": false, "rationale": "現代微處理機皆為 CMOS 積體電路。"}, {"text": "因為微處理機只能使用組合語言撰寫", "isCorrect": false, "rationale": "微處理機與微控制器皆可使用 C 語言或組合語言開發。"}, {"text": "因為微處理機裡面內建了大容量的硬碟", "isCorrect": false, "rationale": "微處理機內部不包含硬碟。"}, {"text": "因為微處理機的運算能力比微控制器強", "isCorrect": true, "rationale": "正確！筆記中明確寫道：「微處理機比較貴，因為運算能力比微控制器好」。"}], "hint": "筆記第 4 頁（你的筆記第 1 頁）下方有特別寫出這句話。"}, {"questionNumber": 55, "category": "01. 微算機架構與指令週期", "isPastExam": false, "examNo": null, "question": "標準 8051 微控制器總共有多少個指令碼（Instruction Codes）以及多少種指令格式？", "answerOptions": [{"text": "64 個指令碼、8 種指令格式", "isCorrect": false, "rationale": "此為誤導數字。"}, {"text": "111 個指令碼、11 種指令格式", "isCorrect": true, "rationale": "正確！根據 Ch1「8051 之規格」與同學筆記第 1 頁，標準 8051 共有 111 個指令碼、11 種指令格式。"}, {"text": "32 個指令碼、4 種指令格式", "isCorrect": false, "rationale": "32 個指令是精簡指令集（RISC）常見的規模。"}, {"text": "256 個指令碼、16 種指令格式", "isCorrect": false, "rationale": "8 位元 Opcode 理論上有 256 個編碼空間，但 8051 實際定義了 111 個指令碼（其中 A5H 保留未使用）。"}], "hint": "兩個數字都是由「1」組成的：111 與 11。"}, {"questionNumber": 56, "category": "01. 微算機架構與指令週期", "isPastExam": false, "examNo": null, "question": "在 MCS-51 系列家族中，下列哪兩顆型號內部「沒有」建置任何程式記憶體（0K ROM），必須外接 ROM 才能執行程式？", "answerOptions": [{"text": "8051 與 8052", "isCorrect": false, "rationale": "8051（4K）與 8052（8K）內建出廠燒死的 Mask ROM（光罩式唯讀記憶體）。"}, {"text": "8751 與 8752", "isCorrect": false, "rationale": "8751（4K）與 8752（8K）內建可用紫外線清除的 EPROM（晶片上有石英玻璃窗）。"}, {"text": "89C51 與 89C52", "isCorrect": false, "rationale": "89C51（4K）與 89C52（8K）內建可用電氣抹除重複燒錄的 EEPROM / Flash。"}, {"text": "8031 與 8032", "isCorrect": true, "rationale": "正確！型號中間為「3」的 8031 與 8032 屬於無 ROM 型（ROMless），必須將 EA 接地並外接程式記憶體。"}], "hint": "型號編碼口訣：0 = Mask ROM，3 = 無 ROM，7 = EPROM，9 = EEPROM/Flash。"}, {"questionNumber": 57, "category": "01. 微算機架構與指令週期", "isPastExam": false, "examNo": null, "question": "MCS-51 系列晶片中，8751 與 89C51 內建程式記憶體的主要技術差異為何？", "answerOptions": [{"text": "8751 為 16 位元 CPU，89C51 為 8 位元 CPU", "isCorrect": false, "rationale": "兩者皆為 8 位元微控制器。"}, {"text": "8751 為無 ROM 型，89C51 為 Mask ROM 型", "isCorrect": false, "rationale": "8031 才是無 ROM 型，8051 才是 Mask ROM 型。"}, {"text": "8751 內建 8K ROM，89C51 內建 4K ROM", "isCorrect": false, "rationale": "8751 與 89C51 兩者內建 ROM 容量皆為 4K Bytes。"}, {"text": "8751 為紫外線抹除式 EPROM，89C51 為電氣抹除式 EEPROM（Flash）", "isCorrect": true, "rationale": "正確！8751 需用紫外線照射石英視窗抹除資料，89C51 則可透過燒錄器直接以電氣訊號抹除並重複燒錄。"}], "hint": "87 系列晶片頂端通常有一個圓形透明視窗，89C 系列則是全黑塑膠封裝。"}, {"questionNumber": 58, "category": "01. 微算機架構與指令週期", "isPastExam": false, "examNo": null, "question": "比較 MCS-51 系列的「51 類（如 89C51）」與「52 類（如 89C52）」，下列哪一項規格在「52 類」中獲得擴增？", "answerOptions": [{"text": "內建 16K Bytes ROM、512 Bytes RAM、4 個 16 位元計時器、8 個中斷源", "isCorrect": false, "rationale": "容量沒有擴增到 16K/512B。"}, {"text": "資料匯流排由 8 位元升級為 16 位元", "isCorrect": false, "rationale": "52 類仍為 8 位元微控制器。"}, {"text": "內建 8K Bytes ROM、256 Bytes RAM、3 個 16 位元計時器、6 個中斷源", "isCorrect": true, "rationale": "正確！52 類相比 51 類：ROM 加倍（4K→8K）、RAM 加倍（128B→256B）、計時器多 1 個（新增 Timer 2）、中斷源多 1 個（6 個）。"}, {"text": "新增 2 組 8 位元 I/O 埠（變成 P0 ~ P5 共 6 組埠）", "isCorrect": false, "rationale": "52 類依然維持 P0、P1、P2、P3 四組 8 位元 I/O 埠（只是 P1.0 與 P1.1 增加了 T2 與 T2EX 第二功能）。"}], "hint": "52 類的記憶體容量剛好是 51 類的兩倍，並多了一個 Timer 2。"}, {"questionNumber": 59, "category": "01. 微算機架構與指令週期", "isPastExam": false, "examNo": null, "question": "在 8051 的三種常見 IC 包裝型式中，哪一種為「針腳式包裝（PDIP-40）」，最適用於學校教學與實驗室麵包板插拔？", "answerOptions": [{"text": "BGA（球柵陣列封裝）", "isCorrect": false, "rationale": "標準傳統 8051 未使用 BGA 封裝。"}, {"text": "DIP（針腳式包裝）", "isCorrect": true, "rationale": "正確！雙列直插式針腳包裝（PDIP-40）兩側有 40 支長針腳，可直接插在麵包板或 IC 座上，最適合學校與實驗室。"}, {"text": "PLCC（塑膠有引腳晶片載體）", "isCorrect": false, "rationale": "PLCC 為正方形四面 J 型引腳，需搭配專用 PLCC 轉接座，適用於實驗室及量產。"}, {"text": "QFP（四方扁平封裝）", "isCorrect": false, "rationale": "QFP 接腳細密且平貼表面，主要用於工廠自動化表面黏著（SMT）量產。"}], "hint": "看看實驗室電路圖上標示的 `DIP40` 或 `PDIP40`。"}, {"questionNumber": 60, "category": "01. 微算機架構與指令週期", "isPastExam": false, "examNo": null, "question": "關於 8051 常見包裝型式的適用場合，下列配對何者正確？", "answerOptions": [{"text": "QFP 包裝：適用於量產；PLCC 包裝：適用於實驗室及量產；針腳式（DIP）包裝：適用於學校與實驗室", "isCorrect": true, "rationale": "正確！這與 Ch1 投影片第 8~11 頁的標註完全一致。"}, {"text": "QFP 包裝：僅適用於麵包板手焊；針腳式（DIP）包裝：僅適用於手機主機板量產", "isCorrect": false, "rationale": "兩者適用場合完全寫反了。"}, {"text": "PLCC 包裝：完全沒有金屬接腳；QFP 包裝：共有 80 支長針腳", "isCorrect": false, "rationale": "PLCC 四周有向內彎曲的 J 型金屬接腳；QFP 常見為 44 腳。"}, {"text": "三種包裝的接腳排列順序與編號完全一模一樣", "isCorrect": false, "rationale": "PDIP 為 40 腳，而 PLCC 與 QFP 通常為 44 腳（多了 4 支 NC 空腳），接腳編號不同。"}], "hint": "Ch1 投影片第 8、9、11 頁分別在圖片下方註明了這三種封裝的適用對象。"}, {"questionNumber": 61, "category": "01. 微算機架構與指令週期", "isPastExam": false, "examNo": null, "question": "精簡指令集電腦（RISC，如 STM32、ARM、RISC-V）與複雜指令集電腦（CISC，如 8051）在指令長度與提取（Fetch）機制上有何差異？", "answerOptions": [{"text": "RISC 指令長度固定（如 32 bits），每個週期固定提取相同位元組數；CISC 指令長度不固定，8051 每個提取週期固定提取 1 個 Byte", "isCorrect": true, "rationale": "正確！同學筆記第 3 頁明確對比：CISC（8051）指令長度不同，每個 Cycle 固定提取 1 個 byte（可能由 Decode 回授繼續 Fetch）；RISC（ARM）指令長度固定，每個 Cycle 固定 Fetch 固定 byte 數。"}, {"text": "RISC 沒有解碼（Decode）步驟；CISC 沒有寫回（Write Back）步驟", "isCorrect": false, "rationale": "兩者皆包含完整的指令週期階段。"}, {"text": "RISC 與 CISC 的機械碼長度完全相同", "isCorrect": false, "rationale": "指令長度特性完全不同。"}, {"text": "RISC 指令長度不固定，每次提取 1 ~ 8 Bytes；CISC 指令長度固定為 2 Bytes", "isCorrect": false, "rationale": "特徵完全顛倒。"}], "hint": "RISC 的 R 是 Reduced（精簡/規則化），所以每道指令都一樣長。"}, {"questionNumber": 62, "category": "01. 微算機架構與指令週期", "isPastExam": false, "examNo": null, "question": "在微處理機的數值表示法中，有號數（Signed Number，包含正負號的整數）是採用哪一種編碼方式來儲存與運算？", "answerOptions": [{"text": "BCD 碼（二進位編碼十進位）", "isCorrect": false, "rationale": "BCD 碼是用 4 bits 表示一位十進位數字（0~9），不含正負號。"}, {"text": "1 的補數（1's Complement）", "isCorrect": false, "rationale": "1 的補數存在 +0（00000000）與 -0（11111111）兩個零，不適合微處理機運算。"}, {"text": "2 的補數（2's Complement）", "isCorrect": true, "rationale": "正確！筆記第 39 頁明確指出：「有號數在微處理機中為 2 的補數表示」，這樣加法與減法可共用同一套硬體加法器且沒有 +0/-0 問題。"}, {"text": "格雷碼（Gray Code）", "isCorrect": false, "rationale": "格雷碼相鄰數值僅差 1 個位元，常用於旋轉編碼器，非有號數運算。"}], "hint": "對二進位數值「取反相再加 1」就是這種表示法。"}, {"questionNumber": 63, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "在 PDIP-40 封裝的標準 8051 晶片中，主電源接腳 VCC（+5V）與接地接腳 GND 分別位於第幾支接腳？", "answerOptions": [{"text": "VCC 為 Pin 40，GND 為 Pin 20", "isCorrect": true, "rationale": "正確！8051 採用標準右上角（Pin 40）接 VCC、左下角（Pin 20）接 GND 的對角供電配置。"}, {"text": "VCC 為 Pin 31，GND 為 Pin 9", "isCorrect": false, "rationale": "Pin 31 是 EA/VPP，Pin 9 是 RST。"}, {"text": "VCC 為 Pin 1，GND 為 Pin 40", "isCorrect": false, "rationale": "Pin 1 是 P1.0。"}, {"text": "VCC 為 Pin 20，GND 為 Pin 40", "isCorrect": false, "rationale": "接反會直接燒毀 8051 晶片！"}], "hint": "40 支腳的晶片，最後一隻腳（40）接電源，正中間那隻腳（20）接地。"}, {"questionNumber": 64, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "當 8051 存取外部程式記憶體（ROM）時，哪一支控制接腳會輸出低態有效訊號（PSEN = 0）以致能外部 ROM 輸出指令碼？", "answerOptions": [{"text": "RD（Pin 17 / P3.7）", "isCorrect": false, "rationale": "RD（P3.7）是用來讀取「外部資料記憶體（RAM）」的，讀取外部 ROM 時不會動作。"}, {"text": "PSEN（Pin 29，Program Store Enable）", "isCorrect": true, "rationale": "正確！PSEN（Program Store Enable，程式儲存致能）專門在讀取外部程式記憶體時變為低電位（0V）。"}, {"text": "ALE（Pin 30，Address Latch Enable）", "isCorrect": false, "rationale": "ALE 是用來栓鎖低 8 位元位址（A0~A7）的訊號，不是讀取 ROM 資料的致能腳。"}, {"text": "WR（Pin 16 / P3.6）", "isCorrect": false, "rationale": "WR（P3.6）是用來寫入「外部資料記憶體（RAM）」的。"}], "hint": "縮寫全名為 Program Store Enable（程式儲存致能）。"}, {"questionNumber": 65, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "因為 Port 0 採用位址（AD0~AD7）與資料（D0~D7）分時多工設計，外部擴充記憶體時必須搭配哪一顆栓鎖器 IC，並由 8051 的哪一支接腳控制？", "answerOptions": [{"text": "74LS121 單穩態振盪器，由 RST（Pin 9）控制", "isCorrect": false, "rationale": "74LS121 是用來產生開機或切換模式 Reset 單擊脈波的。"}, {"text": "74LS373 八位元栓鎖器，由 ALE（Pin 30）控制其栓鎖致能腳 G", "isCorrect": true, "rationale": "正確！當 ALE（Address Latch Enable）為高電位時，74LS373 透明通過低 8 位元位址；ALE 下降為低電位時，74LS373 將 A0~A7 鎖住，讓 Port 0 騰出來傳輸資料 D0~D7。"}, {"text": "ADC0804 轉換器，由 INT0（Pin 12）控制", "isCorrect": false, "rationale": "ADC0804 是類比數位轉換晶片。"}, {"text": "74LS138 解碼器，由 PSEN（Pin 29）控制", "isCorrect": false, "rationale": "74LS138 是用來解碼高位址（A13~A15）產生晶片選擇訊號（CS）的。"}], "hint": "見開發板電路圖 U9（74LS373 DIP20），其第 11 腳 G 直接連到 AT89C51 的第 30 腳 ALE/PROG。"}, {"questionNumber": 66, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "在開發板電路圖中，74LS373（U9）的輸出致能控制腳 `OC`（Pin 1，低態有效）接至 GND，而 `G`（Pin 11）接至 `ALE`，請問當 `ALE = 0` 時，74LS373 的輸出端 Q0~Q7 狀態為何？", "answerOptions": [{"text": "全部變成高阻抗浮接狀態（High-Z）", "isCorrect": false, "rationale": "只有當 OC = 1 時輸出才會進入高阻抗（High-Z）。"}, {"text": "即時隨 Port 0 的資料匯流排 D0~D7 同步變化", "isCorrect": false, "rationale": "G = 1 時才是透明傳輸（隨輸入同步變化），G = 0 則鎖住不隨輸入改變。"}, {"text": "全部自動歸零為 00H", "isCorrect": false, "rationale": "不會自動歸零。"}, {"text": "維持鎖存先前 ALE = 1 時輸入的 A0~A7 位址資料不變", "isCorrect": true, "rationale": "正確！因為 OC = 0 保持輸出致能，當 G（ALE）由 1 變為 0 時，74LS373 進入「栓鎖（Latch）」狀態，持續穩定輸出 A0~A7 位址給記憶體。"}], "hint": "栓鎖器（Latch）的目的就是在 Port 0 改傳資料 D0~D7 期間，幫記憶體「死死記住」剛剛的位址 A0~A7。"}, {"questionNumber": 67, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "筆記中特別註明實驗室使用的 AT89S51/52 晶片，其第 31 腳 `EA/VPP` 在「下載燒錄程式時」與「執行外部程式碼時」的接法有何注意事項？", "answerOptions": [{"text": "下載與執行時都必須懸空（浮接）", "isCorrect": false, "rationale": "EA 接腳絕對不可懸空，否則會造成程式抓取位置不穩定。"}, {"text": "下載時接地，執行外部程式碼時接 +5V", "isCorrect": false, "rationale": "接法剛好相反。"}, {"text": "下載時接 -12V，執行時接 +12V", "isCorrect": false, "rationale": "89S51/52 只需 +5V 單電源即可操作，不需要 ±12V。"}, {"text": "下載時接 +5V，執行外部程式碼時接地（且必須 Reset）", "isCorrect": true, "rationale": "正確！同學筆記第 1 頁明確提醒：「89S51/52 下載時接 5V，執行外部程式碼時接地（要 Reset）」。"}], "hint": "下載程式是寫入內部 Flash（所以要接 5V 致能內部），執行外部程式碼時才接地。"}, {"questionNumber": 68, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "在 AT89S51/52 微控制器中，P1.5、P1.6、P1.7 這三支接腳除了作為一般 I/O 外，還內建哪一組串列在線燒錄（ISP）第二功能？", "answerOptions": [{"text": "T0（P1.5）、T1（P1.6）、T2（P1.7）", "isCorrect": false, "rationale": "T0、T1 位於 P3.4、P3.5；T2 位於 P1.0（僅 52 系列）。"}, {"text": "TXD（P1.5）、RXD（P1.6）、INT0（P1.7）", "isCorrect": false, "rationale": "TXD、RXD、INT0 位於 Port 3（P3.1、P3.0、P3.2）。"}, {"text": "RD（P1.5）、WR（P1.6）、ALE（P1.7）", "isCorrect": false, "rationale": "RD、WR 位於 P3.7、P3.6；ALE 為獨立接腳 Pin 30。"}, {"text": "MOSI（P1.5）、MISO（P1.6）、SCK（P1.7）", "isCorrect": true, "rationale": "正確！P1.5 = MOSI（主出從入）、P1.6 = MISO（主入從出）、P1.7 = SCK（串列時脈），用於 SPI / ISP 燒錄。"}], "hint": "看看同學筆記第 1 頁 PDIP40 接腳圖左側 P1.5~P1.7 括號內的標示。"}, {"questionNumber": 69, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "課堂開發板上使用的「6116」SRAM 記憶體晶片（DIP24），其型號中的「16」代表記憶體容量為多少？換算成位元組（Bytes）是多少？", "answerOptions": [{"text": "16K Bytes，換算為 128K bits", "isCorrect": false, "rationale": "單位不是 Bytes，而是 bits。"}, {"text": "16K bits，換算為 2K Bytes（2^11 Bytes）", "isCorrect": true, "rationale": "正確！記憶體晶片型號通常以「bit（位元）」為單位，16K bits ÷ 8 bits/Byte = 2K Bytes = 2^1 × 2^10 = 2^11 Bytes。"}, {"text": "16 Bytes，換算為 128 bits", "isCorrect": false, "rationale": "容量是 16K bits（2048 Bytes），不是 16 Bytes。"}, {"text": "16M bits，換算為 2M Bytes", "isCorrect": false, "rationale": "單位是 K（Kilo），不是 M（Mega）。"}], "hint": "記憶體 IC 型號尾數通常是「總位元數（bits）」，除以 8 才是 Bytes。"}, {"questionNumber": 70, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "承上題，因為 6116 SRAM 的容量為 $2^{11}$ Bytes（2048 Bytes），且資料匯流排寬度為 8 bits，請問 6116 晶片總共有幾條位址線（A0 ~ An）？", "answerOptions": [{"text": "8 條位址線（A0 ~ A7）", "isCorrect": false, "rationale": "8 條是資料線（D0 ~ D7）的數量，僅能定址 256 Bytes。"}, {"text": "16 條位址線（A0 ~ A15）", "isCorrect": false, "rationale": "16 條是 8051 整個外部匯流排的位址線總數。"}, {"text": "11 條位址線（A0 ~ A10）", "isCorrect": true, "rationale": "正確！因為 $2^{11} = 2048$ 個位址空間，所以需要 11 條位址線，編號從 A0 到 A10。"}, {"text": "12 條位址線（A0 ~ A11）", "isCorrect": false, "rationale": "12 條位址線可定址 4K Bytes（例如 6264 是 8K Bytes 需 13 條）。"}], "hint": "位址線數量就是 2 的次方數（$2^{11}$ Bytes → 11 條線，從 0 數到 10）。"}, {"questionNumber": 71, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "課堂實驗使用的開發板中，為什麼明明執行的是學生從電腦下載的程式碼，板上卻插著一顆「6116 SRAM（隨機存取記憶體）」而不是 ROM？", "answerOptions": [{"text": "AT89C51 內部預先燒錄了 Bootloader，先將電腦傳來的程式當作外部資料寫入 6116 SRAM（如 MOVX @DPTR, A），再切換電路將 6116 當作外部程式記憶體（ROM）執行", "isCorrect": true, "rationale": "正確！這是課堂開發板的巧妙設計：下載時 6116 接成外部資料記憶體寫入機器碼；切換至 RUN 模式時，6116 的腳位接成外部程式記憶體供 8051 讀取執行。"}, {"text": "因為 8051 只能執行存在 SRAM 裡的程式，完全無法讀取 ROM", "isCorrect": false, "rationale": "標準 8051 正常是讀取 ROM 執行程式。"}, {"text": "6116 只是用來存放 LED 亮滅時間的計時器，沒有放任何程式碼", "isCorrect": false, "rationale": "學生的整個 `.tsk` 機械碼就是下載存放在這顆 2KB 的 6116 裡。"}, {"text": "因為 6116 是一顆紫外線抹除式 EPROM", "isCorrect": false, "rationale": "6116 是靜態隨機存取記憶體（SRAM），斷電資料會消失。"}], "hint": "參考同學筆記第 2 頁右上角文字說明：「於 AT89C51 內已有一個 Bootloader 程式，將 RAM 晶片於電腦上下載的程式...作為程式記憶體存取。」"}, {"questionNumber": 72, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "在開發板電路中，U15（74LS138 DIP16）是一顆 3 對 8 線解碼器，其三個位址輸入端 A、B、C 分別連接至 B13、B14、B15（即位址線 A13、A14、A15），它的主要作用為何？", "answerOptions": [{"text": "根據高位元組位址（A13~A15）的組合產生低態有效的晶片選擇訊號（Y0~Y7），用來致能 6116 記憶體、ADC0804 或 DAC0800 等周邊", "isCorrect": true, "rationale": "正確！74LS138 將 3 條高位址線解碼成 8 個互斥的低態輸出（Y0~Y7），用來進行記憶體映射（Memory Mapping）與周邊 I/O 晶片選擇（CS）。"}, {"text": "將類比電壓轉換成 8 位元數位訊號", "isCorrect": false, "rationale": "負責類比轉數位的是 ADC0804。"}, {"text": "產生 12 MHz 的石英振盪時脈給 8051", "isCorrect": false, "rationale": "產生時脈的是石英晶體，不是解碼器。"}, {"text": "將 8 位元的平行資料轉換成串列資料從 TXD 送出", "isCorrect": false, "rationale": "負責並轉串列的是 UART，不是 74LS138。"}], "hint": "觀察電路圖中 ADC0804 的 `/CS` 腳與 DAC0800 栓鎖器的控制腳，都連到 74LS138 的輸出端 Y1、Y3 等。"}, {"questionNumber": 73, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "當 8051 執行「MOVX @DPTR, A」指令將資料寫入外部記憶體時，16 位元資料指標 DPTR 的高 8 位元（DPH）與低 8 位元（DPL）分別透過哪兩個 Port 送出？", "answerOptions": [{"text": "DPH 由 Port 1 送出，DPL 由 Port 3 送出", "isCorrect": false, "rationale": "Port 1 與 Port 3 不輸出外部記憶體位址。"}, {"text": "DPH 由 Port 2 送出，DPL 由 Port 0（經 74LS373 栓鎖）送出", "isCorrect": true, "rationale": "正確！在 8051 所有 16 位元外部定址（包含 PC 與 DPTR）中，高 8 位元（A8~A15）永遠由 Port 2 送出，低 8 位元（A0~A7）永遠由 Port 0 送出。"}, {"text": "DPH 由 Port 0 送出，DPL 由 Port 2 送出", "isCorrect": false, "rationale": "高低位元組的 Port 位置寫反了。"}, {"text": "DPH 與 DPL 皆由 Port 1 分兩次送出", "isCorrect": false, "rationale": "Port 1 不負責外部匯流排位址輸出。"}], "hint": "記住口訣：低位址（A0~A7）走 P0，高位址（A8~A15）走 P2。"}, {"questionNumber": 74, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "在 8051 的四組輸出入埠（P0、P1、P2、P3）中，哪一組埠在作為一般輸出使用時，因為內部「沒有」內建提升電阻（Pull-up Resistor），必須外接提升電阻才能輸出高電位？", "answerOptions": [{"text": "Port 2", "isCorrect": false, "rationale": "Port 2 內部有提升電阻。"}, {"text": "Port 3", "isCorrect": false, "rationale": "Port 3 內部有提升電阻。"}, {"text": "Port 1", "isCorrect": false, "rationale": "Port 1 內部有提升電阻。"}, {"text": "Port 0", "isCorrect": true, "rationale": "正確！Port 0 為了兼作雙向資料匯流排與三態輸出，其輸出級為開汲極（Open Drain），沒有內部提升電阻；而 P1、P2、P3 皆內建提升電阻。"}], "hint": "只有兼任「資料匯流排（AD0~AD7）」的那一組 Port 沒有內部提升電阻。"}, {"questionNumber": 75, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "當 8051 完成硬體重置（Reset）動作的瞬間，四個輸出入埠（P0、P1、P2、P3）的預設輸出狀態為何？", "answerOptions": [{"text": "全部輸出邏輯 0（即各埠暫存器初值皆為 00H）", "isCorrect": false, "rationale": "8051 Reset 後不是 00H，而是 FFH（若接共陽極 LED 則預設全部熄滅）。"}, {"text": "全部輸出邏輯 1（即各埠暫存器初值皆為 FFH）", "isCorrect": true, "rationale": "正確！你的筆記第 8 頁明確記錄：「8051 在 Reset 之後四個 IO port 都會輸出邏輯 1（FFH）」，這也使得所有接腳預設處於準雙向輸入就緒狀態。"}, {"text": "全部處於隨機不確定狀態", "isCorrect": false, "rationale": "數位系統重置後暫存器必為確定已知狀態。"}, {"text": "P0 與 P2 輸出 00H，P1 與 P3 輸出 FFH", "isCorrect": false, "rationale": "四組 Port 的初值一致，皆為 FFH。"}], "hint": "因為 Reset 後所有 I/O 埠預設為 1，所以共陽極 LED 一開機不會全部亂亮，而且接腳可以直接當輸入讀取！"}, {"questionNumber": 76, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "在開發板上撥動 SW1（RUN / Download mode switch，DPDT 雙刀雙擲開關）切換運作模式時，電路透過哪一顆 IC 產生單擊正脈波（Single Pulse）送入 RST 實現自動 Reset？", "answerOptions": [{"text": "U9（74LS373 DIP20，八位元栓鎖器）", "isCorrect": false, "rationale": "74LS373 是位址栓鎖器。"}, {"text": "U11（ADC0804 DIP20，類比數位轉換器）", "isCorrect": false, "rationale": "ADC0804 是類比數位轉換器。"}, {"text": "U12（74LS121 DIP14，單穩態多諧振盪器）", "isCorrect": true, "rationale": "正確！同學筆記第 4 頁畫出 SW1 撥動時會觸發 74LS121（單穩態多諧振盪器 One-Shot），從 Q 腳輸出一個固定寬度的正脈波送入 8051 的 RST 腳自動重置。"}, {"text": "U15（74LS138 DIP16，3 對 8 解碼器）", "isCorrect": false, "rationale": "74LS138 是位址解碼器。"}], "hint": "在 TTL 邏輯 IC 中，74LS121 就是經典的「單穩態多諧振盪器（One-Shot）」。"}, {"questionNumber": 77, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "在 8051 系統電路中，若使用內部時鐘脈波振盪電路，石英振盪晶體（12 MHz）應連接在 8051 的哪兩支接腳之間？", "answerOptions": [{"text": "Pin 9（RST）與 Pin 20（GND）之間", "isCorrect": false, "rationale": "Pin 9 是重置接腳。"}, {"text": "Pin 40（VCC）與 Pin 20（GND）之間", "isCorrect": false, "rationale": "Pin 40 與 Pin 20 是電源與地。"}, {"text": "Pin 30（ALE）與 Pin 31（EA）之間", "isCorrect": false, "rationale": "Pin 30 與 Pin 31 是外部記憶體控制接腳。"}, {"text": "Pin 18（XTAL2）與 Pin 19（XTAL1），並各接一顆 20pF~30pF 陶瓷電容到地", "isCorrect": true, "rationale": "正確！內部反相放大器的輸入端為 XTAL1（Pin 19）、輸出端為 XTAL2（Pin 18），外接石英晶體與兩顆 20pF~30pF 穩頻陶瓷電容。"}], "hint": "接腳名稱上的 `XTAL` 就是英文 Crystal（石英晶體）的縮寫。"}, {"questionNumber": 78, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "根據 Ch1 投影片「8051 之基本電路」，在麵包板或電路板上搭建 8051 最小系統時，標準建議的接線先後順序為何？", "answerOptions": [{"text": "先接記憶體設定電路 → 再接輸出入埠 → 最後接時鐘脈波", "isCorrect": false, "rationale": "時脈與重置是 CPU 啟動的基礎，應優先於記憶體設定。"}, {"text": "先接 LED 負載 → 再接重置電路 → 最後才接電源", "isCorrect": false, "rationale": "未接好電源與基本控制電路前不應先接負載。"}, {"text": "順序完全沒有差別，可隨意從任何一隻腳開始", "isCorrect": false, "rationale": "依照標準順序搭建與量測，最容易排除硬體故障。"}, {"text": "先接電源 → 再接時鐘脈波 → 重置電路 → 記憶體設定電路", "isCorrect": true, "rationale": "正確！Ch1 投影片第 13 頁明確列出四步驟：1. 先接電源（VCC/GND）→ 2. 再接時鐘脈波（XTAL1/2）→ 3. 重置電路（RST）→ 4. 記憶體設定電路（EA）。"}], "hint": "「有電、有心跳（時脈）、會歸零（重置）、知道去哪抓程式（記憶體設定）」。"}, {"questionNumber": 79, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "在 Ch1 的 8051 基本電路零件表中，搭配 12 MHz 石英振盪晶體的陶瓷電容，以及搭配電源啟動重置（POSR）電路的電解電容，其規格分別為何？", "answerOptions": [{"text": "陶瓷電容 1000μF 2 顆；電解電容 1pF 1 顆", "isCorrect": false, "rationale": "數值完全錯誤。"}, {"text": "陶瓷電容 30pF（或 20pF）2 顆；電解電容 10μF/25V 1 顆", "isCorrect": true, "rationale": "正確！投影片零件表標示 30pF 陶瓷電容 2 個（實驗圖上常見 20pF~30pF）用於晶振穩頻，10μF/25V 電解電容 1 個搭配 10KΩ 電阻用於重置電路。"}, {"text": "陶瓷電容 10μF 2 顆；電解電容 30pF 1 顆", "isCorrect": false, "rationale": "電容數值與種類完全顛倒（pF 等級用於高頻晶振，μF 等級用於毫秒級重置延遲）。"}, {"text": "兩者皆使用 10KΩ 電阻器取代", "isCorrect": false, "rationale": "電容無法直接用電阻取代。"}], "hint": "高頻振盪用皮法拉（pF）級小陶瓷電容；開機重置延遲用微法拉（μF）級電解電容。"}, {"questionNumber": 80, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "若 8051 不使用石英晶體，而是採用「外部時鐘脈波產生電路（例如 TTL 振盪器模組）」提供時脈，則外部時脈訊號應如何連接？", "answerOptions": [{"text": "外部時脈同時並聯接至 XTAL1 與 XTAL2", "isCorrect": false, "rationale": "將同一時脈同時接至反相器的輸入與輸出會造成訊號衝突。"}, {"text": "外部時脈接至 XTAL1（Pin 19），而 XTAL2（Pin 18）空接（浮接）", "isCorrect": true, "rationale": "正確！根據 Ch1 投影片第 15 頁電路圖，在標準 HMOS/CHMOS 8051 中，外部 TTL 時脈輸入至 XTAL1（Pin 19），XTAL2（Pin 18）保持空接（Open）。"}, {"text": "外部時脈接至 ALE（Pin 30）", "isCorrect": false, "rationale": "ALE 是位址栓鎖輸出腳，不是時脈輸入腳。"}, {"text": "外部時脈接至 XTAL2（Pin 18），而 XTAL1（Pin 19）接地", "isCorrect": false, "rationale": "XTAL2 是內部振盪器輸出端，不作為外部時脈輸入端。"}], "hint": "XTAL1 是內部振盪反相器的「輸入端」，外部時脈當然要送進輸入端。"}, {"questionNumber": 81, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "標準 Intel 8051 微控制器所能支援的最高石英振盪器工作頻率（f_osc）上限為多少？", "answerOptions": [{"text": "100 MHz", "isCorrect": false, "rationale": "標準傳統 8051 無法在 100 MHz 下運作。"}, {"text": "4 MHz", "isCorrect": false, "rationale": "4 MHz 低於上限。"}, {"text": "12 MHz", "isCorrect": false, "rationale": "12 MHz 是教學實驗最常使用的頻率，但標準 Intel 8051 最高可支援到 24 MHz。"}, {"text": "24 MHz", "isCorrect": true, "rationale": "正確！你的筆記第 19 頁明確記錄：「標準 Intel 的 8051 的石英振盪器只能用到 24MHz」。"}], "hint": "這個數字剛好是常見實驗晶振頻率（12 MHz）的 2 倍。"}, {"questionNumber": 82, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "若將 8051 的石英振盪晶體從 12 MHz 更換為 24 MHz，則執行一個「2 機械週期（2 Machine Cycles）」的指令（如 `DJNZ` 或 `JMP`）需要多少時間？", "answerOptions": [{"text": "0.5 μs", "isCorrect": false, "rationale": "0.5 μs 是 24 MHz 下「1 個機械週期」的時間。"}, {"text": "1 μs", "isCorrect": true, "rationale": "正確！f_osc = 24 MHz 時，1 個機械週期 = 12 / (24×10^6) = 0.5 μs；執行 2 個機械週期的指令則為 2 × 0.5 μs = 1 μs。"}, {"text": "4 μs", "isCorrect": false, "rationale": "4 μs 是 12 MHz 下執行 4 個機械週期指令（如 MUL AB）的時間。"}, {"text": "2 μs", "isCorrect": false, "rationale": "2 μs 是 12 MHz 下執行 2 個機械週期指令的時間。"}], "hint": "頻率變 2 倍，時間減半：24 MHz 下 1 機械週期為 0.5 μs。"}, {"questionNumber": 83, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "標準 8051 指令集中，每一道指令的執行時間皆為機械週期的整數倍，其範圍介於多少個機械週期之間？", "answerOptions": [{"text": "1 ~ 2 個機械週期", "isCorrect": false, "rationale": "乘法與除法指令需要 4 個機械週期。"}, {"text": "固定皆為 1 個機械週期", "isCorrect": false, "rationale": "那是單週期 RISC 的特性，非標準 8051。"}, {"text": "4 ~ 12 個機械週期", "isCorrect": false, "rationale": "大部分指令為 1 或 2 個機械週期，沒有超過 4 個機械週期的指令。"}, {"text": "1 ~ 4 個機械週期", "isCorrect": true, "rationale": "正確！你的筆記第 19 頁明確寫道：「8051 當中的指令執行時間都是機械週期的整數倍時間，1~4 個機械週期」（例如 MUL AB 與 DIV AB 為 4 個機械週期）。"}], "hint": "最快的指令（如 `INC A`）只需 1 個機械週期，最慢的乘除法（`MUL AB`、`DIV AB`）需要 4 個機械週期。"}, {"questionNumber": 84, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "硬體電路縮寫「POSR」在 8051 最小系統設計中代表什麼意思？", "answerOptions": [{"text": "Port Output Shift Register（輸出埠移位暫存器）", "isCorrect": false, "rationale": "無此縮寫。"}, {"text": "Power On Self Reset（電源啟動自我重置）", "isCorrect": true, "rationale": "正確！POSR（Power On Self Reset）利用 RC 充電電路，讓系統在接通電源瞬間自動產生高電位脈波完成初始化重置。"}, {"text": "Peripheral Operating System Reset（周邊作業系統重置）", "isCorrect": false, "rationale": "無此縮寫。"}, {"text": "Program Origin Start Routine（程式起始副程式）", "isCorrect": false, "rationale": "無此縮寫。"}], "hint": "P = Power，O = On，S = Self，R = Reset。"}, {"questionNumber": 85, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "在 POSR（電源啟動自我重置）電路中，電容 C 接在 +5V 與 RST 之間，電阻 R 接在 RST 與 GND 之間。當電源剛開啟瞬間（t = 0+），電容跨壓 V_C 與電阻跨壓（即 RST 接腳電壓）V_R 分別為何？", "answerOptions": [{"text": "V_C = +5V，V_R = 0V", "isCorrect": false, "rationale": "那是充電完成（t → ∞）後的穩態結果。"}, {"text": "V_C = +2.5V，V_R = +2.5V", "isCorrect": false, "rationale": "初始瞬間尚未充電，不會平分電壓。"}, {"text": "V_C = 0V，V_R = +5V（使 RST 獲得高電位觸發重置）", "isCorrect": true, "rationale": "正確！電容電壓不能瞬間突變，開機瞬間電容尚未充電（V_C = 0V，形同短路），根據克希荷夫電壓定律 $5 = V_C + V_R$，全部 +5V 電壓都落在電阻 R 兩端（V_R = +5V），讓 RST 腳變成高電位！"}, {"text": "V_C = 0V，V_R = 0V", "isCorrect": false, "rationale": "V_C + V_R 必須等於電源電壓 +5V。"}], "hint": "回想板書公式：$5 = V_C + V_R$，開機瞬間電容還沒存到電荷（$Q=0 \\Rightarrow V_C=0$）。"}, {"questionNumber": 86, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "承上題，隨著 POSR 電路通電時間增加，電容逐漸充滿電，此時電阻跨壓 V_R（RST 接腳電壓）與充電電流 I 的變化趨勢為何？", "answerOptions": [{"text": "V_R 由 +5V 指數下降至 0V，充電電流 I 也隨之衰減至 0，使 RST 回到低電位結束重置並開始執行程式", "isCorrect": true, "rationale": "正確！隨著電容充電，V_C 從 0V 上升至 +5V，而 $V_R = 5 - V_C$ 則從 +5V 逐漸下降至 0V；當 RST 降至低電位後，重置結束，CPU 開始從 0000H 執行程式。"}, {"text": "V_R 永遠維持在 +5V 不變，電流 I 持續保持最大", "isCorrect": false, "rationale": "若 RST 永遠維持 +5V，CPU 會一直處於重置狀態無法執行程式。"}, {"text": "V_R 會在 +5V 與 0V 之間不斷產生方波振盪", "isCorrect": false, "rationale": "RC 充電是單調指數曲線，不會產生方波振盪。"}, {"text": "V_R 由 0V 上升至 +5V，使 RST 永久鎖在重置狀態", "isCorrect": false, "rationale": "V_C 才是從 0V 上升至 +5V，V_R 是下降。"}], "hint": "電容充飽後形同「斷路」，電阻 R 沒電流流過，RST 就會被電阻拉到 0V 地電位。"}, {"questionNumber": 87, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "若要在 POSR 開機重置電路中加入「手動重置（Manual Reset）」功能，常開（a 接點）按鈕開關應如何連接？", "answerOptions": [{"text": "串聯在 Pin 40 VCC 供電線上", "isCorrect": false, "rationale": "切斷 VCC 是斷電重開，不是手動重置按鈕。"}, {"text": "並聯在電阻 R 兩端（連接於 RST 接腳與 GND 之間）", "isCorrect": false, "rationale": "若並聯在電阻 R 兩端，按下按鈕會把 RST 強制接地（0V），無法觸發高電位重置。"}, {"text": "並聯在電容 C 兩端（連接於 +5V 與 RST 接腳之間）", "isCorrect": true, "rationale": "正確！按鈕並聯在電容 C 兩端，平時按下時會將 RST 直接導通至 +5V（同時讓電容放電），放開後重新由 +5V 維持一段高電位，達成手動重置。"}, {"text": "串聯在 XTAL1 與石英晶體之間", "isCorrect": false, "rationale": "不可切斷晶振迴路。"}], "hint": "8051 需要「高電位（+5V）」才能重置，所以按鈕要負責把 RST 接到 +5V。"}, {"questionNumber": 88, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "在 8051 硬體基本電路中，為了確保重置成功，高電位重置訊號至少必須維持 2 個機械週期。若使用 12 MHz 石英晶體，RST 維持高電位的時間至少需大於多少？", "answerOptions": [{"text": "1 μs", "isCorrect": false, "rationale": "1 μs 僅有 1 個機械週期，不足以保證內部正反器全部重置。"}, {"text": "2 μs", "isCorrect": true, "rationale": "正確！12 MHz 下 1 個機械週期 = 1 μs，因此 2 個機械週期 = 2 μs（實際 RC 電路 10μF × 10KΩ 的時間常數 τ = 100ms，遠大於 2 μs）。"}, {"text": "1 秒", "isCorrect": false, "rationale": "不需要長達 1 秒。"}, {"text": "12 μs", "isCorrect": false, "rationale": "12 μs 為 12 個機械週期。"}], "hint": "2 個機械週期 × 1 μs/機械週期。"}, {"questionNumber": 89, "category": "02. 接腳功能、基本電路與時脈", "isPastExam": false, "examNo": null, "question": "在開發板電路圖（如 C7、C8、C9、C10、C16 等）中，晶片電源接腳旁常並聯標示為「104」的陶瓷電容，請問「104」代表的電容值與主要功用為何？", "answerOptions": [{"text": "0.1 μF（100 nF），作為電源去耦（旁路）濾波電容，濾除高頻切換雜訊", "isCorrect": true, "rationale": "正確！電容三位數代碼 `104` 代表 $10 \\times 10^4\\text{ pF} = 100,000\\text{ pF} = 0.1\\text{ }\\mu\\text{F}$，並聯於 VCC 與 GND 之間用來穩定電源、濾除高頻突波雜訊。"}, {"text": "10.4 Ω，作為限流電阻保護晶片", "isCorrect": false, "rationale": "104 是電容器（標示 C7、C8 等），不是電阻器。"}, {"text": "104 pF，用來決定 8051 的石英振盪頻率", "isCorrect": false, "rationale": "104 代表 10 × 10^4 pF，不是 104 pF。"}, {"text": "104 μF，用來儲存備用電池電力", "isCorrect": false, "rationale": "單位不是 μF。"}], "hint": "數位代碼前兩位為有效數字，第三位為 0 的個數（單位 pF）：`10` 後面補 `4` 個 0。"}, {"questionNumber": 90, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": false, "examNo": null, "question": "標準 8051 內建的 4K Bytes 程式記憶體（Internal ROM），其十六進位位址範圍為何？", "answerOptions": [{"text": "0000H ~ FFFFH", "isCorrect": false, "rationale": "0000H ~ FFFFH 是 64K Bytes 全部外部可定址程式記憶體範圍。"}, {"text": "0000H ~ 1FFFH", "isCorrect": false, "rationale": "0000H ~ 1FFFH 是 8K Bytes（如 8052 / 89C52）的內部程式記憶體範圍。"}, {"text": "0000H ~ 0FFFH", "isCorrect": true, "rationale": "正確！4K = 4096 = 1000H 個位址，從 0000H 開始編號，最後一個位址為 4K - 1 = 0FFFH。"}, {"text": "0000H ~ 00FFH", "isCorrect": false, "rationale": "0000H ~ 00FFH 僅有 256 Bytes。"}], "hint": "板書左側長條圖最頂端寫 `0000H`，最底端寫 `4K - 1 → 0FFFH`。"}, {"questionNumber": 91, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": false, "examNo": null, "question": "在板書推導內部程式記憶體大小時，將 $4\\text{K Bytes} = 2^2 \\times 2^{10}\\text{ Bytes} = 2^{12}\\text{ Bytes}$ 改寫成以 16 為底的次方，等於多少？", "answerOptions": [{"text": "16^2 Bytes（即 100H Bytes）", "isCorrect": false, "rationale": "$16^2 = 256$ Bytes。"}, {"text": "16^4 Bytes（即 10000H Bytes）", "isCorrect": false, "rationale": "$16^4 = 65,536$ Bytes = 64K Bytes。"}, {"text": "16^3 Bytes（即 1000H Bytes）", "isCorrect": true, "rationale": "正確！$2^{12} = (2^4)^3 = 16^3$ Bytes，在十六進位中就是 `1000H`（三位十六進位數 `000H`~`FFFH` 剛好覆蓋 4K）。"}, {"text": "16^12 Bytes", "isCorrect": false, "rationale": "次方指數需除以 4（因為 1 個十六進位位數等於 4 個二進位位元）。"}], "hint": "回想板書公式：$2^{12} = (2^4)^3 = 16^3$。"}, {"questionNumber": 92, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": false, "examNo": null, "question": "在板書的十六進位加法演示中，當 16 位元的程式計數器 PC 數到最大位址 `FFFFH` 後再加 1，會發生什麼結果？", "answerOptions": [{"text": "停留在 FFFFH 不再增加", "isCorrect": false, "rationale": "計數器不會鎖死在 FFFFH。"}, {"text": "觸發硬體燒毀保護機制", "isCorrect": false, "rationale": "這是正常的二進位/十六進位捲繞（Wrap-around）現象。"}, {"text": "自動跳轉到 0030H", "isCorrect": false, "rationale": "不會跳轉到 0030H。"}, {"text": "產生最高位進位溢位，16 位元數值歸零回到 0000H", "isCorrect": true, "rationale": "正確！板書寫出 `FFFFH + 1 = (1)0000H`，超出 16 bits 的進位 1 溢位捨棄，PC 捲繞回到 0000H。"}], "hint": "就像汽車里程表轉到 `9999` 後再多跑一公里會變回 `0000`。"}, {"questionNumber": 93, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": false, "examNo": null, "question": "8051 內部資料記憶體位址 00H ~ 1FH 的四組工作暫存器庫（RB0 ~ RB3），下列哪一組的位址範圍配對「錯誤」？", "answerOptions": [{"text": "RB2：10H ~ 17H", "isCorrect": false, "rationale": "正確配對：RB2 佔用第 16 ~ 23 個 Bytes（10H ~ 17H）。"}, {"text": "RB1：08H ~ 0FH", "isCorrect": false, "rationale": "正確配對：RB1 佔用第 8 ~ 15 個 Bytes（08H ~ 0FH）。"}, {"text": "RB3：20H ~ 27H", "isCorrect": true, "rationale": "本選項錯誤！RB3 的正確位址範圍是「18H ~ 1FH」；而 20H ~ 2FH 已經進入可位元定址區了。"}, {"text": "RB0：00H ~ 07H", "isCorrect": false, "rationale": "正確配對：RB0 佔用前 8 個 Bytes（00H ~ 07H）。"}], "hint": "每個暫存器庫 8 Bytes，4 組總共 32 Bytes（十進位 0~31，十六進位 00H~1FH）。"}, {"questionNumber": 94, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": false, "examNo": null, "question": "程式執行時，CPU 是透過程式狀態字組暫存器（PSW）中的哪兩個位元來切換目前使用的工作暫存器庫（RB0 ~ RB3）？", "answerOptions": [{"text": "CY（Bit 7）與 AC（Bit 6）", "isCorrect": false, "rationale": "CY 是進位旗標，AC 是輔助進位旗標。"}, {"text": "EA（Bit 7）與 ES（Bit 4）", "isCorrect": false, "rationale": "EA 與 ES 位於中斷致能暫存器 IE 中，不在 PSW 中。"}, {"text": "OV（Bit 2）與 P（Bit 0）", "isCorrect": false, "rationale": "OV 是溢位旗標，P 是同位旗標。"}, {"text": "RS1（Bit 4）與 RS0（Bit 3）", "isCorrect": true, "rationale": "正確！RS1 與 RS0（Register Bank Selector）組合為 00、01、10、11 時，分別選用 RB0、RB1、RB2、RB3。"}], "hint": "RS 就是 Register Selector（暫存器選擇器）的縮寫。"}, {"questionNumber": 95, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": false, "examNo": null, "question": "若在程式中設定 PSW 的 `RS1 = 1`、`RS0 = 0`（選用暫存器庫 RB2），此時執行指令「MOV A, R3」，實際上是把內部資料記憶體哪一個位址的資料搬移到 A？", "answerOptions": [{"text": "13H", "isCorrect": true, "rationale": "正確！RS1=1, RS0=0 對應 RB2（起始位址 10H），因此 R0=10H、R1=11H、R2=12H、R3=13H。"}, {"text": "03H", "isCorrect": false, "rationale": "03H 是 RB0（RS1=0, RS0=0）的 R3 位址。"}, {"text": "0BH", "isCorrect": false, "rationale": "0BH 是 RB1（RS1=0, RS0=1）的 R3 位址。"}, {"text": "1BH", "isCorrect": false, "rationale": "1BH 是 RB3（RS1=1, RS0=1）的 R3 位址。"}], "hint": "先算出 RB2 的起始位址（10H），再加上暫存器編號 3。"}, {"questionNumber": 96, "category": "03. 記憶體結構與特殊暫存器", "isPastExam": false, "examNo": null, "question": "8051 內部資料記憶體的「可位元定址區（Bit Addressable Area）」位於哪一個 Byte 位址範圍？總共包含多少個可單獨操作的位元？", "answerOptions": [{"text": "20H ~ 2FH（16 Bytes），共 128 個可單獨定址的位元（位元位址 00H ~ 7FH）", "isCorrect": true, "rationale": "正確！緊接在 4 組暫
